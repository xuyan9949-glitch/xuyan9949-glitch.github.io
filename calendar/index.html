    <main id="main" class="page-shell">
        <section class="page-intro"><a class="breadcrumb" href="/">首页 / 验证日历</a><div class="eyebrow">EXPECTATIONS & FOLLOW-UPS</div><h1>时间到了，判断也该回看。</h1><p>日历是事件的时间入口。保留原先的问题，连接后来的研究与复盘。</p></section>
        <div class="notice">日历不会自动更新。带有“预计”的事件需要在公司或机构正式发布后重新核对；“已过期”不等于“已经发生”。</div>
        <section class="calendar-workspace" aria-label="验证日历">
            <div class="calendar-toolbar">
                <div class="calendar-month-switcher"><button id="calendar-prev" class="calendar-nav-button" type="button" aria-label="上一个月">‹</button><h2 id="calendar-month-title">2026 年 09 月</h2><button id="calendar-next" class="calendar-nav-button" type="button" aria-label="下一个月">›</button></div>
                <div class="calendar-toolbar-actions"><input id="calendar-month" type="month" hidden><select id="calendar-type" aria-label="事件类型"><option value="">全部类型</option></select><button id="calendar-current" class="button secondary" type="button">回到本月</button><button id="calendar-history" class="button secondary" type="button">最近有记录</button></div>
            </div>
            <div class="calendar-legend" aria-label="事件图例"><span><i class="legend-dot macro"></i>宏观</span><span><i class="legend-dot earnings"></i>财报</span><span><i class="legend-dot holiday"></i>节日</span><span><i class="legend-dot product"></i>产品 / 会议</span><span class="calendar-legend-note">点击事件查看详情</span></div>
            <div class="calendar-layout">
                <div class="calendar-month-grid"><div class="calendar-weekdays" aria-hidden="true"><span>周日</span><span>周一</span><span>周二</span><span>周三</span><span>周四</span><span>周五</span><span>周六</span></div><div id="calendar-results" class="calendar-cells" aria-live="polite"></div></div>
                <aside id="calendar-agenda" class="calendar-agenda" aria-label="本月事件"></aside>
            </div>
            <section id="calendar-detail" class="calendar-detail-panel" aria-live="polite"></section>
        </section>
