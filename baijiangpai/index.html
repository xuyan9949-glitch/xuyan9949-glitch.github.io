n ---: ---: --- \n  0   3张j   净增3张，但获得稳定三带核心  \n  1   3张j   净增2张，结构较好  \n  2   3张j   只增1张，效率最佳  \n  3   3张j   不增牌，直接获得技能启动结构  \n  ≥4   保留原数量   原有j炸价值高，疑兵通常不再补牌  \n\n  关键风险\n\n- 疑兵会增加牌量，原有j越少，初始增牌负担越大。\n- 多个对子并存时连环随机，可能补中并不需要的点数。\n- 缺少三带附件或缺少对子时，技能链无法完整展开。\n- 连续三带需要持续牌权，第一手被压后可能中断节奏。\n\n  待实测\n\n- 原有4张或更多j时是否完全不处理并保留原数量。\n- 连环的“三带牌型”包含三带一、三带二及飞机带牌中的哪些类型。\n- 多个对子并存时是否严格等概率随机。\n- 万能牌参与对子时是否会被纳入随机补三目标。\n- 补出的牌是否全场公开，且是否与普通牌完全等价。\n- 打出最后一手三带直接获胜时，是否还结算连环。\n\n"}, {"name": "张飞", "faction": "蜀", "skills": "咆哮", "position": "跨轮同型配对、低牌双升点与隐藏重组", "status": "主要规则已实测", "landlord": 9.5, "farmer": 9.0, "identity": "地主略优，但农民同样属于高强度。", "firstMove": "极高", "image": "技能截图/张飞.png", "html": "<div class=\"hero-shot\"><img src=\"技能截图/张飞.png\" alt=\"张飞技能截图\" loading=\"lazy\"><\/div>\n<h3>技能<\/h3>\n<p><strong>咆哮｜被动｜不限次数<\/strong><\/p>\n<blockquote>连续两次打出相同牌型时，手中2张最小牌随机变大。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9.5/10<\/td><td>先手立即建立1层记录，后续不怕牌权中断，能稳定规划同型双升点<\/td><\/tr>\n<tr><td>农民<\/td><td>9/10<\/td><td>被压或失去牌权不会中断记录，只要个人下一手保持同类即可触发<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8.5/10<\/td><td>记录跨轮保留、一次改造2张且不限次数；主要波动来自随机升点结果<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>牌型序列与触发前手牌结构决定技能是升质还是拆牌<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：地主略优，但农民同样属于高强度。<\/strong><\/p>\n<p><strong>先手匹配度：极高。<\/strong> 地主第一手直接建立对应牌型的1层记录；之后即使被压、经过其他玩家回合，只要张飞个人下一次仍打同类牌型，就能完成触发。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>咆哮没有次数上限，可以在一局内反复改造手牌。<\/li><li>张飞每打出一种牌型，先建立该牌型的1层记录。<\/li><li>下一次由张飞出牌时仍为同一牌型，记录升至2层并触发咆哮；不要求处于同一轮，也不要求连续掌握牌权。<\/li><li>中间被其他玩家压牌不影响记录；只看张飞个人相邻两次实际出牌，期间是否打过其他牌型。<\/li><li>两次出牌结算为一组。触发后重新计数：连续打四次相同牌型会在第2次和第4次分别触发，不会在第3次滚动触发。<\/li><li>相同牌型按大类判断，顺子、连对、飞机等即使长度不同，也属于相同牌型。<\/li><li>每次触发同时选中手中最多2张最小牌，并按夏侯渊“神速”的同类机制随机向上改变点数。<\/li><li>升点上限为2；2不能继续变大，低点数也可能直接跳到2。<\/li><li>技能目标不可自由选择，因此触发前必须检查当前两张最小牌属于什么结构。<\/li><li>升点可能把孤张升级为控制牌，也可能拆散对子、三张、顺子或带牌结构。<\/li><li>技能收益是动态牌质提升，不直接减少手牌数量。<\/li><li>手牌不足2张时仍会触发，并改造当时实际剩余的可用牌。<\/li><li>如果本次出牌已经把手牌全部出完，则直接获胜，不再结算咆哮。<\/li><li>升点结果不向其他玩家公开，只有张飞本人知道。<\/li><\/ul>\n<h3>触发牌型优先级<\/h3>\n<ol><li><strong>连续两手对子：<\/strong> 每次正常减2张，结构效率和触发稳定性兼顾。<\/li><li><strong>连续两手单张：<\/strong> 最容易安排，但减手慢，适合精准处理低牌并连续刷技能。<\/li><li><strong>连续三带或飞机：<\/strong> 大量减手并触发升级，上限高但实战条件较严。<\/li><li><strong>连续顺子或连对：<\/strong> 长度可以不同，适合在大量减牌的同时稳定完成触发。<\/li><li><strong>连续炸弹：<\/strong> 控场和升级兼得，但不应仅为触发提前消耗炸弹。<\/li><\/ol>\n<h3>主流打法<\/h3>\n<h4>地主：同型连打成长<\/h4>\n<ul><li>首攻优先选择手中能够在个人下一次出牌时再次打出的牌型，不要求保住本轮牌权。<\/li><li>触发前先处理会被升点破坏的低位对子、三张或顺子连接张。<\/li><li>若最低两张均为无结构孤张，可主动连续打同牌型，将其同时升级为中高牌。<\/li><li>若最低牌中包含关键对子或炸弹组件，应暂缓第二次同型出牌，先把该结构正常打出。<\/li><li>每次咆哮后立即重算手牌；升点会产生新的对子、三张、顺子连接或控制牌，不能沿用旧拆法。<\/li><\/ul>\n<p>地主的高效循环：<\/p>\n<blockquote>首手建立1层 → 中间牌权变化不影响记录 → 个人下一手同型触发双升点 → 重新计数并按新点数重组。<\/blockquote>\n<h4>农民：跨轮保留型<\/h4>\n<ul><li>优先准备两组能够分别获得出牌窗口的单张或对子，不要求在同一轮完成。<\/li><li>队友正常抢牌权不会破坏张飞记录，无需为咆哮刻意让牌。<\/li><li>被地主压住后，只要下次重新出牌仍保持原牌型，就可以正常触发。<\/li><li>低牌升级后通常保留为拦截点，不必为了继续触发强行拆开新形成的对子或三张。<\/li><li>地主接近走完时，直接压制高于技能养成，不能为了凑第二次同型而放过关键牌。<\/li><\/ul>\n<h3>触发前检查<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>当前两张最小牌<\/th><th>建议<\/th><\/tr><\/thead><tbody>\n<tr><td>两张无结构孤牌<\/td><td>最理想目标，可主动完成触发<\/td><\/tr>\n<tr><td>一个对子<\/td><td>升点可能拆对，先判断对子是否承担收尾<\/td><\/tr>\n<tr><td>三张或炸弹中的两张<\/td><td>高风险，通常先打出或保护原结构<\/td><\/tr>\n<tr><td>顺子关键连接张<\/td><td>升点后可能使整条顺子断裂，谨慎触发<\/td><\/tr>\n<tr><td>已经较高的两张牌<\/td><td>继续升点的控制收益较高，但随机结果可能重叠或分散<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>关键风险<\/h3>\n<ul><li>技能强制选择最小牌，无法保护低位完整结构。<\/li><li>为追求连续相同牌型，可能放弃更高效的正常拆牌路线。<\/li><li>随机升点后可能产生更多孤张，牌质提升不等于静态手数下降。<\/li><li>张飞自己改打其他牌型会中断原有配对记录，出牌顺序规划错误才是主要断层来源。<\/li><li>接近残局时若手中只剩完整组合，咆哮反而可能破坏直接走完结构。<\/li><\/ul>\n<h3>已确认的操作结论<\/h3>\n<ul><li>咆哮记录跨轮保留，不需要连续掌握牌权，不能用抢牌权直接打断张飞。<\/li><li>两次同类牌型为一个独立结算组，触发后重新从1层开始累计。<\/li><li>牌型长度不影响大类判定，长顺接短顺、不同长度连对仍能完成配对。<\/li><li>技能与神速使用同一套升点规则，但咆哮一次处理2张最小牌。<\/li><li>结果隐藏使张飞具备信息优势；对手只能知道技能已经触发，不能确定新点数。<\/li><li>直接出完优先于技能结算，任何时候都不应为了触发而放弃当手获胜。<\/li><\/ul>", "search": "  张飞\n\n 张飞技能截图 技能截图/张飞.png \n\n  技能\n\n 咆哮｜被动｜不限次数 \n\n  连续两次打出相同牌型时，手中2张最小牌随机变大。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9.5/10   先手立即建立1层记录，后续不怕牌权中断，能稳定规划同型双升点  \n  农民   9/10   被压或失去牌权不会中断记录，只要个人下一手保持同类即可触发  \n  稳定性   8.5/10   记录跨轮保留、一次改造2张且不限次数；主要波动来自随机升点结果  \n  操作上限   9.5/10   牌型序列与触发前手牌结构决定技能是升质还是拆牌  \n\n 身份倾向：地主略优，但农民同样属于高强度。 \n\n 先手匹配度：极高。  地主第一手直接建立对应牌型的1层记录；之后即使被压、经过其他玩家回合，只要张飞个人下一次仍打同类牌型，就能完成触发。\n\n  核心机制\n\n- 咆哮没有次数上限，可以在一局内反复改造手牌。\n- 张飞每打出一种牌型，先建立该牌型的1层记录。\n- 下一次由张飞出牌时仍为同一牌型，记录升至2层并触发咆哮；不要求处于同一轮，也不要求连续掌握牌权。\n- 中间被其他玩家压牌不影响记录；只看张飞个人相邻两次实际出牌，期间是否打过其他牌型。\n- 两次出牌结算为一组。触发后重新计数：连续打四次相同牌型会在第2次和第4次分别触发，不会在第3次滚动触发。\n- 相同牌型按大类判断，顺子、连对、飞机等即使长度不同，也属于相同牌型。\n- 每次触发同时选中手中最多2张最小牌，并按夏侯渊“神速”的同类机制随机向上改变点数。\n- 升点上限为2；2不能继续变大，低点数也可能直接跳到2。\n- 技能目标不可自由选择，因此触发前必须检查当前两张最小牌属于什么结构。\n- 升点可能把孤张升级为控制牌，也可能拆散对子、三张、顺子或带牌结构。\n- 技能收益是动态牌质提升，不直接减少手牌数量。\n- 手牌不足2张时仍会触发，并改造当时实际剩余的可用牌。\n- 如果本次出牌已经把手牌全部出完，则直接获胜，不再结算咆哮。\n- 升点结果不向其他玩家公开，只有张飞本人知道。\n\n  触发牌型优先级\n\n1.  连续两手对子：  每次正常减2张，结构效率和触发稳定性兼顾。\n2.  连续两手单张：  最容易安排，但减手慢，适合精准处理低牌并连续刷技能。\n3.  连续三带或飞机：  大量减手并触发升级，上限高但实战条件较严。\n4.  连续顺子或连对：  长度可以不同，适合在大量减牌的同时稳定完成触发。\n5.  连续炸弹：  控场和升级兼得，但不应仅为触发提前消耗炸弹。\n\n  主流打法\n\n  地主：同型连打成长\n\n- 首攻优先选择手中能够在个人下一次出牌时再次打出的牌型，不要求保住本轮牌权。\n- 触发前先处理会被升点破坏的低位对子、三张或顺子连接张。\n- 若最低两张均为无结构孤张，可主动连续打同牌型，将其同时升级为中高牌。\n- 若最低牌中包含关键对子或炸弹组件，应暂缓第二次同型出牌，先把该结构正常打出。\n- 每次咆哮后立即重算手牌；升点会产生新的对子、三张、顺子连接或控制牌，不能沿用旧拆法。\n\n地主的高效循环：\n\n  首手建立1层 → 中间牌权变化不影响记录 → 个人下一手同型触发双升点 → 重新计数并按新点数重组。\n\n  农民：跨轮保留型\n\n- 优先准备两组能够分别获得出牌窗口的单张或对子，不要求在同一轮完成。\n- 队友正常抢牌权不会破坏张飞记录，无需为咆哮刻意让牌。\n- 被地主压住后，只要下次重新出牌仍保持原牌型，就可以正常触发。\n- 低牌升级后通常保留为拦截点，不必为了继续触发强行拆开新形成的对子或三张。\n- 地主接近走完时，直接压制高于技能养成，不能为了凑第二次同型而放过关键牌。\n\n  触发前检查\n\n  当前两张最小牌   建议  \n --- --- \n  两张无结构孤牌   最理想目标，可主动完成触发  \n  一个对子   升点可能拆对，先判断对子是否承担收尾  \n  三张或炸弹中的两张   高风险，通常先打出或保护原结构  \n  顺子关键连接张   升点后可能使整条顺子断裂，谨慎触发  \n  已经较高的两张牌   继续升点的控制收益较高，但随机结果可能重叠或分散  \n\n  关键风险\n\n- 技能强制选择最小牌，无法保护低位完整结构。\n- 为追求连续相同牌型，可能放弃更高效的正常拆牌路线。\n- 随机升点后可能产生更多孤张，牌质提升不等于静态手数下降。\n- 张飞自己改打其他牌型会中断原有配对记录，出牌顺序规划错误才是主要断层来源。\n- 接近残局时若手中只剩完整组合，咆哮反而可能破坏直接走完结构。\n\n  已确认的操作结论\n\n- 咆哮记录跨轮保留，不需要连续掌握牌权，不能用抢牌权直接打断张飞。\n- 两次同类牌型为一个独立结算组，触发后重新从1层开始累计。\n- 牌型长度不影响大类判定，长顺接短顺、不同长度连对仍能完成配对。\n- 技能与神速使用同一套升点规则，但咆哮一次处理2张最小牌。\n- 结果隐藏使张飞具备信息优势；对手只能知道技能已经触发，不能确定新点数。\n- 直接出完优先于技能结算，任何时候都不应为了触发而放弃当手获胜。\n"}, {"name": "徐盛", "faction": "吴", "skills": "疑城", "position": "补牌过滤、失去出牌权前的补救", "status": "主要规则已实测", "landlord": 7.0, "farmer": 8.5, "identity": "农民明显优于地主。", "firstMove": "中等", "image": "技能截图/徐盛.png", "html": "<div class=\"hero-shot\"><img src=\"技能截图/徐盛.png\" alt=\"徐盛技能截图\" loading=\"lazy\"><\/div>\n<h3>技能<\/h3>\n<p><strong>疑城｜主动｜限3次<\/strong><\/p>\n<blockquote>你无牌可压时，可以先随机获得2张牌，然后再选择1张手牌弃置。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>7/10<\/td><td>先手可先建立牌型节奏，但疑城属于失去应牌后的补救，先手不直接启动技能<\/td><\/tr>\n<tr><td>农民<\/td><td>8.5/10<\/td><td>地主冲刺时强行找应牌，容错与拦截价值高<\/td><\/tr>\n<tr><td>稳定性<\/td><td>6/10<\/td><td>补牌随机，弃牌可控<\/td><\/tr>\n<tr><td>操作上限<\/td><td>8/10<\/td><td>发动时机和弃牌质量决定强度<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：农民明显优于地主。<\/strong><\/p>\n<p><strong>先手匹配度：中等。<\/strong> 地主能先处理最难交出的牌型，降低后续“无牌可压”的概率，但疑城本质是反应型技能，必须等到无法压牌才产生价值，先手增益不如主动成长型武将。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>触发门槛：当前无牌可压。<\/li><li>若手中存在能够压制的炸弹，也属于“有牌可压”，不能发动疑城。<\/li><li>新获得的2张牌来源随机。<\/li><li>获得并弃置后会立即回到压牌选择，可以使用新牌或原手牌完成压制。<\/li><li>弃牌结果全场公开。<\/li><li>整局最多发动3次，没有重置或额外恢复机制。<\/li><li>单次牌差：获得2张、弃1张，手牌净增1张。<\/li><li>核心收益：重新寻找应牌，同时过滤一张废牌。<\/li><li>核心代价：最多可能净增3张，残局手数压力上升。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>农民：拦截型<\/h4>\n<ul><li>前期不为普通牌型浪费次数，主要留给地主进入少牌阶段。<\/li><li>地主剩1—3手时，无牌可压再发动，价值最高。<\/li><li>摸到应牌时优先截断地主；没摸到时，用弃牌优化自己的尾牌。<\/li><li>队友已有明显牌权时不抢着发动，避免无意义增牌。<\/li><\/ul>\n<h4>地主：续攻型<\/h4>\n<ul><li>首攻优先处理难脱手结构，利用先手减少后续被卡死的节点。<\/li><li>只在失去牌权会导致农民连续走牌时使用。<\/li><li>手牌本身整齐时少发动，避免随机补牌打散收尾。<\/li><li>适合有多张孤牌、补到相邻点数即可成顺子/连对/三张的牌局。<\/li><li>第三次通常留给残局，不在前期全部交完。<\/li><\/ul>\n<h3>弃牌优先级<\/h3>\n<ol><li>无法并入任何组合的低位孤张。<\/li><li>破坏最少手数方案的冗余牌。<\/li><li>重复但无法成对、成三或作带牌的断张。<\/li><\/ol>\n<p>避免弃置控制牌、完整组合关键张，以及能让最少手数下降的连接张。<\/p>\n<h3>关键判断<\/h3>\n<p>发动前只比较两件事：<\/p>\n<ol><li>抢回这一轮牌权的价值；<\/li><li>手牌净增1张对残局的成本。<\/li><\/ol>\n<p>地主即将走完时，牌权价值通常高于增牌成本；普通前中期则相反。<\/p>", "search": "  徐盛\n\n 徐盛技能截图 技能截图/徐盛.png \n\n  技能\n\n 疑城｜主动｜限3次 \n\n  你无牌可压时，可以先随机获得2张牌，然后再选择1张手牌弃置。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   7/10   先手可先建立牌型节奏，但疑城属于失去应牌后的补救，先手不直接启动技能  \n  农民   8.5/10   地主冲刺时强行找应牌，容错与拦截价值高  \n  稳定性   6/10   补牌随机，弃牌可控  \n  操作上限   8/10   发动时机和弃牌质量决定强度  \n\n 身份倾向：农民明显优于地主。 \n\n 先手匹配度：中等。  地主能先处理最难交出的牌型，降低后续“无牌可压”的概率，但疑城本质是反应型技能，必须等到无法压牌才产生价值，先手增益不如主动成长型武将。\n\n  核心机制\n\n- 触发门槛：当前无牌可压。\n- 若手中存在能够压制的炸弹，也属于“有牌可压”，不能发动疑城。\n- 新获得的2张牌来源随机。\n- 获得并弃置后会立即回到压牌选择，可以使用新牌或原手牌完成压制。\n- 弃牌结果全场公开。\n- 整局最多发动3次，没有重置或额外恢复机制。\n- 单次牌差：获得2张、弃1张，手牌净增1张。\n- 核心收益：重新寻找应牌，同时过滤一张废牌。\n- 核心代价：最多可能净增3张，残局手数压力上升。\n\n  主流打法\n\n  农民：拦截型\n\n- 前期不为普通牌型浪费次数，主要留给地主进入少牌阶段。\n- 地主剩1—3手时，无牌可压再发动，价值最高。\n- 摸到应牌时优先截断地主；没摸到时，用弃牌优化自己的尾牌。\n- 队友已有明显牌权时不抢着发动，避免无意义增牌。\n\n  地主：续攻型\n\n- 首攻优先处理难脱手结构，利用先手减少后续被卡死的节点。\n- 只在失去牌权会导致农民连续走牌时使用。\n- 手牌本身整齐时少发动，避免随机补牌打散收尾。\n- 适合有多张孤牌、补到相邻点数即可成顺子/连对/三张的牌局。\n- 第三次通常留给残局，不在前期全部交完。\n\n  弃牌优先级\n\n1. 无法并入任何组合的低位孤张。\n2. 破坏最少手数方案的冗余牌。\n3. 重复但无法成对、成三或作带牌的断张。\n\n避免弃置控制牌、完整组合关键张，以及能让最少手数下降的连接张。\n\n  关键判断\n\n发动前只比较两件事：\n\n1. 抢回这一轮牌权的价值；\n2. 手牌净增1张对残局的成本。\n\n地主即将走完时，牌权价值通常高于增牌成本；普通前中期则相反。\n"}, {"name": "曹操", "faction": "魏", "skills": "魏武、枭雄", "position": "定向降点、诱压回收与结构重组", "status": "主要规则已实测", "landlord": 8.5, "farmer": 9.0, "identity": "农民略优。", "firstMove": "较高", "image": "", "html": "<h3>技能<\/h3>\n<p><strong>魏武｜主动｜限1次<\/strong><\/p>\n<blockquote>你可以将任意一张点数不低于5的手牌点数减2；由此变化的牌无法组成炸弹。<\/blockquote>\n<p><strong>枭雄｜主动响应｜限1次<\/strong><\/p>\n<blockquote>你出牌被压时，可以获得压你的牌；无法获得炸弹。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8.5/10<\/td><td>先手可主动设计诱压局面，魏武还能修复一次关键结构，但枭雄需要让出牌权<\/td><\/tr>\n<tr><td>农民<\/td><td>9/10<\/td><td>队友可配合触发枭雄，定向输送高牌或结构牌，稳定性略高<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8/10<\/td><td>魏武可自主发动；枭雄的收益取决于压制牌型和对手选择<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9/10<\/td><td>诱压目标、变牌点数与拿牌后的重组空间较大<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：农民略优。<\/strong> 地主有先手设计权，但枭雄发动意味着牌权被抢；农民可以利用队友配合降低让权成本。<\/p>\n<p><strong>先手匹配度：较高。<\/strong> 地主能先出低价值牌型诱导对方用目标牌压制，再发动枭雄；但技能不是直接保住先手，收益取决于后续能否重新夺权。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>魏武只改变1张手牌，点数门槛为不低于5，变化幅度固定为减2。<\/li><li>具体映射按牌序向下降两级：5→3、6→4、7→5、8→6、9→7、10→8、J→9、Q→10、K→J、A→Q、2→K、小王→A、大王→2。<\/li><li>变牌应优先用于立刻减少总手数的结构，而不是单纯制造低牌。<\/li><li>魏武生成的牌除炸弹外，可以用于所有其他牌型；不能把三张补成四张，也不能作为超四张炸弹的成员。<\/li><li>魏武变化后的具体点数不向其他玩家公开。<\/li><li>枭雄在曹操的出牌被任意其他玩家压制后均可发动，压制者包括队友，整局限1次。<\/li><li>发动枭雄会获得压制者刚打出的整手牌，并非只取其中1张。<\/li><li>枭雄不能获得任何炸弹，包括普通炸弹、王炸以及含万能牌组成的炸弹。<\/li><li>枭雄的发动及获得结果全场公开。<\/li><li>枭雄本质是用一次增牌换取完整压制牌型，只有整手拿回后能形成控制牌或缩短牌型时才值得发动。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：诱压回收<\/h4>\n<ul><li>先确定最希望获得的点数，再用略小的同类牌型诱导农民压制。<\/li><li>枭雄优先获取2、王、高对、高三张或能立即补齐结构的牌。<\/li><li>获取普通中小牌会增加出完难度，没有明确重组收益时可保留技能。<\/li><li>魏武优先补顺子、连对、三张或降低一手；不要用于制造无牌权的低孤张。<\/li><li>若魏武与枭雄可以共同完成一组牌型，先保留变牌选择，等枭雄结果确定后再修牌。<\/li><\/ul>\n<h4>农民：队友定向供牌<\/h4>\n<ul><li>队友可用曹操计划获得的牌压制曹操，完成定向输送。<\/li><li>供牌以形成炸弹以外的完整结构、关键回手或直接减少一手为目标。<\/li><li>地主临近走完时，不为触发枭雄故意让权；拦截优先。<\/li><li>魏武用于处理队友供牌后的缺口，使新增牌立即并入现有结构。<\/li><\/ul>\n<h3>魏武变牌优先级<\/h3>\n<ol><li>补齐后总手数立刻减少的顺子或连对缺口。<\/li><li>将对子接口变成三张，或将孤张变成对子。<\/li><li>修复枭雄拿牌后产生的结构断点。<\/li><li>制造可控的小牌带牌。<\/li><li>单纯降低点数但不改善结构的变化不发动。<\/li><\/ol>\n<h3>枭雄取牌优先级<\/h3>\n<ol><li>获取后直接形成终局牌型或关键回手。<\/li><li>2、大小王等高控制牌。<\/li><li>补成三张、连对、顺子或飞机组件。<\/li><li>队友定向提供的目标牌。<\/li><li>无法并入结构的普通孤张通常放弃。<\/li><\/ol>\n<h3>关键风险<\/h3>\n<ul><li>枭雄会增加手牌，拿到的牌不能立即并入结构时可能反而多一手。<\/li><li>为诱导理想压制牌而故意出错牌型，可能直接失去地主节奏。<\/li><li>魏武变牌无法参与炸弹，不能按普通同点数牌计算爆发上限。<\/li><li>两个技能都只有一次，过早兑现小收益会失去残局修牌空间。<\/li><\/ul>", "search": "  曹操\n\n  技能\n\n 魏武｜主动｜限1次 \n\n  你可以将任意一张点数不低于5的手牌点数减2；由此变化的牌无法组成炸弹。\n\n 枭雄｜主动响应｜限1次 \n\n  你出牌被压时，可以获得压你的牌；无法获得炸弹。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8.5/10   先手可主动设计诱压局面，魏武还能修复一次关键结构，但枭雄需要让出牌权  \n  农民   9/10   队友可配合触发枭雄，定向输送高牌或结构牌，稳定性略高  \n  稳定性   8/10   魏武可自主发动；枭雄的收益取决于压制牌型和对手选择  \n  操作上限   9/10   诱压目标、变牌点数与拿牌后的重组空间较大  \n\n 身份倾向：农民略优。  地主有先手设计权，但枭雄发动意味着牌权被抢；农民可以利用队友配合降低让权成本。\n\n 先手匹配度：较高。  地主能先出低价值牌型诱导对方用目标牌压制，再发动枭雄；但技能不是直接保住先手，收益取决于后续能否重新夺权。\n\n  核心机制\n\n- 魏武只改变1张手牌，点数门槛为不低于5，变化幅度固定为减2。\n- 具体映射按牌序向下降两级：5→3、6→4、7→5、8→6、9→7、10→8、j→9、q→10、k→j、a→q、2→k、小王→a、大王→2。\n- 变牌应优先用于立刻减少总手数的结构，而不是单纯制造低牌。\n- 魏武生成的牌除炸弹外，可以用于所有其他牌型；不能把三张补成四张，也不能作为超四张炸弹的成员。\n- 魏武变化后的具体点数不向其他玩家公开。\n- 枭雄在曹操的出牌被任意其他玩家压制后均可发动，压制者包括队友，整局限1次。\n- 发动枭雄会获得压制者刚打出的整手牌，并非只取其中1张。\n- 枭雄不能获得任何炸弹，包括普通炸弹、王炸以及含万能牌组成的炸弹。\n- 枭雄的发动及获得结果全场公开。\n- 枭雄本质是用一次增牌换取完整压制牌型，只有整手拿回后能形成控制牌或缩短牌型时才值得发动。\n\n  主流打法\n\n  地主：诱压回收\n\n- 先确定最希望获得的点数，再用略小的同类牌型诱导农民压制。\n- 枭雄优先获取2、王、高对、高三张或能立即补齐结构的牌。\n- 获取普通中小牌会增加出完难度，没有明确重组收益时可保留技能。\n- 魏武优先补顺子、连对、三张或降低一手；不要用于制造无牌权的低孤张。\n- 若魏武与枭雄可以共同完成一组牌型，先保留变牌选择，等枭雄结果确定后再修牌。\n\n  农民：队友定向供牌\n\n- 队友可用曹操计划获得的牌压制曹操，完成定向输送。\n- 供牌以形成炸弹以外的完整结构、关键回手或直接减少一手为目标。\n- 地主临近走完时，不为触发枭雄故意让权；拦截优先。\n- 魏武用于处理队友供牌后的缺口，使新增牌立即并入现有结构。\n\n  魏武变牌优先级\n\n1. 补齐后总手数立刻减少的顺子或连对缺口。\n2. 将对子接口变成三张，或将孤张变成对子。\n3. 修复枭雄拿牌后产生的结构断点。\n4. 制造可控的小牌带牌。\n5. 单纯降低点数但不改善结构的变化不发动。\n\n  枭雄取牌优先级\n\n1. 获取后直接形成终局牌型或关键回手。\n2. 2、大小王等高控制牌。\n3. 补成三张、连对、顺子或飞机组件。\n4. 队友定向提供的目标牌。\n5. 无法并入结构的普通孤张通常放弃。\n\n  关键风险\n\n- 枭雄会增加手牌，拿到的牌不能立即并入结构时可能反而多一手。\n- 为诱导理想压制牌而故意出错牌型，可能直接失去地主节奏。\n- 魏武变牌无法参与炸弹，不能按普通同点数牌计算爆发上限。\n- 两个技能都只有一次，过早兑现小收益会失去残局修牌空间。\n\n"}, {"name": "曹洪", "faction": "魏", "skills": "敛财", "position": "对子截获、整对增牌与队友定向供给", "status": "初步分析", "landlord": 7.5, "farmer": 9.5, "identity": "强农民型。", "firstMove": "偏低", "image": "", "html": "<h3>技能<\/h3>\n<p><strong>敛财｜被动｜限3次<\/strong><\/p>\n<blockquote>当其他玩家打出对子后，你获得该对子。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>7.5/10<\/td><td>对手可以减少对子使用，且每次获得对子都会增加地主自身牌量<\/td><\/tr>\n<tr><td>农民<\/td><td>9.5/10<\/td><td>队友可定向打出对子供给曹洪，形成稳定的双人牌型转移<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8/10<\/td><td>对子是常见牌型，但地主身份下容易被针对规避<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9/10<\/td><td>三次整对获取可补三张、炸弹、连对，也可破坏地主残局<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：强农民型。<\/strong> 队友可以主动提供曹洪需要的对子；地主则只能等待两名农民出对，并承担持续增牌成本。<\/p>\n<p><strong>先手匹配度：偏低。<\/strong> 地主先手不能直接发动敛财，技能完全依赖其他玩家后续打出对子。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>敛财由其他玩家打出对子触发，整局最多3次。<\/li><li>每次获得的是完整对子，共2张同点数牌。<\/li><li>技能同时具有增牌与重组价值：曹洪增加2张，对方打出的对子进入曹洪手牌。<\/li><li>最优目标是与手中单张或对子合并，直接形成三张、四张炸弹或连对节点。<\/li><li>农民队友可以主动打出指定对子，为曹洪提供结构牌。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：高价值对子才接收<\/h4>\n<ul><li>优先获取能立刻补三张、炸弹或连续对子的牌。<\/li><li>普通孤立对子会增加两张负担，若技能可以选择，应避免低收益触发。<\/li><li>农民进入短牌时，获取其对子还能改变其原定残局结构。<\/li><li>自己接近走完时不应继续囤积无法立即打出的对子。<\/li><\/ul>\n<h4>农民：队友定向供对<\/h4>\n<ul><li>队友优先打出曹洪已有单张或对子的同点数对子，直接补三或补炸。<\/li><li>能形成连对时，可连续利用不同点数对子降低总手数。<\/li><li>地主出对子时，优先拿能建立拦截牌权或破坏地主剩牌推断的点数。<\/li><li>三次技能应围绕明确结构使用，不为普通低对消耗次数。<\/li><\/ul>\n<h3>获取优先级<\/h3>\n<ol><li>与现有对子合并成四张或更多炸弹。<\/li><li>与现有单张合并成三张。<\/li><li>补齐连对或其他特殊结构。<\/li><li>高对形成稳定回手。<\/li><li>无法并入结构的低对价值最低。<\/li><\/ol>\n<h3>关键风险<\/h3>\n<ul><li>每次增加2张牌，三次全部触发最多增加6张，结构不匹配时负担很重。<\/li><li>对手知道曹洪技能后可改用单张、三张和长牌规避。<\/li><li>队友供对若没有后续牌权规划，可能让地主连续推进。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>敛财是强制触发还是可以放弃。<\/li><li>“获得”是转移原实体对子还是复制，原出牌是否仍正常结算。<\/li><li>被队友打出的对子是否正常触发。<\/li><li>含万能牌组成的对子是否触发，能否获得其中的万能牌。<\/li><li>连对、三带二等包含对子结构的牌型是否算“打出对子”。<\/li><li>获得对子及点数是否全场公开。<\/li><li>对方以最后两张对子出完时，是先获胜还是先结算敛财。<\/li><\/ul>", "search": "  曹洪\n\n  技能\n\n 敛财｜被动｜限3次 \n\n  当其他玩家打出对子后，你获得该对子。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   7.5/10   对手可以减少对子使用，且每次获得对子都会增加地主自身牌量  \n  农民   9.5/10   队友可定向打出对子供给曹洪，形成稳定的双人牌型转移  \n  稳定性   8/10   对子是常见牌型，但地主身份下容易被针对规避  \n  操作上限   9/10   三次整对获取可补三张、炸弹、连对，也可破坏地主残局  \n\n 身份倾向：强农民型。  队友可以主动提供曹洪需要的对子；地主则只能等待两名农民出对，并承担持续增牌成本。\n\n 先手匹配度：偏低。  地主先手不能直接发动敛财，技能完全依赖其他玩家后续打出对子。\n\n  核心机制\n\n- 敛财由其他玩家打出对子触发，整局最多3次。\n- 每次获得的是完整对子，共2张同点数牌。\n- 技能同时具有增牌与重组价值：曹洪增加2张，对方打出的对子进入曹洪手牌。\n- 最优目标是与手中单张或对子合并，直接形成三张、四张炸弹或连对节点。\n- 农民队友可以主动打出指定对子，为曹洪提供结构牌。\n\n  主流打法\n\n  地主：高价值对子才接收\n\n- 优先获取能立刻补三张、炸弹或连续对子的牌。\n- 普通孤立对子会增加两张负担，若技能可以选择，应避免低收益触发。\n- 农民进入短牌时，获取其对子还能改变其原定残局结构。\n- 自己接近走完时不应继续囤积无法立即打出的对子。\n\n  农民：队友定向供对\n\n- 队友优先打出曹洪已有单张或对子的同点数对子，直接补三或补炸。\n- 能形成连对时，可连续利用不同点数对子降低总手数。\n- 地主出对子时，优先拿能建立拦截牌权或破坏地主剩牌推断的点数。\n- 三次技能应围绕明确结构使用，不为普通低对消耗次数。\n\n  获取优先级\n\n1. 与现有对子合并成四张或更多炸弹。\n2. 与现有单张合并成三张。\n3. 补齐连对或其他特殊结构。\n4. 高对形成稳定回手。\n5. 无法并入结构的低对价值最低。\n\n  关键风险\n\n- 每次增加2张牌，三次全部触发最多增加6张，结构不匹配时负担很重。\n- 对手知道曹洪技能后可改用单张、三张和长牌规避。\n- 队友供对若没有后续牌权规划，可能让地主连续推进。\n\n  待实测\n\n- 敛财是强制触发还是可以放弃。\n- “获得”是转移原实体对子还是复制，原出牌是否仍正常结算。\n- 被队友打出的对子是否正常触发。\n- 含万能牌组成的对子是否触发，能否获得其中的万能牌。\n- 连对、三带二等包含对子结构的牌型是否算“打出对子”。\n- 获得对子及点数是否全场公开。\n- 对方以最后两张对子出完时，是先获胜还是先结算敛财。\n\n"}, {"name": "法正", "faction": "蜀", "skills": "睚眦、报复", "position": "仇标记积累、定向抽取最高牌与残局破坏", "status": "初步分析", "landlord": 8.5, "farmer": 9.5, "identity": "强农民型。", "firstMove": "较高", "image": "", "html": "<h3>技能<\/h3>\n<p><strong>睚眦｜被动｜不限次数<\/strong><\/p>\n<blockquote>当你出牌被压时，压你的玩家积累1点“仇”。<\/blockquote>\n<p><strong>报复｜主动｜不限次数<\/strong><\/p>\n<blockquote>你可以消除1名玩家2点“仇”，并获得其手中点数最大的1～2张牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8.5/10<\/td><td>先手能主动制造被压窗口，但需要多次失去牌权才能兑现一次报复<\/td><\/tr>\n<tr><td>农民<\/td><td>9.5/10<\/td><td>可集中给地主叠仇，持续抽走其最高牌，队友还能协助控场<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8.5/10<\/td><td>仇的积累条件明确，实际收益受对方最高牌数量和是否愿意压制影响<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>可定向削弱目标的王、2及高牌，同时重构自己的控制牌<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：强农民型。<\/strong> 两名农民可以围绕同一地主控场，法正只需把“仇”集中叠给地主；地主则必须分别处理两名农民，且被压会中断自身连续冲牌。<\/p>\n<p><strong>先手匹配度：较高。<\/strong> 地主可用容易被压的小牌主动启动睚眦，但每次叠仇都以失去牌权为代价；先手主要提供触发设计权，而不是直接收益。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>每次法正打出的牌被某名玩家压制，该玩家获得1点仇；不限累计次数。<\/li><li>仇记录在具体玩家身上，报复必须选取拥有至少2点仇的目标。<\/li><li>每次报复消耗目标2点仇，并从其手牌中获得当前最高点数的1～2张牌。<\/li><li>报复可以重复发动，理论次数取决于全局累计的仇。<\/li><li>技能同时完成两件事：削掉目标最高控制牌，并把这些牌转入法正手中。<\/li><li>获得牌会增加法正手牌，因此评价标准不是单纯拿到大牌，而是能否转化为牌权、炸弹接口或更短残局。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：分目标诱压<\/h4>\n<ul><li>首攻用可控的小单、小对或低结构诱导农民压制，优先把仇集中到高威胁目标。<\/li><li>达到2点后及时评估报复；若能抽走王、2或关键高牌，通常立即兑现。<\/li><li>不要连续为了叠仇放弃牌权，必须保留炸弹或高牌重新接管。<\/li><li>从一名农民处拿到高牌后，优先用于压制另一名农民，恢复地主节奏。<\/li><li>对手手牌很少时，报复兼具拆终局和增牌阻断价值。<\/li><\/ul>\n<h4>农民：集中削地主<\/h4>\n<ul><li>默认只给地主叠仇，避免把技能资源分散到队友。<\/li><li>队友掌握牌权时，法正可以领出容易被地主压制的牌型；被压后由队友继续拦截。<\/li><li>地主高牌尚未暴露时，2点仇即可优先报复，直接降低其王和2的控制力。<\/li><li>获得的高牌优先用于封锁地主，不必强求并入长组合。<\/li><li>地主进入少牌残局时，报复优先级最高，可直接抽走其最大尾牌并破坏原计划。<\/li><\/ul>\n<h3>报复目标优先级<\/h3>\n<ol><li>手牌少且即将走完的地主。<\/li><li>大小王、2等高控制牌尚未完全出现的目标。<\/li><li>已知持有炸弹接口或关键重复点数的目标。<\/li><li>仇较多、可以连续发动报复的目标。<\/li><li>手牌多且最高牌价值较低的目标延后处理。<\/li><\/ol>\n<h3>关键节奏<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>仇层数<\/th><th>处理<\/th><\/tr><\/thead><tbody>\n<tr><td>0～1<\/td><td>继续设计安全的被压窗口<\/td><\/tr>\n<tr><td>2<\/td><td>首次报复窗口；高价值目标通常立即兑现<\/td><\/tr>\n<tr><td>3<\/td><td>消耗2点后保留1点，为下一轮做准备<\/td><\/tr>\n<tr><td>4及以上<\/td><td>可连续报复，快速抽空目标高牌区<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>关键风险<\/h3>\n<ul><li>为叠仇反复送出牌权，可能在报复兑现前直接丢局。<\/li><li>报复获得1～2张牌会增加自身牌量，无法建立牌权时可能拖慢出完。<\/li><li>对手可以选择不压法正，主动限制仇的生成。<\/li><li>仇分散在不同玩家身上时，可能都达不到2点，形成无效积累。<\/li><li>抽走目标最高牌不等于抽走最适合自己结构的牌，残局要优先考虑即时控制。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>“获得1～2张”由玩家选择数量、系统随机，还是按目标最高点数牌的实际张数决定。<\/li><li>若目标有3张或4张并列最高点数牌，具体获得几张以及选择方式。<\/li><li>大小王同时存在时，是否只按大王为最高点数，还是王炸会被整体处理。<\/li><li>报复能否获得组成炸弹的最高点数牌，以及获得后是否破坏目标炸弹。<\/li><li>队友压制法正是否同样积累仇。<\/li><li>仇层数、报复获得牌及具体点数是否全场公开。<\/li><li>报复的发动时点，是否仅限法正自己的出牌阶段。<\/li><\/ul>", "search": "  法正\n\n  技能\n\n 睚眦｜被动｜不限次数 \n\n  当你出牌被压时，压你的玩家积累1点“仇”。\n\n 报复｜主动｜不限次数 \n\n  你可以消除1名玩家2点“仇”，并获得其手中点数最大的1～2张牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8.5/10   先手能主动制造被压窗口，但需要多次失去牌权才能兑现一次报复  \n  农民   9.5/10   可集中给地主叠仇，持续抽走其最高牌，队友还能协助控场  \n  稳定性   8.5/10   仇的积累条件明确，实际收益受对方最高牌数量和是否愿意压制影响  \n  操作上限   9.5/10   可定向削弱目标的王、2及高牌，同时重构自己的控制牌  \n\n 身份倾向：强农民型。  两名农民可以围绕同一地主控场，法正只需把“仇”集中叠给地主；地主则必须分别处理两名农民，且被压会中断自身连续冲牌。\n\n 先手匹配度：较高。  地主可用容易被压的小牌主动启动睚眦，但每次叠仇都以失去牌权为代价；先手主要提供触发设计权，而不是直接收益。\n\n  核心机制\n\n- 每次法正打出的牌被某名玩家压制，该玩家获得1点仇；不限累计次数。\n- 仇记录在具体玩家身上，报复必须选取拥有至少2点仇的目标。\n- 每次报复消耗目标2点仇，并从其手牌中获得当前最高点数的1～2张牌。\n- 报复可以重复发动，理论次数取决于全局累计的仇。\n- 技能同时完成两件事：削掉目标最高控制牌，并把这些牌转入法正手中。\n- 获得牌会增加法正手牌，因此评价标准不是单纯拿到大牌，而是能否转化为牌权、炸弹接口或更短残局。\n\n  主流打法\n\n  地主：分目标诱压\n\n- 首攻用可控的小单、小对或低结构诱导农民压制，优先把仇集中到高威胁目标。\n- 达到2点后及时评估报复；若能抽走王、2或关键高牌，通常立即兑现。\n- 不要连续为了叠仇放弃牌权，必须保留炸弹或高牌重新接管。\n- 从一名农民处拿到高牌后，优先用于压制另一名农民，恢复地主节奏。\n- 对手手牌很少时，报复兼具拆终局和增牌阻断价值。\n\n  农民：集中削地主\n\n- 默认只给地主叠仇，避免把技能资源分散到队友。\n- 队友掌握牌权时，法正可以领出容易被地主压制的牌型；被压后由队友继续拦截。\n- 地主高牌尚未暴露时，2点仇即可优先报复，直接降低其王和2的控制力。\n- 获得的高牌优先用于封锁地主，不必强求并入长组合。\n- 地主进入少牌残局时，报复优先级最高，可直接抽走其最大尾牌并破坏原计划。\n\n  报复目标优先级\n\n1. 手牌少且即将走完的地主。\n2. 大小王、2等高控制牌尚未完全出现的目标。\n3. 已知持有炸弹接口或关键重复点数的目标。\n4. 仇较多、可以连续发动报复的目标。\n5. 手牌多且最高牌价值较低的目标延后处理。\n\n  关键节奏\n\n  仇层数   处理  \n ---: --- \n  0～1   继续设计安全的被压窗口  \n  2   首次报复窗口；高价值目标通常立即兑现  \n  3   消耗2点后保留1点，为下一轮做准备  \n  4及以上   可连续报复，快速抽空目标高牌区  \n\n  关键风险\n\n- 为叠仇反复送出牌权，可能在报复兑现前直接丢局。\n- 报复获得1～2张牌会增加自身牌量，无法建立牌权时可能拖慢出完。\n- 对手可以选择不压法正，主动限制仇的生成。\n- 仇分散在不同玩家身上时，可能都达不到2点，形成无效积累。\n- 抽走目标最高牌不等于抽走最适合自己结构的牌，残局要优先考虑即时控制。\n\n  待实测\n\n- “获得1～2张”由玩家选择数量、系统随机，还是按目标最高点数牌的实际张数决定。\n- 若目标有3张或4张并列最高点数牌，具体获得几张以及选择方式。\n- 大小王同时存在时，是否只按大王为最高点数，还是王炸会被整体处理。\n- 报复能否获得组成炸弹的最高点数牌，以及获得后是否破坏目标炸弹。\n- 队友压制法正是否同样积累仇。\n- 仇层数、报复获得牌及具体点数是否全场公开。\n- 报复的发动时点，是否仅限法正自己的出牌阶段。\n\n"}, {"name": "甄姬", "faction": "魏", "skills": "镜花、洛神", "position": "牌型收集、高对与万能牌成长", "status": "主要奖励已确认", "landlord": 9.0, "farmer": 9.5, "identity": "农民略优。", "firstMove": "中高", "image": "技能截图/甄姬.png", "html": "<div class=\"hero-shot\"><img src=\"技能截图/甄姬.png\" alt=\"甄姬技能截图\" loading=\"lazy\"><\/div>\n<h3>技能<\/h3>\n<p><strong>镜花｜被动｜不限次数<\/strong><\/p>\n<blockquote>当任意玩家打出1种新牌型时，你点亮1片“花瓣”。<\/blockquote>\n<p><strong>洛神｜被动｜各限1次<\/strong><\/p>\n<blockquote>点亮3片“花瓣”时，立即随机获得1个不低于J的对子。<br>点亮5片“花瓣”时，立即获得1张万能牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9/10<\/td><td>有先手，可主动登记首种牌型；五花瓣万能牌显著提高主动冲牌上限<\/td><\/tr>\n<tr><td>农民<\/td><td>9.5/10<\/td><td>队友可主动补新牌型，触发五花瓣更稳定，万能牌也更利于协同控场<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8/10<\/td><td>镜花统计全场，三花瓣门槛较低；奖励点数随机<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>关键在牌型去重、五花瓣触发节奏与万能牌落点<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：农民略优。<\/strong><\/p>\n<p><strong>先手匹配度：中高。<\/strong> 地主可首手主动登记一种牌型，但镜花依赖全场出现不同牌型，不是单靠先手即可完成的技能循环。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>花瓣按“新牌型种类”累计，重复牌型不应重复计数。<\/li><li>任意玩家出牌都能推进，包括自己、对手和农民队友。<\/li><li>三花瓣奖励为J、Q、K、A、2范围内的随机对子。<\/li><li>三花瓣奖励手牌增加2张，收益是高对和回手能力，代价是总手数上升。<\/li><li>五花瓣奖励为1张万能牌，可代替除大小王外的任意点数，并参与炸弹和特殊牌型。<\/li><li>两段洛神奖励各触发一次；完整收益为一个高对加一张万能牌。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：先手铺类型<\/h4>\n<ul><li>首攻优先选择本来就计划打出的完整牌型，同时点亮第一片花瓣。<\/li><li>后续取得牌权时，优先打尚未登记、又不增加拆牌手数的牌型。<\/li><li>不为凑花瓣强拆炸弹、飞机或长顺；奖励增加手牌，必须看整体收益。<\/li><li>三花瓣高对优先作为回手点，或并入三带、飞机等尾牌。<\/li><li>五花瓣临界时可为万能牌适度调整出牌顺序，但应确保万能牌能直接降低手数或形成强控制牌型。<\/li><\/ul>\n<p>地主首攻的价值在于锁定一个低成本牌型，并迫使两名农民后续出牌时可能继续为镜花补类型。<\/p>\n<h4>农民：队友协同型<\/h4>\n<ul><li>两名农民应尽量错开牌型，避免重复单张、对子而不推进花瓣。<\/li><li>队友有自然顺子、连对、三带时，可主动补齐第三或第五种牌型。<\/li><li>地主冲刺阶段，三花瓣高对更适合保留拦截，不急于拆开带牌。<\/li><li>接近五花瓣时，队友应优先打自然存在的新牌型，帮助甄姬取得万能牌并修补关键结构。<\/li><\/ul>\n<h3>牌型登记优先级<\/h3>\n<ol><li>不拆牌即可打出的顺子、连对、飞机等完整结构。<\/li><li>本来就要处理的单张、对子、三带。<\/li><li>能在取得牌权后自然出现的炸弹或特殊牌型。<\/li><li>需要强拆现有组合才能制造的新类型。<\/li><\/ol>\n<p>花瓣只是手段，不能为了“新类型”让静态手数明显恶化。<\/p>\n<h3>三花瓣奖励的处理<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>随机对子<\/th><th>主流处理<\/th><\/tr><\/thead><tbody>\n<tr><td>对2<\/td><td>稳定回手，通常保留到残局<\/td><\/tr>\n<tr><td>对A/对K<\/td><td>作为高对争权，或补三张结构<\/td><\/tr>\n<tr><td>对Q/对J<\/td><td>更适合尽快并入三带、飞机或连续对子<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>高对不会自动降低手数。若原手牌缺乏对子结构，新增对子可能仍需独立一手打出；评分时应同时计算控制力与增牌成本。<\/p>\n<h3>五花瓣万能牌的处理<\/h3>\n<ol><li>优先补成能直接少一手的炸弹、飞机、连对或顺子。<\/li><li>其次补强残局回手结构，避免把万能牌消耗在普通低价值带牌中。<\/li><li>若原结构已顺畅，保留万能牌作为动态接口，待三花瓣随机对子落定后再决定用途。<\/li><\/ol>\n<h3>主要风险<\/h3>\n<ul><li>奖励会增加手牌，触发不等于立即减少手数。<\/li><li>为制造新牌型强拆完整结构，可能得不偿失。<\/li><li>地主对手可通过重复已登记牌型延缓花瓣。<\/li><li>三花瓣奖励随机，对J与对2的战术价值差距明显。<\/li><li>万能牌虽然质量高，但仍会使手牌增加1张；若不能并入现有结构，未必立即降低手数。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>“新牌型”按大类统计，还是不同长度的顺子、连对分别统计。<\/li><li>炸弹长度不同是否属于不同新牌型。<\/li><li>特殊武将牌型是否计入镜花。<\/li><li>一手牌同时满足多个牌型定义时，只点亮1片还是可能点亮多片。<\/li><li>已登记牌型是否有可见提示或列表。<\/li><\/ul>", "search": "  甄姬\n\n 甄姬技能截图 技能截图/甄姬.png \n\n  技能\n\n 镜花｜被动｜不限次数 \n\n  当任意玩家打出1种新牌型时，你点亮1片“花瓣”。\n\n 洛神｜被动｜各限1次 \n\n  点亮3片“花瓣”时，立即随机获得1个不低于j的对子。\n \n  点亮5片“花瓣”时，立即获得1张万能牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9/10   有先手，可主动登记首种牌型；五花瓣万能牌显著提高主动冲牌上限  \n  农民   9.5/10   队友可主动补新牌型，触发五花瓣更稳定，万能牌也更利于协同控场  \n  稳定性   8/10   镜花统计全场，三花瓣门槛较低；奖励点数随机  \n  操作上限   9.5/10   关键在牌型去重、五花瓣触发节奏与万能牌落点  \n\n 身份倾向：农民略优。 \n\n 先手匹配度：中高。  地主可首手主动登记一种牌型，但镜花依赖全场出现不同牌型，不是单靠先手即可完成的技能循环。\n\n  核心机制\n\n- 花瓣按“新牌型种类”累计，重复牌型不应重复计数。\n- 任意玩家出牌都能推进，包括自己、对手和农民队友。\n- 三花瓣奖励为j、q、k、a、2范围内的随机对子。\n- 三花瓣奖励手牌增加2张，收益是高对和回手能力，代价是总手数上升。\n- 五花瓣奖励为1张万能牌，可代替除大小王外的任意点数，并参与炸弹和特殊牌型。\n- 两段洛神奖励各触发一次；完整收益为一个高对加一张万能牌。\n\n  主流打法\n\n  地主：先手铺类型\n\n- 首攻优先选择本来就计划打出的完整牌型，同时点亮第一片花瓣。\n- 后续取得牌权时，优先打尚未登记、又不增加拆牌手数的牌型。\n- 不为凑花瓣强拆炸弹、飞机或长顺；奖励增加手牌，必须看整体收益。\n- 三花瓣高对优先作为回手点，或并入三带、飞机等尾牌。\n- 五花瓣临界时可为万能牌适度调整出牌顺序，但应确保万能牌能直接降低手数或形成强控制牌型。\n\n地主首攻的价值在于锁定一个低成本牌型，并迫使两名农民后续出牌时可能继续为镜花补类型。\n\n  农民：队友协同型\n\n- 两名农民应尽量错开牌型，避免重复单张、对子而不推进花瓣。\n- 队友有自然顺子、连对、三带时，可主动补齐第三或第五种牌型。\n- 地主冲刺阶段，三花瓣高对更适合保留拦截，不急于拆开带牌。\n- 接近五花瓣时，队友应优先打自然存在的新牌型，帮助甄姬取得万能牌并修补关键结构。\n\n  牌型登记优先级\n\n1. 不拆牌即可打出的顺子、连对、飞机等完整结构。\n2. 本来就要处理的单张、对子、三带。\n3. 能在取得牌权后自然出现的炸弹或特殊牌型。\n4. 需要强拆现有组合才能制造的新类型。\n\n花瓣只是手段，不能为了“新类型”让静态手数明显恶化。\n\n  三花瓣奖励的处理\n\n  随机对子   主流处理  \n --- --- \n  对2   稳定回手，通常保留到残局  \n  对a/对k   作为高对争权，或补三张结构  \n  对q/对j   更适合尽快并入三带、飞机或连续对子  \n\n高对不会自动降低手数。若原手牌缺乏对子结构，新增对子可能仍需独立一手打出；评分时应同时计算控制力与增牌成本。\n\n  五花瓣万能牌的处理\n\n1. 优先补成能直接少一手的炸弹、飞机、连对或顺子。\n2. 其次补强残局回手结构，避免把万能牌消耗在普通低价值带牌中。\n3. 若原结构已顺畅，保留万能牌作为动态接口，待三花瓣随机对子落定后再决定用途。\n\n  主要风险\n\n- 奖励会增加手牌，触发不等于立即减少手数。\n- 为制造新牌型强拆完整结构，可能得不偿失。\n- 地主对手可通过重复已登记牌型延缓花瓣。\n- 三花瓣奖励随机，对j与对2的战术价值差距明显。\n- 万能牌虽然质量高，但仍会使手牌增加1张；若不能并入现有结构，未必立即降低手数。\n\n  待实测\n\n- “新牌型”按大类统计，还是不同长度的顺子、连对分别统计。\n- 炸弹长度不同是否属于不同新牌型。\n- 特殊武将牌型是否计入镜花。\n- 一手牌同时满足多个牌型定义时，只点亮1片还是可能点亮多片。\n- 已登记牌型是否有可见提示或列表。\n"}, {"name": "甘宁", "faction": "吴", "skills": "游侠", "position": "压牌窥底、低牌转移与残局拆牌", "status": "初步分析", "landlord": 8.5, "farmer": 9.0, "identity": "农民略优。", "firstMove": "较高", "image": "", "html": "<h3>技能<\/h3>\n<p><strong>游侠｜主动响应｜限3次<\/strong><\/p>\n<blockquote>你压牌后，可以查看被压玩家手中2张最小牌，并选择是否获得这些牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8.5/10<\/td><td>可连续拆走两名农民的低张尾牌，但每次取牌都会增加自身负担<\/td><\/tr>\n<tr><td>农民<\/td><td>9/10<\/td><td>压地主后可定向破坏其残局，也可根据队友牌权选择是否发动<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8.5/10<\/td><td>查看效果稳定，取牌收益取决于对方最小牌与自身结构<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9/10<\/td><td>三次查看、可选取牌与残局手牌推断兼具信息和控制价值<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：农民略优。<\/strong> 农民从地主手中抽走两张低牌，既能延缓地主走牌，也能获得明确的残局信息；地主虽有更多主动压牌机会，但增牌会直接拖慢自身出完。<\/p>\n<p><strong>先手匹配度：较高。<\/strong> 地主首手可主动选择容易被接牌的结构，随后争取反压并启动游侠，但技能必须先完成压牌，不能在第一手直接兑现。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>游侠在甘宁成功压牌后出现发动窗口。<\/li><li>查看对象是刚刚被甘宁压制的玩家，内容为其当前手牌中的2张最小牌。<\/li><li>查看后可以放弃获取；信息收益与取牌收益分开结算。<\/li><li>选择获取时，两张牌转入甘宁手牌，对方相应减少2张，甘宁增加2张。<\/li><li>技能限3次，最多可查看三次、获取六张牌。<\/li><li>核心价值是拆除对方低张出口和读取残局，而不是无条件拿牌。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：查看为主、残局拆牌<\/h4>\n<ul><li>前中盘优先用游侠查看农民低张结构，不为两张普通散牌盲目增牌。<\/li><li>只有取得后能立即并入对子、三张、顺子或炸弹时才拿。<\/li><li>农民进入少牌阶段时，优先抽走其最小牌，破坏原定收尾牌型。<\/li><li>两名农民中优先针对手牌更少、牌权威胁更高的一方。<\/li><li>自己接近走完时原则上只查看不获取，避免倒增两张。<\/li><\/ul>\n<h4>农民：压地主拆尾<\/h4>\n<ul><li>尽量把技能留给地主，不从队友处无效拿牌。<\/li><li>地主进入5张以内时，抽走两张最小牌往往能直接打断其尾牌结构。<\/li><li>获取的牌能与自己现有牌组成对子、三张或长牌时，收益最高。<\/li><li>若队友更接近走完，甘宁应以控地主为主，不因贪取拖慢己方出牌节奏。<\/li><li>查看后结合已出牌记录，反推地主剩余高牌与可能牌型。<\/li><\/ul>\n<h3>获取判断<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>情况<\/th><th>建议<\/th><\/tr><\/thead><tbody>\n<tr><td>两张牌可直接并入现有结构<\/td><td>获取<\/td><\/tr>\n<tr><td>能拆掉对手最后一组完整牌型<\/td><td>获取<\/td><\/tr>\n<tr><td>对手即将走完，取走后明显增加其手数<\/td><td>获取<\/td><\/tr>\n<tr><td>只是两张无关低散牌，自己也接近走完<\/td><td>放弃<\/td><\/tr>\n<tr><td>被压者是队友且取牌无明确协作收益<\/td><td>放弃<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>关键风险<\/h3>\n<ul><li>获取两张牌会增加自身牌量，结构不匹配时可能得不偿失。<\/li><li>只看点数高低而忽略对方牌型，可能反而替对方清除累赘。<\/li><li>农民误从队友处取牌，可能破坏队友原有收尾结构。<\/li><li>技能只有三次，应优先留给短牌阶段或高价值结构牌。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>被压玩家只剩1张牌时，是否查看并可获得该1张；取得后是否立即改变胜负结算。<\/li><li>被压玩家一次出完手牌时，游侠是否还有结算窗口。<\/li><li>两张最小牌点数并列时，具体牌如何确定。<\/li><li>查看内容是否仅甘宁可见；选择获取及所得点数是否全场公开。<\/li><li>选择不获取是否仍消耗1次技能次数。<\/li><li>获取的是原实体牌还是复制牌，以及是否保留原有技能标记。<\/li><li>压制队友牌时能否正常发动。<\/li><li>炸弹或其他特殊牌型完成压牌后是否正常触发。<\/li><\/ul>", "search": "  甘宁\n\n  技能\n\n 游侠｜主动响应｜限3次 \n\n  你压牌后，可以查看被压玩家手中2张最小牌，并选择是否获得这些牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8.5/10   可连续拆走两名农民的低张尾牌，但每次取牌都会增加自身负担  \n  农民   9/10   压地主后可定向破坏其残局，也可根据队友牌权选择是否发动  \n  稳定性   8.5/10   查看效果稳定，取牌收益取决于对方最小牌与自身结构  \n  操作上限   9/10   三次查看、可选取牌与残局手牌推断兼具信息和控制价值  \n\n 身份倾向：农民略优。  农民从地主手中抽走两张低牌，既能延缓地主走牌，也能获得明确的残局信息；地主虽有更多主动压牌机会，但增牌会直接拖慢自身出完。\n\n 先手匹配度：较高。  地主首手可主动选择容易被接牌的结构，随后争取反压并启动游侠，但技能必须先完成压牌，不能在第一手直接兑现。\n\n  核心机制\n\n- 游侠在甘宁成功压牌后出现发动窗口。\n- 查看对象是刚刚被甘宁压制的玩家，内容为其当前手牌中的2张最小牌。\n- 查看后可以放弃获取；信息收益与取牌收益分开结算。\n- 选择获取时，两张牌转入甘宁手牌，对方相应减少2张，甘宁增加2张。\n- 技能限3次，最多可查看三次、获取六张牌。\n- 核心价值是拆除对方低张出口和读取残局，而不是无条件拿牌。\n\n  主流打法\n\n  地主：查看为主、残局拆牌\n\n- 前中盘优先用游侠查看农民低张结构，不为两张普通散牌盲目增牌。\n- 只有取得后能立即并入对子、三张、顺子或炸弹时才拿。\n- 农民进入少牌阶段时，优先抽走其最小牌，破坏原定收尾牌型。\n- 两名农民中优先针对手牌更少、牌权威胁更高的一方。\n- 自己接近走完时原则上只查看不获取，避免倒增两张。\n\n  农民：压地主拆尾\n\n- 尽量把技能留给地主，不从队友处无效拿牌。\n- 地主进入5张以内时，抽走两张最小牌往往能直接打断其尾牌结构。\n- 获取的牌能与自己现有牌组成对子、三张或长牌时，收益最高。\n- 若队友更接近走完，甘宁应以控地主为主，不因贪取拖慢己方出牌节奏。\n- 查看后结合已出牌记录，反推地主剩余高牌与可能牌型。\n\n  获取判断\n\n  情况   建议  \n --- --- \n  两张牌可直接并入现有结构   获取  \n  能拆掉对手最后一组完整牌型   获取  \n  对手即将走完，取走后明显增加其手数   获取  \n  只是两张无关低散牌，自己也接近走完   放弃  \n  被压者是队友且取牌无明确协作收益   放弃  \n\n  关键风险\n\n- 获取两张牌会增加自身牌量，结构不匹配时可能得不偿失。\n- 只看点数高低而忽略对方牌型，可能反而替对方清除累赘。\n- 农民误从队友处取牌，可能破坏队友原有收尾结构。\n- 技能只有三次，应优先留给短牌阶段或高价值结构牌。\n\n  待实测\n\n- 被压玩家只剩1张牌时，是否查看并可获得该1张；取得后是否立即改变胜负结算。\n- 被压玩家一次出完手牌时，游侠是否还有结算窗口。\n- 两张最小牌点数并列时，具体牌如何确定。\n- 查看内容是否仅甘宁可见；选择获取及所得点数是否全场公开。\n- 选择不获取是否仍消耗1次技能次数。\n- 获取的是原实体牌还是复制牌，以及是否保留原有技能标记。\n- 压制队友牌时能否正常发动。\n- 炸弹或其他特殊牌型完成压牌后是否正常触发。\n"}, {"name": "皇甫嵩", "faction": "群", "skills": "平乱", "position": "低牌换高、等量补牌与中高结构重组", "status": "初步分析", "landlord": 8.0, "farmer": 8.5, "identity": "农民略优。", "firstMove": "高但有代价", "image": "", "html": "<h3>技能<\/h3>\n<p><strong>平乱｜被动｜限3次<\/strong><\/p>\n<blockquote>任意玩家打出的牌若只包含点数不高于5的牌，你获得等量张点数不低于6的牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8/10<\/td><td>可主动用低位多张牌型启动大量补牌，但增牌会明显抵消地主的先手减牌效率<\/td><\/tr>\n<tr><td>农民<\/td><td>8.5/10<\/td><td>队友可主动提供低牌型触发，新增中高牌更容易用于拦截地主与团队重组<\/td><\/tr>\n<tr><td>稳定性<\/td><td>7.5/10<\/td><td>触发条件明确，但新增牌点数与结构随机，完整三次可能造成大量手牌负担<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9/10<\/td><td>触发张数越多收益池越大，核心在选择触发规模并把新增牌压缩成更少手数<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：农民略优。<\/strong> 农民可以由队友配合打出纯低点数牌型，同时把获得的中高牌用于拦截地主；地主虽有先手主动触发优势，但每次补牌都会推迟自身走完。<\/p>\n<p><strong>先手匹配度：高但有代价。<\/strong> 地主第一手可用仅含3、4、5的对子、三张或炸弹主动触发；然而打出多少张就补回多少张，手牌数量不会下降，只有新牌结构更优时才真正获利。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>任意玩家都能触发平乱，包括皇甫嵩自己、队友和对手。<\/li><li>判断整手牌的每一张：只有全部点数都不高于5时才满足条件。<\/li><li>触发后，皇甫嵩获得与该手牌张数完全相同的新牌，且每张新牌的点数都不低于6。<\/li><li>平乱每局最多触发3次；多张牌型和单张都只占用1次触发次数。<\/li><li>皇甫嵩自己触发时，打出N张后又获得N张，手牌总数不变，但实现“低牌换中高牌”的结构升级。<\/li><li>其他玩家触发时，皇甫嵩会净增加N张手牌，资源收益与残局负担同时上升。<\/li><li>最优触发并非一味追求张数，而是让新增牌形成对子、三张、炸弹、顺子或关键拦截牌。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：主动洗低牌，控制触发规模<\/h4>\n<ul><li>起手有纯3至5的多张废牌结构时，可主动打出并换成6以上新牌。<\/li><li>首次触发后立即重算全部牌型，重点检查新增牌能否形成中高位顺子、连对、三张或炸弹。<\/li><li>若前两次补牌已造成大量孤张，第三次不要为用完次数继续增牌。<\/li><li>单张低牌触发只换1张，适合轻量升级；四张或更多低牌触发波动大，只在原结构极差时使用。<\/li><li>地主接近走完时应避免被对手的低牌强制灌入新牌，具体是否能放弃触发需实测。<\/li><\/ul>\n<h4>农民：队友供给，构筑拦截牌<\/h4>\n<ul><li>队友可在不影响自身节奏时打出纯低点数对子、三张或长结构，帮助皇甫嵩一次获得多张中高牌。<\/li><li>新增牌优先用于形成能够压制地主的高对、三张、炸弹和连续牌型。<\/li><li>皇甫嵩接近走完时，队友应停止无必要的低牌触发，避免反向增加其手牌。<\/li><li>地主打出低牌触发时，获得的新牌应优先服务即时封锁，而不是长期牌型美化。<\/li><\/ul>\n<h3>触发规模判断<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>触发牌数<\/th><th>价值判断<\/th><\/tr><\/thead><tbody>\n<tr><td>1张<\/td><td>轻量换牌或补牌，结构波动最小<\/td><\/tr>\n<tr><td>2张<\/td><td>有机会形成新对子或补顺子，风险可控<\/td><\/tr>\n<tr><td>3张<\/td><td>资源明显增加，适合寻找三张与多组接口<\/td><\/tr>\n<tr><td>4张以上<\/td><td>爆发上限高，但极易增加孤张与总手数<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>关键风险<\/h3>\n<ul><li>其他玩家触发时会直接增加皇甫嵩手牌，残局甚至可能破坏原本的走完路线。<\/li><li>新牌只保证点数≥6，不保证牌型集中；大量中高孤张可能比原低牌更难批量处理。<\/li><li>平乱只有3次，单张低牌可能提前消耗宝贵触发次数。<\/li><li>为追求大规模补牌而拆出纯低位牌型，可能破坏原有顺子、连对或炸弹。<\/li><li>高点数并不等于高减牌效率，评分必须以最终手数而非新增牌大小衡量。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>平乱是否为强制触发，还是每次满足条件时可以选择是否发动。<\/li><li>新牌从实体牌堆获得还是由技能生成，具体点数是否等概率随机。<\/li><li>新牌池是否包含2、大小王，还是只包含6至A。<\/li><li>新增牌的具体点数及数量是否全场公开。<\/li><li>队友和对手打牌是否完全同样触发平乱。<\/li><li>万能牌声明为5以下点数时是否计入“只包含≤5”，还是按其原始标记判断。<\/li><li>被其他技能改变点数后的牌，按当前点数还是原始点数判断触发。<\/li><li>三带牌型中三张和带牌全部≤5时是否正常触发；只要其中一张≥6是否完全不触发。<\/li><li>皇甫嵩自己一次出完低牌时，是立即获胜，还是会先补入等量新牌而无法走完。<\/li><li>皇甫嵩只剩少量牌时，其他玩家触发平乱会不会在胜负结算前继续给牌。<\/li><li>触发次数耗尽后，其他玩家的低牌出手是否不再产生任何提示或效果。<\/li><\/ul>", "search": "  皇甫嵩\n\n  技能\n\n 平乱｜被动｜限3次 \n\n  任意玩家打出的牌若只包含点数不高于5的牌，你获得等量张点数不低于6的牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8/10   可主动用低位多张牌型启动大量补牌，但增牌会明显抵消地主的先手减牌效率  \n  农民   8.5/10   队友可主动提供低牌型触发，新增中高牌更容易用于拦截地主与团队重组  \n  稳定性   7.5/10   触发条件明确，但新增牌点数与结构随机，完整三次可能造成大量手牌负担  \n  操作上限   9/10   触发张数越多收益池越大，核心在选择触发规模并把新增牌压缩成更少手数  \n\n 身份倾向：农民略优。  农民可以由队友配合打出纯低点数牌型，同时把获得的中高牌用于拦截地主；地主虽有先手主动触发优势，但每次补牌都会推迟自身走完。\n\n 先手匹配度：高但有代价。  地主第一手可用仅含3、4、5的对子、三张或炸弹主动触发；然而打出多少张就补回多少张，手牌数量不会下降，只有新牌结构更优时才真正获利。\n\n  核心机制\n\n- 任意玩家都能触发平乱，包括皇甫嵩自己、队友和对手。\n- 判断整手牌的每一张：只有全部点数都不高于5时才满足条件。\n- 触发后，皇甫嵩获得与该手牌张数完全相同的新牌，且每张新牌的点数都不低于6。\n- 平乱每局最多触发3次；多张牌型和单张都只占用1次触发次数。\n- 皇甫嵩自己触发时，打出n张后又获得n张，手牌总数不变，但实现“低牌换中高牌”的结构升级。\n- 其他玩家触发时，皇甫嵩会净增加n张手牌，资源收益与残局负担同时上升。\n- 最优触发并非一味追求张数，而是让新增牌形成对子、三张、炸弹、顺子或关键拦截牌。\n\n  主流打法\n\n  地主：主动洗低牌，控制触发规模\n\n- 起手有纯3至5的多张废牌结构时，可主动打出并换成6以上新牌。\n- 首次触发后立即重算全部牌型，重点检查新增牌能否形成中高位顺子、连对、三张或炸弹。\n- 若前两次补牌已造成大量孤张，第三次不要为用完次数继续增牌。\n- 单张低牌触发只换1张，适合轻量升级；四张或更多低牌触发波动大，只在原结构极差时使用。\n- 地主接近走完时应避免被对手的低牌强制灌入新牌，具体是否能放弃触发需实测。\n\n  农民：队友供给，构筑拦截牌\n\n- 队友可在不影响自身节奏时打出纯低点数对子、三张或长结构，帮助皇甫嵩一次获得多张中高牌。\n- 新增牌优先用于形成能够压制地主的高对、三张、炸弹和连续牌型。\n- 皇甫嵩接近走完时，队友应停止无必要的低牌触发，避免反向增加其手牌。\n- 地主打出低牌触发时，获得的新牌应优先服务即时封锁，而不是长期牌型美化。\n\n  触发规模判断\n\n  触发牌数   价值判断  \n ---: --- \n  1张   轻量换牌或补牌，结构波动最小  \n  2张   有机会形成新对子或补顺子，风险可控  \n  3张   资源明显增加，适合寻找三张与多组接口  \n  4张以上   爆发上限高，但极易增加孤张与总手数  \n\n  关键风险\n\n- 其他玩家触发时会直接增加皇甫嵩手牌，残局甚至可能破坏原本的走完路线。\n- 新牌只保证点数≥6，不保证牌型集中；大量中高孤张可能比原低牌更难批量处理。\n- 平乱只有3次，单张低牌可能提前消耗宝贵触发次数。\n- 为追求大规模补牌而拆出纯低位牌型，可能破坏原有顺子、连对或炸弹。\n- 高点数并不等于高减牌效率，评分必须以最终手数而非新增牌大小衡量。\n\n  待实测\n\n- 平乱是否为强制触发，还是每次满足条件时可以选择是否发动。\n- 新牌从实体牌堆获得还是由技能生成，具体点数是否等概率随机。\n- 新牌池是否包含2、大小王，还是只包含6至a。\n- 新增牌的具体点数及数量是否全场公开。\n- 队友和对手打牌是否完全同样触发平乱。\n- 万能牌声明为5以下点数时是否计入“只包含≤5”，还是按其原始标记判断。\n- 被其他技能改变点数后的牌，按当前点数还是原始点数判断触发。\n- 三带牌型中三张和带牌全部≤5时是否正常触发；只要其中一张≥6是否完全不触发。\n- 皇甫嵩自己一次出完低牌时，是立即获胜，还是会先补入等量新牌而无法走完。\n- 皇甫嵩只剩少量牌时，其他玩家触发平乱会不会在胜负结算前继续给牌。\n- 触发次数耗尽后，其他玩家的低牌出手是否不再产生任何提示或效果。\n"}, {"name": "祝融", "faction": "蜀", "skills": "巡狩、射猎", "position": "压牌补A、不可压制桥接与定向弃牌", "status": "初步分析", "landlord": 9.0, "farmer": 9.5, "identity": "农民略优。", "firstMove": "中等", "image": "技能截图/祝融.png", "html": "<div class=\"hero-shot\"><img src=\"技能截图/祝融.png\" alt=\"祝融技能截图\" loading=\"lazy\"><\/div>\n<h3>技能<\/h3>\n<p><strong>巡狩｜限5次<\/strong><\/p>\n<blockquote>压牌后，可以获得1张A；以此法获得的A不能组成炸弹。<\/blockquote>\n<p><strong>射猎｜限1次<\/strong><\/p>\n<blockquote>打出的牌型包含2张或以上的A时，可以令该牌型不能被压制，并选择1名玩家弃置2张最大牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9/10<\/td><td>可通过压牌补A并建立不可压制桥接，但首手不能启动巡狩，且只能削弱一名农民<\/td><\/tr>\n<tr><td>农民<\/td><td>9.5/10<\/td><td>可直接指定地主弃两张最大牌，不可压制牌型还能为队友建立稳定牌权<\/td><\/tr>\n<tr><td>稳定性<\/td><td>9/10<\/td><td>补牌点数固定、射猎结果确定；主要成本是巡狩持续增加手牌<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>补A数量、射猎牌型与弃牌目标时机共同决定收益<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：农民略优。<\/strong><\/p>\n<p><strong>先手匹配度：中等。<\/strong> 地主首手无法通过巡狩获得A，但若起手已有对A，可直接规划射猎；否则必须先等待并完成压牌。农民虽然没有先手，却能把弃两张最大牌的效果集中施加给地主，收益更直接。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>祝融成功压牌后，可以选择获得1张A，最多5次。<\/li><li>巡狩是可选补牌，不需要机械拿满5张。<\/li><li>技能生成A与普通A一样可用于单张、对子、三张、顺子、飞机和带牌，但不能参与炸弹。<\/li><li>每次巡狩使手牌净增加1张，必须通过组合重构消化。<\/li><li>射猎要求本次打出的完整牌型中至少包含2张A。<\/li><li>射猎发动后，该手牌型不可被其他牌型压制，同时选择1名玩家弃2张最大牌。<\/li><li>射猎只限1次，应承担牌权锁定与拆除最高控制牌的双重终结任务。<\/li><\/ul>\n<h3>巡狩拿A数量<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>当前A结构<\/th><th>建议<\/th><\/tr><\/thead><tbody>\n<tr><td>0张A<\/td><td>前两次压牌通常取A，优先建立射猎门槛<\/td><\/tr>\n<tr><td>1张A<\/td><td>再取1张即可形成对A，属于最高效率节点<\/td><\/tr>\n<tr><td>2张A<\/td><td>已满足射猎，后续只在能形成三张、飞机或减少手数时继续取<\/td><\/tr>\n<tr><td>3张A<\/td><td>三A已具备高效带牌能力，通常停止增牌<\/td><\/tr>\n<tr><td>4张及以上A<\/td><td>技能A不能成炸，继续增加容易成为牌量负担<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>常规目标是持有2至3张A，而不是用满5次巡狩。<\/strong> 对A最适合低成本启动射猎；三A则能搭配带牌，在不可压制的同时一次处理更多废张。<\/p>\n<h3>射猎牌型优先级<\/h3>\n<ol><li><strong>对A：<\/strong> 只出2张便获得绝对牌权并迫使目标弃2张最大牌，最容易留作残局桥接。<\/li><li><strong>三A带牌：<\/strong> 一次处理三A和附带废牌，减手效率更高。<\/li><li><strong>含三A的飞机或特殊组合：<\/strong> 批量减手并锁死牌权，上限最高但条件更严。<\/li><li><strong>其他含至少两A的合法牌型：<\/strong> 以能否直接衔接剩余手牌为判断标准。<\/li><\/ol>\n<p>射猎不应只看当手减牌量。真正价值是“这一手绝对不会被压＋目标失去两张最高控制牌＋祝融继续掌握牌权”。<\/p>\n<h3>主流打法<\/h3>\n<h4>地主：补双A后封一侧<\/h4>\n<ul><li>首攻正常清理结构，保留容易压牌的高牌，准备通过回合交锋启动巡狩。<\/li><li>取得两张A后停止无目的补牌，优先规划对A或三A带牌的射猎窗口。<\/li><li>射猎目标应选择手数更少、控制力更强或更接近走完的农民。<\/li><li>地主只能削弱一名农民，必须同时确认另一名农民无法在后续牌型中接管。<\/li><li>最理想节奏是射猎牌型领出后，依靠不可压制继续出完剩余完整结构。<\/li><\/ul>\n<h4>农民：锁地主并交接队友<\/h4>\n<ul><li>巡狩补至对A后即可停止，避免为技能增加过多手牌。<\/li><li>射猎通常只指定地主，使其直接失去两张最大控制牌。<\/li><li>队友接近走完时，可用不可压制牌型锁定本轮，再主动把后续牌权交给队友。<\/li><li>地主只剩少量牌时应提前发动，不能等待更漂亮的三A或复杂组合。<\/li><li>若起手已有对A，射猎可以完全不依赖巡狩，后续巡狩只作为结构补强选项。<\/li><\/ul>\n<h3>射猎时机<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>局面<\/th><th>决策<\/th><\/tr><\/thead><tbody>\n<tr><td>地主或关键农民只剩少量牌<\/td><td>立即射猎，删除其最高两张控制牌<\/td><\/tr>\n<tr><td>自己剩余手牌已经形成连续出牌路线<\/td><td>用射猎作为不可压制桥接，直接冲刺<\/td><\/tr>\n<tr><td>目标最大牌疑似王、2或炸弹组件<\/td><td>射猎弃牌收益极高<\/td><\/tr>\n<tr><td>当前只有普通对A，后续结构仍散乱<\/td><td>可暂缓，先整理射猎后的连续牌路<\/td><\/tr>\n<tr><td>为等第三张A可能丢失关键牌权<\/td><td>不等，直接用对A发动<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>关键风险<\/h3>\n<ul><li>巡狩每次都会增加牌量，拿满5张A可能严重拖慢收尾。<\/li><li>技能A不能组成炸弹，多余A不能按普通同点数爆发路线处理。<\/li><li>射猎只能指定1人；地主对双农民时无法一次清空双方控制牌。<\/li><li>目标弃掉的最大牌也可能是难处理孤张，存在替对方优化结构的副作用。<\/li><li>射猎发动太早，虽然取得牌权，却可能没有后续完整牌路。<\/li><\/ul>\n
