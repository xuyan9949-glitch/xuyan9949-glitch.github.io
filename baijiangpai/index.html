>伏兵适合放在对手“压也亏、不压也亏”的牌型中：压制会帮助程昱额外减1张，不压则有农民随机弃2张。<\/li><li>两名农民手牌差距明显时，无人压制后优先指定更接近走完或拦截能力更强的一方。<\/li><li>每次新伏兵生成后立刻重算牌型，避免为了追逐技能拆散炸弹、飞机或长顺。<\/li><li>残局中伏兵若难以被压，可能直接随机清掉对方2张牌并维持牌权，终结能力很强。<\/li><\/ul>\n<h4>农民：队友放行，集中攻击地主<\/h4>\n<ul><li>程昱打出伏兵后，队友通常应避免无意义压制，让伏兵无人压制并指定地主随机弃2张。<\/li><li>若地主压制伏兵，程昱仍可自动弃1张，因此多数情况下两条分支都能帮助农民方减牌或破坏地主结构。<\/li><li>队友需要牌权继续封锁地主时，可以压制伏兵，但要比较牌权价值与让地主弃2张的收益。<\/li><li>伏兵落在低价值孤张时优先主动打出；落在关键炸弹或长牌组件时不应为刷新标记强拆。<\/li><\/ul>\n<h3>伏兵出牌优先级<\/h3>\n<ol><li>打出后可以直接走完或形成确定终局。<\/li><li>对手难以压制的高位或特殊牌型，使指定目标随机弃2张。<\/li><li>容易被压的中等牌型，借被压额外弃掉自己的废牌。<\/li><li>不破坏主要结构的伏兵孤张或对子。<\/li><li>必须拆炸弹、飞机或完整长牌才能打出的伏兵，通常暂缓。<\/li><\/ol>\n<h3>关键风险<\/h3>\n<ul><li>新伏兵落点随机，可能标记在暂时无法单独处理的核心组合中。<\/li><li>伏兵被压后的弃牌方式尚未确认，若系统随机弃牌，可能误伤关键高牌或炸弹组件。<\/li><li>无人压制迫使对手随机弃2张，既可能破坏其结构，也可能帮助其清除废牌甚至直接走完。<\/li><li>农民身份下若误指定队友，会给己方造成明显损失。<\/li><li>为持续刷新伏兵而强行拆牌，可能让总手数增加，抵消技能减牌收益。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>设伏随机标记的具体牌面是否全场公开，还是只有程昱本人可见。<\/li><li>一手打出多张牌且其中含伏兵时，是否只生成1张新伏兵。<\/li><li>同一手中若含多张伏兵，设伏触发次数如何计算。<\/li><li>伏兵被队友压制是否同样触发现兵并让程昱弃牌。<\/li><li>“被压后弃置1张手牌”由程昱选择还是系统随机，弃牌结果是否公开。<\/li><li>“无人压制”是在其余玩家全部选择不出后立即结算，还是在该轮结束时结算。<\/li><li>无人压制时能否指定队友或任意阵营玩家，以及随机弃牌结果是否公开。<\/li><li>目标仅剩1张牌时如何结算随机弃置2张，是否会直接走完获胜。<\/li><li>程昱打出最后一张伏兵时，是立即获胜，还是仍会继续结算设伏与现兵。<\/li><li>伏兵成为万能牌或被其他技能改变点数后，标记是否保留。<\/li><\/ul>", "search": "  程昱\n\n  技能\n\n 设伏｜被动｜不限次 \n\n  开局时，或你打出“伏兵”牌后，随机1张手牌变为“伏兵”牌。\n\n 现兵｜被动｜不限次 \n\n  “伏兵”被压后，你弃置1张手牌；“伏兵”无人压制时，你令1名其他玩家随机弃置2张牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9.5/10   先手可主动打出伏兵，持续刷新标记，并同时制造无人压制的双弃牌威胁  \n  农民   8.5/10   可借队友选择不压伏兵来定向打击地主，但牌权不足时启动较慢  \n  稳定性   8/10   伏兵必定持续生成，但具体落在哪张手牌以及是否被压都存在随机性和博弈  \n  操作上限   9/10   每张伏兵都是“压则程昱减1、不压则指定者弃2”的两难选择  \n\n 身份倾向：地主明显更强。  地主首轮拥有牌权，可以立即打出开局生成的伏兵并开始循环；农民虽然有队友协作，但更依赖取得牌权。\n\n 先手匹配度：极高。  开局自动获得1张伏兵，地主能够第一手主动兑现。伏兵打出后又会随机生成下一张伏兵，使技能具备连续滚动能力。\n\n  核心机制\n\n- 开局时，程昱手中随机1张牌获得“伏兵”标记。\n- 每当程昱打出伏兵牌后，手中另一张随机牌变为新的伏兵，形成持续传递的标记链。\n- 伏兵被任意玩家压制后，程昱再弃置1张自己的手牌，相当于把失去牌权转化为额外减牌。\n- 伏兵最终无人压制时，程昱指定1名其他玩家，由该玩家随机弃置2张牌。\n- 现兵的两种结果取决于该手伏兵最终是否被压，并非由程昱自由选择。\n- 技能均不限次数，理论上只要手中仍能生成并打出伏兵，就可持续触发。\n- 伏兵是牌的特殊标记，不改变该牌原本的点数和牌型用途。\n\n  主流打法\n\n  地主：连续伏兵施压\n\n- 首轮优先判断伏兵所在牌能否在不破坏核心结构的情况下打出。\n- 伏兵适合放在对手“压也亏、不压也亏”的牌型中：压制会帮助程昱额外减1张，不压则有农民随机弃2张。\n- 两名农民手牌差距明显时，无人压制后优先指定更接近走完或拦截能力更强的一方。\n- 每次新伏兵生成后立刻重算牌型，避免为了追逐技能拆散炸弹、飞机或长顺。\n- 残局中伏兵若难以被压，可能直接随机清掉对方2张牌并维持牌权，终结能力很强。\n\n  农民：队友放行，集中攻击地主\n\n- 程昱打出伏兵后，队友通常应避免无意义压制，让伏兵无人压制并指定地主随机弃2张。\n- 若地主压制伏兵，程昱仍可自动弃1张，因此多数情况下两条分支都能帮助农民方减牌或破坏地主结构。\n- 队友需要牌权继续封锁地主时，可以压制伏兵，但要比较牌权价值与让地主弃2张的收益。\n- 伏兵落在低价值孤张时优先主动打出；落在关键炸弹或长牌组件时不应为刷新标记强拆。\n\n  伏兵出牌优先级\n\n1. 打出后可以直接走完或形成确定终局。\n2. 对手难以压制的高位或特殊牌型，使指定目标随机弃2张。\n3. 容易被压的中等牌型，借被压额外弃掉自己的废牌。\n4. 不破坏主要结构的伏兵孤张或对子。\n5. 必须拆炸弹、飞机或完整长牌才能打出的伏兵，通常暂缓。\n\n  关键风险\n\n- 新伏兵落点随机，可能标记在暂时无法单独处理的核心组合中。\n- 伏兵被压后的弃牌方式尚未确认，若系统随机弃牌，可能误伤关键高牌或炸弹组件。\n- 无人压制迫使对手随机弃2张，既可能破坏其结构，也可能帮助其清除废牌甚至直接走完。\n- 农民身份下若误指定队友，会给己方造成明显损失。\n- 为持续刷新伏兵而强行拆牌，可能让总手数增加，抵消技能减牌收益。\n\n  待实测\n\n- 设伏随机标记的具体牌面是否全场公开，还是只有程昱本人可见。\n- 一手打出多张牌且其中含伏兵时，是否只生成1张新伏兵。\n- 同一手中若含多张伏兵，设伏触发次数如何计算。\n- 伏兵被队友压制是否同样触发现兵并让程昱弃牌。\n- “被压后弃置1张手牌”由程昱选择还是系统随机，弃牌结果是否公开。\n- “无人压制”是在其余玩家全部选择不出后立即结算，还是在该轮结束时结算。\n- 无人压制时能否指定队友或任意阵营玩家，以及随机弃牌结果是否公开。\n- 目标仅剩1张牌时如何结算随机弃置2张，是否会直接走完获胜。\n- 程昱打出最后一张伏兵时，是立即获胜，还是仍会继续结算设伏与现兵。\n- 伏兵成为万能牌或被其他技能改变点数后，标记是否保留。\n"}, {"name": "羊祜", "faction": "魏", "skills": "怀柔", "position": "压牌取张、结构补强与队友协作", "status": "主要规则已实测", "landlord": 8.5, "farmer": 9.5, "identity": "强农民型。", "firstMove": "较高", "image": "", "html": "<h3>技能<\/h3>\n<p><strong>怀柔｜主动响应｜限5次<\/strong><\/p>\n<blockquote>你压牌时，可以选择被压牌中的1张加入手牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8.5/10<\/td><td>先手后可通过连续压牌取回关键结构牌，但每次取牌都会降低净减牌效率<\/td><\/tr>\n<tr><td>农民<\/td><td>9.5/10<\/td><td>可从地主或队友的被压牌中定向取牌，协作稳定性和选择空间更高<\/td><\/tr>\n<tr><td>稳定性<\/td><td>9/10<\/td><td>压牌是常规行为，最多5次且目标可以定向选择<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>能补炸弹、三张、顺子和控制牌，并结合队友实现定向供牌<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：强农民型。<\/strong> 农民既可从地主牌中取关键张，也可由队友主动打出目标牌；地主只能从对手出牌中寻找收益。<\/p>\n<p><strong>先手匹配度：较高。<\/strong> 地主先手有利于建立牌权循环，但怀柔必须在后续压牌时发动，不能第一手直接启动。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>怀柔在羊祜完成压牌时出现发动窗口，整局最多5次。<\/li><li>选择目标明确来自本次被羊祜压制的上一手牌型，每次任选其中1张加入手牌。<\/li><li>怀柔的“取牌”是复制：上一手牌仍按原牌型正常打出和结算，不会从桌面移走或缺少其中一张。<\/li><li>取牌目标可定向选择，适合补现有对子、三张、顺子缺口或高控制牌。<\/li><li>发动不会替代本次压牌，羊祜仍正常打出压制牌，只额外获得1张。<\/li><li>单次技能使羊祜手牌增加1张，因此必须以结构收益抵消增牌成本。<\/li><li>农民队友可主动打出包含目标点数的牌型，再由羊祜压制并取牌。<\/li><li>被压的是对子、三张或炸弹时，羊祜仍只任选其中1张复制；炸弹被更大炸弹压制也能发动。<\/li><li>被压牌型含万能牌时，可以取得该万能牌当时代表的点数牌，但得到的是对应点数的普通牌，不能获得万能牌本身。<\/li><li>怀柔获得的牌及其点数全场公开。<\/li><li>若上一手已经是该玩家的最后一手，游戏立即结束，不再结算怀柔。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：夺权顺带重组<\/h4>\n<ul><li>只在本来就应当压牌时发动，不为取普通牌强行浪费控制牌。<\/li><li>优先取能直接补炸弹、三张或最后一组牌型的关键张。<\/li><li>对手打出2、A等高牌时，如果能够合法压制，取回后可继续维持牌权。<\/li><li>前期避免五次全部用完，至少保留1至2次给残局精准补牌。<\/li><\/ul>\n<h4>农民：队友供牌型<\/h4>\n<ul><li>队友可打出羊祜所缺点数，再由羊祜正常压制并取走目标牌。<\/li><li>地主打出长牌时，从中选最能缩短自身手数的连接张。<\/li><li>地主进入短牌阶段后，优先正常拦截；取牌不能以牺牲团队牌权为代价。<\/li><li>五次怀柔不必用满，无结构收益时直接放弃。<\/li><\/ul>\n<h3>取牌优先级<\/h3>\n<ol><li>补成炸弹或更高张数炸弹。<\/li><li>补成三张并直接减少一手。<\/li><li>补齐顺子、连对、飞机的唯一缺口。<\/li><li>获取2、王等稳定牌权。<\/li><li>只能形成新孤张时放弃。<\/li><\/ol>\n<h3>关键风险<\/h3>\n<ul><li>每次取牌都会增加1张，五次全部发动最多增加5张。<\/li><li>为取牌而强行压制可能浪费炸弹或高控制牌。<\/li><li>队友供牌若迫使羊祜拆掉完整结构压制，整体收益可能为负。<\/li><li>取到高牌不等于减少手数，仍应优先考虑结构匹配。<\/li><\/ul>\n<h3>已确认结论<\/h3>\n<ul><li>怀柔复制的是被羊祜压制的上一手牌，不是羊祜自己的压制牌。<\/li><li>所有“取牌”均按复制处理，不影响上一手牌的正常打出与结算。<\/li><li>队友打出的牌可以成为怀柔目标。<\/li><li>多张牌型中每次任选1张；炸弹被更大炸弹压制时同样可以复制其中1张。<\/li><li>万能牌只能按其代表点数复制成普通牌，不能复制万能牌本身。<\/li><li>获得结果全场公开；上一手已经走完时则直接结束游戏。<\/li><\/ul>", "search": "  羊祜\n\n  技能\n\n 怀柔｜主动响应｜限5次 \n\n  你压牌时，可以选择被压牌中的1张加入手牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8.5/10   先手后可通过连续压牌取回关键结构牌，但每次取牌都会降低净减牌效率  \n  农民   9.5/10   可从地主或队友的被压牌中定向取牌，协作稳定性和选择空间更高  \n  稳定性   9/10   压牌是常规行为，最多5次且目标可以定向选择  \n  操作上限   9.5/10   能补炸弹、三张、顺子和控制牌，并结合队友实现定向供牌  \n\n 身份倾向：强农民型。  农民既可从地主牌中取关键张，也可由队友主动打出目标牌；地主只能从对手出牌中寻找收益。\n\n 先手匹配度：较高。  地主先手有利于建立牌权循环，但怀柔必须在后续压牌时发动，不能第一手直接启动。\n\n  核心机制\n\n- 怀柔在羊祜完成压牌时出现发动窗口，整局最多5次。\n- 选择目标明确来自本次被羊祜压制的上一手牌型，每次任选其中1张加入手牌。\n- 怀柔的“取牌”是复制：上一手牌仍按原牌型正常打出和结算，不会从桌面移走或缺少其中一张。\n- 取牌目标可定向选择，适合补现有对子、三张、顺子缺口或高控制牌。\n- 发动不会替代本次压牌，羊祜仍正常打出压制牌，只额外获得1张。\n- 单次技能使羊祜手牌增加1张，因此必须以结构收益抵消增牌成本。\n- 农民队友可主动打出包含目标点数的牌型，再由羊祜压制并取牌。\n- 被压的是对子、三张或炸弹时，羊祜仍只任选其中1张复制；炸弹被更大炸弹压制也能发动。\n- 被压牌型含万能牌时，可以取得该万能牌当时代表的点数牌，但得到的是对应点数的普通牌，不能获得万能牌本身。\n- 怀柔获得的牌及其点数全场公开。\n- 若上一手已经是该玩家的最后一手，游戏立即结束，不再结算怀柔。\n\n  主流打法\n\n  地主：夺权顺带重组\n\n- 只在本来就应当压牌时发动，不为取普通牌强行浪费控制牌。\n- 优先取能直接补炸弹、三张或最后一组牌型的关键张。\n- 对手打出2、a等高牌时，如果能够合法压制，取回后可继续维持牌权。\n- 前期避免五次全部用完，至少保留1至2次给残局精准补牌。\n\n  农民：队友供牌型\n\n- 队友可打出羊祜所缺点数，再由羊祜正常压制并取走目标牌。\n- 地主打出长牌时，从中选最能缩短自身手数的连接张。\n- 地主进入短牌阶段后，优先正常拦截；取牌不能以牺牲团队牌权为代价。\n- 五次怀柔不必用满，无结构收益时直接放弃。\n\n  取牌优先级\n\n1. 补成炸弹或更高张数炸弹。\n2. 补成三张并直接减少一手。\n3. 补齐顺子、连对、飞机的唯一缺口。\n4. 获取2、王等稳定牌权。\n5. 只能形成新孤张时放弃。\n\n  关键风险\n\n- 每次取牌都会增加1张，五次全部发动最多增加5张。\n- 为取牌而强行压制可能浪费炸弹或高控制牌。\n- 队友供牌若迫使羊祜拆掉完整结构压制，整体收益可能为负。\n- 取到高牌不等于减少手数，仍应优先考虑结构匹配。\n\n  已确认结论\n\n- 怀柔复制的是被羊祜压制的上一手牌，不是羊祜自己的压制牌。\n- 所有“取牌”均按复制处理，不影响上一手牌的正常打出与结算。\n- 队友打出的牌可以成为怀柔目标。\n- 多张牌型中每次任选1张；炸弹被更大炸弹压制时同样可以复制其中1张。\n- 万能牌只能按其代表点数复制成普通牌，不能复制万能牌本身。\n- 获得结果全场公开；上一手已经走完时则直接结束游戏。\n"}, {"name": "荀攸", "faction": "魏", "skills": "奇策、谋佐", "position": "十二点弃牌、高牌补给与技能重置循环", "status": "初步分析", "landlord": 9.5, "farmer": 9.0, "identity": "地主略优。", "firstMove": "极高", "image": "", "html": "<h3>技能<\/h3>\n<p><strong>奇策｜主动｜限1次<\/strong><\/p>\n<blockquote>你可以弃置任意张数字和为12的牌，然后随机获得1张点数不低于Q的牌。<\/blockquote>\n<p><strong>谋佐｜被动｜限1次<\/strong><\/p>\n<blockquote>当你打出“奇策”获得的牌后，重置“奇策”技能使用次数。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9.5/10<\/td><td>先手可主动弃掉低牌组合换取Q以上控制牌，并有机会持续重置形成循环<\/td><\/tr>\n<tr><td>农民<\/td><td>9/10<\/td><td>高牌补给适合拦截地主，队友也能帮助其获得打出奖励牌的牌权<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8/10<\/td><td>点数和12的弃牌组合可主动规划，但奖励点数随机，重置还要求奖励牌实际打出<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>可把多张低牌直接弃掉，再以奖励高牌触发下一轮奇策，具备连续压缩手牌的上限<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：地主略优。<\/strong> 地主拥有首轮牌权，更容易在奇策后立即规划并打出奖励牌，从而重置技能；农民则更偏向用奖励高牌建立拦截。<\/p>\n<p><strong>先手匹配度：极高。<\/strong> 奇策是主动弃牌技能，不需要等待被压或其他玩家配合；地主可以在开局直接清除点数和12的低牌组合，再用新获得的Q以上牌争取连续循环。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>奇策允许荀攸选择若干张手牌，只要这些牌的数字总和恰好为12，即可全部弃置。<\/li><li>弃牌后随机获得1张点数不低于Q的新牌。<\/li><li>若用2张或更多牌完成点数12，奇策会直接净减少至少1张手牌；投入张数越多，减牌效率越高。<\/li><li>谋佐关注的是奇策所获得的那张牌；该牌被荀攸实际打出后，奇策恢复1次使用机会。<\/li><li>重置后可以再次寻找点数和12的组合，形成“弃低牌—获高牌—打出高牌—再次弃牌”的循环。<\/li><li>奇策与谋佐界面均标注限1次，但谋佐的重置关系可能允许多轮循环，具体次数规则仍需实测。<\/li><li>技能生成的Q以上牌既是控制资源，也是下一次奇策的启动钥匙，不宜长期滞留在手中。<\/li><\/ul>\n<h3>点数12组合思路<\/h3>\n<ul><li>优先选择张数最多且不破坏关键牌型的组合，以最大化净减牌。<\/li><li>典型两张组合可围绕3+9、4+8、5+7展开。<\/li><li>多张组合可用多个低点数组成，例如3+4+5；具体点数计算口径需以游戏实测为准。<\/li><li>若某组牌属于完整顺子、连对、三张或炸弹，不能只因满足12就机械拆掉。<\/li><li>残局中只要弃牌后剩余结构更短，即使只用两张组合也有较高价值。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：首轮清低，奖励牌接续<\/h4>\n<ul><li>开局先枚举所有点数和12的组合，优先选择张数多、结构损失小的一组。<\/li><li>获得Q以上牌后立即检查能否并入高对、三张、炸弹、顺子或作为回手单张。<\/li><li>为触发谋佐，应尽快在安全牌权窗口打出奇策奖励牌。<\/li><li>奇策重置后再次计算12点组合，不沿用发动前的拆牌方案。<\/li><li>若奖励牌是唯一关键回手，不能为了重置而过早裸出。<\/li><\/ul>\n<h4>农民：高牌拦截与循环减牌<\/h4>\n<ul><li>奇策优先清掉难处理的低位孤张，奖励Q以上牌用于压制地主。<\/li><li>队友掌握牌权时，可通过合适的出牌节奏帮助荀攸打出奖励牌并重置奇策。<\/li><li>地主即将走完时，奖励牌优先承担拦截任务，不为追求下一轮循环放弃当前防守。<\/li><li>若多张低牌能被奇策直接弃掉，荀攸可能形成强残局斩杀，应由队友优先让出适当牌权。<\/li><\/ul>\n<h3>奇策组合优先级<\/h3>\n<ol><li>弃置后可以立即走完或只剩一手。<\/li><li>用3张或更多废牌凑成12，获得显著净减牌。<\/li><li>用2张孤牌完成12，不拆现成结构。<\/li><li>拆除低价值对子或短顺接口，换取明确的终局高牌。<\/li><li>拆炸弹、飞机或关键长牌凑12，通常不采用。<\/li><\/ol>\n<h3>关键风险<\/h3>\n<ul><li>奖励牌随机，Q、K、A、2或王的实际概率未知，不能把每次奖励都按最高收益估算。<\/li><li>奖励牌如果迟迟无法打出，谋佐不能重置奇策，循环会中断。<\/li><li>为追求更多弃牌张数强拆完整牌型，可能使剩余手数反而增加。<\/li><li>奇策把低牌换成高牌，但高牌若不能合并结构，仍可能成为难以批量处理的孤张。<\/li><li>谋佐若整局只能触发一次，则连续循环上限会明显低于字面直觉。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>数字和12的计算方式：A是否算1、J/Q/K是否算11/12/13，2和大小王如何计数。<\/li><li>奇策可选择的最大张数是否有限制，能否用重复点数牌组合。<\/li><li>奇策弃牌由玩家任意选择，只要总和为12即可，还是系统只展示固定组合。<\/li><li>奇策弃牌与新获得牌的具体点数是否全场公开。<\/li><li>奖励牌池是否包含Q、K、A、2及大小王，各点数是否等概率。<\/li><li>奇策奖励牌是否有特殊来源标记，改变点数后谋佐还能否识别。<\/li><li>奖励牌作为多张牌型的一部分打出，是否同样触发谋佐。<\/li><li>奖励牌被其他技能弃置、转移或拿走，是否会触发或永久失去谋佐重置机会。<\/li><li>谋佐重置奇策后自身是否也能重置，从而支持第三次及更多次循环。<\/li><li>同时持有多张历次奇策奖励牌时，打出其中任意一张如何结算重置。<\/li><li>奇策直接弃完最后几张手牌时，是立即获胜，还是必须先获得1张Q以上牌而不能走完。<\/li><li>打出最后一张奇策奖励牌时，是先结算胜利，还是先触发谋佐重置提示。<\/li><\/ul>", "search": "  荀攸\n\n  技能\n\n 奇策｜主动｜限1次 \n\n  你可以弃置任意张数字和为12的牌，然后随机获得1张点数不低于q的牌。\n\n 谋佐｜被动｜限1次 \n\n  当你打出“奇策”获得的牌后，重置“奇策”技能使用次数。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9.5/10   先手可主动弃掉低牌组合换取q以上控制牌，并有机会持续重置形成循环  \n  农民   9/10   高牌补给适合拦截地主，队友也能帮助其获得打出奖励牌的牌权  \n  稳定性   8/10   点数和12的弃牌组合可主动规划，但奖励点数随机，重置还要求奖励牌实际打出  \n  操作上限   9.5/10   可把多张低牌直接弃掉，再以奖励高牌触发下一轮奇策，具备连续压缩手牌的上限  \n\n 身份倾向：地主略优。  地主拥有首轮牌权，更容易在奇策后立即规划并打出奖励牌，从而重置技能；农民则更偏向用奖励高牌建立拦截。\n\n 先手匹配度：极高。  奇策是主动弃牌技能，不需要等待被压或其他玩家配合；地主可以在开局直接清除点数和12的低牌组合，再用新获得的q以上牌争取连续循环。\n\n  核心机制\n\n- 奇策允许荀攸选择若干张手牌，只要这些牌的数字总和恰好为12，即可全部弃置。\n- 弃牌后随机获得1张点数不低于q的新牌。\n- 若用2张或更多牌完成点数12，奇策会直接净减少至少1张手牌；投入张数越多，减牌效率越高。\n- 谋佐关注的是奇策所获得的那张牌；该牌被荀攸实际打出后，奇策恢复1次使用机会。\n- 重置后可以再次寻找点数和12的组合，形成“弃低牌—获高牌—打出高牌—再次弃牌”的循环。\n- 奇策与谋佐界面均标注限1次，但谋佐的重置关系可能允许多轮循环，具体次数规则仍需实测。\n- 技能生成的q以上牌既是控制资源，也是下一次奇策的启动钥匙，不宜长期滞留在手中。\n\n  点数12组合思路\n\n- 优先选择张数最多且不破坏关键牌型的组合，以最大化净减牌。\n- 典型两张组合可围绕3+9、4+8、5+7展开。\n- 多张组合可用多个低点数组成，例如3+4+5；具体点数计算口径需以游戏实测为准。\n- 若某组牌属于完整顺子、连对、三张或炸弹，不能只因满足12就机械拆掉。\n- 残局中只要弃牌后剩余结构更短，即使只用两张组合也有较高价值。\n\n  主流打法\n\n  地主：首轮清低，奖励牌接续\n\n- 开局先枚举所有点数和12的组合，优先选择张数多、结构损失小的一组。\n- 获得q以上牌后立即检查能否并入高对、三张、炸弹、顺子或作为回手单张。\n- 为触发谋佐，应尽快在安全牌权窗口打出奇策奖励牌。\n- 奇策重置后再次计算12点组合，不沿用发动前的拆牌方案。\n- 若奖励牌是唯一关键回手，不能为了重置而过早裸出。\n\n  农民：高牌拦截与循环减牌\n\n- 奇策优先清掉难处理的低位孤张，奖励q以上牌用于压制地主。\n- 队友掌握牌权时，可通过合适的出牌节奏帮助荀攸打出奖励牌并重置奇策。\n- 地主即将走完时，奖励牌优先承担拦截任务，不为追求下一轮循环放弃当前防守。\n- 若多张低牌能被奇策直接弃掉，荀攸可能形成强残局斩杀，应由队友优先让出适当牌权。\n\n  奇策组合优先级\n\n1. 弃置后可以立即走完或只剩一手。\n2. 用3张或更多废牌凑成12，获得显著净减牌。\n3. 用2张孤牌完成12，不拆现成结构。\n4. 拆除低价值对子或短顺接口，换取明确的终局高牌。\n5. 拆炸弹、飞机或关键长牌凑12，通常不采用。\n\n  关键风险\n\n- 奖励牌随机，q、k、a、2或王的实际概率未知，不能把每次奖励都按最高收益估算。\n- 奖励牌如果迟迟无法打出，谋佐不能重置奇策，循环会中断。\n- 为追求更多弃牌张数强拆完整牌型，可能使剩余手数反而增加。\n- 奇策把低牌换成高牌，但高牌若不能合并结构，仍可能成为难以批量处理的孤张。\n- 谋佐若整局只能触发一次，则连续循环上限会明显低于字面直觉。\n\n  待实测\n\n- 数字和12的计算方式：a是否算1、j/q/k是否算11/12/13，2和大小王如何计数。\n- 奇策可选择的最大张数是否有限制，能否用重复点数牌组合。\n- 奇策弃牌由玩家任意选择，只要总和为12即可，还是系统只展示固定组合。\n- 奇策弃牌与新获得牌的具体点数是否全场公开。\n- 奖励牌池是否包含q、k、a、2及大小王，各点数是否等概率。\n- 奇策奖励牌是否有特殊来源标记，改变点数后谋佐还能否识别。\n- 奖励牌作为多张牌型的一部分打出，是否同样触发谋佐。\n- 奖励牌被其他技能弃置、转移或拿走，是否会触发或永久失去谋佐重置机会。\n- 谋佐重置奇策后自身是否也能重置，从而支持第三次及更多次循环。\n- 同时持有多张历次奇策奖励牌时，打出其中任意一张如何结算重置。\n- 奇策直接弃完最后几张手牌时，是立即获胜，还是必须先获得1张q以上牌而不能走完。\n- 打出最后一张奇策奖励牌时，是先结算胜利，还是先触发谋佐重置提示。\n"}, {"name": "蔡文姬", "faction": "群", "skills": "和弦、变奏", "position": "全场牌型序列、低牌升点与连续弃牌", "status": "初步分析", "landlord": 8.5, "farmer": 9.5, "identity": "强农民型。", "firstMove": "较高", "image": "", "html": "<h3>技能<\/h3>\n<p><strong>和弦｜被动｜不限次数<\/strong><\/p>\n<blockquote>场上连续打出3个相同牌型时，你点数最小的1张≤A的牌随机变大，最大变成2。<\/blockquote>\n<p><strong>变奏｜被动｜不限次数<\/strong><\/p>\n<blockquote>场上连续打出3个不同牌型时，你弃置1张最小牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8.5/10<\/td><td>先手可决定牌型序列起点，但两名农民可以主动打断所需节奏<\/td><\/tr>\n<tr><td>农民<\/td><td>9.5/10<\/td><td>两名队友更容易协作制造三同型或三异型，稳定触发升点和减牌<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8/10<\/td><td>技能不限次数，但触发依赖全场连续三手的牌型序列<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>可通过出牌顺序在升点与直接弃牌之间切换，团队配合上限高<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：强农民型。<\/strong> 农民方有两人可以共同维护目标序列，并用队友牌型接力主动触发；地主虽有先手，但难以独自控制连续三手。<\/p>\n<p><strong>先手匹配度：较高。<\/strong> 地主首手能确定序列的第一个牌型，并针对手牌需求选择同型成长或异型弃牌路线，但后续两手受农民干扰。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>两项技能都统计全场连续出现的牌型，而非只统计蔡文姬自己的出牌。<\/li><li>连续三手牌型相同，触发和弦：从蔡文姬最低点数的≤A手牌中取1张随机升点，上限为2。<\/li><li>连续三手牌型各不相同，触发变奏：直接弃置蔡文姬当前1张最低牌。<\/li><li>和弦不减少牌量，主要把低牌转成控制牌或2；变奏直接减少1张，是更稳定的出完收益。<\/li><li>两项技能均不限次数，核心玩法是持续设计全场牌型序列。<\/li><li>同一组三手只按最终形成的序列触发对应技能，不同时触发和弦与变奏。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：先手定调、优先减牌<\/h4>\n<ul><li>默认优先制造三异型触发变奏，直接弃最低牌比随机升点更稳定。<\/li><li>手牌低张较多且缺少控制牌时，可先出常见牌型，引导农民连续跟出同型触发和弦。<\/li><li>首手选择要兼顾后续可控性：单张、对子最容易连续，也最容易被对手故意换型打断。<\/li><li>已经有足够2和王时，不再执着和弦，转向三异型弃牌。<\/li><li>残局提前保留不同牌型接口，争取用序列触发额外减牌。<\/li><\/ul>\n<h4>农民：队友接力型<\/h4>\n<ul><li>需要减牌时，两名农民主动连续打出三种不同牌型，帮助蔡文姬触发变奏。<\/li><li>需要提升牌权时，围绕单张或对子连续接力，触发和弦把最低牌向2提升。<\/li><li>队友可根据蔡文姬手牌数决定路线：短牌优先变奏，长牌且缺控制优先和弦。<\/li><li>地主即将走完时，以拦截为先，不为维护序列放弃合法压制。<\/li><li>记录最近两手牌型，第三手优先选择能完成目标技能的合法方案。<\/li><\/ul>\n<h3>序列决策<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>当前需求<\/th><th>优先序列<\/th><th>目的<\/th><\/tr><\/thead><tbody>\n<tr><td>手牌多、低散张多<\/td><td>三种不同牌型<\/td><td>触发变奏，直接减1张<\/td><\/tr>\n<tr><td>缺2和高控制牌<\/td><td>三次相同牌型<\/td><td>触发和弦，提升最低牌<\/td><\/tr>\n<tr><td>残局剩少量牌<\/td><td>三种不同牌型<\/td><td>追求直接弃牌终结<\/td><\/tr>\n<tr><td>对手即将走完<\/td><td>不强求序列<\/td><td>优先正常压牌控场<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>关键风险<\/h3>\n<ul><li>对手可通过改变牌型主动打断蔡文姬想要的序列。<\/li><li>和弦结果随机，可能只小幅升点，不能按必得2计算。<\/li><li>最低牌若属于顺子、连对或三张接口，变奏可能破坏完整结构。<\/li><li>过度追求序列会牺牲正常牌权，尤其地主不能让两名农民连续推进。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>“相同牌型”是否只看牌型类别，长度或张数不同是否仍视为相同。<\/li><li>“3个不同牌型”是否要求三手两两不同。<\/li><li>不出是否会中断连续牌型统计。<\/li><li>炸弹、王炸及特殊牌型如何归类。<\/li><li>一组三手触发后从下一手重新计数，还是采用滑动窗口继续判断。<\/li><li>多张并列最低牌时由系统随机选择，还是存在固定顺序。<\/li><li>和弦的随机升点概率是否均匀，以及是否可能只提升一级。<\/li><li>最低牌为2或大小王、手中没有≤A牌时，和弦是否跳过。<\/li><li>变奏弃牌与和弦变牌结果是否全场公开。<\/li><li>手牌只剩1张或一次出完时是否仍结算技能。<\/li><\/ul>", "search": "  蔡文姬\n\n  技能\n\n 和弦｜被动｜不限次数 \n\n  场上连续打出3个相同牌型时，你点数最小的1张≤a的牌随机变大，最大变成2。\n\n 变奏｜被动｜不限次数 \n\n  场上连续打出3个不同牌型时，你弃置1张最小牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8.5/10   先手可决定牌型序列起点，但两名农民可以主动打断所需节奏  \n  农民   9.5/10   两名队友更容易协作制造三同型或三异型，稳定触发升点和减牌  \n  稳定性   8/10   技能不限次数，但触发依赖全场连续三手的牌型序列  \n  操作上限   9.5/10   可通过出牌顺序在升点与直接弃牌之间切换，团队配合上限高  \n\n 身份倾向：强农民型。  农民方有两人可以共同维护目标序列，并用队友牌型接力主动触发；地主虽有先手，但难以独自控制连续三手。\n\n 先手匹配度：较高。  地主首手能确定序列的第一个牌型，并针对手牌需求选择同型成长或异型弃牌路线，但后续两手受农民干扰。\n\n  核心机制\n\n- 两项技能都统计全场连续出现的牌型，而非只统计蔡文姬自己的出牌。\n- 连续三手牌型相同，触发和弦：从蔡文姬最低点数的≤a手牌中取1张随机升点，上限为2。\n- 连续三手牌型各不相同，触发变奏：直接弃置蔡文姬当前1张最低牌。\n- 和弦不减少牌量，主要把低牌转成控制牌或2；变奏直接减少1张，是更稳定的出完收益。\n- 两项技能均不限次数，核心玩法是持续设计全场牌型序列。\n- 同一组三手只按最终形成的序列触发对应技能，不同时触发和弦与变奏。\n\n  主流打法\n\n  地主：先手定调、优先减牌\n\n- 默认优先制造三异型触发变奏，直接弃最低牌比随机升点更稳定。\n- 手牌低张较多且缺少控制牌时，可先出常见牌型，引导农民连续跟出同型触发和弦。\n- 首手选择要兼顾后续可控性：单张、对子最容易连续，也最容易被对手故意换型打断。\n- 已经有足够2和王时，不再执着和弦，转向三异型弃牌。\n- 残局提前保留不同牌型接口，争取用序列触发额外减牌。\n\n  农民：队友接力型\n\n- 需要减牌时，两名农民主动连续打出三种不同牌型，帮助蔡文姬触发变奏。\n- 需要提升牌权时，围绕单张或对子连续接力，触发和弦把最低牌向2提升。\n- 队友可根据蔡文姬手牌数决定路线：短牌优先变奏，长牌且缺控制优先和弦。\n- 地主即将走完时，以拦截为先，不为维护序列放弃合法压制。\n- 记录最近两手牌型，第三手优先选择能完成目标技能的合法方案。\n\n  序列决策\n\n  当前需求   优先序列   目的  \n --- --- --- \n  手牌多、低散张多   三种不同牌型   触发变奏，直接减1张  \n  缺2和高控制牌   三次相同牌型   触发和弦，提升最低牌  \n  残局剩少量牌   三种不同牌型   追求直接弃牌终结  \n  对手即将走完   不强求序列   优先正常压牌控场  \n\n  关键风险\n\n- 对手可通过改变牌型主动打断蔡文姬想要的序列。\n- 和弦结果随机，可能只小幅升点，不能按必得2计算。\n- 最低牌若属于顺子、连对或三张接口，变奏可能破坏完整结构。\n- 过度追求序列会牺牲正常牌权，尤其地主不能让两名农民连续推进。\n\n  待实测\n\n- “相同牌型”是否只看牌型类别，长度或张数不同是否仍视为相同。\n- “3个不同牌型”是否要求三手两两不同。\n- 不出是否会中断连续牌型统计。\n- 炸弹、王炸及特殊牌型如何归类。\n- 一组三手触发后从下一手重新计数，还是采用滑动窗口继续判断。\n- 多张并列最低牌时由系统随机选择，还是存在固定顺序。\n- 和弦的随机升点概率是否均匀，以及是否可能只提升一级。\n- 最低牌为2或大小王、手中没有≤a牌时，和弦是否跳过。\n- 变奏弃牌与和弦变牌结果是否全场公开。\n- 手牌只剩1张或一次出完时是否仍结算技能。\n"}, {"name": "诸葛亮", "faction": "蜀", "skills": "妙算、神机", "position": "明底叫分、高牌转组与三次结构整形", "status": "主要规则已实测", "landlord": 9.5, "farmer": 8.5, "identity": "强地主型。", "firstMove": "极高", "image": "", "html": "<h3>技能<\/h3>\n<p><strong>妙算｜被动｜不限次数<\/strong><\/p>\n<blockquote>叫分时，你能提前看到底牌。（五人场不触发）<\/blockquote>\n<p><strong>神机｜主动响应｜限3次<\/strong><\/p>\n<blockquote>你无牌可压时，可以将1张≥K的手牌随机变为手牌中数量最多的牌（变出的牌≤Q），然后跳过压牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9.5/10<\/td><td>提前知道底牌后再决定叫分，且先手便于保留高牌作为后续变牌材料<\/td><\/tr>\n<tr><td>农民<\/td><td>8.5/10<\/td><td>神机可把高牌稳定转入主结构，但妙算对不叫地主的一方主要提供信息价值<\/td><\/tr>\n<tr><td>稳定性<\/td><td>9/10<\/td><td>妙算直接消除底牌盲区；神机有三次机会，但目标点数可能受随机并列影响<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>能同时优化叫分决策、炸弹成长和残局手数<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：强地主型。<\/strong> 妙算直接作用于叫分决策，地主可在已知20张牌的前提下判断炸弹、顺子和残局结构，显著降低误叫风险。<\/p>\n<p><strong>先手匹配度：极高。<\/strong> 地主既能依据明底牌决定是否叫分，又能用先手主动清理低价值结构，把K以上高牌留作神机的变牌资源。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>妙算在叫分阶段提前展示三张底牌，五人场不触发。<\/li><li>底牌内容仅诸葛亮本人可见，但其他玩家会知道诸葛亮发动妙算并查看了底牌。<\/li><li>该信息首先用于决定是否叫地主，其次用于提前规划拿底后的完整牌型。<\/li><li>神机只能在客观无牌可压时发动；只要存在任何合法压制方式就不能发动，炸弹也属于可压普通牌型的手牌。<\/li><li>玩家自行选择1张K、A、2、小王或大王作为转换材料；同点数多张牌没有花色差异。<\/li><li>目标点数只统计3至Q，并变成其中当前持有数量最多的点数。<\/li><li>若3至Q中有多个点数并列最多，则系统在并列点数间随机选择。例如多个对子并列或多个三张并列时随机补充其中一种。<\/li><li>手牌中没有任何3至Q时，神机无法发动。<\/li><li>神机发动行为公开，但最终变成的具体点数不公开。<\/li><li>神机限3次；核心价值不是单纯降点，而是把孤立高牌并入对子、三张或炸弹结构。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：明底精叫、先手整形<\/h4>\n<ul><li>叫分前把底牌并入原17张整体计算，只在底牌能明显补结构或牌权足够时抢地主。<\/li><li>拿底后先手优先处理不能成长的低张和长牌，保留1至3张孤K、A、2作为神机材料。<\/li><li>手中已有三张同点数时，尽量让其保持“数量最多”，等待神机补成炸弹。<\/li><li>没有炸弹接口时，优先把高牌转进能减少手数的三张、对子或连对节点。<\/li><li>不为强行触发神机故意放弃可压的关键牌权；牌权价值高于一次普通整形。<\/li><\/ul>\n<h4>农民：让权蓄材、定向做组<\/h4>\n<ul><li>重点保留一组数量领先的目标点数，并保留K以上孤牌作为转换材料。<\/li><li>面对无法压制的牌型时发动，兼顾自然让权和手牌压缩。<\/li><li>队友掌握牌权时不急于争夺，利用后续无牌可压窗口完成结构成长。<\/li><li>三次神机优先服务于成炸，其次是补三张和减少孤张。<\/li><li>地主进入短牌阶段后，若高牌仍承担拦截职责，不应轻易全部转掉。<\/li><\/ul>\n<h3>叫地主判断<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>明底后的结构<\/th><th>建议<\/th><\/tr><\/thead><tbody>\n<tr><td>底牌直接补炸、补三张或完成强长牌<\/td><td>高优先级叫地主<\/td><\/tr>\n<tr><td>有足够牌权，且K以上孤牌可供神机转化<\/td><td>可以主动叫地主<\/td><\/tr>\n<tr><td>底牌只增加孤张，整体仍多手且缺牌权<\/td><td>降低叫分<\/td><\/tr>\n<tr><td>高牌很少，神机缺少转换材料<\/td><td>不因武将强度硬叫<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>神机目标优先级<\/h3>\n<ol><li>补成四张或更多同点数炸弹。<\/li><li>补成三张并直接减少一手。<\/li><li>补齐连对、飞机等核心节点。<\/li><li>把孤立高牌并入对子。<\/li><li>单纯把高牌降成普通散张通常不发动。<\/li><\/ol>\n<h3>叫地主胜算分析<\/h3>\n<p>诸葛亮的叫地主价值主要看两项：手中3—Q的三张数量，以及K、A、2、大小王这些神机材料数量。三张决定神机能否一步成炸，高牌决定可用次数和后续上限。<\/p>\n<p>按标准54张牌、叫地主后共20张手牌进行纯随机组合计算：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>20张手牌结构<\/th><th>随机出现率<\/th><th>实战含义<\/th><\/tr><\/thead><tbody>\n<tr><td>至少3张神机材料<\/td><td>96.17%<\/td><td>三次技能的材料通常不缺，但不等于有三次发动窗口<\/td><\/tr>\n<tr><td>至少1组三张且至少1张材料<\/td><td>78.21%<\/td><td>理论上具备一次神机直接补炸条件<\/td><\/tr>\n<tr><td>至少1组三张且至少3张材料<\/td><td>74.66%<\/td><td>具备三次材料与首次直接成炸结构<\/td><\/tr>\n<tr><td>至少2组三张且至少3张材料<\/td><td>33.00%<\/td><td>第一炸用掉后，仍可能继续补第二组炸弹<\/td><\/tr>\n<tr><td>至少3组三张且至少3张材料<\/td><td>6.72%<\/td><td>理论上具备三次分别做炸的最高结构<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>以上是结构出现率，不是胜率。实际胜率还取决于能否三次客观无牌可压、炸弹使用顺序、其他牌型手数和对手武将。<\/p>\n<h4>叫地主分档<\/h4>\n<div class=\"table-wrap\"><table><thead><tr><th>档位<\/th><th>手牌条件<\/th><th>建议<\/th><\/tr><\/thead><tbody>\n<tr><td>S档<\/td><td>≥2组三张、≥4张高牌材料，且其余牌型整齐<\/td><td>强叫；首炸后仍有第二组神机爆发，牌权和成长兼备<\/td><\/tr>\n<tr><td>A档<\/td><td>≥1组三张、≥3张高牌材料，另有2或王等控制牌<\/td><td>优先叫；首次神机可直接成炸，高牌储备充足<\/td><\/tr>\n<tr><td>B档<\/td><td>≥1组三张、1—2张材料，或最多数量结构为对子<\/td><td>看整体手数；对子需要两次神机才能成炸，启动偏慢<\/td><\/tr>\n<tr><td>C档<\/td><td>无三张、对子少、牌型散乱，只有高牌数量多<\/td><td>不因神机硬叫；高牌虽多但缺少有效落点<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h4>三次成炸的实际顺序<\/h4>\n<ol><li>第一次神机把一组三张补成炸弹。<\/li><li>炸弹形成后，面对普通牌型时已属于“有牌可压”，不能继续发动神机。<\/li><li>要继续做第二炸，通常需先把现有炸弹打掉，再等待下一次客观无牌可压；或者面对现有炸弹也压不了的更大炸弹。<\/li><li>因此最高收益并非把同一炸弹无限加长，而是准备多组三张，按“神机成炸→炸弹夺权→再等神机”的节奏循环。<\/li><\/ol>\n<p><strong>实战结论：<\/strong> 一组三张加三张以上高牌材料，是诸葛亮最稳定的强叫地主门槛；两组三张以上进入高胜算区。只有高牌、没有三张或对子接口时，技能上限看似很高，实际启动速度不足。<\/p>\n<h3>关键风险<\/h3>\n<ul><li>神机会消耗K以上天然牌权，残局可能失去压制A、2或王的能力。<\/li><li>当前数量最多的牌若不止一种，随机结果可能偏离目标结构。<\/li><li>为等待神机长期保留过多高牌，会使前中盘手数虚高。<\/li><li>已知底牌不等于牌力必胜，仍需把20张完整结构与双农民协作压力一起评估。<\/li><\/ul>", "search": "  诸葛亮\n\n  技能\n\n 妙算｜被动｜不限次数 \n\n  叫分时，你能提前看到底牌。（五人场不触发）\n\n 神机｜主动响应｜限3次 \n\n  你无牌可压时，可以将1张≥k的手牌随机变为手牌中数量最多的牌（变出的牌≤q），然后跳过压牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9.5/10   提前知道底牌后再决定叫分，且先手便于保留高牌作为后续变牌材料  \n  农民   8.5/10   神机可把高牌稳定转入主结构，但妙算对不叫地主的一方主要提供信息价值  \n  稳定性   9/10   妙算直接消除底牌盲区；神机有三次机会，但目标点数可能受随机并列影响  \n  操作上限   9.5/10   能同时优化叫分决策、炸弹成长和残局手数  \n\n 身份倾向：强地主型。  妙算直接作用于叫分决策，地主可在已知20张牌的前提下判断炸弹、顺子和残局结构，显著降低误叫风险。\n\n 先手匹配度：极高。  地主既能依据明底牌决定是否叫分，又能用先手主动清理低价值结构，把k以上高牌留作神机的变牌资源。\n\n  核心机制\n\n- 妙算在叫分阶段提前展示三张底牌，五人场不触发。\n- 底牌内容仅诸葛亮本人可见，但其他玩家会知道诸葛亮发动妙算并查看了底牌。\n- 该信息首先用于决定是否叫地主，其次用于提前规划拿底后的完整牌型。\n- 神机只能在客观无牌可压时发动；只要存在任何合法压制方式就不能发动，炸弹也属于可压普通牌型的手牌。\n- 玩家自行选择1张k、a、2、小王或大王作为转换材料；同点数多张牌没有花色差异。\n- 目标点数只统计3至q，并变成其中当前持有数量最多的点数。\n- 若3至q中有多个点数并列最多，则系统在并列点数间随机选择。例如多个对子并列或多个三张并列时随机补充其中一种。\n- 手牌中没有任何3至q时，神机无法发动。\n- 神机发动行为公开，但最终变成的具体点数不公开。\n- 神机限3次；核心价值不是单纯降点，而是把孤立高牌并入对子、三张或炸弹结构。\n\n  主流打法\n\n  地主：明底精叫、先手整形\n\n- 叫分前把底牌并入原17张整体计算，只在底牌能明显补结构或牌权足够时抢地主。\n- 拿底后先手优先处理不能成长的低张和长牌，保留1至3张孤k、a、2作为神机材料。\n- 手中已有三张同点数时，尽量让其保持“数量最多”，等待神机补成炸弹。\n- 没有炸弹接口时，优先把高牌转进能减少手数的三张、对子或连对节点。\n- 不为强行触发神机故意放弃可压的关键牌权；牌权价值高于一次普通整形。\n\n  农民：让权蓄材、定向做组\n\n- 重点保留一组数量领先的目标点数，并保留k以上孤牌作为转换材料。\n- 面对无法压制的牌型时发动，兼顾自然让权和手牌压缩。\n- 队友掌握牌权时不急于争夺，利用后续无牌可压窗口完成结构成长。\n- 三次神机优先服务于成炸，其次是补三张和减少孤张。\n- 地主进入短牌阶段后，若高牌仍承担拦截职责，不应轻易全部转掉。\n\n  叫地主判断\n\n  明底后的结构   建议  \n --- --- \n  底牌直接补炸、补三张或完成强长牌   高优先级叫地主  \n  有足够牌权，且k以上孤牌可供神机转化   可以主动叫地主  \n  底牌只增加孤张，整体仍多手且缺牌权   降低叫分  \n  高牌很少，神机缺少转换材料   不因武将强度硬叫  \n\n  神机目标优先级\n\n1. 补成四张或更多同点数炸弹。\n2. 补成三张并直接减少一手。\n3. 补齐连对、飞机等核心节点。\n4. 把孤立高牌并入对子。\n5. 单纯把高牌降成普通散张通常不发动。\n\n  叫地主胜算分析\n\n诸葛亮的叫地主价值主要看两项：手中3—q的三张数量，以及k、a、2、大小王这些神机材料数量。三张决定神机能否一步成炸，高牌决定可用次数和后续上限。\n\n按标准54张牌、叫地主后共20张手牌进行纯随机组合计算：\n\n  20张手牌结构   随机出现率   实战含义  \n --- ---: --- \n  至少3张神机材料   96.17%   三次技能的材料通常不缺，但不等于有三次发动窗口  \n  至少1组三张且至少1张材料   78.21%   理论上具备一次神机直接补炸条件  \n  至少1组三张且至少3张材料   74.66%   具备三次材料与首次直接成炸结构  \n  至少2组三张且至少3张材料   33.00%   第一炸用掉后，仍可能继续补第二组炸弹  \n  至少3组三张且至少3张材料   6.72%   理论上具备三次分别做炸的最高结构  \n\n以上是结构出现率，不是胜率。实际胜率还取决于能否三次客观无牌可压、炸弹使用顺序、其他牌型手数和对手武将。\n\n  叫地主分档\n\n  档位   手牌条件   建议  \n --- --- --- \n  s档   ≥2组三张、≥4张高牌材料，且其余牌型整齐   强叫；首炸后仍有第二组神机爆发，牌权和成长兼备  \n  a档   ≥1组三张、≥3张高牌材料，另有2或王等控制牌   优先叫；首次神机可直接成炸，高牌储备充足  \n  b档   ≥1组三张、1—2张材料，或最多数量结构为对子   看整体手数；对子需要两次神机才能成炸，启动偏慢  \n  c档   无三张、对子少、牌型散乱，只有高牌数量多   不因神机硬叫；高牌虽多但缺少有效落点  \n\n  三次成炸的实际顺序\n\n1. 第一次神机把一组三张补成炸弹。\n2. 炸弹形成后，面对普通牌型时已属于“有牌可压”，不能继续发动神机。\n3. 要继续做第二炸，通常需先把现有炸弹打掉，再等待下一次客观无牌可压；或者面对现有炸弹也压不了的更大炸弹。\n4. 因此最高收益并非把同一炸弹无限加长，而是准备多组三张，按“神机成炸→炸弹夺权→再等神机”的节奏循环。\n\n 实战结论：  一组三张加三张以上高牌材料，是诸葛亮最稳定的强叫地主门槛；两组三张以上进入高胜算区。只有高牌、没有三张或对子接口时，技能上限看似很高，实际启动速度不足。\n\n  关键风险\n\n- 神机会消耗k以上天然牌权，残局可能失去压制a、2或王的能力。\n- 当前数量最多的牌若不止一种，随机结果可能偏离目标结构。\n- 为等待神机长期保留过多高牌，会使前中盘手数虚高。\n- 已知底牌不等于牌力必胜，仍需把20张完整结构与双农民协作压力一起评估。\n"}, {"name": "诸葛均", "faction": "蜀", "skills": "耕读", "position": "底牌复制、结构补强与废牌置换", "status": "主要规则已实测", "landlord": 9.0, "farmer": 8.5, "identity": "地主略优。", "firstMove": "极高", "image": "技能截图/诸葛均.png", "html": "<div class=\"hero-shot\"><img src=\"技能截图/诸葛均.png\" alt=\"诸葛均技能截图\" loading=\"lazy\"><\/div>\n<h3>技能<\/h3>\n<p><strong>耕读｜开局选择｜限1次<\/strong><\/p>\n<blockquote>开局时，你可以从底牌中选1张复制并获得。你打出这张复制牌后，可以选1张手牌弃置。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9/10<\/td><td>拥有先手，可立即用复制牌完成结构并触发弃牌，节奏稳定<\/td><\/tr>\n<tr><td>农民<\/td><td>8.5/10<\/td><td>能复制地主底牌中的关键点数，但需要先取得合适出牌窗口<\/td><\/tr>\n<tr><td>稳定性<\/td><td>9.5/10<\/td><td>复制目标可选、复制牌有标记、弃牌可选且任何组合都能触发<\/td><\/tr>\n<tr><td>操作上限<\/td><td>8.5/10<\/td><td>复制目标和弃牌时机决定收益<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：地主略优。<\/strong><\/p>\n<p><strong>先手匹配度：极高。<\/strong> 地主可在第一手主动打出包含复制牌的组合，并额外弃置一张废牌；同一轮完成结构输出和手牌压缩。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>开局从三张底牌中定向复制1张，原底牌不受影响。<\/li><li>复制目标与复制结果公开，所有玩家都知道复制的是哪张底牌。<\/li><li>复制范围仅限正常底牌，不存在复制万能牌的情况。<\/li><li>获得复制牌时手牌增加1张。<\/li><li>复制牌带有独立标记；无论单出，还是作为炸弹、顺子或其他组合的一部分打出，都会正确触发弃牌。<\/li><li>打出复制牌后，可以选择弃置1张手牌，也可以放弃弃牌。<\/li><li>弃牌结果公开。<\/li><li>若选择弃牌，完整结算后总牌差为0，完成一次“复制关键牌、删除废牌”的置换；若放弃弃牌，则保留净增加的1张牌。<\/li><li>若复制牌进入多张组合，该手出牌结束后仍可额外弃1张，实际推进效率高。<\/li><\/ul>\n<h3>复制优先级<\/h3>\n<ol><li>复制后直接形成或加长炸弹的点数。<\/li><li>复制后使总手数立即下降的结构牌。<\/li><li>补成三张、飞机、连对或顺子的关键张。<\/li><li>能稳定取得牌权的2、A等高牌。<\/li><li>能快速打出并触发弃牌的低成本牌。<\/li><\/ol>\n<p>选择标准不是底牌中哪张最大，而是哪张复制后能同时做到“更快打出＋弃掉最差手牌”。<\/p>\n<h3>主流打法<\/h3>\n<h4>地主：首手置换型<\/h4>\n<ul><li>优先复制能进入首攻组合的底牌。<\/li><li>第一手打出复制牌所在的顺子、连对、三带或炸弹，随后弃掉最大废张。<\/li><li>若复制可形成5张及以上同点数炸弹，通常属于高优先级路线。<\/li><li>没有立即成型机会时，可复制2或A作为回手点，等夺回牌权时完成弃牌。<\/li><\/ul>\n<p>地主最强节奏是：<\/p>\n<blockquote>复制关键张 → 首手打出完整组合 → 弃掉孤张 → 剩余结构直接压缩。<\/blockquote>\n<h4>农民：底牌针对型<\/h4>\n<ul><li>复制信息完全公开，不能依靠隐藏牌数误导地主；价值只来自结构补强和弃牌置换。<\/li><li>优先复制能形成炸弹、三张或关键拦截牌的点数。<\/li><li>地主少牌时，复制高牌的即时拦截价值高于长期结构收益。<\/li><li>复制牌迟迟无法打出时，弃牌收益被冻结，因此应避免只看强度、不看出牌窗口。<\/li><\/ul>\n<h3>弃牌优先级<\/h3>\n<ol><li>无法进入任何组合的孤张。<\/li><li>使最少手数增加的冗余牌。<\/li><li>无法形成对子、三张或带牌结构的断张。<\/li><li>已失去战术价值的低位牌。<\/li><\/ol>\n<p>如果复制牌本身已经让某个组合成型，弃牌应服务于下一个收尾组合，不能只按点数从小到大处理。<\/p>\n<h3>关键风险<\/h3>\n<ul><li>复制最强点数但无法及时打出，会暂时增加手牌负担。<\/li><li>为了触发弃牌强拆完整结构，可能抵消耕读收益。<\/li><li>弃牌时机过早，可能删掉后续连接张；过晚则失去压缩节奏。<\/li><li>农民没有先手，复制牌能否顺利进入应牌结构比地主更重要。<\/li><li>复制牌和弃牌均公开，对手可以据此推断炸弹、顺子及剩余结构。<\/li><\/ul>\n<h3>已确认的操作结论<\/h3>\n<ul><li>复制牌的独立标记解决了同点数识别问题，不需要为触发技能而单独打出。<\/li><li>主流选择是把复制牌并入价值最高的组合，在正常推进手数时顺带完成弃牌。<\/li><li>弃牌可放弃，因此复制牌出手时若剩余结构已经完整，不必强制破坏牌型。<\/li><li>信息完全公开，诸葛均没有隐藏牌优势；对手可针对复制点数和公开弃牌调整记牌。<\/li><\/ul>", "search": "  诸葛均\n\n 诸葛均技能截图 技能截图/诸葛均.png \n\n  技能\n\n 耕读｜开局选择｜限1次 \n\n  开局时，你可以从底牌中选1张复制并获得。你打出这张复制牌后，可以选1张手牌弃置。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9/10   拥有先手，可立即用复制牌完成结构并触发弃牌，节奏稳定  \n  农民   8.5/10   能复制地主底牌中的关键点数，但需要先取得合适出牌窗口  \n  稳定性   9.5/10   复制目标可选、复制牌有标记、弃牌可选且任何组合都能触发  \n  操作上限   8.5/10   复制目标和弃牌时机决定收益  \n\n 身份倾向：地主略优。 \n\n 先手匹配度：极高。  地主可在第一手主动打出包含复制牌的组合，并额外弃置一张废牌；同一轮完成结构输出和手牌压缩。\n\n  核心机制\n\n- 开局从三张底牌中定向复制1张，原底牌不受影响。\n- 复制目标与复制结果公开，所有玩家都知道复制的是哪张底牌。\n- 复制范围仅限正常底牌，不存在复制万能牌的情况。\n- 获得复制牌时手牌增加1张。\n- 复制牌带有独立标记；无论单出，还是作为炸弹、顺子或其他组合的一部分打出，都会正确触发弃牌。\n- 打出复制牌后，可以选择弃置1张手牌，也可以放弃弃牌。\n- 弃牌结果公开。\n- 若选择弃牌，完整结算后总牌差为0，完成一次“复制关键牌、删除废牌”的置换；若放弃弃牌，则保留净增加的1张牌。\n- 若复制牌进入多张组合，该手出牌结束后仍可额外弃1张，实际推进效率高。\n\n  复制优先级\n\n1. 复制后直接形成或加长炸弹的点数。\n2. 复制后使总手数立即下降的结构牌。\n3. 补成三张、飞机、连对或顺子的关键张。\n4. 能稳定取得牌权的2、a等高牌。\n5. 能快速打出并触发弃牌的低成本牌。\n\n选择标准不是底牌中哪张最大，而是哪张复制后能同时做到“更快打出＋弃掉最差手牌”。\n\n  主流打法\n\n  地主：首手置换型\n\n- 优先复制能进入首攻组合的底牌。\n- 第一手打出复制牌所在的顺子、连对、三带或炸弹，随后弃掉最大废张。\n- 若复制可形成5张及以上同点数炸弹，通常属于高优先级路线。\n- 没有立即成型机会时，可复制2或a作为回手点，等夺回牌权时完成弃牌。\n\n地主最强节奏是：\n\n  复制关键张 → 首手打出完整组合 → 弃掉孤张 → 剩余结构直接压缩。\n\n  农民：底牌针对型\n\n- 复制信息完全公开，不能依靠隐藏牌数误导地主；价值只来自结构补强和弃牌置换。\n- 优先复制能形成炸弹、三张或关键拦截牌的点数。\n- 地主少牌时，复制高牌的即时拦截价值高于长期结构收益。\n- 复制牌迟迟无法打出时，弃牌收益被冻结，因此应避免只看强度、不看出牌窗口。\n\n  弃牌优先级\n\n1. 无法进入任何组合的孤张。\n2. 使最少手数增加的冗余牌。\n3. 无法形成对子、三张或带牌结构的断张。\n4. 已失去战术价值的低位牌。\n\n如果复制牌本身已经让某个组合成型，弃牌应服务于下一个收尾组合，不能只按点数从小到大处理。\n\n  关键风险\n\n- 复制最强点数但无法及时打出，会暂时增加手牌负担。\n- 为了触发弃牌强拆完整结构，可能抵消耕读收益。\n- 弃牌时机过早，可能删掉后续连接张；过晚则失去压缩节奏。\n- 农民没有先手，复制牌能否顺利进入应牌结构比地主更重要。\n- 复制牌和弃牌均公开，对手可以据此推断炸弹、顺子及剩余结构。\n\n  已确认的操作结论\n\n- 复制牌的独立标记解决了同点数识别问题，不需要为触发技能而单独打出。\n- 主流选择是把复制牌并入价值最高的组合，在正常推进手数时顺带完成弃牌。\n- 弃牌可放弃，因此复制牌出手时若剩余结构已经完整，不必强制破坏牌型。\n- 信息完全公开，诸葛均没有隐藏牌优势；对手可针对复制点数和公开弃牌调整记牌。\n"}, {"name": "赵云", "faction": "蜀", "skills": "冲阵", "position": "单对回收、随机升点与七张额度管理", "status": "初步分析", "landlord": 8.5, "farmer": 9.0, "identity": "农民略优。", "firstMove": "中高", "image": "", "html": "<h3>技能<\/h3>\n<p><strong>冲阵｜被动｜不限次数（累计回收7张后失效）<\/strong><\/p>\n<blockquote>你打出单牌或对子被压后，收回打出的牌且点数随机变大（最大变到【2】）。累计收回7张后，“冲阵”失效。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8.5/10<\/td><td>先手可主动用中低单牌或对子试探，受压后回收升点，但失去牌权且当手没有净减牌<\/td><\/tr>\n<tr><td>农民<\/td><td>9/10<\/td><td>更容易借地主压制完成升点，队友也可配合压牌，逐步制造高对与控制牌<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8/10<\/td><td>单牌、对子触发范围宽，但升点结果随机，且累计回收7张后永久停止<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9/10<\/td><td>可通过诱压将低牌持续升级，同时决定把有限的7张额度投入单牌还是对子<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：农民略优。<\/strong> 农民更容易被地主压制，并可由队友选择合适时机协助触发；地主虽然拥有先手，但每次冲阵都意味着当手未能减少牌数且失去牌权。<\/p>\n<p><strong>先手匹配度：中高。<\/strong> 地主可首手用单牌或对子主动测试对手；若被压则立即回收升点，若无人压制则保留牌权继续推进。不过技能本质仍是受压收益，并非纯先手爆发。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>只有赵云打出的单牌或对子能够触发冲阵，其他牌型被压不回收。<\/li><li>新版技能不再限制原牌必须≤A；只要打出的是单牌或对子并被压制，就进入冲阵判断。<\/li><li>单牌被压后回收1张，对子被压后回收2张；回收牌的点数随机提高，但最高只能变为2，不会变成大小王。<\/li><li>回收的是赵云刚打出的原牌，因此该次出牌在数量上被抵消，但牌面质量得到提升。<\/li><li>累计按实际收回张数计数：单牌消耗1张额度，对子消耗2张额度。<\/li><li>累计收回达到7张后，冲阵永久失效；在此之前界面虽写“不限次数”，实际总回收量有7张上限。<\/li><li>对子回收效率高，一次可同时升级2张同点数牌，但会更快消耗回收额度。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>农民：低牌诱压，高牌拦截<\/h4>\n<ul><li>优先用中低单牌或对子诱导地主压制，把难处理的低牌升级为控制牌。<\/li><li>队友有富余牌权时，可以压制赵云的低牌，帮助其完成可控升点。<\/li><li>回收后的对子若仍保持同点数，优先发展为高对、三张或炸弹；是否保持一致需实测。<\/li><li>地主即将走完时，不能只为升级而让出必要牌权，当前封锁优先于长期收益。<\/li><li>接近7张上限时，把最后额度留给最差的低牌或最有希望形成结构的对子。<\/li><\/ul>\n<h4>地主：试探诱压，控制回收节奏<\/h4>\n<ul><li>首手可选择对手有能力但未必愿意压制的中等单牌或对子，建立两难局面。<\/li><li>低牌回收升点后应及时并入高位结构，避免反复回收却始终不减手。<\/li><li>不要连续裸出所有对子消耗额度；现成顺子、连对、三张等结构仍应按正常路线批量打出。<\/li><li>若对手选择不压，赵云保留牌权，应直接利用节奏继续减少手数，而非执着触发技能。<\/li><\/ul>\n<h3>七张额度分配<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>使用方式<\/th><th>特点<\/th><\/tr><\/thead><tbody>\n<tr><td>7次单牌<\/td><td>升级覆盖面最大，适合清理多个低位孤张<\/td><\/tr>\n<tr><td>3次对子＋1次单牌<\/td><td>触发次数少，但一次升级两张，适合发展高对和重复点数结构<\/td><\/tr>\n<tr><td>单牌与对子混用<\/td><td>根据实际牌型灵活分配，通常最稳妥<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>关键风险<\/h3>\n<ul><li>被压后牌会回到手中，赵云没有完成净减牌，且通常已经失去牌权。<\/li><li>随机升点未必能融入现有结构，可能把可用低牌变成新的高位孤张。<\/li><li>对手可以选择不压低威胁牌，让赵云无法升级，只能按普通出牌推进。<\/li><li>对子一次消耗2张回收额度，若收益一般会快速耗尽技能。<\/li><li>为触发冲阵而拆掉顺子、连对、三张或炸弹，可能让总手数增加。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>点数“随机变大”的具体概率，是在原点数至2之间随机，还是必定至少提高一级。<\/li><li>原牌已经是2且被压制时，因不存在更大且不超过2的点数，冲阵会如何处理。<\/li><li>回收对子时两张牌是否同步变成同一新点数，还是分别随机升点。<\/li><li>回收及变点结果是否全场公开。<\/li><li>被队友压制是否正常触发冲阵。<\/li><li>被炸弹压制的单牌或对子是否仍能正常回收。<\/li><li>万能牌作为单牌或对子的一部分时是否可以回收，回收后如何变点。<\/li><li>被其他技能改变过点数的牌被回收时，升点按当前点数还是原始点数计算。<\/li><li>当前累计6张时对子被压，会回收2张达到8张，还是只能回收其中1张至7张。<\/li><li>达到7张上限的那次回收是否完整结算升点后再令技能失效。<\/li><li>收回的牌是从桌面实体取回，是否会影响其他依赖“已出牌”的武将技能。<\/li><\/ul>", "search": "  赵云\n\n  技能\n\n 冲阵｜被动｜不限次数（累计回收7张后失效） \n\n  你打出单牌或对子被压后，收回打出的牌且点数随机变大（最大变到【2】）。累计收回7张后，“冲阵”失效。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8.5/10   先手可主动用中低单牌或对子试探，受压后回收升点，但失去牌权且当手没有净减牌  \n  农民   9/10   更容易借地主压制完成升点，队友也可配合压牌，逐步制造高对与控制牌  \n  稳定性   8/10   单牌、对子触发范围宽，但升点结果随机，且累计回收7张后永久停止  \n  操作上限   9/10   可通过诱压将低牌持续升级，同时决定把有限的7张额度投入单牌还是对子  \n\n 身份倾向：农民略优。  农民更容易被地主压制，并可由队友选择合适时机协助触发；地主虽然拥有先手，但每次冲阵都意味着当手未能减少牌数且失去牌权。\n\n 先手匹配度：中高。  地主可首手用单牌或对子主动测试对手；若被压则立即回收升点，若无人压制则保留牌权继续推进。不过技能本质仍是受压收益，并非纯先手爆发。\n\n  核心机制\n\n- 只有赵云打出的单牌或对子能够触发冲阵，其他牌型被压不回收。\n- 新版技能不再限制原牌必须≤a；只要打出的是单牌或对子并被压制，就进入冲阵判断。\n- 单牌被压后回收1张，对子被压后回收2张；回收牌的点数随机提高，但最高只能变为2，不会变成大小王。\n- 回收的是赵云刚打出的原牌，因此该次出牌在数量上被抵消，但牌面质量得到提升。\n- 累计按实际收回张数计数：单牌消耗1张额度，对子消耗2张额度。\n- 累计收回达到7张后，冲阵永久失效；在此之前界面虽写“不限次数”，实际总回收量有7张上限。\n- 对子回收效率高，一次可同时升级2张同点数牌，但会更快消耗回收额度。\n\n  主流打法\n\n  农民：低牌诱压，高牌拦截\n\n- 优先用中低单牌或对子诱导地主压制，把难处理的低牌升级为控制牌。\n- 队友有富余牌权时，可以压制赵云的低牌，帮助其完成可控升点。\n- 回收后的对子若仍保持同点数，优先发展为高对、三张或炸弹；是否保持一致需实测。\n- 地主即将走完时，不能只为升级而让出必要牌权，当前封锁优先于长期收益。\n- 接近7张上限时，把最后额度留给最差的低牌或最有希望形成结构的对子。\n\n  地主：试探诱压，控制回收节奏\n\n- 首手可选择对手有能力但未必愿意压制的中等单牌或对子，建立两难局面。\n- 低牌回收升点后应及时并入高位结构，避免反复回收却始终不减手。\n- 不要连续裸出所有对子消耗额度；现成顺子、连对、三张等结构仍应按正常路线批量打出。\n- 若对手选择不压，赵云保留牌权，应直接利用节奏继续减少手数，而非执着触发技能。\n\n  七张额度分配\n\n  使用方式   特点  \n --- --- \n  7次单牌   升级覆盖面最大，适合清理多个低位孤张  \n  3次对子＋1次单牌   触发次数少，但一次升级两张，适合发展高对和重复点数结构  \n  单牌与对子混用   根据实际牌型灵活分配，通常最稳妥  \n\n  关键风险\n\n- 被压后牌会回到手中，赵云没有完成净减牌，且通常已经失去牌权。\n- 随机升点未必能融入现有结构，可能把可用低牌变成新的高位孤张。\n- 对手可以选择不压低威胁牌，让赵云无法升级，只能按普通出牌推进。\n- 对子一次消耗2张回收额度，若收益一般会快速耗尽技能。\n- 为触发冲阵而拆掉顺子、连对、三张或炸弹，可能让总手数增加。\n\n  待实测\n\n- 点数“随机变大”的具体概率，是在原点数至2之间随机，还是必定至少提高一级。\n- 原牌已经是2且被压制时，因不存在更大且不超过2的点数，冲阵会如何处理。\n- 回收对子时两张牌是否同步变成同一新点数，还是分别随机升点。\n- 回收及变点结果是否全场公开。\n- 被队友压制是否正常触发冲阵。\n- 被炸弹压制的单牌或对子是否仍能正常回收。\n- 万能牌作为单牌或对子的一部分时是否可以回收，回收后如何变点。\n- 被其他技能改变过点数的牌被回收时，升点按当前点数还是原始点数计算。\n- 当前累计6张时对子被压，会回收2张达到8张，还是只能回收其中1张至7张。\n- 达到7张上限的那次回收是否完整结算升点后再令技能失效。\n- 收回的牌是从桌面实体取回，是否会影响其他依赖“已出牌”的武将技能。\n"}, {"name": "邓艾", "faction": "魏", "skills": "屯田、兵粮", "position": "主动让权、粮食积累与王炸兑换", "status": "主要规则已实测", "landlord": 8.0, "farmer": 9.5, "identity": "强农民型。", "firstMove": "偏低", "image": "技能截图/邓艾-1.png", "html": "<div class=\"hero-shot\"><img src=\"技能截图/邓艾-1.png\" alt=\"邓艾技能截图一\" loading=\"lazy\"><\/div>\n<div class=\"hero-shot\"><img src=\"技能截图/邓艾-2.png\" alt=\"邓艾技能截图二\" loading=\"lazy\"><\/div>\n<h3>技能<\/h3>\n<p><strong>屯田｜被动｜限5次<\/strong><\/p>\n<blockquote>轮到你压牌时，如果需要压的牌不超过4张且你选择不压，获得1点“粮食”。<\/blockquote>\n<p><strong>兵粮｜主动｜不限次数<\/strong><\/p>\n<blockquote>可以消耗“粮食”点数获得手牌：<br>- 2点：获得1张小王；<br>- 3点：获得1张大王；<br>- 4点：获得1张万能牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8/10<\/td><td>能用5粮换出王炸，但需要多次主动放弃压牌权，与地主连续进攻目标冲突<\/td><\/tr>\n<tr><td>农民<\/td><td>9.5/10<\/td><td>可借队友回合安全屯粮，5粮稳定转化为大小王，残局封锁能力极强<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8.5/10<\/td><td>兑换结果固定；主要不确定性在于能否获得足够安全的屯田窗口<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>每次不压的机会成本和2/3/4点兑换分支决定上限<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：强农民型。<\/strong><\/p>\n<p><strong>先手匹配度：偏低。<\/strong> 地主首手不能获得粮食，必须等其他玩家出牌并主动选择不压；先手虽能布置节奏，但与屯田的被动让权机制并不匹配。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>屯田只在轮到邓艾压牌时检查。<\/li><li>当前需要压制的牌型总张数不超过4张，且邓艾选择不压，即可获得1粮。<\/li><li>是否实际存在合法压牌不影响屯田：有牌可压而主动不出、完全无牌可压后选择不出，均正常获得粮食。<\/li><li>恰好4张的任何合法牌型也正常触发，包括四张炸弹、三带一等；5张及以上不触发。<\/li><li>一次回合最多获得1粮，与需要压的具体牌型无关。<\/li><li>屯田整局最多触发5次，因此全局最多生产5点粮食；消费粮食不会恢复屯田次数，也不会提高产粮上限。<\/li><li>兵粮在轮到邓艾主动出牌时和轮到邓艾压牌时都可以使用。<\/li><li>兵粮不限次数，同一种兑换可以重复选择，只受当前粮食余额和整局5点总产量限制。<\/li><li>兵粮生成的牌会加入手牌，因此兑换控制力的同时也增加牌量。<\/li><li>2粮和3粮可以分别换取小王、大王；完整5粮理论上可直接凑成王炸。<\/li><li>4粮换万能牌只增加1张，结构适配性最高，但会放弃5粮王炸路线。<\/li><\/ul>\n<h3>粮食兑换优先级<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>粮食<\/th><th>兑换路线<\/th><th>评价<\/th><\/tr><\/thead><tbody>\n<tr><td>2<\/td><td>小王<\/td><td>紧急拦截或提前建立王炸的一半；单独控制力有限<\/td><\/tr>\n<tr><td>3<\/td><td>大王<\/td><td>单卡控制力最高，适合无法继续安全屯粮的局面<\/td><\/tr>\n<tr><td>4<\/td><td>万能牌<\/td><td>最灵活，可补炸弹、顺子、飞机及残局结构<\/td><\/tr>\n<tr><td>5<\/td><td>小王＋大王<\/td><td>标准最强路线，增加2张但直接形成王炸<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>默认终点是5粮王炸。<\/strong> 这是最高确定性控制收益；但若地主已经进入少牌、邓艾无法再安全让权，则应在3粮直接换大王，或在4粮换万能牌解决当下结构，不能机械等第5粮。<\/p>\n<h3>主流打法<\/h3>\n<h4>地主：有限屯粮，不为王炸丢节奏<\/h4>\n<ul><li>首攻正常减手，不为技能刻意选择容易被压的牌型。<\/li><li>农民打出不超过4张的牌型时，只在其无法连续走牌、且地主仍有可靠回手时选择屯田。<\/li><li>达到3粮后已有大王保底路线；若继续让权风险过高，直接兑换并恢复进攻。<\/li><li>4粮时根据手牌决定万能牌还是继续等王炸：已有炸弹、顺子缺口或残局接口时，万能牌可能比双王更快结束牌局。<\/li><li>地主不能为了凑5粮连续放过两名农民的关键减手机会。<\/li><\/ul>\n<h4>农民：队友配合攒5粮<\/h4>\n<ul><li>队友打出单张、对子、三张或四张牌型时，邓艾可主动不压并稳定获得粮食。<\/li><li>队友掌握牌权且地主暂时无法连续冲牌，是最安全的屯田窗口。<\/li><li>前两三次屯田以积累为主，不急于兑换小王；5粮王炸是最强团队终点。<\/li><li>地主少牌时，优先按3粮大王或4粮万能牌提前兑现，控制当下高于资源效率。<\/li><li>生成王炸后应作为最后控制闸门，帮助队友先走；不能仅为倍率在无必要时提前炸出。<\/li><\/ul>\n<h3>是否应该选择不压<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>局面<\/th><th>决策<\/th><\/tr><\/thead><tbody>\n<tr><td>队友牌权稳定，地主手数较多<\/td><td>适合屯田，机会成本最低<\/td><\/tr>\n<tr><td>地主刚出普通单张或对子，后续威胁低<\/td><td>可用一次让权换粮<\/td><\/tr>\n<tr><td>地主只剩1至2手<\/td><td>禁止贪粮，应直接压制<\/td><\/tr>\n<tr><td>当前牌型超过4张<\/td><td>无法获得粮食，按正常控场处理<\/td><\/tr>\n<tr><td>已有4粮且万能牌能直接减少一手<\/td><td>优先兑换万能牌，不必机械追王炸<\/td><\/tr>\n<tr><td>已有5粮<\/td><td>根据残局立即兑换王炸，停止继续让权<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>关键风险<\/h3>\n<ul><li>每一点粮食都以一次不压为代价，资源并非免费获得。<\/li><li>地主身份连续让权，可能在完成兑换前就被农民走完。<\/li><li>王炸路线增加2张手牌；如果无法取得合适出手机会，也会延缓收尾。<\/li><li>4粮万能牌和5粮王炸互斥，错误兑换会永久关闭另一条路线。<\/li><li>对手可改打5张以上的顺子、连对或飞机，阻止邓艾屯田。<\/li><li>为屯粮放过必须拦截的牌，是该武将最严重的操作错误。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>兑换生成的大小王、万能牌及具体结果是否向其他玩家公开。<\/li><\/ul>\n<h3>已确认的操作结论<\/h3>\n<ul><li>“选择不出”是唯一行为条件，不检查邓艾是否具备合法压牌。<\/li><li>触发边界包含4张；任何合法的1至4张牌型都能提供粮食。<\/li><li>兵粮横跨主动出牌和压牌两个操作阶段，可根据当轮需求即时兑换。<\/li><li>重复兑换合法，例如累计4粮可以连续两次兑换小王。<\/li><li>五次屯田是整局硬上限，先消费再屯田也不能突破总计5点粮食。<\/li><\/ul>", "search": "  邓艾\n\n 邓艾技能截图一 技能截图/邓艾-1.png \n\n 邓艾技能截图二 技能截图/邓艾-2.png \n\n  技能\n\n 屯田｜被动｜限5次 \n\n  轮到你压牌时，如果需要压的牌不超过4张且你选择不压，获得1点“粮食”。\n\n 兵粮｜主动｜不限次数 \n\n  可以消耗“粮食”点数获得手牌：\n \n  - 2点：获得1张小王；\n  - 3点：获得1张大王；\n  - 4点：获得1张万能牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8/10   能用5粮换出王炸，但需要多次主动放弃压牌权，与地主连续进攻目标冲突  \n  农民   9.5/10   可借队友回合安全屯粮，5粮稳定转化为大小王，残局封锁能力极强  \n  稳定性   8.5/10   兑换结果固定；主要不确定性在于能否获得足够安全的屯田窗口  \n  操作上限   9.5/10   每次不压的机会成本和2/3/4点兑换分支决定上限  \n\n 身份倾向：强农民型。 \n\n 先手匹配度：偏低。  地主首手不能获得粮食，必须等其他玩家出牌并主动选择不压；先手虽能布置节奏，但与屯田的被动让权机制并不匹配。\n\n  核心机制\n\n- 屯田只在轮到邓艾压牌时检查。\n- 当前需要压制的牌型总张数不超过4张，且邓艾选择不压，即可获得1粮。\n- 是否实际存在合法压牌不影响屯田：有牌可压而主动不出、完全无牌可压后选择不出，均正常获得粮食。\n- 恰好4张的任何合法牌型也正常触发，包括四张炸弹、三带一等；5张及以上不触发。\n- 一次回合最多获得1粮，与需要压的具体牌型无关。\n- 屯田整局最多触发5次，因此全局最多生产5点粮食；消费粮食不会恢复屯田次数，也不会提高产粮上限。\n- 兵粮在轮到邓艾主动出牌时和轮到邓艾压牌时都可以使用。\n- 兵粮不限次数，同一种兑换可以重复选择，只受当前粮食余额和整局5点总产量限制。\n- 兵粮生成的牌会加入手牌，因此兑换控制力的同时也增加牌量。\n- 2粮和3粮可以分别换取小王、大王；完整5粮理论上可直接凑成王炸。\n- 4粮换万能牌只增加1张，结构适配性最高，但会放弃5粮王炸路线。\n\n  粮食兑换优先级\n\n  粮食   兑换路线   评价  \n ---: --- --- \n  2   小王   紧急拦截或提前建立王炸的一半；单独控制力有限  \n  3   大王   单卡控制力最高，适合无法继续安全屯粮的局面  \n  4   万能牌   最灵活，可补炸弹、顺子、飞机及残局结构  \n  5   小王＋大王   标准最强路线，增加2张但直接形成王炸  \n\n 默认终点是5粮王炸。  这是最高确定性控制收益；但若地主已经进入少牌、邓艾无法再安全让权，则应在3粮直接换大王，或在4粮换万能牌解决当下结构，不能机械等第5粮。\n\n  主流打法\n\n  地主：有限屯粮，不为王炸丢节奏\n\n- 首攻正常减手，不为技能刻意选择容易被压的牌型。\n- 农民打出不超过4张的牌型时，只在其无法连续走牌、且地主仍有可靠回手时选择屯田。\n- 达到3粮后已有大王保底路线；若继续让权风险过高，直接兑换并恢复进攻。\n- 4粮时根据手牌决定万能牌还是继续等王炸：已有炸弹、顺子缺口或残局接口时，万能牌可能比双王更快结束牌局。\n- 地主不能为了凑5粮连续放过两名农民的关键减手机会。\n\n  农民：队友配合攒5粮\n\n- 队友打出单张、对子、三张或四张牌型时，邓艾可主动不压并稳定获得粮食。\n- 队友掌握牌权且地主暂时无法连续冲牌，是最安全的屯田窗口。\n- 前两三次屯田以积累为主，不急于兑换小王；5粮王炸是最强团队终点。\n- 地主少牌时，优先按3粮大王或4粮万能牌提前兑现，控制当下高于资源效率。\n- 生成王炸后应作为最后控制闸门，帮助队友先走；不能仅为倍率在无必要时提前炸出。\n\n  是否应该选择不压\n\n  局面   决策  \n --- --- \n  队友牌权稳定，地主手数较多   适合屯田，机会成本最低  \n  地主刚出普通单张或对子，后续威胁低   可用一次让权换粮  \n  地主只剩1至2手   禁止贪粮，应直接压制  \n  当前牌型超过4张   无法获得粮食，按正常控场处理  \n  已有4粮且万能牌能直接减少一手   优先兑换万能牌，不必机械追王炸  \n  已有5粮   根据残局立即兑换王炸，停止继续让权  \n\n  关键风险\n\n- 每一点粮食都以一次不压为代价，资源并非免费获得。\n- 地主身份连续让权，可能在完成兑换前就被农民走完。\n- 王炸路线增加2张手牌；如果无法取得合适出手机会，也会延缓收尾。\n- 4粮万能牌和5粮王炸互斥，错误兑换会永久关闭另一条路线。\n- 对手可改打5张以上的顺子、连对或飞机，阻止邓艾屯田。\n- 为屯粮放过必须拦截的牌，是该武将最严重的操作错误。\n\n  待实测\n\n- 兑换生成的大小王、万能牌及具体结果是否向其他玩家公开。\n\n  已确认的操作结论\n\n- “选择不出”是唯一行为条件，不检查邓艾是否具备合法压牌。\n- 触发边界包含4张；任何合法的1至4张牌型都能提供粮食。\n- 兵粮横跨主动出牌和压牌两个操作阶段，可根据当轮需求即时兑换。\n- 重复兑换合法，例如累计4粮可以连续两次兑换小王。\n- 五次屯田是整局硬上限，先消费再屯田也不能突破总计5点粮食。\n"}, {"name": "邹氏", "faction": "群", "skills": "遗霜", "position": "受压弃牌、最高牌降点与残局反击", "status": "初步分析", "landlord": 9.0, "farmer": 9.5, "identity": "农民略优。", "firstMove": "较高", "image": "", "html": "<h3>技能<\/h3>\n<p><strong>遗霜｜主动响应｜限2次<\/strong><\/p>\n<blockquote>你出牌被压后，可以弃置1个单牌、对子或三张，然后令压你的玩家最大1张牌点数分别降低1、2或3。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9/10<\/td><td>先手可主动出中等牌诱压，再弃掉最多三张并削弱一名农民的最高控制牌<\/td><\/tr>\n<tr><td>农民<\/td><td>9.5/10<\/td><td>被地主压制的机会稳定，可快速减牌并连续削弱地主手中的王、2、A等核心牌<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8.5/10<\/td><td>触发条件常见且弃牌由自己选择，但需要手中存在完整单牌、对子或三张结构<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>两次最多额外弃6张，还能定向压低对方最大牌，具备显著残局斩杀能力<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：农民略优。<\/strong> 地主通常是主要压制者，邹氏作为农民更容易把两次遗霜都作用于地主；地主使用时则可能分别削弱不同农民，收益较分散。<\/p>\n<p><strong>先手匹配度：较高。<\/strong> 地主可以主动打出对手愿意压制的中等牌型，随后用遗霜弃掉自身结构并削弱压制者，但技能仍需对手实际压牌才能启动。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>遗霜只在邹氏打出的牌被其他玩家压制后出现发动窗口，每局最多2次。<\/li><li>邹氏可以选择弃置1张单牌、1个对子或1组三张，即分别弃1、2或3张牌。<\/li><li>弃单牌时，压制者手中最大1张牌降低1点；弃对子时降低2点；弃三张时降低3点。<\/li><li>技能只改变压制者手中“最大1张牌”，不是把全部最大点数牌一起降低。<\/li><li>弃置的牌由邹氏从自己的手牌中选择，用于快速清除废牌或完成残局减牌。<\/li><li>降点会破坏对方最高控制牌的原始牌权，也可能拆散对子、三张、炸弹或连续结构。<\/li><li>两次技能若都弃三张，邹氏最多可以额外弃掉6张手牌，是非常强的受压减牌能力。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>农民：诱导地主压制，集中削高<\/h4>\n<ul><li>优先打出地主大概率会压制的中等牌型，主动创造遗霜窗口。<\/li><li>能安全弃三张时通常收益最高：一次减少3张，并让地主最大牌降低3点。<\/li><li>地主的王、2或A可能承担关键回手，应把遗霜尽量留给这些高牌仍在其手中的阶段。<\/li><li>队友即将走完时，以团队牌权为先，不要为了触发遗霜破坏必要拦截。<\/li><li>手牌剩余3张以内且能按单牌、对子或三张弃置时，遗霜可能直接完成走牌。<\/li><\/ul>\n<h4>地主：分阶段诱压，定点破坏农民<\/h4>\n<ul><li>观察哪名农民掌握主要高牌或更接近走完，优先诱导该玩家压制并承受降点。<\/li><li>第一轮遗霜可以清理低位三张或对子，第二轮保留给残局直接弃完。<\/li><li>若三张本身能通过三带结构高效打出，不应仅为多降1点而机械弃置；比较整体手数后决定。<\/li><li>对手不压时继续保持牌权，不能为强行发动技能主动送出更大的战略损失。<\/li><\/ul>\n<h3>弃牌选择<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>弃牌类型<\/th><th>自身减牌<\/th><th>对方最大牌降点<\/th><th>适用场景<\/th><\/tr><\/thead><tbody>\n<tr><td>单牌<\/td><td>1张<\/td><td>1点<\/td><td>清孤张、轻度削弱或最后1张收尾<\/td><\/tr>\n<tr><td>对子<\/td><td>2张<\/td><td>2点<\/td><td>清理低对、破坏对方高牌权<\/td><\/tr>\n<tr><td>三张<\/td><td>3张<\/td><td>3点<\/td><td>最大减牌与最大削弱，残局价值最高<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>关键风险<\/h3>\n<ul><li>遗霜必须先让邹氏的牌被压，通常意味着失去牌权；额外弃牌不能自动夺回出牌权。<\/li><li>为弃三张而拆掉本可高效打出的飞机、三带或炸弹，整体收益可能下降。<\/li><li>降低的是对方最大1张牌，随机或选择方式未确认，未必能精准拆掉最重要的组合。<\/li><li>对手知道邹氏仍有遗霜时，可以选择不压非关键牌，降低触发机会。<\/li><li>若降点后的牌反而补齐对方顺子、对子或三张，也可能意外帮助其重组。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>弃置单牌、对子或三张是否完全由邹氏选择具体牌。<\/li><li>“三张”是否仅指三张同点数裸三张，能否从三带一、三带二或飞机结构中选择三张弃置。<\/li><li>被队友压制是否正常触发遗霜，并降低队友的最大牌。<\/li><li>炸弹压制邹氏普通牌型、或更大炸弹压制邹氏炸弹时，是否均能触发。<\/li><li>压制者有多张并列最大牌时，降低哪一张；是否由邹氏选择。<\/li><li>对方最大牌为大王、小王或2时，具体降点映射是什么。<\/li><li>降点后的牌面及遗霜弃牌结果是否全场公开。<\/li><li>降点能否把一张牌降到3以下，最低点数边界是什么。<\/li><li>被降低的牌若带有万能牌或其他特殊标记，标记是否保留。<\/li><li>邹氏通过遗霜弃完全部剩余手牌时，是否立即按走完结算胜利。<\/li><li>邹氏上一手已经出完牌时游戏直接结束，不再产生遗霜窗口。<\/li><\/ul>", "search": "  邹氏\n\n  技能\n\n 遗霜｜主动响应｜限2次 \n\n  你出牌被压后，可以弃置1个单牌、对子或三张，然后令压你的玩家最大1张牌点数分别降低1、2或3。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9/10   先手可主动出中等牌诱压，再弃掉最多三张并削弱一名农民的最高控制牌  \n  农民   9.5/10   被地主压制的机会稳定，可快速减牌并连续削弱地主手中的王、2、a等核心牌  \n  稳定性   8.5/10   触发条件常见且弃牌由自己选择，但需要手中存在完整单牌、对子或三张结构  \n  操作上限   9.5/10   两次最多额外弃6张，还能定向压低对方最大牌，具备显著残局斩杀能力  \n\n 身份倾向：农民略优。  地主通常是主要压制者，邹氏作为农民更容易把两次遗霜都作用于地主；地主使用时则可能分别削弱不同农民，收益较分散。\n\n 先手匹配度：较高。  地主可以主动打出对手愿意压制的中等牌型，随后用遗霜弃掉自身结构并削弱压制者，但技能仍需对手实际压牌才能启动。\n\n  核心机制\n\n- 遗霜只在邹氏打出的牌被其他玩家压制后出现发动窗口，每局最多2次。\n- 邹氏可以选择弃置1张单牌、1个对子或1组三张，即分别弃1、2或3张牌。\n- 弃单牌时，压制者手中最大1张牌降低1点；弃对子时降低2点；弃三张时降低3点。\n- 技能只改变压制者手中“最大1张牌”，不是把全部最大点数牌一起降低。\n- 弃置的牌由邹氏从自己的手牌中选择，用于快速清除废牌或完成残局减牌。\n- 降点会破坏对方最高控制牌的原始牌权，也可能拆散对子、三张、炸弹或连续结构。\n- 两次技能若都弃三张，邹氏最多可以额外弃掉6张手牌，是非常强的受压减牌能力。\n\n  主流打法\n\n  农民：诱导地主压制，集中削高\n\n- 优先打出地主大概率会压制的中等牌型，主动创造遗霜窗口。\n- 能安全弃三张时通常收益最高：一次减少3张，并让地主最大牌降低3点。\n- 地主的王、2或a可能承担关键回手，应把遗霜尽量留给这些高牌仍在其手中的阶段。\n- 队友即将走完时，以团队牌权为先，不要为了触发遗霜破坏必要拦截。\n- 手牌剩余3张以内且能按单牌、对子或三张弃置时，遗霜可能直接完成走牌。\n\n  地主：分阶段诱压，定点破坏农民\n\n- 观察哪名农民掌握主要高牌或更接近走完，优先诱导该玩家压制并承受降点。\n- 第一轮遗霜可以清理低位三张或对子，第二轮保留给残局直接弃完。\n- 若三张本身能通过三带结构高效打出，不应仅为多降1点而机械弃置；比较整体手数后决定。\n- 对手不压时继续保持牌权，不能为强行发动技能主动送出更大的战略损失。\n\n  弃牌选择\n\n  弃牌类型   自身减牌   对方最大牌降点   适用场景  \n --- ---: ---: --- \n  单牌   1张   1点   清孤张、轻度削弱或最后1张收尾  \n  对子   2张   2点   清理低对、破坏对方高牌权  \n  三张   3张   3点   最大减牌与最大削弱，残局价值最高  \n\n  关键风险\n\n- 遗霜必须先让邹氏的牌被压，通常意味着失去牌权；额外弃牌不能自动夺回出牌权。\n- 为弃三张而拆掉本可高效打出的飞机、三带或炸弹，整体收益可能下降。\n- 降低的是对方最大1张牌，随机或选择方式未确认，未必能精准拆掉最重要的组合。\n- 对手知道邹氏仍有遗霜时，可以选择不压非关键牌，降低触发机会。\n- 若降点后的牌反而补齐对方顺子、对子或三张，也可能意外帮助其重组。\n\n  待实测\n\n- 弃置单牌、对子或三张是否完全由邹氏选择具体牌。\n- “三张”是否仅指三张同点数裸三张，能否从三带一、三带二或飞机结构中选择三张弃置。\n- 被队友压制是否正常触发遗霜，并降低队友的最大牌。\n- 炸弹压制邹氏普通牌型、或更大炸弹压制邹氏炸弹时，是否均能触发。\n- 压制者有多张并列最大牌时，降低哪一张；是否由邹氏选择。\n- 对方最大牌为大王、小王或2时，具体降点映射是什么。\n- 降点后的牌面及遗霜弃牌结果是否全场公开。\n- 降点能否把一张牌降到3以下，最低点数边界是什么。\n- 被降低的牌若带有万能牌或其他特殊标记，标记是否保留。\n- 邹氏通过遗霜弃完全部剩余手牌时，是否立即按走完结算胜利。\n- 邹氏上一手已经出完牌时游戏直接结束，不再产生遗霜窗口。\n"}, {"name": "郭嘉", "faction": "魏", "skills": "遗计、胜论", "position": "新牌型补牌、偶数窗口与镜像终结", "status": "初步分析", "landlord": 9.5, "farmer": 9.0, "identity": "地主略优。", "firstMove": "极高", "image": "技能截图/郭嘉-1.png", "html": "<div class=\"hero-shot\"><img src=\"技能截图/郭嘉-1.png\" alt=\"郭嘉技能截图一\" loading=\"lazy\"><\/div>\n<div class=\"hero-shot\"><img src=\"技能截图/郭嘉-2.png\" alt=\"郭嘉技能截图二\" loading=\"lazy\"><\/div>\n<h3>技能<\/h3>\n<p><strong>遗计｜限1次<\/strong><\/p>\n<blockquote>出牌后，若这手打出不超过9张牌，且剩余手牌张数与这手牌一样多，可以把剩余手牌变成刚打出的这手牌，然后“胜论”失效。<\/blockquote>\n<p><strong>胜论｜限10次<\/strong><\/p>\n<blockquote>每打出一种自己此前没有出过的牌型，可以随机获得1张牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9.5/10<\/td><td>先手可主动调整至偶数牌量并设计镜像终结，遗计与连续领出高度匹配<\/td><\/tr>\n<tr><td>农民<\/td><td>9/10<\/td><td>胜论补牌和遗计复制上限很高，但镜像牌型能否取得第二次出手机会更依赖队友<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8/10<\/td><td>遗计结果确定，但要求牌数精确相等；胜论随机补牌会持续改变窗口<\/td><\/tr>\n<tr><td>操作上限<\/td><td>10/10<\/td><td>牌数、牌型、牌权和两项技能结算顺序共同决定终局<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：地主略优。<\/strong><\/p>\n<p><strong>先手匹配度：极高。<\/strong> 地主可先处理2张或其他小结构，把20张手牌压到18张以内的偶数窗口，再主动打出半数牌并启动遗计；若保住牌权，可直接重复镜像牌型收尾。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>遗计发动前的手牌总数必须为偶数：若本手打出N张，出牌后必须恰好剩余N张。<\/li><li>N最大为9，因此发动前总手牌最多18张。<\/li><li>发动后，剩余N张牌整体变成刚打出的N张牌，形成一套完全同构的第二手。<\/li><li>遗计是可选效果；不满足牌权或收尾条件时可以暂缓发动。<\/li><li>一旦实际使用遗计，胜论立即失效，后续不再通过新牌型补牌。<\/li><li>胜论只统计郭嘉自己此前未打出过的牌型，每个新类型可随机获得1张牌，最多10次。<\/li><li>胜论补牌会使手牌增加1张，既能改善结构、调整奇偶，也可能打乱已经计算好的遗计等分窗口。<\/li><\/ul>\n<h3>遗计发动窗口<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>发动前手牌<\/th><th>本手打出<\/th><th>剩余并复制<\/th><th>优先复制结构<\/th><\/tr><\/thead><tbody>\n<tr><td>18<\/td><td>9张<\/td><td>9张<\/td><td>九张组合、长结构或特殊牌型<\/td><\/tr>\n<tr><td>16<\/td><td>8张<\/td><td>8张<\/td><td>八张顺子、四连对等<\/td><\/tr>\n<tr><td>14<\/td><td>7张<\/td><td>7张<\/td><td>七张顺子或其他完整结构<\/td><\/tr>\n<tr><td>12<\/td><td>6张<\/td><td>6张<\/td><td>六张顺子、三连对、飞机<\/td><\/tr>\n<tr><td>10<\/td><td>5张<\/td><td>5张<\/td><td>五张顺子<\/td><\/tr>\n<tr><td>8<\/td><td>4张<\/td><td>4张<\/td><td>炸弹、三带一<\/td><\/tr>\n<tr><td>6<\/td><td>3张<\/td><td>3张<\/td><td>三张牌型<\/td><\/tr>\n<tr><td>4<\/td><td>2张<\/td><td>2张<\/td><td>高对子或王炸<\/td><\/tr>\n<tr><td>2<\/td><td>1张<\/td><td>1张<\/td><td>最高单张<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>最强窗口通常不是张数最大，而是复制后能稳定连续领出的牌型。8张窗口复制炸弹、4张窗口复制王炸，控制确定性远高于普通长顺。<\/p>\n<h3>遗计优先级<\/h3>\n<ol><li><strong>王炸镜像：<\/strong> 4张手牌时打出王炸，余下2张复制成第二套王炸，理论控制力最高。<\/li><li><strong>炸弹镜像：<\/strong> 8张手牌时打出4张炸弹，剩余4张复制为同点数炸弹。<\/li><li><strong>高位长结构镜像：<\/strong> 高顺子、高连对或飞机不易被压，适合连续领出。<\/li><li><strong>高对子、三张镜像：<\/strong> 张数小、设置容易，但需要确认对手剩余控制牌。<\/li><li><strong>普通低位牌型镜像：<\/strong> 即使完成复制，也可能第一手被压而无法兑现第二手，优先级最低。<\/li><\/ol>\n<h3>主流打法<\/h3>\n<h4>地主：先调牌数，再镜像终结<\/h4>\n<ul><li>20张起手无法立即遗计，首阶段应先打掉2张或其他偶数张数，使手牌进入18以下偶数区间。<\/li><li>胜论前期只在随机补牌不会破坏核心结构时获取；补1张会改变奇偶，需要同步重算终结窗口。<\/li><li>一旦形成炸弹、王炸或难压长结构的“双手模型”，停止贪胜论，优先锁定遗计。<\/li><li>遗计第一手应尽量保证取得牌权；若第一手被压，复制虽然完成，但第二手可能长期无法出手。<\/li><li>保持炸弹或高牌作为遗计第一手之前的回手保障，不能只计算牌数而忽略出牌权。<\/li><\/ul>\n<p>地主主流节奏：<\/p>\n<blockquote>20张先减至偶数窗口 → 用胜论有限补强或调数 → 形成半手高控制牌型 → 遗计复制 → 再次领出同型牌收尾。<\/blockquote>\n<h4>农民：队友护航的双手终结<\/h4>\n<ul><li>17张起手为奇数，通常先打奇数张或利用一次胜论补牌，把手牌调整为偶数。<\/li><li>队友应帮助郭嘉夺回牌权，让遗计复制后的第二手获得领出机会。<\/li><li>农民可用胜论更积极地补牌，但接近8、6、4张关键窗口时应停止无目的增牌。<\/li><li>地主即将走完时，不为等待完美镜像而放弃即时压制。<\/li><\/ul>\n<h3>胜论的使用原则<\/h3>\n<ul><li>新牌型奖励不是纯收益：每触发一次，手牌净增加1张。<\/li><li>前中盘可利用单张、对子、三带、顺子、连对等自然新类型补牌并寻找结构。<\/li><li>胜论最重要的隐藏价值是调整奇偶：奇数手牌补1张可进入遗计需要的偶数总量。<\/li><li>已经处于理想偶数窗口时，随意触发胜论可能直接破坏遗计条件。<\/li><li>若新牌型本身能够大量减手，获得1张的代价可接受；为刷类型强拆结构通常不值。<\/li><\/ul>\n<h3>关键风险<\/h3>\n<ul><li>只满足“打出张数等于剩余张数”还不够，第一套牌型必须有足够控制力才能兑现第二套。<\/li><li>胜论随机补牌可能让偶数变奇数，导致遗计窗口后移。<\/li><li>为凑8张炸弹镜像或4张王炸镜像过度保牌，可能错过直接获胜。<\/li><li>遗计使用后胜论永久失效，发动过早会关闭后续补牌与调数能力。<\/li><li>复制长结构若点数偏低，第一手被压后可能无法再次获得领出机会。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>遗计是精确复制刚打出牌的全部点数，还是只把剩余牌变成相同牌型并重新生成点数。<\/li><li>王炸、万能牌、特殊牌型及带技能标记的牌能否被遗计完整复制。<\/li><li>遗计与胜论在同一手同时满足时的结算顺序；是否可以先拒绝胜论补牌再发动遗计。<\/li><li>胜论的“新牌型”按牌型大类统计，还是不同长度的顺子、连对分别统计。<\/li><li>胜论随机获得的牌及点数是否向其他玩家公开。<\/li><li>遗计复制后的牌面是否全部向其他玩家公开。<\/li><li>遗计第一手被其他玩家压住时，剩余牌是否仍已完成变换。<\/li><\/ul>", "search": "  郭嘉\n\n 郭嘉技能截图一 技能截图/郭嘉-1.png \n\n 郭嘉技能截图二 技能截图/郭嘉-2.png \n\n  技能\n\n 遗计｜限1次 \n\n  出牌后，若这手打出不超过9张牌，且剩余手牌张数与这手牌一样多，可以把剩余手牌变成刚打出的这手牌，然后“胜论”失效。\n\n 胜论｜限10次 \n\n  每打出一种自己此前没有出过的牌型，可以随机获得1张牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9.5/10   先手可主动调整至偶数牌量并设计镜像终结，遗计与连续领出高度匹配  \n  农民   9/10   胜论补牌和遗计复制上限很高，但镜像牌型能否取得第二次出手机会更依赖队友  \n  稳定性   8/10   遗计结果确定，但要求牌数精确相等；胜论随机补牌会持续改变窗口  \n  操作上限   10/10   牌数、牌型、牌权和两项技能结算顺序共同决定终局  \n\n 身份倾向：地主略优。 \n\n 先手匹配度：极高。  地主可先处理2张或其他小结构，把20张手牌压到18张以内的偶数窗口，再主动打出半数牌并启动遗计；若保住牌权，可直接重复镜像牌型收尾。\n\n  核心机制\n\n- 遗计发动前的手牌总数必须为偶数：若本手打出n张，出牌后必须恰好剩余n张。\n- n最大为9，因此发动前总手牌最多18张。\n- 发动后，剩余n张牌整体变成刚打出的n张牌，形成一套完全同构的第二手。\n- 遗计是可选效果；不满足牌权或收尾条件时可以暂缓发动。\n- 一旦实际使用遗计，胜论立即失效，后续不再通过新牌型补牌。\n- 胜论只统计郭嘉自己此前未打出过的牌型，每个新类型可随机获得1张牌，最多10次。\n- 胜论补牌会使手牌增加1张，既能改善结构、调整奇偶，也可能打乱已经计算好的遗计等分窗口。\n\n  遗计发动窗口\n\n  发动前手牌   本手打出   剩余并复制   优先复制结构  \n ---: ---: ---: --- \n  18   9张   9张   九张组合、长结构或特殊牌型  \n  16   8张   8张   八张顺子、四连对等  \n  14   7张   7张   七张顺子或其他完整结构  \n  12   6张   6张   六张顺子、三连对、飞机  \n  10   5张   5张   五张顺子  \n  8   4张   4张   炸弹、三带一  \n  6   3张   3张   三张牌型  \n  4   2张   2张   高对子或王炸  \n  2   1张   1张   最高单张  \n\n最强窗口通常不是张数最大，而是复制后能稳定连续领出的牌型。8张窗口复制炸弹、4张窗口复制王炸，控制确定性远高于普通长顺。\n\n  遗计优先级\n\n1.  王炸镜像：  4张手牌时打出王炸，余下2张复制成第二套王炸，理论控制力最高。\n2.  炸弹镜像：  8张手牌时打出4张炸弹，剩余4张复制为同点数炸弹。\n3.  高位长结构镜像：  高顺子、高连对或飞机不易被压，适合连续领出。\n4.  高对子、三张镜像：  张数小、设置容易，但需要确认对手剩余控制牌。\n5.  普通低位牌型镜像：  即使完成复制，也可能第一手被压而无法兑现第二手，优先级最低。\n\n  主流打法\n\n  地主：先调牌数，再镜像终结\n\n- 20张起手无法立即遗计，首阶段应先打掉2张或其他偶数张数，使手牌进入18以下偶数区间。\n- 胜论前期只在随机补牌不会破坏核心结构时获取；补1张会改变奇偶，需要同步重算终结窗口。\n- 一旦形成炸弹、王炸或难压长结构的“双手模型”，停止贪胜论，优先锁定遗计。\n- 遗计第一手应尽量保证取得牌权；若第一手被压，复制虽然完成，但第二手可能长期无法出手。\n- 保持炸弹或高牌作为遗计第一手之前的回手保障，不能只计算牌数而忽略出牌权。\n\n地主主流节奏：\n\n  20张先减至偶数窗口 → 用胜论有限补强或调数 → 形成半手高控制牌型 → 遗计复制 → 再次领出同型牌收尾。\n\n  农民：队友护航的双手终结\n\n- 17张起手为奇数，通常先打奇数张或利用一次胜论补牌，把手牌调整为偶数。\n- 队友应帮助郭嘉夺回牌权，让遗计复制后的第二手获得领出机会。\n- 农民可用胜论更积极地补牌，但接近8、6、4张关键窗口时应停止无目的增牌。\n- 地主即将走完时，不为等待完美镜像而放弃即时压制。\n\n  胜论的使用原则\n\n- 新牌型奖励不是纯收益：每触发一次，手牌净增加1张。\n- 前中盘可利用单张、对子、三带、顺子、连对等自然新类型补牌并寻找结构。\n- 胜论最重要的隐藏价值是调整奇偶：奇数手牌补1张可进入遗计需要的偶数总量。\n- 已经处于理想偶数窗口时，随意触发胜论可能直接破坏遗计条件。\n- 若新牌型本身能够大量减手，获得1张的代价可接受；为刷类型强拆结构通常不值。\n\n  关键风险\n\n- 只满足“打出张数等于剩余张数”还不够，第一套牌型必须有足够控制力才能兑现第二套。\n- 胜论随机补牌可能让偶数变奇数，导致遗计窗口后移。\n- 为凑8张炸弹镜像或4张王炸镜像过度保牌，可能错过直接获胜。\n- 遗计使用后胜论永久失效，发动过早会关闭后续补牌与调数能力。\n- 复制长结构若点数偏低，第一手被压后可能无法再次获得领出机会。\n\n  待实测\n\n- 遗计是精确复制刚打出牌的全部点数，还是只把剩余牌变成相同牌型并重新生成点数。\n- 王炸、万能牌、特殊牌型及带技能标记的牌能否被遗计完整复制。\n- 遗计与胜论在同一手同时满足时的结算顺序；是否可以先拒绝胜论补牌再发动遗计。\n- 胜论的“新牌型”按牌型大类统计，还是不同长度的顺子、连对分别统计。\n- 胜论随机获得的牌及点数是否向其他玩家公开。\n- 遗计复制后的牌面是否全部向其他玩家公开。\n- 遗计第一手被其他玩家压住时，剩余牌是否仍已完成变换。\n"}, {"name": "郭女王", "faction": "魏", "skills": "智数、殊宠", "position": "三带弃牌斩杀、整对获取与队友供牌", "status": "主要规则已实测", "landlord": 9.0, "farmer": 9.5, "identity": "农民略优。", "firstMove": "极高", "image": "技能截图/郭女王-1.png", "html": "<div class=\"hero-shot\"><img src=\"技能截图/郭女王-1.png\" alt=\"郭女王技能截图一\" loading=\"lazy\"><\/div>\n<div class=\"hero-shot\"><img src=\"技能截图/郭女王-2.png\" alt=\"郭女王技能截图二\" loading=\"lazy\"><\/div>\n<h3>技能<\/h3>\n<p><strong>智数｜主动响应｜不限次数<\/strong><\/p>\n<blockquote>你打出三带牌型时，可以选择1张手牌弃置。<\/blockquote>\n<p><strong>殊宠｜主动响应｜不限次数<\/strong><\/p>\n<blockquote>当其他玩家打出三带牌型时，你可以获得其带的牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9/10<\/td><td>先手可主动用三带持续额外减牌，三张结构越多，压缩效率越高<\/td><\/tr>\n<tr><td>农民<\/td><td>9.5/10<\/td><td>除自身减牌外，还可由队友用三带定向输送单牌或对子，协作上限更高<\/td><\/tr>\n<tr><td>稳定性<\/td><td>9/10<\/td><td>智数可主动兑现并能弃牌终结；殊宠收益范围固定且不影响原牌型结算<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>三张保留、带牌选择、额外弃牌与队友供牌共同决定实际手数<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：农民略优。<\/strong> 地主先手利于主动展开三带并压缩手牌；农民则多出队友定向供牌这一层稳定联动。<\/p>\n<p><strong>先手匹配度：极高。<\/strong> 地主可首手打三带并同步弃置1张废牌，使一次出牌完成牌型输出与尾牌清理；后续每获得一次领出机会都能继续复用。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>智数不限次数，每次郭女王打出合法的三带一或三带二后，都可以再从剩余手牌中选择1张弃置；飞机及飞机带牌不触发。<\/li><li>智数属于可选效果；额外弃牌会直接减少手牌，但不应破坏下一组完整结构。<\/li><li>智数若弃掉最后1张手牌，立即获胜。<\/li><li>殊宠只由其他玩家的三带一、三带二触发，包括队友与对手；飞机类牌型不触发。<\/li><li>殊宠不限次数且可以选择是否获得带牌；无结构价值的带牌可以不拿。<\/li><li>对方打出三带一时获得所带单牌；打出三带二时获得完整的一对，而不是只取其中1张。<\/li><li>殊宠相当于复制带牌加入郭女王手牌，不会抽走或破坏原玩家打出的牌，原三带牌型照常完整结算。<\/li><li>智数弃牌与殊宠获得牌的具体点数均向全场公开。<\/li><li>两项技能构成循环：其他玩家的三带为郭女王提供带牌，郭女王再把牌并入组合，或在自己出三带时通过智数处理废张。<\/li><li>武将价值取决于三张密度。起手三张、飞机组件越多，智数可兑现次数越多。<\/li><\/ul>\n<h3>智数的弃牌优先级<\/h3>\n<ol><li>无法进入顺子、对子、三张或带牌结构的最低孤张。<\/li><li>殊宠获得后不能立即并入组合的多余牌。<\/li><li>已经断张、继续保留只会增加一手的中小单牌。<\/li><li>无回手作用的重复尾牌。<\/li><li>除非能够直接形成更短终局，不弃2、王、炸弹组件或关键三张。<\/li><\/ol>\n<p>智数的判断标准不是固定弃最小牌，而是弃掉“对剩余最少手数贡献最低”的一张。<\/p>\n<h3>殊宠拿牌优先级<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>带牌价值<\/th><th>决策<\/th><\/tr><\/thead><tbody>\n<tr><td>拿到后直接形成炸弹或特殊牌型<\/td><td>最高优先级<\/td><\/tr>\n<tr><td>补成三张、对子、连对或顺子<\/td><td>通常获取<\/td><\/tr>\n<tr><td>高单牌可建立回手<\/td><td>残局优先获取<\/td><\/tr>\n<tr><td>队友定向送来计划点数<\/td><td>按团队路线获取<\/td><\/tr>\n<tr><td>低孤张且无法并入任何结构<\/td><td>放弃，避免无意义增牌<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>主流打法<\/h3>\n<h4>地主：连续三带压缩<\/h4>\n<ul><li>起手先统计三张数量，优先保留能连续组成三带一、三带二的核心。<\/li><li>首攻三带时同步智数弃1张废牌，使一手实际减少更多手牌。<\/li><li>带牌优先使用原本就需要处理的对子或单张，智数再删除另一张最差尾牌。<\/li><li>多组三张不要轻易拆成对子；每保住一组三张，就保留一次额外弃牌机会。<\/li><li>残局应把最后一次三带与智数合并计算，争取出牌后通过额外弃牌直接清空。<\/li><\/ul>\n<h4>农民：队友供牌与自身压缩<\/h4>\n<ul><li>队友打三带时，可把郭女王需要的连接张、对子或炸弹接口作为带牌送出。<\/li><li>殊宠不是见三带必拿；无法立即改善结构时应放弃，避免增加农民出完难度。<\/li><li>自己取得牌权后，尽量用三带带走低牌并触发智数，再额外删除一张废牌。<\/li><li>队友准备走完时，不要为了拿牌改变其最优出牌路线；团队先出完高于个人结构收益。<\/li><li>地主的三带若携带关键高牌，可根据拦截需求获取；低带牌则通常放弃。<\/li><\/ul>\n<h3>关键牌型价值<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>手牌结构<\/th><th>价值判断<\/th><\/tr><\/thead><tbody>\n<tr><td>多组三张＋充足单牌<\/td><td>智数触发密度高，适合地主主动冲牌<\/td><\/tr>\n<tr><td>多组三张＋对子<\/td><td>三带二能高效减手；别人打出时殊宠可获得完整带对<\/td><\/tr>\n<tr><td>飞机结构<\/td><td>不触发智数或殊宠，按普通斗地主结构评价<\/td><\/tr>\n<tr><td>只有一组三张<\/td><td>仍可完成一次额外弃牌，但武将持续性明显下降<\/td><\/tr>\n<tr><td>无三张结构<\/td><td>智数基本停机，主要依赖殊宠与队友协作<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>关键风险<\/h3>\n<ul><li>为了触发智数强拆顺子、连对或炸弹，可能使总手数不降反升。<\/li><li>殊宠会把牌加入手牌；拿到的带牌不能立即成型时，实际是在替别人接废牌。<\/li><li>对手可以减少三带使用，主动压低殊宠收益。<\/li><li>过早消耗全部三张，会失去后续持续弃牌能力。<\/li><\/ul>\n<h3>已确认结论<\/h3>\n<ul><li>技能中的“三带牌型”只包含三带一和三带二，不包含任何飞机类型。<\/li><li>殊宠遇到三带一获得所带单牌，遇到三带二获得完整的一对。<\/li><li>智数弃牌与殊宠获得牌的点数均向全场公开。<\/li><li>智数可以弃掉最后1张手牌并立即获胜，是郭女王最重要的终局能力。<\/li><li>殊宠不会影响原玩家的三带牌型结算；原牌照常打出，郭女王获得对应带牌。<\/li><\/ul>", "search": "  郭女王\n\n 郭女王技能截图一 技能截图/郭女王-1.png \n\n 郭女王技能截图二 技能截图/郭女王-2.png \n\n  技能\n\n 智数｜主动响应｜不限次数 \n\n  你打出三带牌型时，可以选择1张手牌弃置。\n\n 殊宠｜主动响应｜不限次数 \n\n  当其他玩家打出三带牌型时，你可以获得其带的牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9/10   先手可主动用三带持续额外减牌，三张结构越多，压缩效率越高  \n  农民   9.5/10   除自身减牌外，还可由队友用三带定向输送单牌或对子，协作上限更高  \n  稳定性   9/10   智数可主动兑现并能弃牌终结；殊宠收益范围固定且不影响原牌型结算  \n  操作上限   9.5/10   三张保留、带牌选择、额外弃牌与队友供牌共同决定实际手数  \n\n 身份倾向：农民略优。  地主先手利于主动展开三带并压缩手牌；农民则多出队友定向供牌这一层稳定联动。\n\n 先手匹配度：极高。  地主可首手打三带并同步弃置1张废牌，使一次出牌完成牌型输出与尾牌清理；后续每获得一次领出机会都能继续复用。\n\n  核心机制\n\n- 智数不限次数，每次郭女王打出合法的三带一或三带二后，都可以再从剩余手牌中选择1张弃置；飞机及飞机带牌不触发。\n- 智数属于可选效果；额外弃牌会直接减少手牌，但不应破坏下一组完整结构。\n- 智数若弃掉最后1张手牌，立即获胜。\n- 殊宠只由其他玩家的三带一、三带二触发，包括队友与对手；飞机类牌型不触发。\n- 殊宠不限次数且可以选择是否获得带牌；无结构价值的带牌可以不拿。\n- 对方打出三带一时获得所带单牌；打出三带二时获得完整的一对，而不是只取其中1张。\n- 殊宠相当于复制带牌加入郭女王手牌，不会抽走或破坏原玩家打出的牌，原三带牌型照常完整结算。\n- 智数弃牌与殊宠获得牌的具体点数均向全场公开。\n- 两项技能构成循环：其他玩家的三带为郭女王提供带牌，郭女王再把牌并入组合，或在自己出三带时通过智数处理废张。\n- 武将价值取决于三张密度。起手三张、飞机组件越多，智数可兑现次数越多。\n\n  智数的弃牌优先级\n\n1. 无法进入顺子、对子、三张或带牌结构的最低孤张。\n2. 殊宠获得后不能立即并入组合的多余牌。\n3. 已经断张、继续保留只会增加一手的中小单牌。\n4. 无回手作用的重复尾牌。\n5. 除非能够直接形成更短终局，不弃2、王、炸弹组件或关键三张。\n\n智数的判断标准不是固定弃最小牌，而是弃掉“对剩余最少手数贡献最低”的一张。\n\n  殊宠拿牌优先级\n\n  带牌价值   决策  \n --- --- \n  拿到后直接形成炸弹或特殊牌型   最高优先级  \n  补成三张、对子、连对或顺子   通常获取  \n  高单牌可建立回手   残局优先获取  \n  队友定向送来计划点数   按团队路线获取  \n  低孤张且无法并入任何结构   放弃，避免无意义增牌  \n\n  主流打法\n\n  地主：连续三带压缩\n\n- 起手先统计三张数量，优先保留能连续组成三带一、三带二的核心。\n- 首攻三带时同步智数弃1张废牌，使一手实际减少更多手牌。\n- 带牌优先使用原本就需要处理的对子或单张，智数再删除另一张最差尾牌。\n- 多组三张不要轻易拆成对子；每保住一组三张，就保留一次额外弃牌机会。\n- 残局应把最后一次三带与智数合并计算，争取出牌后通过额外弃牌直接清空。\n\n  农民：队友供牌与自身压缩\n\n- 队友打三带时，可把郭女王需要的连接张、对子或炸弹接口作为带牌送出。\n- 殊宠不是见三带必拿；无法立即改善结构时应放弃，避免增加农民出完难度。\n- 自己取得牌权后，尽量用三带带走低牌并触发智数，再额外删除一张废牌。\n- 队友准备走完时，不要为了拿牌改变其最优出牌路线；团队先出完高于个人结构收益。\n- 地主的三带若携带关键高牌，可根据拦截需求获取；低带牌则通常放弃。\n\n  关键牌型价值\n\n  手牌结构   价值判断  \n --- --- \n  多组三张＋充足单牌   智数触发密度高，适合地主主动冲牌  \n  多组三张＋对子   三带二能高效减手；别人打出时殊宠可获得完整带对  \n  飞机结构   不触发智数或殊宠，按普通斗地主结构评价  \n  只有一组三张   仍可完成一次额外弃牌，但武将持续性明显下降  \n  无三张结构   智数基本停机，主要依赖殊宠与队友协作  \n\n  关键风险\n\n- 为了触发智数强拆顺子、连对或炸弹，可能使总手数不降反升。\n- 殊宠会把牌加入手牌；拿到的带牌不能立即成型时，实际是在替别人接废牌。\n- 对手可以减少三带使用，主动压低殊宠收益。\n- 过早消耗全部三张，会失去后续持续弃牌能力。\n\n  已确认结论\n\n- 技能中的“三带牌型”只包含三带一和三带二，不包含任何飞机类型。\n- 殊宠遇到三带一获得所带单牌，遇到三带二获得完整的一对。\n- 智数弃牌与殊宠获得牌的点数均向全场公开。\n- 智数可以弃掉最后1张手牌并立即获胜，是郭女王最重要的终局能力。\n- 殊宠不会影响原玩家的三带牌型结算；原牌照常打出，郭女王获得对应带牌。\n"}, {"name": "陆逊", "faction": "吴", "skills": "破蜀、御魏", "position": "出牌补高、受压弃低与持续牌权循环", "status": "初步分析", "landlord": 9.5, "farmer": 9.0, "identity": "地主略优。", "firstMove": "极高", "image": "", "html": "<h3>技能<\/h3>\n<p><strong>破蜀｜被动｜限20次<\/strong><\/p>\n<blockquote>你出牌后，随机获得1张点数≥10的牌；手牌仅剩1张时不触发。<\/blockquote>\n<p><strong>御魏｜被动｜限20次<\/strong><\/p>\n<blockquote>你出牌被压时，弃置1张点数最小的牌；手牌仅剩1张时不触发。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9.5/10<\/td><td>先手立即启动破蜀，长牌可一边减牌一边持续补充高牌权<\/td><\/tr>\n<tr><td>农民<\/td><td>9/10<\/td><td>被地主压制时可借御魏加速减牌，但主动启动与连续牌权略弱于地主<\/td><\/tr>\n<tr><td>稳定性<\/td><td>9/10<\/td><td>两项技能上限均为20次，正常对局近似全程生效<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9/10<\/td><td>出牌张数、补牌后的重组和是否诱导对手压制共同决定速度<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：地主略优。<\/strong> 地主先手可立即触发破蜀，并用20张牌更稳定地组织顺子、连对、飞机等多张牌型；农民的御魏收益更容易兑现，但牌权主动性稍弱。<\/p>\n<p><strong>先手匹配度：极高。<\/strong> 第一手即可获得高牌，后续用新增高牌夺回牌权，形成“多张牌减手—补高牌—再控场”的循环。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>破蜀在陆逊每次完成出牌后随机新增1张点数不低于10的牌。<\/li><li>单出1张再补1张时，手牌数量不变；一次出多张再补1张时，净减少“出牌张数−1”。<\/li><li>御魏在陆逊刚打出的牌被压制后，自动弃置当前手牌中1张最低点数牌。<\/li><li>出牌后若再被压制，同一轮可先结算破蜀补牌，再通过御魏额外弃牌。<\/li><li>两项技能各限20次，正常对局中基本可视为持续生效。<\/li><li>任一技能轮到结算时若陆逊仅剩1张手牌，则该技能不触发。<\/li><li>核心优势是把每次出牌转化为高牌补给，并把失去牌权转化为额外减牌。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：长牌推进、高牌循环<\/h4>\n<ul><li>首手优先出顺子、连对、飞机等多张结构，避免单出后因补牌导致手牌数量不降。<\/li><li>新增10以上牌优先并入对子、三张和高位连对，不把所有高牌都拆成单张。<\/li><li>对手压制后，御魏会再清除最低牌；可主动用中等强度牌型诱压，加速清理低张。<\/li><li>保留2和王作为回手，新补到的10—A用于持续重组。<\/li><li>残局进入2张时，要规划一次性走完或确保最后一张有牌权，避免补牌循环拖延终结。<\/li><\/ul>\n<h4>农民：诱压减牌、队友接力<\/h4>\n<ul><li>优先出地主有能力压制的中等牌型，让御魏顺带清掉最低散张。<\/li><li>队友若能合理接牌，可帮助陆逊触发御魏并继续掌握团队节奏。<\/li><li>新增高牌用于拦截地主，低牌则尽量通过御魏自动清除。<\/li><li>手牌整齐时优先多张牌型；连续单出会被破蜀补回，减牌效率较差。<\/li><li>地主进入短牌阶段后以控场为主，不为触发御魏故意放弃必要牌权。<\/li><\/ul>\n<h3>出牌效率<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>本次打出张数<\/th><th>仅触发破蜀后的净减牌<\/th><th>再被压并触发御魏后的净减牌<\/th><\/tr><\/thead><tbody>\n<tr><td>1<\/td><td>0<\/td><td>1<\/td><\/tr>\n<tr><td>2<\/td><td>1<\/td><td>2<\/td><\/tr>\n<tr><td>3<\/td><td>2<\/td><td>3<\/td><\/tr>\n<tr><td>5<\/td><td>4<\/td><td>5<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>因此陆逊的主流路线不是连续单张，而是尽量用多张牌型推进；被压时反而能够恢复到接近正常出牌的减牌效率。<\/p>\n<h3>关键风险<\/h3>\n<ul><li>单张出牌会被破蜀补回1张，若对手不压，手牌数量无法下降。<\/li><li>持续补入10以上牌可能打断原有低位长牌结构，需要动态重算。<\/li><li>御魏固定弃最低牌，可能拆掉低位顺子、连对或三张接口。<\/li><li>高牌越来越多不等于手数更少，残局仍要防止大量高位孤张。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>破蜀的随机牌池是否包含2、大小王，以及各点数是否等概率。<\/li><li>破蜀新增牌的具体点数是否全场公开。<\/li><li>御魏弃牌点数是否全场公开。<\/li><li>多张最低牌并列时系统如何选择。<\/li><li>被队友压制是否正常触发御魏。<\/li><li>陆逊一次出完手牌时，是否直接结束而不再结算破蜀。<\/li><li>出牌后破蜀补至1张、随后被压时，御魏是否因当前仅剩1张而不触发。<\/li><li>炸弹被更大炸弹压制时是否正常触发御魏。<\/li><\/ul>", "search": "  陆逊\n\n  技能\n\n 破蜀｜被动｜限20次 \n\n  你出牌后，随机获得1张点数≥10的牌；手牌仅剩1张时不触发。\n\n 御魏｜被动｜限20次 \n\n  你出牌被压时，弃置1张点数最小的牌；手牌仅剩1张时不触发。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9.5/10   先手立即启动破蜀，长牌可一边减牌一边持续补充高牌权  \n  农民   9/10   被地主压制时可借御魏加速减牌，但主动启动与连续牌权略弱于地主  \n  稳定性   9/10   两项技能上限均为20次，正常对局近似全程生效  \n  操作上限   9/10   出牌张数、补牌后的重组和是否诱导对手压制共同决定速度  \n\n 身份倾向：地主略优。  地主先手可立即触发破蜀，并用20张牌更稳定地组织顺子、连对、飞机等多张牌型；农民的御魏收益更容易兑现，但牌权主动性稍弱。\n\n 先手匹配度：极高。  第一手即可获得高牌，后续用新增高牌夺回牌权，形成“多张牌减手—补高牌—再控场”的循环。\n\n  核心机制\n\n- 破蜀在陆逊每次完成出牌后随机新增1张点数不低于10的牌。\n- 单出1张再补1张时，手牌数量不变；一次出多张再补1张时，净减少“出牌张数−1”。\n- 御魏在陆逊刚打出的牌被压制后，自动弃置当前手牌中1张最低点数牌。\n- 出牌后若再被压制，同一轮可先结算破蜀补牌，再通过御魏额外弃牌。\n- 两项技能各限20次，正常对局中基本可视为持续生效。\n- 任一技能轮到结算时若陆逊仅剩1张手牌，则该技能不触发。\n- 核心优势是把每次出牌转化为高牌补给，并把失去牌权转化为额外减牌。\n\n  主流打法\n\n  地主：长牌推进、高牌循环\n\n- 首手优先出顺子、连对、飞机等多张结构，避免单出后因补牌导致手牌数量不降。\n- 新增10以上牌优先并入对子、三张和高位连对，不把所有高牌都拆成单张。\n- 对手压制后，御魏会再清除最低牌；可主动用中等强度牌型诱压，加速清理低张。\n- 保留2和王作为回手，新补到的10—a用于持续重组。\n- 残局进入2张时，要规划一次性走完或确保最后一张有牌权，避免补牌循环拖延终结。\n\n  农民：诱压减牌、队友接力\n\n- 优先出地主有能力压制的中等牌型，让御魏顺带清掉最低散张。\n- 队友若能合理接牌，可帮助陆逊触发御魏并继续掌握团队节奏。\n- 新增高牌用于拦截地主，低牌则尽量通过御魏自动清除。\n- 手牌整齐时优先多张牌型；连续单出会被破蜀补回，减牌效率较差。\n- 地主进入短牌阶段后以控场为主，不为触发御魏故意放弃必要牌权。\n\n  出牌效率\n\n  本次打出张数   仅触发破蜀后的净减牌   再被压并触发御魏后的净减牌  \n ---: ---: ---: \n  1   0   1  \n  2   1   2  \n  3   2   3  \n  5   4   5  \n\n因此陆逊的主流路线不是连续单张，而是尽量用多张牌型推进；被压时反而能够恢复到接近正常出牌的减牌效率。\n\n  关键风险\n\n- 单张出牌会被破蜀补回1张，若对手不压，手牌数量无法下降。\n- 持续补入10以上牌可能打断原有低位长牌结构，需要动态重算。\n- 御魏固定弃最低牌，可能拆掉低位顺子、连对或三张接口。\n- 高牌越来越多不等于手数更少，残局仍要防止大量高位孤张。\n\n  待实测\n\n- 破蜀的随机牌池是否包含2、大小王，以及各点数是否等概率。\n- 破蜀新增牌的具体点数是否全场公开。\n- 御魏弃牌点数是否全场公开。\n- 多张最低牌并列时系统如何选择。\n- 被队友压制是否正常触发御魏。\n- 陆逊一次出完手牌时，是否直接结束而不再结算破蜀。\n- 出牌后破蜀补至1张、随后被压时，御魏是否因当前仅剩1张而不触发。\n- 炸弹被更大炸弹压制时是否正常触发御魏。\n"}, {"name": "马超", "faction": "蜀", "skills": "铁骑、合围", "position": "出牌防拿、历史牌借用与组合反压", "status": "初步分析", "landlord": 9.0, "farmer": 8.5, "identity": "地主略优。", "firstMove": "高", "image": "", "html": "<h3>技能<\/h3>\n<p><strong>铁骑｜主动｜限2次<\/strong><\/p>\n<blockquote>其他角色不能拿走你下次打出的牌。<\/blockquote>\n<p><strong>合围｜主动｜限2次<\/strong><\/p>\n<blockquote>轮到你压牌时，可以查看另一名玩家本局游戏出过的牌，然后将至少1张手牌与这些牌组合进行压牌。查看的玩家不能选择你想压制的玩家。你用“合围”打出炸弹后，“合围”失效。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9/10<\/td><td>先手能提前用铁骑保护关键牌，合围还能借两名农民之一的历史出牌扩展压牌范围<\/td><\/tr>\n<tr><td>农民<\/td><td>8.5/10<\/td><td>可借队友历史出牌完成组合压牌，但合围选人限制与技能失效条件增加操作难度<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8/10<\/td><td>铁骑效果确定；合围强度取决于场上已公开的出牌记录与当前手牌接口<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>能围绕历史牌池重组压牌，并控制是否用炸弹结束合围体系<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：地主略优。<\/strong> 地主天然拥有首轮牌权，可以先布置铁骑并主导牌局；合围面对两名对手时也更容易找到可借用的历史牌。<\/p>\n<p><strong>先手匹配度：高。<\/strong> 铁骑可以在主动出牌前使用，使下一手牌免受其他角色的拿牌技能影响；但合围必须等到马超进入压牌阶段才能发动。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>铁骑保护的是马超“下次打出的整手牌”，其他角色不能通过技能拿走其中的牌。<\/li><li>铁骑只限制拿牌，不改变该手牌能否被正常压制，也不直接提供牌权。<\/li><li>合围仅在轮到马超压牌时发动，先查看一名符合条件的玩家本局已经打出过的牌。<\/li><li>被查看者不能是马超当前想要压制的那名玩家，因此三人局中通常只能查看另一方的历史出牌。<\/li><li>马超必须投入至少1张自己的手牌，再与所查看的历史牌组合成合法牌型完成压牌。<\/li><li>合围每局最多发动2次；若其中一次借助合围打出炸弹，合围立即失效，之后不能再发动。<\/li><li>历史牌用于组合，不代表把实体牌从弃牌区拿入马超手牌；最终如何结算仍需实测确认。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：铁骑护牌，合围补结构<\/h4>\n<ul><li>首轮准备打出容易被敌方技能获取的关键长牌或高价值牌时，先发动铁骑。<\/li><li>记住两名农民已经出过的对子、三张和连续点数，为后续合围保留最少的手牌接口。<\/li><li>合围优先用于普通牌型夺回牌权，尽量保留第二次发动机会。<\/li><li>只有炸弹能够直接建立终局或阻止农民走完时，才接受合围立即失效的代价。<\/li><\/ul>\n<h4>农民：借队友牌池完成拦截<\/h4>\n<ul><li>队友可通过正常出牌为马超留下有价值的历史牌型接口。<\/li><li>合围选择查看队友时，目标通常是压制地主；这样既满足选人限制，也便于合作。<\/li><li>自己只需投入至少1张牌，应优先选择既能完成压牌又不破坏自身核心结构的最小投入。<\/li><li>铁骑用于保护即将打出的炸弹组件、长牌或可能被对手拿走的关键点数。<\/li><\/ul>\n<h3>合围使用优先级<\/h3>\n<ol><li>组合后能够直接走完或形成确定终局。<\/li><li>用普通牌型夺回牌权，同时保留后续第二次合围。<\/li><li>补成对方难以继续压制的高位多张牌型。<\/li><li>地主即将走完时，以合围炸弹强行拦截。<\/li><li>仅为减少少量手牌而提前消耗技能，通常优先级最低。<\/li><\/ol>\n<h3>关键风险<\/h3>\n<ul><li>合围只能使用被查看者已经出过的牌，前期历史牌池太少时选择有限。<\/li><li>不能查看当前要压制的玩家，无法直接借用该玩家刚打出的牌完成同源反压。<\/li><li>至少要投入1张自身手牌；缺少合适接口时，即使历史牌很好也无法形成合法压牌。<\/li><li>用合围打出炸弹会令技能彻底失效，可能浪费尚未使用的次数。<\/li><li>铁骑不等于“不可压制”，若误当作强制牌权技能，会高估其控场能力。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>铁骑是否必须在主动出牌阶段使用，以及连续发动两次能否保护后续两手牌。<\/li><li>铁骑能否阻止复制类技能，还是只阻止把实体牌拿走的技能。<\/li><li>合围调用的历史牌是临时视为牌型素材，还是会生成或转入马超手牌。<\/li><li>合围完成压牌后，马超实际减少的手牌数是否只计算自己投入的牌。<\/li><li>合围能否使用万能牌及已发生点数变化的历史牌，按原点数还是最终点数计算。<\/li><li>合围打出炸弹后，未使用的次数是否一并作废。<\/li><li>合围组成普通牌型或炸弹的具体牌面是否全场公开。<\/li><\/ul>", "search": "  马超\n\n  技能\n\n 铁骑｜主动｜限2次 \n\n  其他角色不能拿走你下次打出的牌。\n\n 合围｜主动｜限2次 \n\n  轮到你压牌时，可以查看另一名玩家本局游戏出过的牌，然后将至少1张手牌与这些牌组合进行压牌。查看的玩家不能选择你想压制的玩家。你用“合围”打出炸弹后，“合围”失效。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9/10   先手能提前用铁骑保护关键牌，合围还能借两名农民之一的历史出牌扩展压牌范围  \n  农民   8.5/10   可借队友历史出牌完成组合压牌，但合围选人限制与技能失效条件增加操作难度  \n  稳定性   8/10   铁骑效果确定；合围强度取决于场上已公开的出牌记录与当前手牌接口  \n  操作上限   9.5/10   能围绕历史牌池重组压牌，并控制是否用炸弹结束合围体系  \n\n 身份倾向：地主略优。  地主天然拥有首轮牌权，可以先布置铁骑并主导牌局；合围面对两名对手时也更容易找到可借用的历史牌。\n\n 先手匹配度：高。  铁骑可以在主动出牌前使用，使下一手牌免受其他角色的拿牌技能影响；但合围必须等到马超进入压牌阶段才能发动。\n\n  核心机制\n\n- 铁骑保护的是马超“下次打出的整手牌”，其他角色不能通过技能拿走其中的牌。\n- 铁骑只限制拿牌，不改变该手牌能否被正常压制，也不直接提供牌权。\n- 合围仅在轮到马超压牌时发动，先查看一名符合条件的玩家本局已经打出过的牌。\n- 被查看者不能是马超当前想要压制的那名玩家，因此三人局中通常只能查看另一方的历史出牌。\n- 马超必须投入至少1张自己的手牌，再与所查看的历史牌组合成合法牌型完成压牌。\n- 合围每局最多发动2次；若其中一次借助合围打出炸弹，合围立即失效，之后不能再发动。\n- 历史牌用于组合，不代表把实体牌从弃牌区拿入马超手牌；最终如何结算仍需实测确认。\n\n  主流打法\n\n  地主：铁骑护牌，合围补结构\n\n- 首轮准备打出容易被敌方技能获取的关键长牌或高价值牌时，先发动铁骑。\n- 记住两名农民已经出过的对子、三张和连续点数，为后续合围保留最少的手牌接口。\n- 合围优先用于普通牌型夺回牌权，尽量保留第二次发动机会。\n- 只有炸弹能够直接建立终局或阻止农民走完时，才接受合围立即失效的代价。\n\n  农民：借队友牌池完成拦截\n\n- 队友可通过正常出牌为马超留下有价值的历史牌型接口。\n- 合围选择查看队友时，目标通常是压制地主；这样既满足选人限制，也便于合作。\n- 自己只需投入至少1张牌，应优先选择既能完成压牌又不破坏自身核心结构的最小投入。\n- 铁骑用于保护即将打出的炸弹组件、长牌或可能被对手拿走的关键点数。\n\n  合围使用优先级\n\n1. 组合后能够直接走完或形成确定终局。\n2. 用普通牌型夺回牌权，同时保留后续第二次合围。\n3. 补成对方难以继续压制的高位多张牌型。\n4. 地主即将走完时，以合围炸弹强行拦截。\n5. 仅为减少少量手牌而提前消耗技能，通常优先级最低。\n\n  关键风险\n\n- 合围只能使用被查看者已经出过的牌，前期历史牌池太少时选择有限。\n- 不能查看当前要压制的玩家，无法直接借用该玩家刚打出的牌完成同源反压。\n- 至少要投入1张自身手牌；缺少合适接口时，即使历史牌很好也无法形成合法压牌。\n- 用合围打出炸弹会令技能彻底失效，可能浪费尚未使用的次数。\n- 铁骑不等于“不可压制”，若误当作强制牌权技能，会高估其控场能力。\n\n  待实测\n\n- 铁骑是否必须在主动出牌阶段使用，以及连续发动两次能否保护后续两手牌。\n- 铁骑能否阻止复制类技能，还是只阻止把实体牌拿走的技能。\n- 合围调用的历史牌是临时视为牌型素材，还是会生成或转入马超手牌。\n- 合围完成压牌后，马超实际减少的手牌数是否只计算自己投入的牌。\n- 合围能否使用万能牌及已发生点数变化的历史牌，按原点数还是最终点数计算。\n- 合围打出炸弹后，未使用的次数是否一并作废。\n- 合围组成普通牌型或炸弹的具体牌面是否全场公开。\n"}, {"name": "麋夫人", "faction": "蜀", "skills": "存嗣", "position": "八张窗口、万能牌转化与队友终局支援", "status": "初步分析", "landlord": 8.5, "farmer": 9.5, "identity": "强农民型。", "firstMove": "中等", "image": "", "html": "<h3>技能<\/h3>\n<p><strong>存嗣｜主动响应｜限1次<\/strong><\/p>\n<blockquote>当你的手牌数量首次不超过8张时，可以将1张最大牌变为【万能牌】，并交给场上任意1名角色，包括自己。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8.5/10<\/td><td>可把最大牌转成万能牌修复残局，但技能到8张阶段才启动<\/td><\/tr>\n<tr><td>农民<\/td><td>9.5/10<\/td><td>可把万能牌交给自己或队友，具有明确的双人终局协作优势<\/td><\/tr>\n<tr><td>稳定性<\/td><td>9/10<\/td><td>手牌首次降至8张即可获得确定的万能牌转化窗口<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9/10<\/td><td>受赠目标、最大牌价值与万能牌落点共同决定收益<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：强农民型。<\/strong> 地主只能围绕自身重组；农民可比较两家残局，选择把万能牌交给最接近走完的一方。<\/p>\n<p><strong>先手匹配度：中等。<\/strong> 地主先手有利于更快降至8张，但技能不能在开局立即兑现；真正价值集中在中后盘结构重组。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>存嗣只在麋夫人本局手牌数量第一次降至8张或更少时出现发动窗口。<\/li><li>技能把麋夫人当时的1张最高点数牌转化为万能牌，再交给指定角色。<\/li><li>目标可以是麋夫人自己、队友或对手，常规选择为自己或队友。<\/li><li>交给自己时，手牌数量不变，只完成“最高牌→万能牌”的结构转换。<\/li><li>交给队友时，麋夫人减少1张，队友增加1张；团队总牌数不变，但牌型资源被重新分配。<\/li><li>万能牌可代替除大小王外的任意点数，可参与炸弹和特殊牌型，也可单独按声明点数打出。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：八张残局重构<\/h4>\n<ul><li>接近8张前先规划剩余牌型，避免最高牌是必须保留的唯一回手。<\/li><li>触发后通常交给自己，用万能牌补炸弹、飞机、连对、顺子或最后一组牌型。<\/li><li>若最大牌本身已是确定回手，且万能牌不能减少总手数，可以放弃发动。<\/li><li>进入8张前优先清理孤张，让万能牌落地后直接形成两至三手终局。<\/li><\/ul>\n<h4>农民：双人终局转移<\/h4>\n<ul><li>触发前同时观察自己与队友手牌数，优先把万能牌交给更接近走完的一方。<\/li><li>自己结构差、队友只缺1张即可成型时，主动交给队友。<\/li><li>队友无法立即利用万能牌时，留给自己修复残局，避免无效增牌。<\/li><li>可以通过一次长牌快速跨入8张区间，并把转换后的万能牌立即用于团队终结。<\/li><li>地主即将走完时，以能否立即建立拦截牌为第一判断标准。<\/li><\/ul>\n<h3>受赠目标优先级<\/h3>\n<ol><li>获得万能牌后可以直接走完的己方角色。<\/li><li>获得后能形成炸弹或稳定回手的角色。<\/li><li>获得后总手数明显减少的角色。<\/li><li>自己保留万能牌用于残局修复。<\/li><li>除特殊机制联动外，不交给对手。<\/li><\/ol>\n<h3>触发前规划<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>手牌阶段<\/th><th>处理<\/th><\/tr><\/thead><tbody>\n<tr><td>9张以上<\/td><td>调整尾牌结构，确定万能牌接收者<\/td><\/tr>\n<tr><td>即将降至8张<\/td><td>保留能与万能牌直接组合的接口<\/td><\/tr>\n<tr><td>首次≤8张<\/td><td>比较自己与队友的即时终结收益<\/td><\/tr>\n<tr><td>发动后<\/td><td>围绕万能牌形成最少手数方案<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>关键风险<\/h3>\n<ul><li>技能会消耗当前最大牌的原始点数，可能失去王、2等天然回手。<\/li><li>交给队友会增加其手牌，若不能立即成型可能拖慢团队出完。<\/li><li>第一次进入8张是关键窗口，未经规划快速甩牌可能导致转换目标不理想。<\/li><li>万能牌只能代替点数，不能替代大小王；不能把所有高牌价值等同于万能牌。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>最高牌为大小王时能否被转换为万能牌；若不能，是否向下选择次高牌。<\/li><li>多张并列最大牌时由玩家自行选择具体1张，还是系统指定。<\/li><li>首次不超过8张时放弃发动，之后能否再次出现发动窗口。<\/li><li>一次出牌从9张直接降至更低张数时是否正常触发。<\/li><li>手牌因其他技能减少至8张或以下时是否触发。<\/li><li>万能牌转化及交给目标的结果是否全场公开。<\/li><li>将万能牌交给其他角色后，是否带有来源标记或额外限制。<\/li><\/ul>", "search": "  麋夫人\n\n  技能\n\n 存嗣｜主动响应｜限1次 \n\n  当你的手牌数量首次不超过8张时，可以将1张最大牌变为【万能牌】，并交给场上任意1名角色，包括自己。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8.5/10   可把最大牌转成万能牌修复残局，但技能到8张阶段才启动  \n  农民   9.5/10   可把万能牌交给自己或队友，具有明确的双人终局协作优势  \n  稳定性   9/10   手牌首次降至8张即可获得确定的万能牌转化窗口  \n  操作上限   9/10   受赠目标、最大牌价值与万能牌落点共同决定收益  \n\n 身份倾向：强农民型。  地主只能围绕自身重组；农民可比较两家残局，选择把万能牌交给最接近走完的一方。\n\n 先手匹配度：中等。  地主先手有利于更快降至8张，但技能不能在开局立即兑现；真正价值集中在中后盘结构重组。\n\n  核心机制\n\n- 存嗣只在麋夫人本局手牌数量第一次降至8张或更少时出现发动窗口。\n- 技能把麋夫人当时的1张最高点数牌转化为万能牌，再交给指定角色。\n- 目标可以是麋夫人自己、队友或对手，常规选择为自己或队友。\n- 交给自己时，手牌数量不变，只完成“最高牌→万能牌”的结构转换。\n- 交给队友时，麋夫人减少1张，队友增加1张；团队总牌数不变，但牌型资源被重新分配。\n- 万能牌可代替除大小王外的任意点数，可参与炸弹和特殊牌型，也可单独按声明点数打出。\n\n  主流打法\n\n  地主：八张残局重构\n\n- 接近8张前先规划剩余牌型，避免最高牌是必须保留的唯一回手。\n- 触发后通常交给自己，用万能牌补炸弹、飞机、连对、顺子或最后一组牌型。\n- 若最大牌本身已是确定回手，且万能牌不能减少总手数，可以放弃发动。\n- 进入8张前优先清理孤张，让万能牌落地后直接形成两至三手终局。\n\n  农民：双人终局转移\n\n- 触发前同时观察自己与队友手牌数，优先把万能牌交给更接近走完的一方。\n- 自己结构差、队友只缺1张即可成型时，主动交给队友。\n- 队友无法立即利用万能牌时，留给自己修复残局，避免无效增牌。\n- 可以通过一次长牌快速跨入8张区间，并把转换后的万能牌立即用于团队终结。\n- 地主即将走完时，以能否立即建立拦截牌为第一判断标准。\n\n  受赠目标优先级\n\n1. 获得万能牌后可以直接走完的己方角色。\n2. 获得后能形成炸弹或稳定回手的角色。\n3. 获得后总手数明显减少的角色。\n4. 自己保留万能牌用于残局修复。\n5. 除特殊机制联动外，不交给对手。\n\n  触发前规划\n\n  手牌阶段   处理  \n ---: --- \n  9张以上   调整尾牌结构，确定万能牌接收者  \n  即将降至8张   保留能与万能牌直接组合的接口  \n  首次≤8张   比较自己与队友的即时终结收益  \n  发动后   围绕万能牌形成最少手数方案  \n\n  关键风险\n\n- 技能会消耗当前最大牌的原始点数，可能失去王、2等天然回手。\n- 交给队友会增加其手牌，若不能立即成型可能拖慢团队出完。\n- 第一次进入8张是关键窗口，未经规划快速甩牌可能导致转换目标不理想。\n- 万能牌只能代替点数，不能替代大小王；不能把所有高牌价值等同于万能牌。\n\n  待实测\n\n- 最高牌为大小王时能否被转换为万能牌；若不能，是否向下选择次高牌。\n- 多张并列最大牌时由玩家自行选择具体1张，还是系统指定。\n- 首次不超过8张时放弃发动，之后能否再次出现发动窗口。\n- 一次出牌从9张直接降至更低张数时是否正常触发。\n- 手牌因其他技能减少至8张或以下时是否触发。\n- 万能牌转化及交给目标的结果是否全场公开。\n- 将万能牌交给其他角色后，是否带有来源标记或额外限制。\n\n"}];
let state={q:'',faction:'全部',sort:'default',selected:null};
const grid=document.querySelector('#grid'),detail=document.querySelector('#detail'),count=document.querySelector('#count');
const factions=['全部',...new Set(heroes.map(h=>h.faction))];
document.querySelector('#filters').innerHTML=factions.map(x=>`<button class="chip ${x==='全部'?'active':''}" data-f="${x}">${x}</button>`).join('');
function scoreBar(label,value,type=''){return `<div class="score ${type}"><span>${label}</span><strong>${value}</strong><div class="bar"><i style="width:${value*10}%"></i></div></div>`}
function filtered(){let list=heroes.filter(h=>(state.faction==='全部'||h.faction===state.faction)&&(!state.q||(h.name+h.skills+h.position+h.identity+h.search).includes(state.q)));if(state.sort==='landlord')list.sort((a,b)=>b.landlord-a.landlord);if(state.sort==='farmer')list.sort((a,b)=>b.farmer-a.farmer);if(state.sort==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));return list}
function render(){const list=filtered();count.textContent=`${list.length} / ${heroes.length} 名武将`;grid.innerHTML=list.length?list.map(h=>`<button class="card ${state.selected===h.name?'active':''}" data-name="${h.name}"><div class="card-head"><div class="hero-name">${h.name}</div><span class="faction ${h.faction}">${h.faction}</span></div><div class="skills">${h.skills}</div><div class="position">${h.position}</div><div class="scores">${scoreBar('地主',h.landlord)}${scoreBar('农民',h.farmer,'farmer')}</div></button>`).join(''):'<div class="empty">没有匹配的武将</div>';document.querySelectorAll('.card').forEach(x=>x.onclick=()=>show(x.dataset.name))}
function closeDetail(){detail.classList.remove('open');document.body.classList.remove('detail-open')}
function show(name){const h=heroes.find(x=>x.name===name);if(!h)return;state.selected=name;detail.innerHTML=`<div class="detail-head"><button class="close" aria-label="返回武将列表">×</button><h2>${h.name}</h2><p>${h.skills} · ${h.position}</p><div class="detail-badges"><span class="badge">${h.faction}</span><span class="badge">${h.status}</span><span class="badge">${h.identity}</span></div></div><div class="detail-scroll"><div class="quick"><div>地主评分<strong>${h.landlord}/10</strong></div><div>农民评分<strong>${h.farmer}/10</strong></div><div>先手匹配<strong>${h.firstMove}</strong></div></div><article class="content">${h.html}</article></div>`;detail.classList.add('open');document.body.classList.add('detail-open');detail.querySelector('.close').onclick=closeDetail;render()}
document.querySelector('#search').oninput=e=>{state.q=e.target.value.trim().toLowerCase();render()};document.querySelector('#sort').onchange=e=>{state.sort=e.target.value;render()};document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{state.faction=x.dataset.f;document.querySelectorAll('.chip').forEach(y=>y.classList.toggle('active',y===x));render()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.querySelector('#search').focus()}});render();
</script></body></html>
