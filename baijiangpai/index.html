选择屯田。<\/li><li>达到3粮后已有大王保底路线；若继续让权风险过高，直接兑换并恢复进攻。<\/li><li>4粮时根据手牌决定万能牌还是继续等王炸：已有炸弹、顺子缺口或残局接口时，万能牌可能比双王更快结束牌局。<\/li><li>地主不能为了凑5粮连续放过两名农民的关键减手机会。<\/li><\/ul>\n<h4>农民：队友配合攒5粮<\/h4>\n<ul><li>队友打出单张、对子、三张或四张牌型时，邓艾可主动不压并稳定获得粮食。<\/li><li>队友掌握牌权且地主暂时无法连续冲牌，是最安全的屯田窗口。<\/li><li>前两三次屯田以积累为主，不急于兑换小王；5粮王炸是最强团队终点。<\/li><li>地主少牌时，优先按3粮大王或4粮万能牌提前兑现，控制当下高于资源效率。<\/li><li>生成王炸后应作为最后控制闸门，帮助队友先走；不能仅为倍率在无必要时提前炸出。<\/li><\/ul>\n<h3>是否应该选择不压<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>局面<\/th><th>决策<\/th><\/tr><\/thead><tbody>\n<tr><td>队友牌权稳定，地主手数较多<\/td><td>适合屯田，机会成本最低<\/td><\/tr>\n<tr><td>地主刚出普通单张或对子，后续威胁低<\/td><td>可用一次让权换粮<\/td><\/tr>\n<tr><td>地主只剩1至2手<\/td><td>禁止贪粮，应直接压制<\/td><\/tr>\n<tr><td>当前牌型超过4张<\/td><td>无法获得粮食，按正常控场处理<\/td><\/tr>\n<tr><td>已有4粮且万能牌能直接减少一手<\/td><td>优先兑换万能牌，不必机械追王炸<\/td><\/tr>\n<tr><td>已有5粮<\/td><td>根据残局立即兑换王炸，停止继续让权<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>关键风险<\/h3>\n<ul><li>每一点粮食都以一次不压为代价，资源并非免费获得。<\/li><li>地主身份连续让权，可能在完成兑换前就被农民走完。<\/li><li>王炸路线增加2张手牌；如果无法取得合适出手机会，也会延缓收尾。<\/li><li>4粮万能牌和5粮王炸互斥，错误兑换会永久关闭另一条路线。<\/li><li>对手可改打5张以上的顺子、连对或飞机，阻止邓艾屯田。<\/li><li>为屯粮放过必须拦截的牌，是该武将最严重的操作错误。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>兑换生成的大小王、万能牌及具体结果是否向其他玩家公开。<\/li><\/ul>\n<h3>已确认的操作结论<\/h3>\n<ul><li>“选择不出”是唯一行为条件，不检查邓艾是否具备合法压牌。<\/li><li>触发边界包含4张；任何合法的1至4张牌型都能提供粮食。<\/li><li>兵粮横跨主动出牌和压牌两个操作阶段，可根据当轮需求即时兑换。<\/li><li>重复兑换合法，例如累计4粮可以连续两次兑换小王。<\/li><li>五次屯田是整局硬上限，先消费再屯田也不能突破总计5点粮食。<\/li><\/ul>", "search": "  邓艾\n\n 邓艾��  \n\n 邓艾��  \n\n  技能\n\n 屯田｜被动｜限5次 \n\n  轮到你压牌时，如果需要压的牌不超过4张且你选择不压，获得1点“粮食”。\n\n 兵粮｜主动｜不限次数 \n\n  可以消耗“粮食”点数获得手牌：\n \n  - 2点：获得1张小王；\n  - 3点：获得1张大王；\n  - 4点：获得1张万能牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8/10   能用5粮换出王炸，但需要多次主动放弃压牌权，与地主连续进攻目标冲突  \n  农民   9.5/10   可借队友回合安全屯粮，5粮稳定转化为大小王，残局封锁能力极强  \n  稳定性   8.5/10   兑换结果固定；主要不确定性在于能否获得足够安全的屯田窗口  \n  操作上限   9.5/10   每次不压的机会成本和2/3/4点兑换分支决定上限  \n\n 身份倾向：强农民型。 \n\n 先手匹配度：偏低。  地主首手不能获得粮食，必须等其他玩家出牌并主动选择不压；先手虽能布置节奏，但与屯田的被动让权机制并不匹配。\n\n  核心机制\n\n- 屯田只在轮到邓艾压牌时检查。\n- 当前需要压制的牌型总张数不超过4张，且邓艾选择不压，即可获得1粮。\n- 是否实际存在合法压牌不影响屯田：有牌可压而主动不出、完全无牌可压后选择不出，均正常获得粮食。\n- 恰好4张的任何合法牌型也正常触发，包括四张炸弹、三带一等；5张及以上不触发。\n- 一次回合最多获得1粮，与需要压的具体牌型无关。\n- 屯田整局最多触发5次，因此全局最多生产5点粮食；消费粮食不会恢复屯田次数，也不会提高产粮上限。\n- 兵粮在轮到邓艾主动出牌时和轮到邓艾压牌时都可以使用。\n- 兵粮不限次数，同一种兑换可以重复选择，只受当前粮食余额和整局5点总产量限制。\n- 兵粮生成的牌会加入手牌，因此兑换控制力的同时也增加牌量。\n- 2粮和3粮可以分别换取小王、大王；完整5粮理论上可直接凑成王炸。\n- 4粮换万能牌只增加1张，结构适配性最高，但会放弃5粮王炸路线。\n\n  粮食兑换优先级\n\n  粮食   兑换路线   评价  \n ---: --- --- \n  2   小王   紧急拦截或提前建立王炸的一半；单独控制力有限  \n  3   大王   单卡控制力最高，适合无法继续安全屯粮的局面  \n  4   万能牌   最灵活，可补炸弹、顺子、飞机及残局结构  \n  5   小王＋大王   标准最强路线，增加2张但直接形成王炸  \n\n 默认终点是5粮王炸。  这是最高确定性控制收益；但若地主已经进入少牌、邓艾无法再安全让权，则应在3粮直接换大王，或在4粮换万能牌解决当下结构，不能机械等第5粮。\n\n  主流打法\n\n  地主：有限屯粮，不为王炸丢节奏\n\n- 首攻正常减手，不为技能刻意选择容易被压的牌型。\n- 农民打出不超过4张的牌型时，只在其无法连续走牌、且地主仍有可靠回手时选择屯田。\n- 达到3粮后已有大王保底路线；若继续让权风险过高，直接兑换并恢复进攻。\n- 4粮时根据手牌决定万能牌还是继续等王炸：已有炸弹、顺子缺口或残局接口时，万能牌可能比双王更快结束牌局。\n- 地主不能为了凑5粮连续放过两名农民的关键减手机会。\n\n  农民：队友配合攒5粮\n\n- 队友打出单张、对子、三张或四张牌型时，邓艾可主动不压并稳定获得粮食。\n- 队友掌握牌权且地主暂时无法连续冲牌，是最安全的屯田窗口。\n- 前两三次屯田以积累为主，不急于兑换小王；5粮王炸是最强团队终点。\n- 地主少牌时，优先按3粮大王或4粮万能牌提前兑现，控制当下高于资源效率。\n- 生成王炸后应作为最后控制闸门，帮助队友先走；不能仅为倍率在无必要时提前炸出。\n\n  是否应该选择不压\n\n  局面   决策  \n --- --- \n  队友牌权稳定，地主手数较多   适合屯田，机会成本最低  \n  地主刚出普通单张或对子，后续威胁低   可用一次让权换粮  \n  地主只剩1至2手   禁止贪粮，应直接压制  \n  当前牌型超过4张   无法获得粮食，按正常控场处理  \n  已有4粮且万能牌能直接减少一手   优先兑换万能牌，不必机械追王炸  \n  已有5粮   根据残局立即兑换王炸，停止继续让权  \n\n  关键风险\n\n- 每一点粮食都以一次不压为代价，资源并非免费获得。\n- 地主身份连续让权，可能在完成兑换前就被农民走完。\n- 王炸路线增加2张手牌；如果无法取得合适出手机会，也会延缓收尾。\n- 4粮万能牌和5粮王炸互斥，错误兑换会永久关闭另一条路线。\n- 对手可改打5张以上的顺子、连对或飞机，阻止邓艾屯田。\n- 为屯粮放过必须拦截的牌，是该武将最严重的操作错误。\n\n  待实测\n\n- 兑换生成的大小王、万能牌及具体结果是否向其他玩家公开。\n\n  已确认的操作结论\n\n- “选择不出”是唯一行为条件，不检查邓艾是否具备合法压牌。\n- 触发边界包含4张；任何合法的1至4张牌型都能提供粮食。\n- 兵粮横跨主动出牌和压牌两个操作阶段，可根据当轮需求即时兑换。\n- 重复兑换合法，例如累计4粮可以连续两次兑换小王。\n- 五次屯田是整局硬上限，先消费再屯田也不能突破总计5点粮食。\n"}, {"name": "郭嘉", "faction": "魏", "skills": "遗计、胜论", "position": "新牌型补牌、偶数窗口与镜像终结", "status": "初步分析", "landlord": 9.5, "farmer": 9.0, "identity": "地主略优。", "firstMove": "极高", "html": "<h3>技能<\/h3>\n<p><strong>遗计｜限1次<\/strong><\/p>\n<blockquote>出牌后，若这手打出不超过9张牌，且剩余手牌张数与这手牌一样多，可以把剩余手牌变成刚打出的这手牌，然后“胜论”失效。<\/blockquote>\n<p><strong>胜论｜限10次<\/strong><\/p>\n<blockquote>每打出一种自己此前没有出过的牌型，可以随机获得1张牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9.5/10<\/td><td>先手可主动调整至偶数牌量并设计镜像终结，遗计与连续领出高度匹配<\/td><\/tr>\n<tr><td>农民<\/td><td>9/10<\/td><td>胜论补牌和遗计复制上限很高，但镜像牌型能否取得第二次出手机会更依赖队友<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8/10<\/td><td>遗计结果确定，但要求牌数精确相等；胜论随机补牌会持续改变窗口<\/td><\/tr>\n<tr><td>操作上限<\/td><td>10/10<\/td><td>牌数、牌型、牌权和两项技能结算顺序共同决定终局<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：地主略优。<\/strong><\/p>\n<p><strong>先手匹配度：极高。<\/strong> 地主可先处理2张或其他小结构，把20张手牌压到18张以内的偶数窗口，再主动打出半数牌并启动遗计；若保住牌权，可直接重复镜像牌型收尾。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>遗计发动前的手牌总数必须为偶数：若本手打出N张，出牌后必须恰好剩余N张。<\/li><li>N最大为9，因此发动前总手牌最多18张。<\/li><li>发动后，剩余N张牌整体变成刚打出的N张牌，形成一套完全同构的第二手。<\/li><li>遗计是可选效果；不满足牌权或收尾条件时可以暂缓发动。<\/li><li>一旦实际使用遗计，胜论立即失效，后续不再通过新牌型补牌。<\/li><li>胜论只统计郭嘉自己此前未打出过的牌型，每个新类型可随机获得1张牌，最多10次。<\/li><li>胜论补牌会使手牌增加1张，既能改善结构、调整奇偶，也可能打乱已经计算好的遗计等分窗口。<\/li><\/ul>\n<h3>遗计发动窗口<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>发动前手牌<\/th><th>本手打出<\/th><th>剩余并复制<\/th><th>优先复制结构<\/th><\/tr><\/thead><tbody>\n<tr><td>18<\/td><td>9张<\/td><td>9张<\/td><td>九张组合、长结构或特殊牌型<\/td><\/tr>\n<tr><td>16<\/td><td>8张<\/td><td>8张<\/td><td>八张顺子、四连对等<\/td><\/tr>\n<tr><td>14<\/td><td>7张<\/td><td>7张<\/td><td>七张顺子或其他完整结构<\/td><\/tr>\n<tr><td>12<\/td><td>6张<\/td><td>6张<\/td><td>六张顺子、三连对、飞机<\/td><\/tr>\n<tr><td>10<\/td><td>5张<\/td><td>5张<\/td><td>五张顺子<\/td><\/tr>\n<tr><td>8<\/td><td>4张<\/td><td>4张<\/td><td>炸弹、三带一<\/td><\/tr>\n<tr><td>6<\/td><td>3张<\/td><td>3张<\/td><td>三张牌型<\/td><\/tr>\n<tr><td>4<\/td><td>2张<\/td><td>2张<\/td><td>高对子或王炸<\/td><\/tr>\n<tr><td>2<\/td><td>1张<\/td><td>1张<\/td><td>最高单张<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>最强窗口通常不是张数最大，而是复制后能稳定连续领出的牌型。8张窗口复制炸弹、4张窗口复制王炸，控制确定性远高于普通长顺。<\/p>\n<h3>遗计优先级<\/h3>\n<ol><li><strong>王炸镜像：<\/strong> 4张手牌时打出王炸，余下2张复制成第二套王炸，理论控制力最高。<\/li><li><strong>炸弹镜像：<\/strong> 8张手牌时打出4张炸弹，剩余4张复制为同点数炸弹。<\/li><li><strong>高位长结构镜像：<\/strong> 高顺子、高连对或飞机不易被压，适合连续领出。<\/li><li><strong>高对子、三张镜像：<\/strong> 张数小、设置容易，但需要确认对手剩余控制牌。<\/li><li><strong>普通低位牌型镜像：<\/strong> 即使完成复制，也可能第一手被压而无法兑现第二手，优先级最低。<\/li><\/ol>\n<h3>主流打法<\/h3>\n<h4>地主：先调牌数，再镜像终结<\/h4>\n<ul><li>20张起手无法立即遗计，首阶段应先打掉2张或其他偶数张数，使手牌进入18以下偶数区间。<\/li><li>胜论前期只在随机补牌不会破坏核心结构时获取；补1张会改变奇偶，需要同步重算终结窗口。<\/li><li>一旦形成炸弹、王炸或难压长结构的“双手模型”，停止贪胜论，优先锁定遗计。<\/li><li>遗计第一手应尽量保证取得牌权；若第一手被压，复制虽然完成，但第二手可能长期无法出手。<\/li><li>保持炸弹或高牌作为遗计第一手之前的回手保障，不能只计算牌数而忽略出牌权。<\/li><\/ul>\n<p>地主主流节奏：<\/p>\n<blockquote>20张先减至偶数窗口 → 用胜论有限补强或调数 → 形成半手高控制牌型 → 遗计复制 → 再次领出同型牌收尾。<\/blockquote>\n<h4>农民：队友护航的双手终结<\/h4>\n<ul><li>17张起手为奇数，通常先打奇数张或利用一次胜论补牌，把手牌调整为偶数。<\/li><li>队友应帮助郭嘉夺回牌权，让遗计复制后的第二手获得领出机会。<\/li><li>农民可用胜论更积极地补牌，但接近8、6、4张关键窗口时应停止无目的增牌。<\/li><li>地主即将走完时，不为等待完美镜像而放弃即时压制。<\/li><\/ul>\n<h3>胜论的使用原则<\/h3>\n<ul><li>新牌型奖励不是纯收益：每触发一次，手牌净增加1张。<\/li><li>前中盘可利用单张、对子、三带、顺子、连对等自然新类型补牌并寻找结构。<\/li><li>胜论最重要的隐藏价值是调整奇偶：奇数手牌补1张可进入遗计需要的偶数总量。<\/li><li>已经处于理想偶数窗口时，随意触发胜论可能直接破坏遗计条件。<\/li><li>若新牌型本身能够大量减手，获得1张的代价可接受；为刷类型强拆结构通常不值。<\/li><\/ul>\n<h3>关键风险<\/h3>\n<ul><li>只满足“打出张数等于剩余张数”还不够，第一套牌型必须有足够控制力才能兑现第二套。<\/li><li>胜论随机补牌可能让偶数变奇数，导致遗计窗口后移。<\/li><li>为凑8张炸弹镜像或4张王炸镜像过度保牌，可能错过直接获胜。<\/li><li>遗计使用后胜论永久失效，发动过早会关闭后续补牌与调数能力。<\/li><li>复制长结构若点数偏低，第一手被压后可能无法再次获得领出机会。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>遗计是精确复制刚打出牌的全部点数，还是只把剩余牌变成相同牌型并重新生成点数。<\/li><li>王炸、万能牌、特殊牌型及带技能标记的牌能否被遗计完整复制。<\/li><li>遗计与胜论在同一手同时满足时的结算顺序；是否可以先拒绝胜论补牌再发动遗计。<\/li><li>胜论的“新牌型”按牌型大类统计，还是不同长度的顺子、连对分别统计。<\/li><li>胜论随机获得的牌及点数是否向其他玩家公开。<\/li><li>遗计复制后的牌面是否全部向其他玩家公开。<\/li><li>遗计第一手被其他玩家压住时，剩余牌是否仍已完成变换。<\/li><\/ul>", "search": "  郭嘉\n\n 郭嘉��  \n\n 郭嘉��  \n\n  技能\n\n 遗计｜限1次 \n\n  出牌后，若这手打出不超过9张牌，且剩余手牌张数与这手牌一样多，可以把剩余手牌变成刚打出的这手牌，然后“胜论”失效。\n\n 胜论｜限10次 \n\n  每打出一种自己此前没有出过的牌型，可以随机获得1张牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9.5/10   先手可主动调整至偶数牌量并设计镜像终结，遗计与连续领出高度匹配  \n  农民   9/10   胜论补牌和遗计复制上限很高，但镜像牌型能否取得第二次出手机会更依赖队友  \n  稳定性   8/10   遗计结果确定，但要求牌数精确相等；胜论随机补牌会持续改变窗口  \n  操作上限   10/10   牌数、牌型、牌权和两项技能结算顺序共同决定终局  \n\n 身份倾向：地主略优。 \n\n 先手匹配度：极高。  地主可先处理2张或其他小结构，把20张手牌压到18张以内的偶数窗口，再主动打出半数牌并启动遗计；若保住牌权，可直接重复镜像牌型收尾。\n\n  核心机制\n\n- 遗计发动前的手牌总数必须为偶数：若本手打出n张，出牌后必须恰好剩余n张。\n- n最大为9，因此发动前总手牌最多18张。\n- 发动后，剩余n张牌整体变成刚打出的n张牌，形成一套完全同构的第二手。\n- 遗计是可选效果；不满足牌权或收尾条件时可以暂缓发动。\n- 一旦实际使用遗计，胜论立即失效，后续不再通过新牌型补牌。\n- 胜论只统计郭嘉自己此前未打出过的牌型，每个新类型可随机获得1张牌，最多10次。\n- 胜论补牌会使手牌增加1张，既能改善结构、调整奇偶，也可能打乱已经计算好的遗计等分窗口。\n\n  遗计发动窗口\n\n  发动前手牌   本手打出   剩余并复制   优先复制结构  \n ---: ---: ---: --- \n  18   9张   9张   九张组合、长结构或特殊牌型  \n  16   8张   8张   八张顺子、四连对等  \n  14   7张   7张   七张顺子或其他完整结构  \n  12   6张   6张   六张顺子、三连对、飞机  \n  10   5张   5张   五张顺子  \n  8   4张   4张   炸弹、三带一  \n  6   3张   3张   三张牌型  \n  4   2张   2张   高对子或王炸  \n  2   1张   1张   最高单张  \n\n最强窗口通常不是张数最大，而是复制后能稳定连续领出的牌型。8张窗口复制炸弹、4张窗口复制王炸，控制确定性远高于普通长顺。\n\n  遗计优先级\n\n1.  王炸镜像：  4张手牌时打出王炸，余下2张复制成第二套王炸，理论控制力最高。\n2.  炸弹镜像：  8张手牌时打出4张炸弹，剩余4张复制为同点数炸弹。\n3.  高位长结构镜像：  高顺子、高连对或飞机不易被压，适合连续领出。\n4.  高对子、三张镜像：  张数小、设置容易，但需要确认对手剩余控制牌。\n5.  普通低位牌型镜像：  即使完成复制，也可能第一手被压而无法兑现第二手，优先级最低。\n\n  主流打法\n\n  地主：先调牌数，再镜像终结\n\n- 20张起手无法立即遗计，首阶段应先打掉2张或其他偶数张数，使手牌进入18以下偶数区间。\n- 胜论前期只在随机补牌不会破坏核心结构时获取；补1张会改变奇偶，需要同步重算终结窗口。\n- 一旦形成炸弹、王炸或难压长结构的“双手模型”，停止贪胜论，优先锁定遗计。\n- 遗计第一手应尽量保证取得牌权；若第一手被压，复制虽然完成，但第二手可能长期无法出手。\n- 保持炸弹或高牌作为遗计第一手之前的回手保障，不能只计算牌数而忽略出牌权。\n\n地主主流节奏：\n\n  20张先减至偶数窗口 → 用胜论有限补强或调数 → 形成半手高控制牌型 → 遗计复制 → 再次领出同型牌收尾。\n\n  农民：队友护航的双手终结\n\n- 17张起手为奇数，通常先打奇数张或利用一次胜论补牌，把手牌调整为偶数。\n- 队友应帮助郭嘉夺回牌权，让遗计复制后的第二手获得领出机会。\n- 农民可用胜论更积极地补牌，但接近8、6、4张关键窗口时应停止无目的增牌。\n- 地主即将走完时，不为等待完美镜像而放弃即时压制。\n\n  胜论的使用原则\n\n- 新牌型奖励不是纯收益：每触发一次，手牌净增加1张。\n- 前中盘可利用单张、对子、三带、顺子、连对等自然新类型补牌并寻找结构。\n- 胜论最重要的隐藏价值是调整奇偶：奇数手牌补1张可进入遗计需要的偶数总量。\n- 已经处于理想偶数窗口时，随意触发胜论可能直接破坏遗计条件。\n- 若新牌型本身能够大量减手，获得1张的代价可接受；为刷类型强拆结构通常不值。\n\n  关键风险\n\n- 只满足“打出张数等于剩余张数”还不够，第一套牌型必须有足够控制力才能兑现第二套。\n- 胜论随机补牌可能让偶数变奇数，导致遗计窗口后移。\n- 为凑8张炸弹镜像或4张王炸镜像过度保牌，可能错过直接获胜。\n- 遗计使用后胜论永久失效，发动过早会关闭后续补牌与调数能力。\n- 复制长结构若点数偏低，第一手被压后可能无法再次获得领出机会。\n\n  待实测\n\n- 遗计是精确复制刚打出牌的全部点数，还是只把剩余牌变成相同牌型并重新生成点数。\n- 王炸、万能牌、特殊牌型及带技能标记的牌能否被遗计完整复制。\n- 遗计与胜论在同一手同时满足时的结算顺序；是否可以先拒绝胜论补牌再发动遗计。\n- 胜论的“新牌型”按牌型大类统计，还是不同长度的顺子、连对分别统计。\n- 胜论随机获得的牌及点数是否向其他玩家公开。\n- 遗计复制后的牌面是否全部向其他玩家公开。\n- 遗计第一手被其他玩家压住时，剩余牌是否仍已完成变换。\n"}, {"name": "郭女王", "faction": "魏", "skills": "智数、殊宠", "position": "三带弃牌斩杀、整对获取与队友供牌", "status": "主要规则已实测", "landlord": 9.0, "farmer": 9.5, "identity": "农民略优。", "firstMove": "极高", "html": "<h3>技能<\/h3>\n<p><strong>智数｜主动响应｜不限次数<\/strong><\/p>\n<blockquote>你打出三带牌型时，可以选择1张手牌弃置。<\/blockquote>\n<p><strong>殊宠｜主动响应｜不限次数<\/strong><\/p>\n<blockquote>当其他玩家打出三带牌型时，你可以获得其带的牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9/10<\/td><td>先手可主动用三带持续额外减牌，三张结构越多，压缩效率越高<\/td><\/tr>\n<tr><td>农民<\/td><td>9.5/10<\/td><td>除自身减牌外，还可由队友用三带定向输送单牌或对子，协作上限更高<\/td><\/tr>\n<tr><td>稳定性<\/td><td>9/10<\/td><td>智数可主动兑现并能弃牌终结；殊宠收益范围固定且不影响原牌型结算<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>三张保留、带牌选择、额外弃牌与队友供牌共同决定实际手数<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：农民略优。<\/strong> 地主先手利于主动展开三带并压缩手牌；农民则多出队友定向供牌这一层稳定联动。<\/p>\n<p><strong>先手匹配度：极高。<\/strong> 地主可首手打三带并同步弃置1张废牌，使一次出牌完成牌型输出与尾牌清理；后续每获得一次领出机会都能继续复用。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>智数不限次数，每次郭女王打出合法的三带一或三带二后，都可以再从剩余手牌中选择1张弃置；飞机及飞机带牌不触发。<\/li><li>智数属于可选效果；额外弃牌会直接减少手牌，但不应破坏下一组完整结构。<\/li><li>智数若弃掉最后1张手牌，立即获胜。<\/li><li>殊宠只由其他玩家的三带一、三带二触发，包括队友与对手；飞机类牌型不触发。<\/li><li>殊宠不限次数且可以选择是否获得带牌；无结构价值的带牌可以不拿。<\/li><li>对方打出三带一时获得所带单牌；打出三带二时获得完整的一对，而不是只取其中1张。<\/li><li>殊宠相当于复制带牌加入郭女王手牌，不会抽走或破坏原玩家打出的牌，原三带牌型照常完整结算。<\/li><li>智数弃牌与殊宠获得牌的具体点数均向全场公开。<\/li><li>两项技能构成循环：其他玩家的三带为郭女王提供带牌，郭女王再把牌并入组合，或在自己出三带时通过智数处理废张。<\/li><li>武将价值取决于三张密度。起手三张、飞机组件越多，智数可兑现次数越多。<\/li><\/ul>\n<h3>智数的弃牌优先级<\/h3>\n<ol><li>无法进入顺子、对子、三张或带牌结构的最低孤张。<\/li><li>殊宠获得后不能立即并入组合的多余牌。<\/li><li>已经断张、继续保留只会增加一手的中小单牌。<\/li><li>无回手作用的重复尾牌。<\/li><li>除非能够直接形成更短终局，不弃2、王、炸弹组件或关键三张。<\/li><\/ol>\n<p>智数的判断标准不是固定弃最小牌，而是弃掉“对剩余最少手数贡献最低”的一张。<\/p>\n<h3>殊宠拿牌优先级<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>带牌价值<\/th><th>决策<\/th><\/tr><\/thead><tbody>\n<tr><td>拿到后直接形成炸弹或特殊牌型<\/td><td>最高优先级<\/td><\/tr>\n<tr><td>补成三张、对子、连对或顺子<\/td><td>通常获取<\/td><\/tr>\n<tr><td>高单牌可建立回手<\/td><td>残局优先获取<\/td><\/tr>\n<tr><td>队友定向送来计划点数<\/td><td>按团队路线获取<\/td><\/tr>\n<tr><td>低孤张且无法并入任何结构<\/td><td>放弃，避免无意义增牌<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>主流打法<\/h3>\n<h4>地主：连续三带压缩<\/h4>\n<ul><li>起手先统计三张数量，优先保留能连续组成三带一、三带二的核心。<\/li><li>首攻三带时同步智数弃1张废牌，使一手实际减少更多手牌。<\/li><li>带牌优先使用原本就需要处理的对子或单张，智数再删除另一张最差尾牌。<\/li><li>多组三张不要轻易拆成对子；每保住一组三张，就保留一次额外弃牌机会。<\/li><li>残局应把最后一次三带与智数合并计算，争取出牌后通过额外弃牌直接清空。<\/li><\/ul>\n<h4>农民：队友供牌与自身压缩<\/h4>\n<ul><li>队友打三带时，可把郭女王需要的连接张、对子或炸弹接口作为带牌送出。<\/li><li>殊宠不是见三带必拿；无法立即改善结构时应放弃，避免增加农民出完难度。<\/li><li>自己取得牌权后，尽量用三带带走低牌并触发智数，再额外删除一张废牌。<\/li><li>队友准备走完时，不要为了拿牌改变其最优出牌路线；团队先出完高于个人结构收益。<\/li><li>地主的三带若携带关键高牌，可根据拦截需求获取；低带牌则通常放弃。<\/li><\/ul>\n<h3>关键牌型价值<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>手牌结构<\/th><th>价值判断<\/th><\/tr><\/thead><tbody>\n<tr><td>多组三张＋充足单牌<\/td><td>智数触发密度高，适合地主主动冲牌<\/td><\/tr>\n<tr><td>多组三张＋对子<\/td><td>三带二能高效减手；别人打出时殊宠可获得完整带对<\/td><\/tr>\n<tr><td>飞机结构<\/td><td>不触发智数或殊宠，按普通斗地主结构评价<\/td><\/tr>\n<tr><td>只有一组三张<\/td><td>仍可完成一次额外弃牌，但武将持续性明显下降<\/td><\/tr>\n<tr><td>无三张结构<\/td><td>智数基本停机，主要依赖殊宠与队友协作<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>关键风险<\/h3>\n<ul><li>为了触发智数强拆顺子、连对或炸弹，可能使总手数不降反升。<\/li><li>殊宠会把牌加入手牌；拿到的带牌不能立即成型时，实际是在替别人接废牌。<\/li><li>对手可以减少三带使用，主动压低殊宠收益。<\/li><li>过早消耗全部三张，会失去后续持续弃牌能力。<\/li><\/ul>\n<h3>已确认结论<\/h3>\n<ul><li>技能中的“三带牌型”只包含三带一和三带二，不包含任何飞机类型。<\/li><li>殊宠遇到三带一获得所带单牌，遇到三带二获得完整的一对。<\/li><li>智数弃牌与殊宠获得牌的点数均向全场公开。<\/li><li>智数可以弃掉最后1张手牌并立即获胜，是郭女王最重要的终局能力。<\/li><li>殊宠不会影响原玩家的三带牌型结算；原牌照常打出，郭女王获得对应带牌。<\/li><\/ul>", "search": "  郭女王\n\n 郭女王��  \n\n 郭女王��  \n\n  技能\n\n 智数｜主动响应｜不限次数 \n\n  你打出三带牌型时，可以选择1张手牌弃置。\n\n 殊宠｜主动响应｜不限次数 \n\n  当其他玩家打出三带牌型时，你可以获得其带的牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9/10   先手可主动用三带持续额外减牌，三张结构越多，压缩效率越高  \n  农民   9.5/10   除自身减牌外，还可由队友用三带定向输送单牌或对子，协作上限更高  \n  稳定性   9/10   智数可主动兑现并能弃牌终结；殊宠收益范围固定且不影响原牌型结算  \n  操作上限   9.5/10   三张保留、带牌选择、额外弃牌与队友供牌共同决定实际手数  \n\n 身份倾向：农民略优。  地主先手利于主动展开三带并压缩手牌；农民则多出队友定向供牌这一层稳定联动。\n\n 先手匹配度：极高。  地主可首手打三带并同步弃置1张废牌，使一次出牌完成牌型输出与尾牌清理；后续每获得一次领出机会都能继续复用。\n\n  核心机制\n\n- 智数不限次数，每次郭女王打出合法的三带一或三带二后，都可以再从剩余手牌中选择1张弃置；飞机及飞机带牌不触发。\n- 智数属于可选效果；额外弃牌会直接减少手牌，但不应破坏下一组完整结构。\n- 智数若弃掉最后1张手牌，立即获胜。\n- 殊宠只由其他玩家的三带一、三带二触发，包括队友与对手；飞机类牌型不触发。\n- 殊宠不限次数且可以选择是否获得带牌；无结构价值的带牌可以不拿。\n- 对方打出三带一时获得所带单牌；打出三带二时获得完整的一对，而不是只取其中1张。\n- 殊宠相当于复制带牌加入郭女王手牌，不会抽走或破坏原玩家打出的牌，原三带牌型照常完整结算。\n- 智数弃牌与殊宠获得牌的具体点数均向全场公开。\n- 两项技能构成循环：其他玩家的三带为郭女王提供带牌，郭女王再把牌并入组合，或在自己出三带时通过智数处理废张。\n- 武将价值取决于三张密度。起手三张、飞机组件越多，智数可兑现次数越多。\n\n  智数的弃牌优先级\n\n1. 无法进入顺子、对子、三张或带牌结构的最低孤张。\n2. 殊宠获得后不能立即并入组合的多余牌。\n3. 已经断张、继续保留只会增加一手的中小单牌。\n4. 无回手作用的重复尾牌。\n5. 除非能够直接形成更短终局，不弃2、王、炸弹组件或关键三张。\n\n智数的判断标准不是固定弃最小牌，而是弃掉“对剩余最少手数贡献最低”的一张。\n\n  殊宠拿牌优先级\n\n  带牌价值   决策  \n --- --- \n  拿到后直接形成炸弹或特殊牌型   最高优先级  \n  补成三张、对子、连对或顺子   通常获取  \n  高单牌可建立回手   残局优先获取  \n  队友定向送来计划点数   按团队路线获取  \n  低孤张且无法并入任何结构   放弃，避免无意义增牌  \n\n  主流打法\n\n  地主：连续三带压缩\n\n- 起手先统计三张数量，优先保留能连续组成三带一、三带二的核心。\n- 首攻三带时同步智数弃1张废牌，使一手实际减少更多手牌。\n- 带牌优先使用原本就需要处理的对子或单张，智数再删除另一张最差尾牌。\n- 多组三张不要轻易拆成对子；每保住一组三张，就保留一次额外弃牌机会。\n- 残局应把最后一次三带与智数合并计算，争取出牌后通过额外弃牌直接清空。\n\n  农民：队友供牌与自身压缩\n\n- 队友打三带时，可把郭女王需要的连接张、对子或炸弹接口作为带牌送出。\n- 殊宠不是见三带必拿；无法立即改善结构时应放弃，避免增加农民出完难度。\n- 自己取得牌权后，尽量用三带带走低牌并触发智数，再额外删除一张废牌。\n- 队友准备走完时，不要为了拿牌改变其最优出牌路线；团队先出完高于个人结构收益。\n- 地主的三带若携带关键高牌，可根据拦截需求获取；低带牌则通常放弃。\n\n  关键牌型价值\n\n  手牌结构   价值判断  \n --- --- \n  多组三张＋充足单牌   智数触发密度高，适合地主主动冲牌  \n  多组三张＋对子   三带二能高效减手；别人打出时殊宠可获得完整带对  \n  飞机结构   不触发智数或殊宠，按普通斗地主结构评价  \n  只有一组三张   仍可完成一次额外弃牌，但武将持续性明显下降  \n  无三张结构   智数基本停机，主要依赖殊宠与队友协作  \n\n  关键风险\n\n- 为了触发智数强拆顺子、连对或炸弹，可能使总手数不降反升。\n- 殊宠会把牌加入手牌；拿到的带牌不能立即成型时，实际是在替别人接废牌。\n- 对手可以减少三带使用，主动压低殊宠收益。\n- 过早消耗全部三张，会失去后续持续弃牌能力。\n\n  已确认结论\n\n- 技能中的“三带牌型”只包含三带一和三带二，不包含任何飞机类型。\n- 殊宠遇到三带一获得所带单牌，遇到三带二获得完整的一对。\n- 智数弃牌与殊宠获得牌的点数均向全场公开。\n- 智数可以弃掉最后1张手牌并立即获胜，是郭女王最重要的终局能力。\n- 殊宠不会影响原玩家的三带牌型结算；原牌照常打出，郭女王获得对应带牌。\n"}];
let state={q:'',faction:'全部',sort:'default',selected:null};
const grid=document.querySelector('#grid'),detail=document.querySelector('#detail'),count=document.querySelector('#count');
const factions=['全部',...new Set(heroes.map(h=>h.faction))];
document.querySelector('#filters').innerHTML=factions.map(x=>`<button class="chip ${x==='全部'?'active':''}" data-f="${x}">${x}</button>`).join('');
function scoreBar(label,value,type=''){return `<div class="score ${type}"><span>${label}</span><strong>${value}</strong><div class="bar"><i style="width:${value*10}%"></i></div></div>`}
function filtered(){let list=heroes.filter(h=>(state.faction==='全部'||h.faction===state.faction)&&(!state.q||(h.name+h.skills+h.position+h.identity+h.search).includes(state.q)));if(state.sort==='landlord')list.sort((a,b)=>b.landlord-a.landlord);if(state.sort==='farmer')list.sort((a,b)=>b.farmer-a.farmer);if(state.sort==='name')list.sort((a,b)=>a.name.localeCompare(b.name,'zh-CN'));return list}
function render(){const list=filtered();count.textContent=`${list.length} / ${heroes.length} 名武将`;grid.innerHTML=list.length?list.map(h=>`<button class="card ${state.selected===h.name?'active':''}" data-name="${h.name}"><div class="card-head"><div class="hero-name">${h.name}</div><span class="faction ${h.faction}">${h.faction}</span></div><div class="skills">${h.skills}</div><div class="position">${h.position}</div><div class="scores">${scoreBar('地主',h.landlord)}${scoreBar('农民',h.farmer,'farmer')}</div></button>`).join(''):'<div class="empty">没有匹配的武将</div>';document.querySelectorAll('.card').forEach(x=>x.onclick=()=>show(x.dataset.name))}
function closeDetail(){detail.classList.remove('open');document.body.classList.remove('detail-open')}
function show(name){const h=heroes.find(x=>x.name===name);if(!h)return;state.selected=name;detail.innerHTML=`<div class="detail-head"><button class="close" aria-label="返回武将列表">×</button><h2>${h.name}</h2><p>${h.skills} · ${h.position}</p><div class="detail-badges"><span class="badge">${h.faction}</span><span class="badge">${h.status}</span><span class="badge">${h.identity}</span></div></div><div class="detail-scroll"><div class="quick"><div>地主评分<strong>${h.landlord}/10</strong></div><div>农民评分<strong>${h.farmer}/10</strong></div><div>先手匹配<strong>${h.firstMove}</strong></div></div><article class="content">${h.html}</article></div>`;detail.classList.add('open');document.body.classList.add('detail-open');detail.querySelector('.close').onclick=closeDetail;render()}
document.querySelector('#search').oninput=e=>{state.q=e.target.value.trim().toLowerCase();render()};document.querySelector('#sort').onchange=e=>{state.sort=e.target.value;render()};document.querySelectorAll('.chip').forEach(x=>x.onclick=()=>{state.faction=x.dataset.f;document.querySelectorAll('.chip').forEach(y=>y.classList.toggle('active',y===x));render()});document.addEventListener('keydown',e=>{if(e.key==='Escape')closeDetail();if(e.key==='/'&&document.activeElement.tagName!=='INPUT'){e.preventDefault();document.querySelector('#search').focus()}});render();
</script></body></html>
