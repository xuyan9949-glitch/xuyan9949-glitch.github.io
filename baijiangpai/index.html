<body><div class="app">
<header class="topbar"><div class="top-inner"><div class="brand"><div class="eyebrow">LOCAL STRATEGY ARCHIVE</div><h1>三国百将牌 · 武将研究库</h1></div><div class="search"><input id="search" placeholder="搜索武将、技能、炸弹、万能牌、顺子……" autocomplete="off"></div><div class="count" id="count"></div></div></header>

</div><script>
const heroes=[{"name": "公孙瓒", "faction": "群", "skills": "义从", "position": "随机坐骑获取、功能轮换与阶段适配", "status": "初步分析", "landlord": 8.5, "farmer": 8.5, "identity": "身份均衡。", "firstMove": "高", "image": "", "html": "<h3>技能<\/h3>\n<p><strong>义从｜主动｜不限次<\/strong><\/p>\n<blockquote>你可以随机获得场上未出现过的1匹“坐骑”；若你已有“坐骑”，则进行替换。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8.5/10<\/td><td>先手可立即获取第一匹坐骑，并根据牌局阶段持续轮换功能<\/td><\/tr>\n<tr><td>农民<\/td><td>8.5/10<\/td><td>同样能主动获取坐骑，但具体团队价值取决于随机到的坐骑效果<\/td><\/tr>\n<tr><td>稳定性<\/td><td>7/10<\/td><td>一定能从未出现的坐骑中随机获得，但结果不可指定，且旧坐骑会被替换<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9/10<\/td><td>不限次数允许持续刷新，核心在何时保留现有坐骑、何时继续轮换<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：身份均衡。<\/strong> 技能不直接依赖地主或农民身份；地主的优势是开局先手便于立即结合坐骑展开，农民则可能利用功能型坐骑支援团队。<\/p>\n<p><strong>先手匹配度：高。<\/strong> 义从是主动技能且不限次数，如果允许在主动出牌前发动，地主可在第一轮先获取坐骑，再据其效果调整出牌方案。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>每次发动义从，都会从本局场上尚未出现过的坐骑中随机获得1匹。<\/li><li>公孙瓒同时只能保留1匹坐骑；已有坐骑时，新坐骑会将旧坐骑替换。<\/li><li>“场上未出现过”意味着已经出现过的坐骑原则上不会再次进入随机池，因此连续发动会逐步排除旧结果。<\/li><li>技能不限次数，但实际可发动上限会受到坐骑总池数量及“未出现过”条件限制。<\/li><li>义从本身不直接出牌、拿牌或弃牌，实战强度主要来自当前坐骑提供的特殊功能。<\/li><li>随机结果不可指定，因此发动前必须比较当前坐骑的确定价值与换取未知坐骑的收益。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>通用：先取坐骑，再按阶段轮换<\/h4>\n<ul><li>没有坐骑时优先发动一次，先获得无成本的持续效果。<\/li><li>当前坐骑正好解决手牌结构、牌权或防守问题时应停止刷新，不为用技能而替换。<\/li><li>当前坐骑效果已经兑现、进入冷却或不适合残局时，再用义从换取新功能。<\/li><li>记录本局已经出现的坐骑；随着候选池缩小，后期随机结果会更容易判断。<\/li><li>若剩余未出现坐骑中负面或低收益结果较多，应保留当前坐骑。<\/li><\/ul>\n<h4>地主<\/h4>\n<ul><li>开局获取坐骑后，优先围绕能强化首攻、牌权或批量减牌的效果设计路线。<\/li><li>地主没有队友兜底，稳定的防守或控场坐骑通常比高波动刷新更重要。<\/li><li>进入残局前可把已完成使命的前期坐骑换成回手、终结或防反类坐骑。<\/li><\/ul>\n<h4>农民<\/h4>\n<ul><li>优先保留能封锁地主、转移资源或协助队友的坐骑。<\/li><li>队友即将走完时，以牌权和防守功能为第一优先，不盲目追求个人减牌。<\/li><li>若当前坐骑只强化主动进攻而长期拿不到牌权，可以考虑刷新为反应型效果。<\/li><\/ul>\n<h3>轮换判断<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>当前情况<\/th><th>建议<\/th><\/tr><\/thead><tbody>\n<tr><td>尚无坐骑<\/td><td>立即获取第一匹<\/td><\/tr>\n<tr><td>当前坐骑与手牌高度匹配<\/td><td>保留，不刷新<\/td><\/tr>\n<tr><td>当前效果已经使用完毕<\/td><td>优先替换<\/td><\/tr>\n<tr><td>已知剩余坐骑整体更强<\/td><td>主动刷新<\/td><\/tr>\n<tr><td>残局需要特定牌权能力<\/td><td>只在剩余池有对应效果时冒险替换<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>关键风险<\/h3>\n<ul><li>替换是不可逆操作，旧坐骑可能在新坐骑出现后立即失去。<\/li><li>随机坐骑与当前手牌不匹配时，发动技能可能主动降低既有优势。<\/li><li>若坐骑池不会重置，过早连续刷新可能耗尽后期需要的关键坐骑。<\/li><li>当前缺少各坐骑的完整效果表，评分只能视为初步值，不能仅凭“不限次”高估强度。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>义从可以在哪些时点发动，是否能在主动出牌和压牌阶段自由使用。<\/li><li>每个时点能否连续发动多次，还是每轮或每次行动限1次。<\/li><li>完整坐骑池包含哪些坐骑，各自效果和持续时间是什么。<\/li><li>“场上未出现过”按全场所有玩家计算，还是只按公孙瓒自己曾获得的坐骑计算。<\/li><li>被替换的坐骑是否计入“已经出现过”，之后能否再次随机获得。<\/li><li>其他玩家通过技能获得过的坐骑，是否也会从义从随机池中排除。<\/li><li>所有坐骑均已出现后，义从是无法发动、重置坐骑池，还是从全池重新随机。<\/li><li>新坐骑名称与效果是否全场公开。<\/li><li>替换新坐骑时，旧坐骑尚未结算的持续效果是否立即消失。<\/li><li>公孙瓒失去或被拿走坐骑后，是否可以立刻再次发动义从补充。<\/li><\/ul>", "search": "  公孙瓒\n\n  技能\n\n 义从｜主动｜不限次 \n\n  你可以随机获得场上未出现过的1匹“坐骑”；若你已有“坐骑”，则进行替换。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8.5/10   先手可立即获取第一匹坐骑，并根据牌局阶段持续轮换功能  \n  农民   8.5/10   同样能主动获取坐骑，但具体团队价值取决于随机到的坐骑效果  \n  稳定性   7/10   一定能从未出现的坐骑中随机获得，但结果不可指定，且旧坐骑会被替换  \n  操作上限   9/10   不限次数允许持续刷新，核心在何时保留现有坐骑、何时继续轮换  \n\n 身份倾向：身份均衡。  技能不直接依赖地主或农民身份；地主的优势是开局先手便于立即结合坐骑展开，农民则可能利用功能型坐骑支援团队。\n\n 先手匹配度：高。  义从是主动技能且不限次数，如果允许在主动出牌前发动，地主可在第一轮先获取坐骑，再据其效果调整出牌方案。\n\n  核心机制\n\n- 每次发动义从，都会从本局场上尚未出现过的坐骑中随机获得1匹。\n- 公孙瓒同时只能保留1匹坐骑；已有坐骑时，新坐骑会将旧坐骑替换。\n- “场上未出现过”意味着已经出现过的坐骑原则上不会再次进入随机池，因此连续发动会逐步排除旧结果。\n- 技能不限次数，但实际可发动上限会受到坐骑总池数量及“未出现过”条件限制。\n- 义从本身不直接出牌、拿牌或弃牌，实战强度主要来自当前坐骑提供的特殊功能。\n- 随机结果不可指定，因此发动前必须比较当前坐骑的确定价值与换取未知坐骑的收益。\n\n  主流打法\n\n  通用：先取坐骑，再按阶段轮换\n\n- 没有坐骑时优先发动一次，先获得无成本的持续效果。\n- 当前坐骑正好解决手牌结构、牌权或防守问题时应停止刷新，不为用技能而替换。\n- 当前坐骑效果已经兑现、进入冷却或不适合残局时，再用义从换取新功能。\n- 记录本局已经出现的坐骑；随着候选池缩小，后期随机结果会更容易判断。\n- 若剩余未出现坐骑中负面或低收益结果较多，应保留当前坐骑。\n\n  地主\n\n- 开局获取坐骑后，优先围绕能强化首攻、牌权或批量减牌的效果设计路线。\n- 地主没有队友兜底，稳定的防守或控场坐骑通常比高波动刷新更重要。\n- 进入残局前可把已完成使命的前期坐骑换成回手、终结或防反类坐骑。\n\n  农民\n\n- 优先保留能封锁地主、转移资源或协助队友的坐骑。\n- 队友即将走完时，以牌权和防守功能为第一优先，不盲目追求个人减牌。\n- 若当前坐骑只强化主动进攻而长期拿不到牌权，可以考虑刷新为反应型效果。\n\n  轮换判断\n\n  当前情况   建议  \n --- --- \n  尚无坐骑   立即获取第一匹  \n  当前坐骑与手牌高度匹配   保留，不刷新  \n  当前效果已经使用完毕   优先替换  \n  已知剩余坐骑整体更强   主动刷新  \n  残局需要特定牌权能力   只在剩余池有对应效果时冒险替换  \n\n  关键风险\n\n- 替换是不可逆操作，旧坐骑可能在新坐骑出现后立即失去。\n- 随机坐骑与当前手牌不匹配时，发动技能可能主动降低既有优势。\n- 若坐骑池不会重置，过早连续刷新可能耗尽后期需要的关键坐骑。\n- 当前缺少各坐骑的完整效果表，评分只能视为初步值，不能仅凭“不限次”高估强度。\n\n  待实测\n\n- 义从可以在哪些时点发动，是否能在主动出牌和压牌阶段自由使用。\n- 每个时点能否连续发动多次，还是每轮或每次行动限1次。\n- 完整坐骑池包含哪些坐骑，各自效果和持续时间是什么。\n- “场上未出现过”按全场所有玩家计算，还是只按公孙瓒自己曾获得的坐骑计算。\n- 被替换的坐骑是否计入“已经出现过”，之后能否再次随机获得。\n- 其他玩家通过技能获得过的坐骑，是否也会从义从随机池中排除。\n- 所有坐骑均已出现后，义从是无法发动、重置坐骑池，还是从全池重新随机。\n- 新坐骑名称与效果是否全场公开。\n- 替换新坐骑时，旧坐骑尚未结算的持续效果是否立即消失。\n- 公孙瓒失去或被拿走坐骑后，是否可以立刻再次发动义从补充。\n"}, {"name": "关羽", "faction": "蜀", "skills": "单骑、武圣", "position": "顺子收益、万能牌与定向复制", "status": "主要规则已实测", "landlord": 9.0, "farmer": 8.5, "identity": "地主略优。", "firstMove": "极高", "image": "技能截图/关羽.png", "html": "<div class=\"hero-shot\"><img src=\"技能截图/关羽.png\" alt=\"关羽技能截图\" loading=\"lazy\"><\/div>\n<h3>技能<\/h3>\n<p><strong>单骑｜被动｜限1次<\/strong><\/p>\n<blockquote>你打出顺子时，获得1张【万能牌】。<\/blockquote>\n<p><strong>武圣｜主动响应｜限2次<\/strong><\/p>\n<blockquote>其他玩家打出顺子后，你可以从这手顺子里选1张加入手牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9/10<\/td><td>先手可主动出顺子拿万能牌，20张手牌也更容易形成顺子<\/td><\/tr>\n<tr><td>农民<\/td><td>8.5/10<\/td><td>可由队友稳定提供顺子和关键普通点数，但武圣不能复制其中的万能牌<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8/10<\/td><td>单骑可主动触发；农民可由队友提高武圣触发稳定性<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>万能牌、连续武圣与队友协作带来高组合上限<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：地主略优。<\/strong> 地主能靠单骑稳定自取万能牌；农民虽有队友协作，但武圣只能复制顺子中的普通牌。<\/p>\n<p><strong>先手匹配度：极高。<\/strong> 地主第一手即可主动打顺子，稳定获得万能牌，再用万能牌重构剩余牌型；不需要等待对手配合。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>单骑把一次顺子出牌转化为1张万能牌，实际净减牌数为“顺子长度−1”。<\/li><li>万能牌可代替除大小王外的任意点数，可参与炸弹和特殊牌型，也可单独打出；单出时按当时点数结算。<\/li><li>武圣并非从原顺子中移走牌，而是复制所选牌加入手牌；原玩家的顺子仍完整结算。<\/li><li>“其他玩家”包括队友，队友可以主动提供顺子触发武圣。<\/li><li>若其他玩家的顺子中包含万能牌，武圣不能选择复制该万能牌；只能从其中的普通点数牌选择1张复制。<\/li><li>两次武圣可以在同一轮连续触发。<\/li><li>两个技能都围绕顺子展开：单骑提供万能牌，武圣补连接张或重复点数。<\/li><li>武圣不仅是收益技能，也会迫使对手减少顺子使用，具有牌型威慑。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：首顺启动型<\/h4>\n<ol><li>起手优先寻找不破坏核心结构的顺子。<\/li><li>第一轮主动出顺子，尽早拿到万能牌。<\/li><li>万能牌优先用于直接减少一手的结构，不为单纯补大牌浪费。<\/li><li>武圣只拿能立即成型或显著缩短尾牌的点数。<\/li><li>万能牌与武圣选牌共同服务于一至两手收尾。<\/li><\/ol>\n<p>地主首顺不是越长越好。若超长顺子会拆掉多组三张、对子或炸弹，应比较拿到万能牌后的整体手数再决定。<\/p>\n<h4>农民：协作回收型<\/h4>\n<ul><li>队友出顺子时，可定向复制己方需要的连接张；原顺子不受影响。<\/li><li>队友顺子中带有万能牌时，应忽略万能牌，只在其余普通点数牌中选择结构收益最高的一张。<\/li><li>同一轮出现两次顺子机会时，可连续使用两次武圣，快速完成炸弹或特殊牌型。<\/li><li>地主出顺子时，优先拿能形成炸弹、三张、连对或补齐己方顺子的牌。<\/li><li>地主接近走完时，武圣拿牌的首要目标是生成拦截牌，而不是单纯优化长期结构。<\/li><li>单骑尽量用于已经计划要出的顺子，不为触发技能强拆其他高价值组合。<\/li><\/ul>\n<h3>武圣选牌优先级<\/h3>\n<ol><li>复制后直接减少一手的普通点数牌。<\/li><li>补成长炸弹或特殊牌型的点数。<\/li><li>补成三张、飞机、连对或完整顺子的牌。<\/li><li>补齐另一条顺子的连接张。<\/li><li>形成高对或关键回手牌。<\/li><li>单独的大牌。<\/li><\/ol>\n<p>单纯选顺子中的最高点数通常不是最优。若一张中间连接牌能让尾牌少一手，其价值高于孤立的A。<\/p>\n<h3>万能牌使用优先级<\/h3>\n<ol><li>补成可以直接走完的最后牌型。<\/li><li>补成长炸弹或特殊牌型。<\/li><li>补飞机、长顺或连对，使总手数下降。<\/li><li>修复被拆断的关键结构。<\/li><li>单独作为所需点数出牌或回手。<\/li><\/ol>\n<p>万能牌只有一次获取机会，核心评价标准是“使用后少几手”，不是“变成多大的牌”。<\/p>\n<h3>主要风险<\/h3>\n<ul><li>为触发单骑强拆对子、三张或炸弹，整体手数可能反而增加。<\/li><li>武圣每次使手牌增加1张；选牌不能立即成型时可能拖慢收尾。<\/li><li>对手知道关羽技能后，可以主动减少顺子，压低武圣收益。<\/li><li>过早消耗万能牌，会降低残局修牌能力。<\/li><li>连续复制两张虽然上限高，但会让手牌增加2张；不能成型时不应为了用完次数而强拿。<\/li><\/ul>\n<h3>已确认的联动结论<\/h3>\n<ul><li>队友打出含万能牌的顺子时，原顺子照常结算，但关羽不能复制万能牌，只能复制其中的普通牌。<\/li><li>连续两次武圣可以在一个轮次内迅速补齐同点数炸弹、飞机或其他特殊牌型。<\/li><li>万能牌既能修结构，也能直接当作所需点数出牌，因此无需为“留万能牌”牺牲明确的当轮胜势。<\/li><li>武圣的本质是定向复制而非回收，不能用传统“拿牌会破坏对方顺子”的思路评估。<\/li><\/ul>", "search": "  关羽\n\n 关羽技能截图 技能截图/关羽.png \n\n  技能\n\n 单骑｜被动｜限1次 \n\n  你打出顺子时，获得1张【万能牌】。\n\n 武圣｜主动响应｜限2次 \n\n  其他玩家打出顺子后，你可以从这手顺子里选1张加入手牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9/10   先手可主动出顺子拿万能牌，20张手牌也更容易形成顺子  \n  农民   8.5/10   可由队友稳定提供顺子和关键普通点数，但武圣不能复制其中的万能牌  \n  稳定性   8/10   单骑可主动触发；农民可由队友提高武圣触发稳定性  \n  操作上限   9.5/10   万能牌、连续武圣与队友协作带来高组合上限  \n\n 身份倾向：地主略优。  地主能靠单骑稳定自取万能牌；农民虽有队友协作，但武圣只能复制顺子中的普通牌。\n\n 先手匹配度：极高。  地主第一手即可主动打顺子，稳定获得万能牌，再用万能牌重构剩余牌型；不需要等待对手配合。\n\n  核心机制\n\n- 单骑把一次顺子出牌转化为1张万能牌，实际净减牌数为“顺子长度−1”。\n- 万能牌可代替除大小王外的任意点数，可参与炸弹和特殊牌型，也可单独打出；单出时按当时点数结算。\n- 武圣并非从原顺子中移走牌，而是复制所选牌加入手牌；原玩家的顺子仍完整结算。\n- “其他玩家”包括队友，队友可以主动提供顺子触发武圣。\n- 若其他玩家的顺子中包含万能牌，武圣不能选择复制该万能牌；只能从其中的普通点数牌选择1张复制。\n- 两次武圣可以在同一轮连续触发。\n- 两个技能都围绕顺子展开：单骑提供万能牌，武圣补连接张或重复点数。\n- 武圣不仅是收益技能，也会迫使对手减少顺子使用，具有牌型威慑。\n\n  主流打法\n\n  地主：首顺启动型\n\n1. 起手优先寻找不破坏核心结构的顺子。\n2. 第一轮主动出顺子，尽早拿到万能牌。\n3. 万能牌优先用于直接减少一手的结构，不为单纯补大牌浪费。\n4. 武圣只拿能立即成型或显著缩短尾牌的点数。\n5. 万能牌与武圣选牌共同服务于一至两手收尾。\n\n地主首顺不是越长越好。若超长顺子会拆掉多组三张、对子或炸弹，应比较拿到万能牌后的整体手数再决定。\n\n  农民：协作回收型\n\n- 队友出顺子时，可定向复制己方需要的连接张；原顺子不受影响。\n- 队友顺子中带有万能牌时，应忽略万能牌，只在其余普通点数牌中选择结构收益最高的一张。\n- 同一轮出现两次顺子机会时，可连续使用两次武圣，快速完成炸弹或特殊牌型。\n- 地主出顺子时，优先拿能形成炸弹、三张、连对或补齐己方顺子的牌。\n- 地主接近走完时，武圣拿牌的首要目标是生成拦截牌，而不是单纯优化长期结构。\n- 单骑尽量用于已经计划要出的顺子，不为触发技能强拆其他高价值组合。\n\n  武圣选牌优先级\n\n1. 复制后直接减少一手的普通点数牌。\n2. 补成长炸弹或特殊牌型的点数。\n3. 补成三张、飞机、连对或完整顺子的牌。\n4. 补齐另一条顺子的连接张。\n5. 形成高对或关键回手牌。\n6. 单独的大牌。\n\n单纯选顺子中的最高点数通常不是最优。若一张中间连接牌能让尾牌少一手，其价值高于孤立的a。\n\n  万能牌使用优先级\n\n1. 补成可以直接走完的最后牌型。\n2. 补成长炸弹或特殊牌型。\n3. 补飞机、长顺或连对，使总手数下降。\n4. 修复被拆断的关键结构。\n5. 单独作为所需点数出牌或回手。\n\n万能牌只有一次获取机会，核心评价标准是“使用后少几手”，不是“变成多大的牌”。\n\n  主要风险\n\n- 为触发单骑强拆对子、三张或炸弹，整体手数可能反而增加。\n- 武圣每次使手牌增加1张；选牌不能立即成型时可能拖慢收尾。\n- 对手知道关羽技能后，可以主动减少顺子，压低武圣收益。\n- 过早消耗万能牌，会降低残局修牌能力。\n- 连续复制两张虽然上限高，但会让手牌增加2张；不能成型时不应为了用完次数而强拿。\n\n  已确认的联动结论\n\n- 队友打出含万能牌的顺子时，原顺子照常结算，但关羽不能复制万能牌，只能复制其中的普通牌。\n- 连续两次武圣可以在一个轮次内迅速补齐同点数炸弹、飞机或其他特殊牌型。\n- 万能牌既能修结构，也能直接当作所需点数出牌，因此无需为“留万能牌”牺牲明确的当轮胜势。\n- 武圣的本质是定向复制而非回收，不能用传统“拿牌会破坏对方顺子”的思路评估。\n"}, {"name": "关银屏", "faction": "蜀", "skills": "花武", "position": "强制增牌、中高牌增殖与多炸成长", "status": "主要规则已实测", "landlord": 8.5, "farmer": 9.0, "identity": "农民略优。", "firstMove": "高，但不是纯正收益", "image": "技能截图/关银屏.png", "html": "<div class=\"hero-shot\"><img src=\"技能截图/关银屏.png\" alt=\"关银屏技能截图\" loading=\"lazy\"><\/div>\n<h3>技能<\/h3>\n<p><strong>花武｜被动｜限5次<\/strong><\/p>\n<blockquote>任意玩家打出张数不少于4张的牌型时，你从J、Q、K中随机获得1张牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8.5/10<\/td><td>先手可主动用多张牌型启动花武，但新增牌会持续抵消减手效率<\/td><\/tr>\n<tr><td>农民<\/td><td>9/10<\/td><td>队友能协助触发，新增J/Q/K兼具拦截、组对与重构价值<\/td><\/tr>\n<tr><td>稳定性<\/td><td>7.5/10<\/td><td>触发条件清晰，但奖励点数随机，且最多增加5张手牌<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9/10<\/td><td>核心在触发密度、新牌重组和停止增牌后的残局设计<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：农民略优。<\/strong><\/p>\n<p><strong>先手匹配度：高，但不是纯正收益。<\/strong> 地主可以首手打出顺子、连对、三带一或其他四张以上牌型，稳定触发第一张奖励；但每次补牌都会降低当手的实际减牌量，必须依靠连续重组才能兑现优势。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>任意玩家均可触发，包括关银屏自己、队友和对手。<\/li><li>触发条件只看该次合法牌型的总张数是否不少于4张，与具体牌型无关。<\/li><li>每次触发随机获得1张J、Q或K，最多触发5次。<\/li><li>花武属于强制发牌，满足条件便触发，不能主动放弃；即使关银屏只剩少量手牌也会增牌。<\/li><li>新增牌的具体点数向全场公开，技能窗口会显示已触发或剩余次数。<\/li><li>技能生成的J/Q/K没有特殊标记，与普通牌完全等价。<\/li><li>完整触发会额外获得5张牌，优势是中高点数集中，代价是总牌量明显增加。<\/li><li>J、Q、K彼此相邻，天然适合补顺子；重复点数则适合发展对子、三张与超量同点数炸弹。<\/li><li>花武本身不直接提供牌权，新增牌必须通过正常牌型打出。<\/li><\/ul>\n<h3>新增牌的结构优先级<\/h3>\n<ol><li>与原手牌同点数合成三张、炸弹或更长同点数炸弹。<\/li><li>补齐10-J-Q-K-A区间顺子，或延长已有顺子。<\/li><li>形成JQK区间连对、飞机组件或三带结构。<\/li><li>保留对K、对Q作为中后盘回手点。<\/li><li>无法并入组合的单J、单Q、单K尽早择机处理。<\/li><\/ol>\n<p>花武的判断核心不是获得了几张牌，而是新增牌最终让静态手数减少还是增加。<\/p>\n<h3>主流打法<\/h3>\n<h4>地主：长牌型启动，边打边重组<\/h4>\n<ul><li>首攻优先选择原本就要打出的长顺、连对或飞机，既建立减手优势，也完成首次触发。<\/li><li>首次获得J/Q/K后立即重算10到A区间，不宜固守开局拆牌方案。<\/li><li>已有J、Q、K对子或三张时，可主动提高四张以上牌型的出牌频率，争取向炸弹或连续结构成长。<\/li><li>奖励接近5次前，应提前规划最终新增牌的落点，避免满触发后留下多个中高单张。<\/li><li>有直接走完路线时不为追满5次而延长牌局。<\/li><\/ul>\n<p>地主的高效路线是：<\/p>\n<blockquote>首手长结构减牌 → 新增牌并入中高区 → 再用重构牌型批量输出 → 奖励耗尽后收尾。<\/blockquote>\n<h4>农民：队友协同重构<\/h4>\n<ul><li>队友自然拥有顺子、连对、三带或飞机时，可在不牺牲牌权的前提下帮助触发花武。<\/li><li>新增K/Q更适合保留拦截；新增J更偏向顺子、连对和带牌重组。<\/li><li>地主少牌时不能为了触发奖励放弃立即封锁，新增牌不会自动转化为牌权。<\/li><li>若关银屏手中已有J/Q/K密集结构，队友连续打出四张以上牌型可以快速将其推向炸弹或多组对子。<\/li><li>农民优势来自队友可控触发，不是盲目把5次奖励全部灌满。<\/li><\/ul>\n<h3>触发牌型价值<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>触发方式<\/th><th>评价<\/th><\/tr><\/thead><tbody>\n<tr><td>长顺、长连对、飞机<\/td><td>本身减牌量大，最能消化花武增牌<\/td><\/tr>\n<tr><td>三带一、三带二<\/td><td>触发成本低，适合主动启动<\/td><\/tr>\n<tr><td>四张及以上炸弹<\/td><td>控场与触发兼得，但不应仅为花武提前消耗<\/td><\/tr>\n<tr><td>队友自然多张牌型<\/td><td>农民最优触发来源，不占用自己的出牌机会<\/td><\/tr>\n<tr><td>为触发而强拆组合<\/td><td>通常收益低，容易使新增牌成为额外负担<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>起手J/Q/K与成炸进度<\/h3>\n<p>计算口径：每次花武独立、J/Q/K等概率各1/3；同点数达到4张即形成炸弹。结构按数量降序表示，例如3-2-1不区分具体点数。任一项起手已经达到4张的情况属于原生炸弹，不列入生成概率。<\/p>\n<p>“首炸期望进度”把5次内仍未成炸记为第6次，用于同时衡量速度和失败风险，数值越小越好。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>起手结构<\/th><th>第1次<\/th><th>第2次<\/th><th>第3次<\/th><th>第4次<\/th><th>第5次<\/th><th>首炸期望进度<\/th><th>第5次至少双炸<\/th><th>炸弹数期望<\/th><\/tr><\/thead><tbody>\n<tr><td>3-3-3<\/td><td>100%<\/td><td>100%<\/td><td>100%<\/td><td>100%<\/td><td>100%<\/td><td>1.00<\/td><td>98.77%<\/td><td>2.605<\/td><\/tr>\n<tr><td>3-3-2<\/td><td>66.67%<\/td><td>100%<\/td><td>100%<\/td><td>100%<\/td><td>100%<\/td><td>1.33<\/td><td>94.65%<\/td><td>2.276<\/td><\/tr>\n<tr><td>3-3-1<\/td><td>66.67%<\/td><td>88.89%<\/td><td>100%<\/td><td>100%<\/td><td>100%<\/td><td>1.44<\/td><td>86.42%<\/td><td>1.947<\/td><\/tr>\n<tr><td>3-3-0<\/td><td>66.67%<\/td><td>88.89%<\/td><td>96.30%<\/td><td>100%<\/td><td>100%<\/td><td>1.48<\/td><td>78.19%<\/td><td>1.782<\/td><\/tr>\n<tr><td>3-2-2<\/td><td>33.33%<\/td><td>77.78%<\/td><td>100%<\/td><td>100%<\/td><td>100%<\/td><td>1.89<\/td><td>82.30%<\/td><td>1.947<\/td><\/tr>\n<tr><td>3-2-1<\/td><td>33.33%<\/td><td>66.67%<\/td><td>88.89%<\/td><td>100%<\/td><td>100%<\/td><td>2.11<\/td><td>61.73%<\/td><td>1.617<\/td><\/tr>\n<tr><td>3-2-0<\/td><td>33.33%<\/td><td>66.67%<\/td><td>85.19%<\/td><td>95.06%<\/td><td>100%<\/td><td>2.20<\/td><td>45.27%<\/td><td>1.453<\/td><\/tr>\n<tr><td>3-1-1<\/td><td>33.33%<\/td><td>55.56%<\/td><td>77.78%<\/td><td>92.59%<\/td><td>100%<\/td><td>2.41<\/td><td>28.81%<\/td><td>1.288<\/td><\/tr>\n<tr><td>3-1-0<\/td><td>33.33%<\/td><td>55.56%<\/td><td>74.07%<\/td><td>87.65%<\/td><td>95.88%<\/td><td>2.53<\/td><td>16.46%<\/td><td>1.123<\/td><\/tr>\n<tr><td>3-0-0<\/td><td>33.33%<\/td><td>55.56%<\/td><td>70.37%<\/td><td>82.72%<\/td><td>91.77%<\/td><td>2.66<\/td><td>4.12%<\/td><td>0.959<\/td><\/tr>\n<tr><td>2-2-2<\/td><td>0%<\/td><td>33.33%<\/td><td>77.78%<\/td><td n<tr><td>3-2-1<\/td><td>0%<\/td><td>11.11%<\/td><td>32.10%<\/td><td>61.73%<\/td><\/tr>\n<tr><td>2-2-2<\/td><td>0%<\/td><td>0%<\/td><td>22.22%<\/td><td>61.73%<\/td><\/tr>\n<tr><td>3-2-0<\/td><td>0%<\/td><td>11.11%<\/td><td>27.16%<\/td><td>45.27%<\/td><\/tr>\n<tr><td>3-1-1<\/td><td>0%<\/td><td>0%<\/td><td>9.88%<\/td><td>28.81%<\/td><\/tr>\n<tr><td>2-2-1<\/td><td>0%<\/td><td>0%<\/td><td>7.41%<\/td><td>28.81%<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>叫地主与放弃追炸阈值<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>分级<\/th><th>起手结构<\/th><th>技能侧判断<\/th><\/tr><\/thead><tbody>\n<tr><td>S：强叫底子<\/td><td>3-3-3、3-3-2、3-3-1、3-3-0、3-2-2<\/td><td>第3次首炸率不低于96.30%，第4次必有首炸，5次双炸率78.19%至98.77%；仅从花武维度可视为接近无脑叫<\/td><\/tr>\n<tr><td>A：明显叫分优势<\/td><td>3-2-1、3-2-0、3-1-1、2-2-2<\/td><td>第3次首炸率77.78%至88.89%，完整触发必有首炸；仍需检查原手牌是否能稳定制造触发<\/td><\/tr>\n<tr><td>B：有条件叫<\/td><td>3-1-0、3-0-0、2-2-1、2-2-0<\/td><td>最终首炸率91.77%以上，但形成偏慢；王、2、原生炸或长牌型至少占一项优势再叫<\/td><\/tr>\n<tr><td>C：不围绕炸弹决策<\/td><td>2-1-1、2-1-0、2-0-0、1-1-1<\/td><td>前3次首炸率不超过33.33%，不要保护J/Q/K等炸；按顺子、对子和正常减手处理<\/td><\/tr>\n<tr><td>D：基本无成炸优势<\/td><td>1-1-0、1-0-0、0-0-0<\/td><td>完整5次首炸率低于50%，花武主要视为随机增牌与结构扰动<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>不存在只凭J/Q/K结构就绝对“无脑叫地主”的结论。S级代表技能本身已经提供极强叫分理由；最终仍要排除完全缺少王、2、牌权和四张以上触发牌型的极端烂牌。<\/p>\n<p><strong>最佳实战结构不是单纯总数最多，而是多组三张。<\/strong> 3-3-x既最快形成首炸，也最容易形成双炸；3-2-2虽然首炸稍慢，但第五次双炸率仍有82.30%。2-2-2总数同样为6张，却要到第2次才可能成炸，爆发明显晚于3-2-1和3-2-0。<\/p>\n<h3>关键风险<\/h3>\n<ul><li>连续触发会不断增加手牌，四张牌型实际只净减少3张。<\/li><li>随机结果若分散为J、Q、K单张，可能增加静态手数。<\/li><li>对手也能强制触发花武，可在关银屏临近收尾时用多张牌型向其塞牌。<\/li><li>新增中高牌容易与原有顺子、对子方案发生竞争，必须持续重算。<\/li><li>追求5次满收益可能延误直接获胜窗口。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>J、Q、K的随机权重是否严格相等；当前概率表按各1/3计算。<\/li><\/ul>", "search": "  关银屏\n\n 关银屏技能截图 技能截图/关银屏.png \n\n  技能\n\n 花武｜被动｜限5次 \n\n  任意玩家打出张数不少于4张的牌型时，你从j、q、k中随机获得1张牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8.5/10   先手可主动用多张牌型启动花武，但新增牌会持续抵消减手效率  \n  农民   9/10   队友能协助触发，新增j/q/k兼具拦截、组对与重构价值  \n  稳定性   7.5/10   触发条件清晰，但奖励点数随机，且最多增加5张手牌  \n  操作上限   9/10   核心在触发密度、新牌重组和停止增牌后的残局设计  \n\n 身份倾向：农民略优。 \n\n 先手匹配度：高，但不是纯正收益。  地主可以首手打出顺子、连对、三带一或其他四张以上牌型，稳定触发第一张奖励；但每次补牌都会降低当手的实际减牌量，必须依靠连续重组才能兑现优势。\n\n  核心机制\n\n- 任意玩家均可触发，包括关银屏自己、队友和对手。\n- 触发条件只看该次合法牌型的总张数是否不少于4张，与具体牌型无关。\n- 每次触发随机获得1张j、q或k，最多触发5次。\n- 花武属于强制发牌，满足条件便触发，不能主动放弃；即使关银屏只剩少量手牌也会增牌。\n- 新增牌的具体点数向全场公开，技能窗口会显示已触发或剩余次数。\n- 技能生成的j/q/k没有特殊标记，与普通牌完全等价。\n- 完整触发会额外获得5张牌，优势是中高点数集中，代价是总牌量明显增加。\n- j、q、k彼此相邻，天然适合补顺子；重复点数则适合发展对子、三张与超量同点数炸弹。\n- 花武本身不直接提供牌权，新增牌必须通过正常牌型打出。\n\n  新增牌的结构优先级\n\n1. 与原手牌同点数合成三张、炸弹或更长同点数炸弹。\n2. 补齐10-j-q-k-a区间顺子，或延长已有顺子。\n3. 形成jqk区间连对、飞机组件或三带结构。\n4. 保留对k、对q作为中后盘回手点。\n5. 无法并入组合的单j、单q、单k尽早择机处理。\n\n花武的判断核心不是获得了几张牌，而是新增牌最终让静态手数减少还是增加。\n\n  主流打法\n\n  地主：长牌型启动，边打边重组\n\n- 首攻优先选择原本就要打出的长顺、连对或飞机，既建立减手优势，也完成首次触发。\n- 首次获得j/q/k后立即重算10到a区间，不宜固守开局拆牌方案。\n- 已有j、q、k对子或三张时，可主动提高四张以上牌型的出牌频率，争取向炸弹或连续结构成长。\n- 奖励接近5次前，应提前规划最终新增牌的落点，避免满触发后留下多个中高单张。\n- 有直接走完路线时不为追满5次而延长牌局。\n\n地主的高效路线是：\n\n  首手长结构减牌 → 新增牌并入中高区 → 再用重构牌型批量输出 → 奖励耗尽后收尾。\n\n  农民：队友协同重构\n\n- 队友自然拥有顺子、连对、三带或飞机时，可在不牺牲牌权的前提下帮助触发花武。\n- 新增k/q更适合保留拦截；新增j更偏向顺子、连对和带牌重组。\n- 地主少牌时不能为了触发奖励放弃立即封锁，新增牌不会自动转化为牌权。\n- 若关银屏手中已有j/q/k密集结构，队友连续打出四张以上牌型可以快速将其推向炸弹或多组对子。\n- 农民优势来自队友可控触发，不是盲目把5次奖励全部灌满。\n\n  触发牌型价值\n\n  触发方式   评价  \n --- --- \n  长顺、长连对、飞机   本身减牌量大，最能消化花武增牌  \n  三带一、三带二   触发成本低，适合主动启动  \n  四张及以上炸弹   控场与触发兼得，但不应仅为花武提前消耗  \n  队友自然多张牌型   农民最优触发来源，不占用自己的出牌机会  \n  为触发而强拆组合   通常收益低，容易使新增牌成为额外负担  \n\n  起手j/q/k与成炸进度\n\n计算口径：每次花武独立、j/q/k等概率各1/3；同点数达到4张即形成炸弹。结构按数量降序表示，例如3-2-1不区分具体点数。任一项起手已经达到4张的情况属于原生炸弹，不列入生成概率。\n\n“首炸期望进度”把5次内仍未成炸记为第6次，用于同时衡量速度和失败风险，数值越小越好。\n\n  起手结构   第1次   第2次   第3次   第4次   第5次   首炸期望进度   第5次至少双炸   炸弹数期望  \n :---: ---: ---: ---: ---: ---: ---: ---: ---: \n  3-3-3   100%   100%   100%   100%   100%   1.00   98.77%   2.605  \n  3-3-2   66.67%   100%   100%   100%   100%   1.33   94.65%   2.276  \n  3-3-1   66.67%   88.89%   100%   100%   100%   1.44   86.42%   1.947  \n  3-3-0   66.67%   88.89%   96.30%   100%   100%   1.48   78.19%   1.782  \n  3-2-2   33.33%   77.78%   100%   100%   100%   1.89   82.30%   1.947  \n  3-2-1   33.33 顺子、对子和正常减手处理  \n  d：基本无成炸优势   1-1-0、1-0-0、0-0-0   完整5次首炸率低于50%，花武主要视为随机增牌与结构扰动  \n\n不存在只凭j/q/k结构就绝对“无脑叫地主”的结论。s级代表技能本身已经提供极强叫分理由；最终仍要排除完全缺少王、2、牌权和四张以上触发牌型的极端烂牌。\n\n 最佳实战结构不是单纯总数最多，而是多组三张。  3-3-x既最快形成首炸，也最容易形成双炸；3-2-2虽然首炸稍慢，但第五次双炸率仍有82.30%。2-2-2总数同样为6张，却要到第2次才可能成炸，爆发明显晚于3-2-1和3-2-0。\n\n  关键风险\n\n- 连续触发会不断增加手牌，四张牌型实际只净减少3张。\n- 随机结果若分散为j、q、k单张，可能增加静态手数。\n- 对手也能强制触发花武，可在关银屏临近收尾时用多张牌型向其塞牌。\n- 新增中高牌容易与原有顺子、对子方案发生竞争，必须持续重算。\n- 追求5次满收益可能延误直接获胜窗口。\n\n  待实测\n\n- j、q、k的随机权重是否严格相等；当前概率表按各1/3计算。\n"}, {"name": "典韦", "faction": "魏", "skills": "不屈、血战", "position": "连续出牌叠层、对子与万能牌成长", "status": "主要规则已实测", "landlord": 9.5, "farmer": 7.5, "identity": "强地主型。", "firstMove": "极高", "image": "技能截图/典韦-1.png", "html": "<div class=\"hero-shot\"><img src=\"技能截图/典韦-1.png\" alt=\"典韦技能截图1\" loading=\"lazy\"><\/div>\n<div class=\"hero-shot\"><img src=\"技能截图/典韦-2.png\" alt=\"典韦技能截图2\" loading=\"lazy\"><\/div>\n<div class=\"hero-shot\"><img src=\"技能截图/典韦-3.png\" alt=\"典韦技能截图3\" loading=\"lazy\"><\/div>\n<h3>技能<\/h3>\n<p><strong>不屈｜被动｜不限次数<\/strong><\/p>\n<blockquote>你出牌后，增加1层“不屈”标记，最多积累4层。不出时层数清零；手牌不多于3张时不增加层数。<\/blockquote>\n<p><strong>血战｜被动｜不限次数<\/strong><\/p>\n<blockquote>增加“不屈”标记后，根据层数获得效果：<br>- 2层：手中除大小王外最大的单牌补充至对子；<br>- 3层：获得1张2；<br>- 4层：获得1张万能牌。<br>以此法获得2次万能牌后，“不屈”失效。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9.5/10<\/td><td>先手启动四连出牌，主动掌控叠层节奏，适配度极高<\/td><\/tr>\n<tr><td>农民<\/td><td>7.5/10<\/td><td>需要持续跟牌或取得牌权，叠层容易被地主打断<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8/10<\/td><td>奖励固定，满层不会自行清零，但连续叠层仍受牌权限制<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>首轮顺序、2层复制目标和主动争取第二轮决定上限<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：强地主型。<\/strong><\/p>\n<p><strong>先手匹配度：极高。<\/strong> 地主可以主动打出第一手并连续维持牌权，是最容易完成四层循环的身份。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>连续实际出牌是资源；牌权被其他玩家抢走本身不会使不屈清零。<\/li><li>轮到典韦压牌时，只有实际选择“不出”才会清零；若继续用更大牌反压，原层数保留并继续累积。<\/li><li>每轮从0层完整升至4层时依次获得：复制最大单牌成对、获得2、获得万能牌。<\/li><li>奖励会增加手牌，但牌质快速上升，重点是把新增牌压成对子、炸弹和特殊牌型。<\/li><li>达到4层并获得万能牌后会维持4层；继续出牌不会再次触发4层奖励。<\/li><li>清零后可以重新从1层叠起，第二次升至4层时取得第二张万能牌。<\/li><li>获得两次万能牌后不屈永久失效，完整上限为两轮四层循环。<\/li><li>手牌不多于3张时停止加层，不能利用技能无限拖延最后残局。<\/li><li>2层时若手中不存在符合条件的单牌，奖励直接跳过，不补偿其他牌。<\/li><li>技能新增的2和万能牌均公开。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：双循环成长型<\/h4>\n<h5>第一轮：先手四连<\/h5>\n<ol><li>首攻选择不易被压、且不会破坏后续应牌能力的完整组合。<\/li><li>第2层到来前，尽量让最有价值的高牌保持“单牌”状态。<\/li><li>第2层优先复制单2，其次A、K，直接形成高对。<\/li><li>第3层固定获得2，继续向多张2或炸弹结构发展。<\/li><li>第4层取得万能牌，立即重算尾牌。<\/li><\/ol>\n<h5>第二轮：重置再冲四层<\/h5>\n<p>达到4层并取得第一张万能牌后，继续出牌只会维持4层，不会重复获得万能牌。第二轮必须在典韦实际选择一次“不出”、层数清零后，再从1层重新叠至4层。<\/p>\n<p>不应为了清层主动放弃本可继续反压或直接走完的机会。只有确实需要不出且本局仍有足够回合时，才规划第二轮；能够直接获胜时立即结束。<\/p>\n<h4>农民：接力续层型<\/h4>\n<ul><li>队友取得牌权本身不会清层；但应避免用典韦无法继续反压的牌型迫使其不出。<\/li><li>第一目标通常是完成2层或3层，不强求每局两次四层。<\/li><li>地主即将走完时，保住出牌连续性比保留普通组合更重要。<\/li><li>一旦层数清零，应重新评估是否还有时间再启动，不宜沉没成本式强追。<\/li><\/ul>\n<h3>2层复制目标<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>最大单牌<\/th><th>结果<\/th><th>评价<\/th><\/tr><\/thead><tbody>\n<tr><td>2<\/td><td>补成对2<\/td><td>最优常规目标，回手稳定<\/td><\/tr>\n<tr><td>A<\/td><td>补成对A<\/td><td>高质量争权牌<\/td><\/tr>\n<tr><td>K/Q/J<\/td><td>补成高对<\/td><td>可继续争权或并入连对<\/td><\/tr>\n<tr><td>中低牌<\/td><td>补成普通对子<\/td><td>主要价值是减少孤张<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>为了让2层复制到理想牌，不应在首手提前打掉目标单牌，也要避免目标在2层前因其他组合变成非单牌状态。<\/p>\n<p>不存在“最大单牌并列”的实际判定问题：同点数两张牌已经构成对子，不属于单牌；剩余单牌按点数自然确定最高者。<\/p>\n<h3>万能牌路线<\/h3>\n<ul><li>第一张万能牌优先修复新增奖励造成的散牌，或补成长炸弹、飞机、连对。<\/li><li>第二张万能牌通常服务于直接收尾或构成高强度特殊牌型。<\/li><li>两张万能牌是技能上限，不应只当普通大牌使用。<\/li><\/ul>\n<h3>主要风险<\/h3>\n<ul><li>对手用典韦无法跟进的牌型逼其不出，可直接清空层数。<\/li><li>为维持层数强行拆炸弹、顺子或飞机，可能得不偿失。<\/li><li>2/3/4层连续增牌，若不能立即成型，会拖慢手数。<\/li><li>满4层后若始终保持牌权，只能维持当前状态，无法重复刷取万能牌。<\/li><li>为了开启第二轮故意选择不出，可能失去整局主动权，通常不值得。<\/li><li>手牌降到3张后不再叠层，接近残局才启动通常来不及。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>万能牌单独处于手牌时，是否会被2层“最大单牌补充至对子”选中，及其复制后的点数判定。<\/li><\/ul>\n<h3>已确认的清零规则<\/h3>\n<ul><li>牌权变化不是清零条件，其他玩家压过典韦后，不屈层数仍然保留。<\/li><li>典韦当轮用更大牌继续反压时，层数正常延续。<\/li><li>只有典韦实际选择“不出”时，不屈层数才清零。<\/li><\/ul>", "search": "  典韦\n\n 典韦技能截图1 技能截图/典韦-1.png \n 典韦技能截图2 技能截图/典韦-2.png \n 典韦技能截图3 技能截图/典韦-3.png \n\n  技能\n\n 不屈｜被动｜不限次数 \n\n  你出牌后，增加1层“不屈”标记，最多积累4层。不出时层数清零；手牌不多于3张时不增加层数。\n\n 血战｜被动｜不限次数 \n\n  增加“不屈”标记后，根据层数获得效果：\n \n  - 2层：手中除大小王外最大的单牌补充至对子；\n  - 3层：获得1张2；\n  - 4层：获得1张万能牌。\n \n  以此法获得2次万能牌后，“不屈”失效。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9.5/10   先手启动四连出牌，主动掌控叠层节奏，适配度极高  \n  农民   7.5/10   需要持续跟牌或取得牌权，叠层容易被地主打断  \n  稳定性   8/10   奖励固定，满层不会自行清零，但连续叠层仍受牌权限制  \n  操作上限   9.5/10   首轮顺序、2层复制目标和主动争取第二轮决定上限  \n\n 身份倾向：强地主型。 \n\n 先手匹配度：极高。  地主可以主动打出第一手并连续维持牌权，是最容易完成四层循环的身份。\n\n  核心机制\n\n- 连续实际出牌是资源；牌权被其他玩家抢走本身不会使不屈清零。\n- 轮到典韦压牌时，只有实际选择“不出”才会清零；若继续用更大牌反压，原层数保留并继续累积。\n- 每轮从0层完整升至4层时依次获得：复制最大单牌成对、获得2、获得万能牌。\n- 奖励会增加手牌，但牌质快速上升，重点是把新增牌压成对子、炸弹和特殊牌型。\n- 达到4层并获得万能牌后会维持4层；继续出牌不会再次触发4层奖励。\n- 清零后可以重新从1层叠起，第二次升至4层时取得第二张万能牌。\n- 获得两次万能牌后不屈永久失效，完整上限为两轮四层循环。\n- 手牌不多于3张时停止加层，不能利用技能无限拖延最后残局。\n- 2层时若手中不存在符合条件的单牌，奖励直接跳过，不补偿其他牌。\n- 技能新增的2和万能牌均公开。\n\n  主流打法\n\n  地主：双循环成长型\n\n  第一轮：先手四连\n\n1. 首攻选择不易被压、且不会破坏后续应牌能力的完整组合。\n2. 第2层到来前，尽量让最有价值的高牌保持“单牌”状态。\n3. 第2层优先复制单2，其次a、k，直接形成高对。\n4. 第3层固定获得2，继续向多张2或炸弹结构发展。\n5. 第4层取得万能牌，立即重算尾牌。\n\n  第二轮：重置再冲四层\n\n达到4层并取得第一张万能牌后，继续出牌只会维持4层，不会重复获得万能牌。第二轮必须在典韦实际选择一次“不出”、层数清零后，再从1层重新叠至4层。\n\n不应为了清层主动放弃本可继续反压或直接走完的机会。只有确实需要不出且本局仍有足够回合时，才规划第二轮；能够直接获胜时立即结束。\n\n  农民：接力续层型\n\n- 队友取得牌权本身不会清层；但应避免用典韦无法继续反压的牌型迫使其不出。\n- 第一目标通常是完成2层或3层，不强求每局两次四层。\n- 地主即将走完时，保住出牌连续性比保留普通组合更重要。\n- 一旦层数清零，应重新评估是否还有时间再启动，不宜沉没成本式强追。\n\n  2层复制目标\n\n  最大单牌   结果   评价  \n --- --- --- \n  2   补成对2   最优常规目标，回手稳定  \n  a   补成对a   高质量争权牌  \n  k/q/j   补成高对   可继续争权或并入连对  \n  中低牌   补成普通对子   主要价值是减少孤张  \n\n为了让2层复制到理想牌，不应在首手提前打掉目标单牌，也要避免目标在2层前因其他组合变成非单牌状态。\n\n不存在“最大单牌并列”的实际判定问题：同点数两张牌已经构成对子，不属于单牌；剩余单牌按点数自然确定最高者。\n\n  万能牌路线\n\n- 第一张万能牌优先修复新增奖励造成的散牌，或补成长炸弹、飞机、连对。\n- 第二张万能牌通常服务于直接收尾或构成高强度特殊牌型。\n- 两张万能牌是技能上限，不应只当普通大牌使用。\n\n  主要风险\n\n- 对手用典韦无法跟进的牌型逼其不出，可直接清空层数。\n- 为维持层数强行拆炸弹、顺子或飞机，可能得不偿失。\n- 2/3/4层连续增牌，若不能立即成型，会拖慢手数。\n- 满4层后若始终保持牌权，只能维持当前状态，无法重复刷取万能牌。\n- 为了开启第二轮故意选择不出，可能失去整局主动权，通常不值得。\n- 手牌降到3张后不再叠层，接近残局才启动通常来不及。\n\n  待实测\n\n- 万能牌单独处于手牌时，是否会被2层“最大单牌补充至对子”选中，及其复制后的点数判定。\n\n  已确认的清零规则\n\n- 牌权变化不是清零条件，其他玩家压过典韦后，不屈层数仍然保留。\n- 典韦当轮用更大牌继续反压时，层数正常延续。\n- 只有典韦实际选择“不出”时，不屈层数才清零。\n"}, {"name": "刘禅", "faction": "蜀", "skills": "决政、放权", "position": "开局送牌、弃高减牌与队友牌权转移", "status": "主要规则已实测", "landlord": 5.5, "farmer": 10.0, "identity": "极强农民型。", "firstMove": "农民极高、地主负向", "image": "", "html": "<h3>技能<\/h3>\n<p><strong>决政｜主动响应｜限1次<\/strong><\/p>\n<blockquote>开局时，你可以将至多2张牌交给一名其他玩家。<\/blockquote>\n<p><strong>放权｜主动｜限1次<\/strong><\/p>\n<blockquote>若你有牌权，可以弃置最大的2张牌，将牌权转移给一名其他玩家。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>5.5/10<\/td><td>两项技能都把资源或牌权交给对手，与地主单人获胜目标冲突<\/td><\/tr>\n<tr><td>农民<\/td><td>10/10<\/td><td>开局定向送牌、主动弃两张并把牌权交给队友，协作能力极强<\/td><\/tr>\n<tr><td>稳定性<\/td><td>9.5/10<\/td><td>两项技能均可自主选择目标，农民方几乎总有明确收益<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>可补队友炸弹、长牌和残局，并完成精确牌权交接<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：极强农民型。<\/strong> 技能设计直接服务于双人协作；地主使用时只能把牌或牌权交给农民，通常是明显负收益。<\/p>\n<p><strong>先手匹配度：农民极高、地主负向。<\/strong> 农民拿到牌权后可弃掉两张最高牌并让队友直接首攻；地主的先手反而会被放权主动送走。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>决政在开局阶段发动，可选择0至2张手牌，一次性交给同一名其他玩家。<\/li><li>决政交出的牌及其点数全场公开；实战中刘禅手里通常不会出现万能牌，因此不单列万能牌交付规则。<\/li><li>农民通常把牌交给队友，用于补炸弹、三张、对子、顺子或关键控制牌。<\/li><li>放权只要求刘禅当前拥有牌权，任何取得牌权的时点均可发动，包括以炸弹取得牌权后。<\/li><li>发动后公开弃置手中点数最大的2张牌；若只剩1张，则弃置该牌。最高点数有多张时不区分花色，只按点数处理。<\/li><li>弃掉的牌进入弃牌区，并不会交给被指定的玩家；技能转移的只有牌权。<\/li><li>被指定的玩家获得牌权后，立即开始新一轮主动出牌。<\/li><li>刘禅只剩1张或2张牌时仍可发动放权，弃完手牌后立即按走完结算胜利。<\/li><li>放权同时完成快速减牌与队友接管出牌，是强力的残局终结和节奏技能。<\/li><li>两项技能各限1次，应围绕同一名核心队友设计完整协作路线。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>农民：资源集中型<\/h4>\n<ul><li>开局判断哪名农民的结构更接近走完，把决政的牌交给核心出牌者。<\/li><li>送牌优先补炸弹，其次补三张、长牌缺口或稳定回手。<\/li><li>刘禅自己保留容易处理的结构，难以融入自身手牌的牌优先送出。<\/li><li>获得牌权后，在队友具备连续走牌能力时发动放权，自己弃两张并让队友直接接管。<\/li><li>地主即将走完时不要机械放权，先确认队友有可靠拦截或终结路线。<\/li><\/ul>\n<h4>地主：原则上不依赖技能<\/h4>\n<ul><li>决政与放权都会直接帮助对手，通常不发动。<\/li><li>只有存在特殊武将联动、必须清除两张最高牌才能立即改变胜负时才考虑放权。<\/li><li>地主叫分主要依据原始牌力，不能把刘禅技能视为正向补强。<\/li><\/ul>\n<h3>决政送牌优先级<\/h3>\n<ol><li>交给队友后直接形成炸弹或立即走完。<\/li><li>补齐飞机、连对、顺子等大幅减少手数的结构。<\/li><li>补成三张、对子或稳定回手。<\/li><li>转移自己无法处理的孤张。<\/li><li>无法改善队友结构时少送或不送。<\/li><\/ol>\n<h3>关键风险<\/h3>\n<ul><li>送牌会增加队友手牌，判断错误可能同时拖慢两名农民。<\/li><li>放权固定弃置最大两张，可能损失王、2等关键拦截牌。<\/li><li>队友牌型不适合接管时转移牌权，可能直接把节奏送还地主。<\/li><li>地主身份下两项技能通常不具备常规正收益。<\/li><\/ul>", "search": "  刘禅\n\n  技能\n\n 决政｜主动响应｜限1次 \n\n  开局时，你可以将至多2张牌交给一名其他玩家。\n\n 放权｜主动｜限1次 \n\n  若你有牌权，可以弃置最大的2张牌，将牌权转移给一名其他玩家。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   5.5/10   两项技能都把资源或牌权交给对手，与地主单人获胜目标冲突  \n  农民   10/10   开局定向送牌、主动弃两张并把牌权交给队友，协作能力极强  \n  稳定性   9.5/10   两项技能均可自主选择目标，农民方几乎总有明确收益  \n  操作上限   9.5/10   可补队友炸弹、长牌和残局，并完成精确牌权交接  \n\n 身份倾向：极强农民型。  技能设计直接服务于双人协作；地主使用时只能把牌或牌权交给农民，通常是明显负收益。\n\n 先手匹配度：农民极高、地主负向。  农民拿到牌权后可弃掉两张最高牌并让队友直接首攻；地主的先手反而会被放权主动送走。\n\n  核心机制\n\n- 决政在开局阶段发动，可选择0至2张手牌，一次性交给同一名其他玩家。\n- 决政交出的牌及其点数全场公开；实战中刘禅手里通常不会出现万能牌，因此不单列万能牌交付规则。\n- 农民通常把牌交给队友，用于补炸弹、三张、对子、顺子或关键控制牌。\n- 放权只要求刘禅当前拥有牌权，任何取得牌权的时点均可发动，包括以炸弹取得牌权后。\n- 发动后公开弃置手中点数最大的2张牌；若只剩1张，则弃置该牌。最高点数有多张时不区分花色，只按点数处理。\n- 弃掉的牌进入弃牌区，并不会交给被指定的玩家；技能转移的只有牌权。\n- 被指定的玩家获得牌权后，立即开始新一轮主动出牌。\n- 刘禅只剩1张或2张牌时仍可发动放权，弃完手牌后立即按走完结算胜利。\n- 放权同时完成快速减牌与队友接管出牌，是强力的残局终结和节奏技能。\n- 两项技能各限1次，应围绕同一名核心队友设计完整协作路线。\n\n  主流打法\n\n  农民：资源集中型\n\n- 开局判断哪名农民的结构更接近走完，把决政的牌交给核心出牌者。\n- 送牌优先补炸弹，其次补三张、长牌缺口或稳定回手。\n- 刘禅自己保留容易处理的结构，难以融入自身手牌的牌优先送出。\n- 获得牌权后，在队友具备连续走牌能力时发动放权，自己弃两张并让队友直接接管。\n- 地主即将走完时不要机械放权，先确认队友有可靠拦截或终结路线。\n\n  地主：原则上不依赖技能\n\n- 决政与放权都会直接帮助对手，通常不发动。\n- 只有存在特殊武将联动、必须清除两张最高牌才能立即改变胜负时才考虑放权。\n- 地主叫分主要依据原始牌力，不能把刘禅技能视为正向补强。\n\n  决政送牌优先级\n\n1. 交给队友后直接形成炸弹或立即走完。\n2. 补齐飞机、连对、顺子等大幅减少手数的结构。\n3. 补成三张、对子或稳定回手。\n4. 转移自己无法处理的孤张。\n5. 无法改善队友结构时少送或不送。\n\n  关键风险\n\n- 送牌会增加队友手牌，判断错误可能同时拖慢两名农民。\n- 放权固定弃置最大两张，可能损失王、2等关键拦截牌。\n- 队友牌型不适合接管时转移牌权，可能直接把节奏送还地主。\n- 地主身份下两项技能通常不具备常规正收益。\n\n"}, {"name": "吕布", "faction": "群", "skills": "无双、霸关", "position": "受压蓄怒、中高牌回收与低牌强制推进", "status": "初步分析", "landlord": 8.5, "farmer": 9.0, "identity": "农民略优。", "firstMove": "中等", "image": "", "html": "<h3>技能<\/h3>\n<p><strong>无双｜被动｜限1次<\/strong><\/p>\n<blockquote>你出牌被压或跳过压牌后，积攒1点怒气。怒气达到6点时，立即获得全场已出过的【J】【Q】【K】牌。（五人场至多随机获得6张已出的J、Q、K）<\/blockquote>\n<p><strong>霸关｜主动｜限1次<\/strong><\/p>\n<blockquote>若你有牌权，可以消耗全部怒气，让自己打出的下一手牌只能被带【J】【Q】【K】的牌压制。（你出的这手牌点数必须全部≤【10】）<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8.5/10<\/td><td>先手可规划霸关，但无双需要多次失去或放弃压牌机会，启动速度偏慢<\/td><\/tr>\n<tr><td>农民<\/td><td>9/10<\/td><td>更容易在地主连续出牌时跳过压牌积怒，并利用队友共同消耗场上的J/Q/K牌池<\/td><\/tr>\n<tr><td>稳定性<\/td><td>7/10<\/td><td>六点怒气门槛较高，最终收益取决于触发时全场已经打出多少J、Q、K<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9/10<\/td><td>可在“继续攒怒拿牌”和“提前消耗怒气发动霸关”之间选择不同胜负路线<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：农民略优。<\/strong> 农民面对地主的主动出牌时更容易反复选择跳过并积攒怒气，且队友打出的J/Q/K也能扩大无双牌池；地主则更容易依靠初始牌权兑现霸关。<\/p>\n<p><strong>先手匹配度：中等。<\/strong> 地主第一手拥有牌权，但开局通常没有怒气；霸关虽可围绕先手使用，具体是否允许零怒气发动仍待实测。无双则明确需要牌局推进后才能兑现。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>吕布自己打出的牌被压制后，获得1点怒气。<\/li><li>轮到吕布压牌而选择跳过时，也获得1点怒气。<\/li><li>怒气累计到6点，无双立即触发，获得全场此前已经打出的所有J、Q、K。<\/li><li>三人场技能文本未设置6张上限；五人场则至多从符合条件的已出牌中随机获得6张。<\/li><li>霸关要求吕布当前拥有牌权，并消耗当时的全部怒气。<\/li><li>霸关强化的是吕布“下一手”出牌，且该手中所有牌的点数都必须不高于10。<\/li><li>强化后的牌只能被带有J、Q或K的合法牌型压制；单纯点数更高但不含J/Q/K的牌不能压制。<\/li><li>无双和霸关都会围绕同一怒气资源展开：等待6点可获得大量中高牌，提前发动霸关则用怒气换取一次低牌强行推进。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>农民：跳过蓄怒，回收中高牌<\/h4>\n<ul><li>地主出牌不构成立即威胁时，可主动跳过压牌稳定积怒。<\/li><li>队友在吕布到6怒前，可以优先打出手中不影响自身结构的J/Q/K，为无双扩大收益池。<\/li><li>接近6怒时关注全场已出J/Q/K数量；牌池不足时可以暂缓不必要的第六次触发窗口。<\/li><li>获得J/Q/K后优先重组对子、三张、炸弹、连对和高位顺子，避免把增牌变成大量孤张。<\/li><li>地主即将走完时不能为了积怒放弃必要拦截，六怒收益来不及兑现时没有价值。<\/li><\/ul>\n<h4>地主：低牌霸关或后程无双<\/h4>\n<ul><li>起手若有一手难处理的≤10低牌，可围绕霸关保留牌权，制造更高的压制门槛。<\/li><li>霸关适合保护长顺、连对、飞机带牌或残局最后一手低牌，而不是普通单张试探。<\/li><li>若牌局节奏允许吕布被压或跳过累计至6怒，可转为无双回收路线。<\/li><li>无双会使手牌数量突然增加，必须确保回收的J/Q/K能够合并结构，而非只追求牌数收益。<\/li><\/ul>\n<h3>怒气使用判断<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>局面<\/th><th>建议<\/th><\/tr><\/thead><tbody>\n<tr><td>已接近6怒且场上J/Q/K较多<\/td><td>优先等待无双触发<\/td><\/tr>\n<tr><td>怒气不高但有一手关键低牌必须通过<\/td><td>考虑霸关换取强制推进<\/td><\/tr>\n<tr><td>霸关后可直接走完<\/td><td>霸关优先级最高<\/td><\/tr>\n<tr><td>场上J/Q/K很少<\/td><td>无双收益不足，不必机械攒满<\/td><\/tr>\n<tr><td>对手只剩少量牌<\/td><td>以即时封锁为主，不为怒气让牌<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>关键风险<\/h3>\n<ul><li>无双获得的是已打出的牌，会突然增加手牌数量；无法组成结构时可能反而拖慢走牌。<\/li><li>六次被压或跳过意味着多次失去牌权，若没有队友支撑，可能在技能触发前结束牌局。<\/li><li>霸关会消耗全部怒气，可能放弃即将到手的无双大量补牌。<\/li><li>霸关只提高压制条件，并不保证绝对无法被压；对手仍可用包含J/Q/K的合法牌型应对。<\/li><li>霸关要求本手所有点数≤10，不能夹带J以上牌，也不能把普通高牌一并保护。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>无双“限1次”是指六怒补牌只触发一次，还是整套怒气机制触发后停止累计。<\/li><li>吕布客观无牌可压时系统自动跳过，是否同样积攒怒气。<\/li><li>吕布有牌可压但选择不出，以及被队友压制，是否均正常积怒。<\/li><li>一手牌连续被多人压制时，只按首次失去牌权积1怒，还是每次覆盖都计算。<\/li><li>无双获得的J/Q/K具体牌面及数量是否全场公开，原弃牌区牌是否被实体拿走。<\/li><li>达到6怒时若全场尚未打出J/Q/K，技能是否消耗且不获得牌。<\/li><li>霸关能否在0点怒气时发动；若能，“消耗全部怒气”是否可视为消耗0点。<\/li><li>霸关的“带J/Q/K”是要求压制牌型实际包含任意一张，还是只要求牌型最大点数属于J/Q/K。<\/li><li>炸弹或王炸若不含J/Q/K，能否无视霸关直接压制。<\/li><li>霸关能否用于含万能牌的≤10牌型，以及万能牌声明点数如何判定。<\/li><li>霸关强化的出牌及其保护状态是否全场公开。<\/li><li>吕布打出最后一手≤10牌时，是否直接胜利而无需等待霸关的压制窗口。<\/li><\/ul>", "search": "  吕布\n\n  技能\n\n 无双｜被动｜限1次 \n\n  你出牌被压或跳过压牌后，积攒1点怒气。怒气达到6点时，立即获得全场已出过的【j】【q】【k】牌。（五人场至多随机获得6张已出的j、q、k）\n\n 霸关｜主动｜限1次 \n\n  若你有牌权，可以消耗全部怒气，让自己打出的下一手牌只能被带【j】【q】【k】的牌压制。（你出的这手牌点数必须全部≤【10】）\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8.5/10   先手可规划霸关，但无双需要多次失去或放弃压牌机会，启动速度偏慢  \n  农民   9/10   更容易在地主连续出牌时跳过压牌积怒，并利用队友共同消耗场上的j/q/k牌池  \n  稳定性   7/10   六点怒气门槛较高，最终收益取决于触发时全场已经打出多少j、q、k  \n  操作上限   9/10   可在“继续攒怒拿牌”和“提前消耗怒气发动霸关”之间选择不同胜负路线  \n\n 身份倾向：农民略优。  农民面对地主的主动出牌时更容易反复选择跳过并积攒怒气，且队友打出的j/q/k也能扩大无双牌池；地主则更容易依靠初始牌权兑现霸关。\n\n 先手匹配度：中等。  地主第一手拥有牌权，但开局通常没有怒气；霸关虽可围绕先手使用，具体是否允许零怒气发动仍待实测。无双则明确需要牌局推进后才能兑现。\n\n  核心机制\n\n- 吕布自己打出的牌被压制后，获得1点怒气。\n- 轮到吕布压牌而选择跳过时，也获得1点怒气。\n- 怒气累计到6点，无双立即触发，获得全场此前已经打出的所有j、q、k。\n- 三人场技能文本未设置6张上限；五人场则至多从符合条件的已出牌中随机获得6张。\n- 霸关要求吕布当前拥有牌权，并消耗当时的全部怒气。\n- 霸关强化的是吕布“下一手”出牌，且该手中所有牌的点数都必须不高于10。\n- 强化后的牌只能被带有j、q或k的合法牌型压制；单纯点数更高但不含j/q/k的牌不能压制。\n- 无双和霸关都会围绕同一怒气资源展开：等待6点可获得大量中高牌，提前发动霸关则用怒气换取一次低牌强行推进。\n\n  主流打法\n\n  农民：跳过蓄怒，回收中高牌\n\n- 地主出牌不构成立即威胁时，可主动跳过压牌稳定积怒。\n- 队友在吕布到6怒前，可以优先打出手中不影响自身结构的j/q/k，为无双扩大收益池。\n- 接近6怒时关注全场已出j/q/k数量；牌池不足时可以暂缓不必要的第六次触发窗口。\n- 获得j/q/k后优先重组对子、三张、炸弹、连对和高位顺子，避免把增牌变成大量孤张。\n- 地主即将走完时不能为了积怒放弃必要拦截，六怒收益来不及兑现时没有价值。\n\n  地主：低牌霸关或后程无双\n\n- 起手若有一手难处理的≤10低牌，可围绕霸关保留牌权，制造更高的压制门槛。\n- 霸关适合保护长顺、连对、飞机带牌或残局最后一手低牌，而不是普通单张试探。\n- 若牌局节奏允许吕布被压或跳过累计至6怒，可转为无双回收路线。\n- 无双会使手牌数量突然增加，必须确保回收的j/q/k能够合并结构，而非只追求牌数收益。\n\n  怒气使用判断\n\n  局面   建议  \n --- --- \n  已接近6怒且场上j/q/k较多   优先等待无双触发  \n  怒气不高但有一手关键低牌必须通过   考虑霸关换取强制推进  \n  霸关后可直接走完   霸关优先级最高  \n  场上j/q/k很少   无双收益不足，不必机械攒满  \n  对手只剩少量牌   以即时封锁为主，不为怒气让牌  \n\n  关键风险\n\n- 无双获得的是已打出的牌，会突然增加手牌数量；无法组成结构时可能反而拖慢走牌。\n- 六次被压或跳过意味着多次失去牌权，若没有队友支撑，可能在技能触发前结束牌局。\n- 霸关会消耗全部怒气，可能放弃即将到手的无双大量补牌。\n- 霸关只提高压制条件，并不保证绝对无法被压；对手仍可用包含j/q/k的合法牌型应对。\n- 霸关要求本手所有点数≤10，不能夹带j以上牌，也不能把普通高牌一并保护。\n\n  待实测\n\n- 无双“限1次”是指六怒补牌只触发一次，还是整套怒气机制触发后停止累计。\n- 吕布客观无牌可压时系统自动跳过，是否同样积攒怒气。\n- 吕布有牌可压但选择不出，以及被队友压制，是否均正常积怒。\n- 一手牌连续被多人压制时，只按首次失去牌权积1怒，还是每次覆盖都计算。\n- 无双获得的j/q/k具体牌面及数量是否全场公开，原弃牌区牌是否被实体拿走。\n- 达到6怒时若全场尚未打出j/q/k，技能是否消耗且不获得牌。\n- 霸关能否在0点怒气时发动；若能，“消耗全部怒气”是否可视为消耗0点。\n- 霸关的“带j/q/k”是要求压制牌型实际包含任意一张，还是只要求牌型最大点数属于j/q/k。\n- 炸弹或王炸若不含j/q/k，能否无视霸关直接压制。\n- 霸关能否用于含万能牌的≤10牌型，以及万能牌声明点数如何判定。\n- 霸关强化的出牌及其保护状态是否全场公开。\n- 吕布打出最后一手≤10牌时，是否直接胜利而无需等待霸关的压制窗口。\n"}, {"name": "吕蒙", "faction": "吴", "skills": "勤学、顿悟", "position": "定向取牌、炸弹重置与二次补强", "status": "主要规则已实测", "landlord": 8.5, "farmer": 9.5, "identity": "农民明显更优。", "firstMove": "偏低", "image": "技能截图/吕蒙-1.png", "html": "<div class=\"hero-shot\"><img src=\"技能截图/吕蒙-1.png\" alt=\"吕蒙技能截图一\" loading=\"lazy\"><\/div>\n<div class=\"hero-shot\"><img src=\"技能截图/吕蒙-2.png\" alt=\"吕蒙技能截图二\" loading=\"lazy\"><\/div>\n<h3>技能<\/h3>\n<p><strong>勤学｜主动｜限1次<\/strong><\/p>\n<blockquote>轮到你压牌时，可以从上一手其他玩家打出的牌中选择至多2张获得，然后跳过压牌；无法获得王炸。<\/blockquote>\n<p><strong>顿悟｜被动｜限1次<\/strong><\/p>\n<blockquote>当你打出炸弹后，重置“勤学”的使用次数。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8.5/10<\/td><td>定向取牌质量高，但首手无法启动勤学，需要先让出一轮节奏<\/td><\/tr>\n<tr><td>农民<\/td><td>9.5/10<\/td><td>可同时利用地主与队友的出牌，队友还能主动输送关键张<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8.5/10<\/td><td>目标公开可选，但收益受上一手牌型与自身炸弹数量影响<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>取牌目标、跳过时机与炸弹重置顺序共同决定上限<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：农民明显更优。<\/strong><\/p>\n<p><strong>先手匹配度：偏低。<\/strong> 地主首手无法使用勤学，必须等其他玩家出牌后才能发动；先手主要用于整理牌型和规划后续炸弹重置，并非技能的直接启动优势。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>勤学只能在轮到自己压牌时发动，目标必须来自上一手其他玩家打出的牌。<\/li><li>可选0至2张；发动后跳过本次压牌，不能同时获得牌并正常压制。<\/li><li>获得目标可定向选择，不是随机补牌。<\/li><li>王炸不能作为勤学的获取目标。<\/li><li>勤学初始可使用1次；发动后使用次数变为0。<\/li><li>勤学次数为0时，打出炸弹会通过顿悟将其刷新回1次。<\/li><li>勤学尚未使用、次数仍为1时提前打出炸弹，不消耗也不影响后续刷新机制。<\/li><li>顿悟只提供一次有效刷新，因此常规上限是两次勤学：首次勤学、炸弹刷新、第二次勤学。<\/li><li>每次最多获得2张，完整循环最多增加4张定向牌。<\/li><\/ul>\n<h3>取牌优先级<\/h3>\n<ol><li>直接补成炸弹或使现有炸弹升级的同点数牌。<\/li><li>补齐飞机、三张、连对、顺子等可立即少手的结构牌。<\/li><li>能建立稳定回手的2、A或大王、小王单张。<\/li><li>能与现有单张直接成对、与对子直接成三张的牌。<\/li><li>单纯点数较高、但无法进入结构的牌。<\/li><\/ol>\n<p>取牌标准是“获得后减少多少手并增加多少控制力”，不是机械拿上一手最大的两张。<\/p>\n<h3>主流打法<\/h3>\n<h4>地主：先出结构，后取牌重组<\/h4>\n<ul><li>首攻优先清理完整长结构，保留一枚可控炸弹作为顿悟开关。<\/li><li>第一次勤学只在能明显改良结构时发动；不为普通高牌轻易放弃压牌权。<\/li><li>取牌后尽快把新增牌并入对子、三张、顺子或炸弹，避免20张基础牌量继续膨胀。<\/li><li>为完成双勤学循环，应在第一次勤学后保留至少一枚炸弹；此前因实战需要打出的其他炸弹不影响后续刷新。<\/li><li>第二次勤学更适合残局定向补牌，目标是直接形成最后两三手，而不是继续囤牌。<\/li><\/ul>\n<p>地主核心顺序：<\/p>\n<blockquote>先清原生结构 → 第一次勤学补关键张 → 炸弹夺权并重置 → 第二次勤学完成残局结构。<\/blockquote>\n<h4>农民：队友输送型<\/h4>\n<ul><li>队友可主动打出吕蒙需要的对子、三张组件或顺子连接张，让勤学定向获取。<\/li><li>获取队友牌时要同时判断跳过后是否会把牌权送还地主；结构收益不足时不发动。<\/li><li>地主打出高对、三张或长结构时，可截取最能补强自身手牌的两张，直接改变地主剩余牌推断。<\/li><li>有炸弹时应尽量完成两轮勤学；没有炸弹时，首次发动必须更严格地要求即时收益。<\/li><li>地主进入少牌阶段后，控场优先于贪取，不能为拿牌主动跳过关键拦截。<\/li><\/ul>\n<h3>炸弹与重置顺序<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>局面<\/th><th>建议<\/th><\/tr><\/thead><tbody>\n<tr><td>勤学未使用<\/td><td>炸弹可按正常控场需要使用，不影响之后的有效刷新<\/td><\/tr>\n<tr><td>勤学已使用<\/td><td>可用炸弹夺权并重置，形成技能完整循环<\/td><\/tr>\n<tr><td>炸弹可被取牌补成<\/td><td>优先勤学补炸，再用新炸弹触发顿悟<\/td><\/tr>\n<tr><td>对手即将走完<\/td><td>直接炸断，不为技能顺序延误控场<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>炸弹不仅是控制牌，也是第二次勤学的启动成本。是否保炸应以“重置后的第二次取牌是否有实际窗口”为准。<\/p>\n<h3>关键风险<\/h3>\n<ul><li>每次勤学都会增加手牌，若新增牌不能并入结构，可能明显拖慢出完速度。<\/li><li>发动后强制跳过压牌，错误时机会直接丢失控制权。<\/li><li>第一次勤学后手中没有炸弹，便无法启动第二次勤学。<\/li><li>过度等待理想目标，可能整局没有使用技能。<\/li><li>农民队友喂牌若缺少牌权规划，可能帮助地主连续推进。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>“获得”是复制上一手牌，还是将对应实体牌从已出牌区转入吕蒙手牌；是否影响记牌总量。<\/li><li>上一手包含王炸以外的单张大王或小王时，能否单独获取。<\/li><li>上一手多张同点数牌时，可否选择其中两张，且是否保留原点数与技能标记。<\/li><li>勤学选择0张是否仍算使用，并强制跳过压牌。<\/li><li>第二次勤学后再次打炸弹是否因顿悟已用完而不再重置。<\/li><\/ul>", "search": "  吕蒙\n\n 吕蒙技能截图一 技能截图/吕蒙-1.png \n\n 吕蒙技能截图二 技能截图/吕蒙-2.png \n\n  技能\n\n 勤学｜主动｜限1次 \n\n  轮到你压牌时，可以从上一手其他玩家打出的牌中选择至多2张获得，然后跳过压牌；无法获得王炸。\n\n 顿悟｜被动｜限1次 \n\n  当你打出炸弹后，重置“勤学”的使用次数。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8.5/10   定向取牌质量高，但首手无法启动勤学，需要先让出一轮节奏  \n  农民   9.5/10   可同时利用地主与队友的出牌，队友还能主动输送关键张  \n  稳定性   8.5/10   目标公开可选，但收益受上一手牌型与自身炸弹数量影响  \n  操作上限   9.5/10   取牌目标、跳过时机与炸弹重置顺序共同决定上限  \n\n 身份倾向：农民明显更优。 \n\n 先手匹配度：偏低。  地主首手无法使用勤学，必须等其他玩家出牌后才能发动；先手主要用于整理牌型和规划后续炸弹重置，并非技能的直接启动优势。\n\n  核心机制\n\n- 勤学只能在轮到自己压牌时发动，目标必须来自上一手其他玩家打出的牌。\n- 可选0至2张；发动后跳过本次压牌，不能同时获得牌并正常压制。\n- 获得目标可定向选择，不是随机补牌。\n- 王炸不能作为勤学的获取目标。\n- 勤学初始可使用1次；发动后使用次数变为0。\n- 勤学次数为0时，打出炸弹会通过顿悟将其刷新回1次。\n- 勤学尚未使用、次数仍为1时提前打出炸弹，不消耗也不影响后续刷新机制。\n- 顿悟只提供一次有效刷新，因此常规上限是两次勤学：首次勤学、炸弹刷新、第二次勤学。\n- 每次最多获得2张，完整循环最多增加4张定向牌。\n\n  取牌优先级\n\n1. 直接补成炸弹或使现有炸弹升级的同点数牌。\n2. 补齐飞机、三张、连对、顺子等可立即少手的结构牌。\n3. 能建立稳定回手的2、a或大王、小王单张。\n4. 能与现有单张直接成对、与对子直接成三张的牌。\n5. 单纯点数较高、但无法进入结构的牌。\n\n取牌标准是“获得后减少多少手并增加多少控制力”，不是机械拿上一手最大的两张。\n\n  主流打法\n\n  地主：先出结构，后取牌重组\n\n- 首攻优先清理完整长结构，保留一枚可控炸弹作为顿悟开关。\n- 第一次勤学只在能明显改良结构时发动；不为普通高牌轻易放弃压牌权。\n- 取牌后尽快把新增牌并入对子、三张、顺子或炸弹，避免20张基础牌量继续膨胀。\n- 为完成双勤学循环，应在第一次勤学后保留至少一枚炸弹；此前因实战需要打出的其他炸弹不影响后续刷新。\n- 第二次勤学更适合残局定向补牌，目标是直接形成最后两三手，而不是继续囤牌。\n\n地主核心顺序：\n\n  先清原生结构 → 第一次勤学补关键张 → 炸弹夺权并重置 → 第二次勤学完成残局结构。\n\n  农民：队友输送型\n\n- 队友可主动打出吕蒙需要的对子、三张组件或顺子连接张，让勤学定向获取。\n- 获取队友牌时要同时判断跳过后是否会把牌权送还地主；结构收益不足时不发动。\n- 地主打出高对、三张或长结构时，可截取最能补强自身手牌的两张，直接改变地主剩余牌推断。\n- 有炸弹时应尽量完成两轮勤学；没有炸弹时，首次发动必须更严格地要求即时收益。\n- 地主进入少牌阶段后，控场优先于贪取，不能为拿牌主动跳过关键拦截。\n\n  炸弹与重置顺序\n\n  局面   建议  \n --- --- \n  勤学未使用   炸弹可按正常控场需要使用，不影响之后的有效刷新  \n  勤学已使用   可用炸弹夺权并重置，形成技能完整循环  \n  炸弹可被取牌补成   优先勤学补炸，再用新炸弹触发顿悟  \n  对手即将走完   直接炸断，不为技能顺序延误控场  \n\n炸弹不仅是控制牌，也是第二次勤学的启动成本。是否保炸应以“重置后的第二次取牌是否有实际窗口”为准。\n\n  关键风险\n\n- 每次勤学都会增加手牌，若新增牌不能并入结构，可能明显拖慢出完速度。\n- 发动后强制跳过压牌，错误时机会直接丢失控制权。\n- 第一次勤学后手中没有炸弹，便无法启动第二次勤学。\n- 过度等待理想目标，可能整局没有使用技能。\n- 农民队友喂牌若缺少牌权规划，可能帮助地主连续推进。\n\n  待实测\n\n- “获得”是复制上一手牌，还是将对应实体牌从已出牌区转入吕蒙手牌；是否影响记牌总量。\n- 上一手包含王炸以外的单张大王或小王时，能否单独获取。\n- 上一手多张同点数牌时，可否选择其中两张，且是否保留原点数与技能标记。\n- 勤学选择0张是否仍算使用，并强制跳过压牌。\n- 第二次勤学后再次打炸弹是否因顿悟已用完而不再重置。\n"}, {"name": "吴国太", "faction": "吴", "skills": "懿训", "position": "强制压牌、最大牌弃置与双目标压榨", "status": "初步分析", "landlord": 9.5, "farmer": 8.5, "identity": "强地主型。", "firstMove": "极高", "image": "技能截图/吴国太.png", "html": "<div class=\"hero-shot\"><img src=\"技能截图/吴国太.png\" alt=\"吴国太技能截图\" loading=\"lazy\"><\/div>\n<h3>技能<\/h3>\n<p><strong>懿训｜主动｜限2次<\/strong><\/p>\n<blockquote>可以令至多2名其他玩家在你本次出牌后的回合：若能压牌则必须压牌；若不能压牌，则弃置1张最大牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9.5/10<\/td><td>先手可同时指定两名农民，用高强度牌型逼出控制牌或双弃最大牌<\/td><\/tr>\n<tr><td>农民<\/td><td>8.5/10<\/td><td>可单独针对地主，但指定队友存在误伤，需要更精确地选择对象与牌型<\/td><\/tr>\n<tr><td>稳定性<\/td><td>9/10<\/td><td>无论目标能否压牌都会产生强制结果，技能很少完全落空<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>出牌类型、目标顺序和两次发动窗口决定收益上限<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：强地主型。<\/strong><\/p>\n<p><strong>先手匹配度：极高。<\/strong> 地主首手即可发动懿训，同时覆盖两名农民；既能用难压牌型迫使双方弃掉最大牌，也能用可压牌型强制消耗其王、2、炸弹或关键结构。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>主动选择至多2名其他玩家，可以只选1人，也可以同时选择两人。<\/li><li>效果只约束目标在吴国太本次出牌后的对应回合。<\/li><li>目标存在合法压牌时不能选择不出，必须打出能够压住当前牌面的牌型。<\/li><li>目标完全无法压牌时，改为弃置手中1张最大牌。<\/li><li>两条结果都具有收益：能压则强制消耗牌；不能压则直接删除其最高控制牌。<\/li><li>技能限2次，通常分别承担“前中盘拆控制”和“残局强制处理”两种任务。<\/li><\/ul>\n<h3>发动牌型优先级<\/h3>\n<ol><li><strong>王炸或接近最高级的炸弹：<\/strong> 对手大概率无法压牌，两名农民各弃1张最大牌；若存在更高炸弹，则强制其提前交出。<\/li><li><strong>高位复杂牌型：<\/strong> 高顺子、高连对、飞机等匹配难度高，容易触发弃最大牌。<\/li><li><strong>高单张、高对子：<\/strong> 可逼出王、2或更高对子，适合拆除对方残局回手牌。<\/li><li><strong>特殊牌型或长炸弹：<\/strong> 用于测试并清除对手隐藏的强控制结构。<\/li><li><strong>低位普通牌型：<\/strong> 对手往往能轻松压制，甚至借机批量减手，通常不适合作为懿训载体。<\/li><\/ol>\n<p>评价标准不是“这手牌有多大”，而是两名目标分别会进入“被迫交牌”还是“弃最大牌”，以及哪种结果更有利。<\/p>\n<h3>主流打法<\/h3>\n<h4>地主：双目标压榨型<\/h4>\n<ul><li>第一次优先在首轮或早期使用，利用先手同时查看两名农民的应牌能力。<\/li><li>手中有高炸、王炸或难匹配长牌型时，可直接追求双弃最大牌。<\/li><li>若牌型能被压但需要王、2或炸弹，发动价值仍然很高，等于强迫农民提前暴露并消耗控制资源。<\/li><li>第一名农民被迫压牌后，第二名农民面对的牌面可能继续升高，存在连锁压榨潜力。<\/li><li>第二次保留到一名农民进入少牌或地主准备连续冲牌时，用于清掉最后的回手点。<\/li><\/ul>\n<p>地主的主流节奏：<\/p>\n<blockquote>首手高强度牌型发动 → 双目标被迫响应或弃最大牌 → 根据公开结果重排控制链 → 残局第二次发动封口。<\/blockquote>\n<h4>农民：单点针对地主<\/h4>\n<ul><li>默认只指定地主，避免队友无法压牌时被迫弃掉最大牌。<\/li><li>地主握有牌权且疑似准备连续冲牌时，用高位同类牌型逼其交出更高控制牌。<\/li><li>队友手牌结构明确、被迫压牌反而能帮助其减手时，才考虑同时指定队友。<\/li><li>若队友无法应对当前牌型，指定队友等于主动削弱己方控制力，通常禁止。<\/li><li>第二次应围绕地主残局牌数使用，不要仅为早期交换普通牌而消耗。<\/li><\/ul>\n<h3>两种收益的取舍<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>预期结果<\/th><th>战术价值<\/th><\/tr><\/thead><tbody>\n<tr><td>目标用王或2压牌<\/td><td>提前拆掉残局控制点，吴国太可据此重排回手牌<\/td><\/tr>\n<tr><td>目标用炸弹压牌<\/td><td>强制暴露并消耗隐藏炸弹，价值通常很高<\/td><\/tr>\n<tr><td>目标无法压牌并弃最大牌<\/td><td>直接削弱最高控制力，但也可能替对手删除一张难处理的孤张<\/td><\/tr>\n<tr><td>目标用长牌型压牌<\/td><td>可能帮助其大量减手，是发动前必须规避的反收益<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>关键风险<\/h3>\n<ul><li>使用低位顺子、连对或飞机发动，可能强制对手一次打出大量手牌，反而帮助其提速。<\/li><li>对手弃掉的最大牌若原本是难以搭配的孤张，可能同时改善其静态手数。<\/li><li>农民误选队友可能造成高牌损失，或打乱队友原定控制顺序。<\/li><li>两次技能都在前期使用，会失去残局强制拆牌能力。<\/li><li>只追求“不能压”的弃牌效果，可能忽略强制对手交出炸弹本身就是更高价值收益。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>同时指定两人时，第二名目标需要压吴国太最初的牌，还是压第一名目标被迫打出的新牌面。<\/li><li>目标只有炸弹能够压牌时，是否必须使用炸弹。<\/li><li>最大点数有多张时，由目标自行选择弃置其中1张，还是系统随机选择。<\/li><li>万能牌处于手牌时是否参与“最大牌”判定，以及被弃置时按什么点数结算。<\/li><li>强制弃置的牌及具体点数是否向全场公开。<\/li><\/ul>", "search": "  吴国太\n\n 吴国太技能截图 技能截图/吴国太.png \n\n  技能\n\n 懿训｜主动｜限2次 \n\n  可以令至多2名其他玩家在你本次出牌后的回合：若能压牌则必须压牌；若不能压牌，则弃置1张最大牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9.5/10   先手可同时指定两名农民，用高强度牌型逼出控制牌或双弃最大牌  \n  农民   8.5/10   可单独针对地主，但指定队友存在误伤，需要更精确地选择对象与牌型  \n  稳定性   9/10   无论目标能否压牌都会产生强制结果，技能很少完全落空  \n  操作上限   9.5/10   出牌类型、目标顺序和两次发动窗口决定收益上限  \n\n 身份倾向：强地主型。 \n\n 先手匹配度：极高。  地主首手即可发动懿训，同时覆盖两名农民；既能用难压牌型迫使双方弃掉最大牌，也能用可压牌型强制消耗其王、2、炸弹或关键结构。\n\n  核心机制\n\n- 主动选择至多2名其他玩家，可以只选1人，也可以同时选择两人。\n- 效果只约束目标在吴国太本次出牌后的对应回合。\n- 目标存在合法压牌时不能选择不出，必须打出能够压住当前牌面的牌型。\n- 目标完全无法压牌时，改为弃置手中1张最大牌。\n- 两条结果都具有收益：能压则强制消耗牌；不能压则直接删除其最高控制牌。\n- 技能限2次，通常分别承担“前中盘拆控制”和“残局强制处理”两种任务。\n\n  发动牌型优先级\n\n1.  王炸或接近最高级的炸弹：  对手大概率无法压牌，两名农民各弃1张最大牌；若存在更高炸弹，则强制其提前交出。\n2.  高位复杂牌型：  高顺子、高连对、飞机等匹配难度高，容易触发弃最大牌。\n3.  高单张、高对子：  可逼出王、2或更高对子，适合拆除对方残局回手牌。\n4.  特殊牌型或长炸弹：  用于测试并清除对手隐藏的强控制结构。\n5.  低位普通牌型：  对手往往能轻松压制，甚至借机批量减手，通常不适合作为懿训载体。\n\n评价标准不是“这手牌有多大”，而是两名目标分别会进入“被迫交牌”还是“弃最大牌”，以及哪种结果更有利。\n\n  主流打法\n\n  地主：双目标压榨型\n\n- 第一次优先在首轮或早期使用，利用先手同时查看两名农民的应牌能力。\n- 手中有高炸、王炸或难匹配长牌型时，可直接追求双弃最大牌。\n- 若牌型能被压但需要王、2或炸弹，发动价值仍然很高，等于强迫农民提前暴露并消耗控制资源。\n- 第一名农民被迫压牌后，第二名农民面对的牌面可能继续升高，存在连锁压榨潜力。\n- 第二次保留到一名农民进入少牌或地主准备连续冲牌时，用于清掉最后的回手点。\n\n地主的主流节奏：\n\n  首手高强度牌型发动 → 双目标被迫响应或弃最大牌 → 根据公开结果重排控制链 → 残局第二次发动封口。\n\n  农民：单点针对地主\n\n- 默认只指定地主，避免队友无法压牌时被迫弃掉最大牌。\n- 地主握有牌权且疑似准备连续冲牌时，用高位同类牌型逼其交出更高控制牌。\n- 队友手牌结构明确、被迫压牌反而能帮助其减手时，才考虑同时指定队友。\n- 若队友无法应对当前牌型，指定队友等于主动削弱己方控制力，通常禁止。\n- 第二次应围绕地主残局牌数使用，不要仅为早期交换普通牌而消耗。\n\n  两种收益的取舍\n\n  预期结果   战术价值  \n --- --- \n  目标用王或2压牌   提前拆掉残局控制点，吴国太可据此重排回手牌  \n  目标用炸弹压牌   强制暴露并消耗隐藏炸弹，价值通常很高  \n  目标无法压牌并弃最大牌   直接削弱最高控制力，但也可能替对手删除一张难处理的孤张  \n  目标用长牌型压牌   可能帮助其大量减手，是发动前必须规避的反收益  \n\n  关键风险\n\n- 使用低位顺子、连对或飞机发动，可能强制对手一次打出大量手牌，反而帮助其提速。\n- 对手弃掉的最大牌若原本是难以搭配的孤张，可能同时改善其静态手数。\n- 农民误选队友可能造成高牌损失，或打乱队友原定控制顺序。\n- 两次技能都在前期使用，会失去残局强制拆牌能力。\n- 只追求“不能压”的弃牌效果，可能忽略强制对手交出炸弹本身就是更高价值收益。\n\n  待实测\n\n- 同时指定两人时，第二名目标需要压吴国太最初的牌，还是压第一名目标被迫打出的新牌面。\n- 目标只有炸弹能够压牌时，是否必须使用炸弹。\n- 最大点数有多张时，由目标自行选择弃置其中1张，还是系统随机选择。\n- 万能牌处于手牌时是否参与“最大牌”判定，以及被弃置时按什么点数结算。\n- 强制弃置的牌及具体点数是否向全场公开。\n"}, {"name": "夏侯惇", "faction": "魏", "skills": "刚烈", "position": "最大牌诱压、队友协同与三牌内斩杀", "status": "主要规则已实测", "landlord": 9.5, "farmer": 9.5, "identity": "地主、农民基本同档。", "firstMove": "极高", "image": "技能截图/夏侯惇.png", "html": "<div class=\"hero-shot\"><img src=\"技能截图/夏侯惇.png\" alt=\"夏侯惇技能截图\" loading=\"lazy\"><\/div>\n<h3>技能<\/h3>\n<p><strong>刚烈｜条件触发｜限1次<\/strong><\/p>\n<blockquote>你打出带有最大手牌的牌型被压后，你可以弃置3张最小牌，然后拿回1张点数最大的牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9.5/10<\/td><td>先手便于主动规划含最大牌的攻势，进入剩1至3张窗口后形成直接斩杀威胁<\/td><\/tr>\n<tr><td>农民<\/td><td>9.5/10<\/td><td>队友可主动压制并触发刚烈，终局配合稳定性极高<\/td><\/tr>\n<tr><td>稳定性<\/td><td>9/10<\/td><td>对手不压仍可限制中盘发动，但队友可配合，且剩1至3张时被任何方式压制都会清空<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>上限集中在最大牌嵌入、尾牌数量控制和队友配合触发<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：地主、农民基本同档。<\/strong> 地主有先手和20张牌的规划空间；农民则可由队友主动压制，稳定兑现刚烈终结。<\/p>\n<p><strong>先手匹配度：极高。<\/strong> 地主能从第一手开始主动控制牌数和牌型，目标不是尽早发动，而是把唯一一次刚烈保留到“出牌后剩1至3张”的终结窗口。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>触发检查的是刚打出的整手牌型中是否包含出牌前自己手里的最高点数牌，不要求该牌型本身是最大牌型。<\/li><li>有大王时，大王就是最高牌；例如“三个3带大王”包含大王，因此满足“带有最大手牌”。<\/li><li>该手牌被任何玩家以合法方式压住都会触发，包括农民队友配合压制，以及被炸弹压制。<\/li><li>发动后弃置手牌区最右侧的3张牌；若只剩1张或2张，则将剩余牌全部弃完。<\/li><li>随后从自己刚打出的那手牌中拿回点数最高的<strong>单独1张牌<\/strong>。只按点数判定且固定只回收1张，例如该手含3张A，仍只回收1张A。<\/li><li>常规结算净减少2张，但这不是技能的主要价值。<\/li><li>若出牌后剩1至3张，牌型被压后会直接弃完全部尾牌并终结比赛；牌局结束，不会再因拿回牌而恢复手牌。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：三牌内斩杀型<\/h4>\n<ul><li>前中盘保留刚烈，优先把总牌数整理到“本手打出后剩1至3张”。<\/li><li>终结手必须嵌入当时的最高牌，但不必把最高牌单独打出；可作为三带一、飞机带牌或其他合法组合的组成牌。<\/li><li>该手若无人压，继续保有牌权推进；若被普通牌或炸弹压，弃掉全部尾牌直接获胜。<\/li><li>因此对手面对终结手会进入两难：不压则让夏侯惇继续领牌，压则触发刚烈清空。<\/li><li>大王并非只能当单张使用；能够合法嵌入组合时，可作为最高牌完成触发条件。<\/li><\/ul>\n<h4>农民：终局逼迫型<\/h4>\n<ul><li>同样以剩1至3张斩杀为最高优先级，不在中盘只为净减2张提前交技能。<\/li><li>夏侯惇完成含最高牌的终结手后，队友可以主动用更大同型牌或炸弹压制，直接帮助其触发刚烈获胜。<\/li><li>无法进入三张窗口时，再把技能用于清除三张结构最差的低牌，并回收1张高牌继续拦截地主。<\/li><\/ul>\n<h3>触发牌型选择<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>牌型<\/th><th>评价<\/th><\/tr><\/thead><tbody>\n<tr><td>最大单张<\/td><td>条件最直观，但2或王通常缺少普通压制空间<\/td><\/tr>\n<tr><td>最大对子<\/td><td>可推进两张，但仍需对手拥有更大同型或炸弹<\/td><\/tr>\n<tr><td>含最高牌的组合<\/td><td>最高牌作为带牌也有效；例如三个3带大王可以成立<\/td><\/tr>\n<tr><td>出牌后剩1至3张<\/td><td>最高优先级；一旦被任意玩家压制，弃完尾牌直接获胜<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>理想触发牌不是绝对最大的牌型，而是“合法包含当前最高牌，并在出牌后留下1至3张”的牌型。<\/p>\n<h3>发动禁区<\/h3>\n<ul><li>未进入斩杀窗口便为净减2张提前消耗唯一一次技能。<\/li><li>弃置的三张仍是关键完整结构，且发动后不能显著缩短手数。<\/li><li>为了塞入最高牌强拆更优的直接出完路线。<\/li><\/ul>\n<h3>已确认结论<\/h3>\n<ul><li>“最大手牌”按出牌前自己手中的最高点数判断；牌型只需包含它。<\/li><li>被队友压制和被炸弹压制均能触发刚烈。<\/li><li>拿回范围是自己刚打出的牌，且无论最高点数有几张都只拿回1张。<\/li><li>弃牌对象固定为手牌排列最右侧的3张，不存在不同组合选择。<\/li><li>出牌后只剩1张、2张或3张均可正常触发；刚烈弃完全部尾牌便立即终结比赛，不会再因回收牌而恢复手牌。<\/li><\/ul>", "search": "  夏侯惇\n\n 夏侯惇技能截图 技能截图/夏侯惇.png \n\n  技能\n\n 刚烈｜条件触发｜限1次 \n\n  你打出带有最大手牌的牌型被压后，你可以弃置3张最小牌，然后拿回1张点数最大的牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9.5/10   先手便于主动规划含最大牌的攻势，进入剩1至3张窗口后形成直接斩杀威胁  \n  农民   9.5/10   队友可主动压制并触发刚烈，终局配合稳定性极高  \n  稳定性   9/10   对手不压仍可限制中盘发动，但队友可配合，且剩1至3张时被任何方式压制都会清空  \n  操作上限   9.5/10   上限集中在最大牌嵌入、尾牌数量控制和队友配合触发  \n\n 身份倾向：地主、农民基本同档。  地主有先手和20张牌的规划空间；农民则可由队友主动压制，稳定兑现刚烈终结。\n\n 先手匹配度：极高。  地主能从第一手开始主动控制牌数和牌型，目标不是尽早发动，而是把唯一一次刚烈保留到“出牌后剩1至3张”的终结窗口。\n\n  核心机制\n\n- 触发检查的是刚打出的整手牌型中是否包含出牌前自己手里的最高点数牌，不要求该牌型本身是最大牌型。\n- 有大王时，大王就是最高牌；例如“三个3带大王”包含大王，因此满足“带有最大手牌”。\n- 该手牌被任何玩家以合法方式压住都会触发，包括农民队友配合压制，以及被炸弹压制。\n- 发动后弃置手牌区最右侧的3张牌；若只剩1张或2张，则将剩余牌全部弃完。\n- 随后从自己刚打出的那手牌中拿回点数最高的 单独1张牌 。只按点数判定且固定只回收1张，例如该手含3张a，仍只回收1张a。\n- 常规结算净减少2张，但这不是技能的主要价值。\n- 若出牌后剩1至3张，牌型被压后会直接弃完全部尾牌并终结比赛；牌局结束，不会再因拿回牌而恢复手牌。\n\n  主流打法\n\n  地主：三牌内斩杀型\n\n- 前中盘保留刚烈，优先把总牌数整理到“本手打出后剩1至3张”。\n- 终结手必须嵌入当时的最高牌，但不必把最高牌单独打出；可作为三带一、飞机带牌或其他合法组合的组成牌。\n- 该手若无人压，继续保有牌权推进；若被普通牌或炸弹压，弃掉全部尾牌直接获胜。\n- 因此对手面对终结手会进入两难：不压则让夏侯惇继续领牌，压则触发刚烈清空。\n- 大王并非只能当单张使用；能够合法嵌入组合时，可作为最高牌完成触发条件。\n\n  农民：终局逼迫型\n\n- 同样以剩1至3张斩杀为最高优先级，不在中盘只为净减2张提前交技能。\n- 夏侯惇完成含最高牌的终结手后，队友可以主动用更大同型牌或炸弹压制，直接帮助其触发刚烈获胜。\n- 无法进入三张窗口时，再把技能用于清除三张结构最差的低牌，并回收1张高牌继续拦截地主。\n\n  触发牌型选择\n\n  牌型   评价  \n --- --- \n  最大单张   条件最直观，但2或王通常缺少普通压制空间  \n  最大对子   可推进两张，但仍需对手拥有更大同型或炸弹  \n  含最高牌的组合   最高牌作为带牌也有效；例如三个3带大王可以成立  \n  出牌后剩1至3张   最高优先级；一旦被任意玩家压制，弃完尾牌直接获胜  \n\n理想触发牌不是绝对最大的牌型，而是“合法包含当前最高牌，并在出牌后留下1至3张”的牌型。\n\n  发动禁区\n\n- 未进入斩杀窗口便为净减2张提前消耗唯一一次技能。\n- 弃置的三张仍是关键完整结构，且发动后不能显著缩短手数。\n- 为了塞入最高牌强拆更优的直接出完路线。\n\n  已确认结论\n\n- “最大手牌”按出牌前自己手中的最高点数判断；牌型只需包含它。\n- 被队友压制和被炸弹压制均能触发刚烈。\n- 拿回范围是自己刚打出的牌，且无论最高点数有几张都只拿回1张。\n- 弃牌对象固定为手牌排列最右侧的3张，不存在不同组合选择。\n- 出牌后只剩1张、2张或3张均可正常触发；刚烈弃完全部尾牌便立即终结比赛，不会再因回收牌而恢复手牌。\n"}, {"name": "夏侯渊", "faction": "魏", "skills": "神速", "position": "出牌后随机升点、动态改牌", "status": "主要规则已实测", "landlord": 9.5, "farmer": 7.5, "identity": "地主优势明显。", "firstMove": "极高", "image": "技能截图/夏侯渊.png", "html": "<div class=\"hero-shot\"><img src=\"技能截图/夏侯渊.png\" alt=\"夏侯渊技能截图\" loading=\"lazy\"><\/div>\n<h3>技能<\/h3>\n<p><strong>神速｜被动｜不限次数<\/strong><\/p>\n<blockquote>你出牌后，手中随机1张牌点数随机变大。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9.5/10<\/td><td>先手可立即打长组合触发神速，主动建立“清结构—养2”循环<\/td><\/tr>\n<tr><td>农民<\/td><td>7.5/10<\/td><td>能生成高牌拦截，但手牌少、触发次数和养成空间有限<\/td><\/tr>\n<tr><td>稳定性<\/td><td>6.5/10<\/td><td>目标和新点数随机，但变化只向上且2永久稳定<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9/10<\/td><td>出牌顺序、触发次数和残局重算要求高<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：地主优势明显。<\/strong><\/p>\n<p><strong>先手匹配度：极高。<\/strong> 地主第一手即可选择飞机、长顺或连对，在大量减牌的同时只触发一次神速；不需要等待对手先出，能主动决定第一次变化发生在什么手牌结构上。<\/p>\n<h3>已确认规则<\/h3>\n<ul><li>每出一手牌触发一次；一手出多张也只变化1张。<\/li><li>随机选取一张非2手牌，变为更大的随机点数，上限为2。<\/li><li>2不再变化。<\/li><li>对子、三张、炸弹没有保护权重。<\/li><li>手牌全部出完后直接获胜，不再结算神速。<\/li><li>变化结果仅自己可见。<\/li><li>同点数达到4张及以上均为完整炸弹；5张2、6张2可整组打出，不形成散牌负担。<\/li><\/ul>\n<h3>升2效率<\/h3>\n<p>以下按所有合法更大点数等概率计算：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>原点数<\/th><th>变成2概率<\/th><\/tr><\/thead><tbody>\n<tr><td>A<\/td><td>100%<\/td><\/tr>\n<tr><td>K<\/td><td>50%<\/td><\/tr>\n<tr><td>Q<\/td><td>33.3%<\/td><\/tr>\n<tr><td>J<\/td><td>25%<\/td><\/tr>\n<tr><td>10<\/td><td>20%<\/td><\/tr>\n<tr><td>9<\/td><td>16.7%<\/td><\/tr>\n<tr><td>8<\/td><td>14.3%<\/td><\/tr>\n<tr><td>7<\/td><td>12.5%<\/td><\/tr>\n<tr><td>6<\/td><td>11.1%<\/td><\/tr>\n<tr><td>5<\/td><td>10%<\/td><\/tr>\n<tr><td>4<\/td><td>9.1%<\/td><\/tr>\n<tr><td>3<\/td><td>8.3%<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>A、K、Q是主要养2候选。低牌虽然也能直升2，但效率更低。<\/p>\n<h3>主流打法<\/h3>\n<h4>地主：清结构 → 养2 → 长炸弹收尾<\/h4>\n<h5>第一阶段：清结构<\/h5>\n<p>优先级：<\/p>\n<ol><li>能直接出完的牌型；<\/li><li>飞机、长顺子、长连对；<\/li><li>容易被拆的非2炸弹、三张和对子；<\/li><li>中低位散牌；<\/li><li>A、K、Q升2候选；<\/li><li>已生成的2。<\/li><\/ol>\n<p>长组合一手出得多，却只触发一次，优于拆成多手。非2结构持有越久，被神速拆坏的累计风险越高。<\/p>\n<p>地主首攻优先从长组合开始：既利用先手无须压牌的优势，又先移除最怕神速破坏的结构。若没有长组合，再考虑低位对子或散牌启动第一次变化，不宜先交2。<\/p>\n<h5>第二阶段：养2<\/h5>\n<ul><li>逐步清除低、中位非2牌，提高神速命中A、K、Q的比例。<\/li><li>已生成的2永久稳定，持续并入炸弹。<\/li><li>用现有高牌或炸弹维持牌权；不为多触发一次而无条件拆牌。<\/li><li>对手不知道变化结果，可隐藏新生成的2、对子或炸弹长度。<\/li><\/ul>\n<h5>第三阶段：炸弹收尾<\/h5>\n<ul><li>4张2是起爆门槛，不是养成上限。<\/li><li>第5、第6张2继续强化同一个炸弹，不增加收尾手数。<\/li><li>理想尾牌是“一手普通组合 + 多张2炸弹”。<\/li><li>若已经可以直接走完，立即结束，不为增加炸弹长度延迟胜利。<\/li><\/ul>\n<h4>农民：隐蔽拦截型<\/h4>\n<ul><li>优先完成队友配合，不为了养2抢无意义牌权。<\/li><li>地主进入少牌阶段后，保留新生成的2和高牌作拦截。<\/li><li>长组合仍优先出，避免后续随机变化破坏结构。<\/li><li>利用变化不公开的优势，让地主难以判断你的真实控制力。<\/li><\/ul>\n<h3>结构风险<\/h3>\n<p>若剩余可变化牌为 <code>N<\/code> 张：<\/p>\n<ul><li>非2对子单次被拆概率约为 <code>2/N<\/code>；<\/li><li>非2三张约为 <code>3/N<\/code>；<\/li><li>非2四炸约为 <code>4/N<\/code>；<\/li><li>由2组成的对子、三张或长炸弹不受神速影响。<\/li><\/ul>\n<p>因此传统“长期捏住非2炸弹”等牌方式不适合夏侯渊。完整结构要么尽早出，要么接受被拆风险。<\/p>\n<h3>决策要点<\/h3>\n<ul><li>能直接走完，不等技能。<\/li><li>一手多出，少拆多触发。<\/li><li>先清脆弱结构，再提高高位牌占比。<\/li><li>四个2起爆，多一个更强。<\/li><li>每次变化后重新计算尾牌，不沿用开局方案。<\/li><\/ul>\n<blockquote>先清长牌，后养高牌；四个2起爆，多一个更强；能直接走完，不等技能。<\/blockquote>", "search": "  夏侯渊\n\n 夏侯渊技能截图 技能截图/夏侯渊.png \n\n  技能\n\n 神速｜被动｜不限次数 \n\n  你出牌后，手中随机1张牌点数随机变大。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9.5/10   先手可立即打长组合触发神速，主动建立“清结构—养2”循环  \n  农民   7.5/10   能生成高牌拦截，但手牌少、触发次数和养成空间有限  \n  稳定性   6.5/10   目标和新点数随机，但变化只向上且2永久稳定  \n  操作上限   9/10   出牌顺序、触发次数和残局重算要求高  \n\n 身份倾向：地主优势明显。 \n\n 先手匹配度：极高。  地主第一手即可选择飞机、长顺或连对，在大量减牌的同时只触发一次神速；不需要等待对手先出，能主动决定第一次变化发生在什么手牌结构上。\n\n  已确认规则\n\n- 每出一手牌触发一次；一手出多张也只变化1张。\n- 随机选取一张非2手牌，变为更大的随机点数，上限为2。\n- 2不再变化。\n- 对子、三张、炸弹没有保护权重。\n- 手牌全部出完后直接获胜，不再结算神速。\n- 变化结果仅自己可见。\n- 同点数达到4张及以上均为完整炸弹；5张2、6张2可整组打出，不形成散牌负担。\n\n  升2效率\n\n以下按所有合法更大点数等概率计算：\n\n  原点数   变成2概率  \n --- ---: \n  a   100%  \n  k   50%  \n  q   33.3%  \n  j   25%  \n  10   20%  \n  9   16.7%  \n  8   14.3%  \n  7   12.5%  \n  6   11.1%  \n  5   10%  \n  4   9.1%  \n  3   8.3%  \n\na、k、q是主要养2候选。低牌虽然也能直升2，但效率更低。\n\n  主流打法\n\n  地主：清结构 → 养2 → 长炸弹收尾\n\n  第一阶段：清结构\n\n优先级：\n\n1. 能直接出完的牌型；\n2. 飞机、长顺子、长连对；\n3. 容易被拆的非2炸弹、三张和对子；\n4. 中低位散牌；\n5. a、k、q升2候选；\n6. 已生成的2。\n\n长组合一手出得多，却只触发一次，优于拆成多手。非2结构持有越久，被神速拆坏的累计风险越高。\n\n地主首攻优先从长组合开始：既利用先手无须压牌的优势，又先移除最怕神速破坏的结构。若没有长组合，再考虑低位对子或散牌启动第一次变化，不宜先交2。\n\n  第二阶段：养2\n\n- 逐步清除低、中位非2牌，提高神速命中a、k、q的比例。\n- 已生成的2永久稳定，持续并入炸弹。\n- 用现有高牌或炸弹维持牌权；不为多触发一次而无条件拆牌。\n- 对手不知道变化结果，可隐藏新生成的2、对子或炸弹长度。\n\n  第三阶段：炸弹收尾\n\n- 4张2是起爆门槛，不是养成上限。\n- 第5、第6张2继续强化同一个炸弹，不增加收尾手数。\n- 理想尾牌是“一手普通组合 + 多张2炸弹”。\n- 若已经可以直接走完，立即结束，不为增加炸弹长度延迟胜利。\n\n  农民：隐蔽拦截型\n\n- 优先完成队友配合，不为了养2抢无意义牌权。\n- 地主进入少牌阶段后，保留新生成的2和高牌作拦截。\n- 长组合仍优先出，避免后续随机变化破坏结构。\n- 利用变化不公开的优势，让地主难以判断你的真实控制力。\n\n  结构风险\n\n若剩余可变化牌为  n  张：\n\n- 非2对子单次被拆概率约为  2/n ；\n- 非2三张约为  3/n ；\n- 非2四炸约为  4/n ；\n- 由2组成的对子、三张或长炸弹不受神速影响。\n\n因此传统“长期捏住非2炸弹”等牌方式不适合夏侯渊。完整结构要么尽早出，要么接受被拆风险。\n\n  决策要点\n\n- 能直接走完，不等技能。\n- 一手多出，少拆多触发。\n- 先清脆弱结构，再提高高位牌占比。\n- 四个2起爆，多一个更强。\n- 每次变化后重新计算尾牌，不沿用开局方案。\n\n  先清长牌，后养高牌；四个2起爆，多一个更强；能直接走完，不等技能。\n"}, {"name": "大乔", "faction": "吴", "skills": "结缘、贤助", "position": "强制截获、最高牌补三与公开协作", "status": "主要规则已实测", "landlord": 8.0, "farmer": 9.5, "identity": "强农民型。", "firstMove": "中高", "image": "技能截图/大乔-1.png", "html": "<div class=\"hero-shot\"><img src=\"技能截图/大乔-1.png\" alt=\"大乔技能截图一\" loading=\"lazy\"><\/div>\n<div class=\"hero-shot\"><img src=\"技能截图/大乔-2.png\" alt=\"大乔技能截图二\" loading=\"lazy\"><\/div>\n<h3>技能<\/h3>\n<p><strong>结缘｜被动｜限1次<\/strong><\/p>\n<blockquote>其他玩家打出的单牌无人压制时，你获得该牌。<\/blockquote>\n<p><strong>贤助｜主动｜限1次<\/strong><\/p>\n<blockquote>选择1名其他玩家，你与其分别展示手中最大的牌，然后各自将展示牌补充至3张；大小王不能补充。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8/10<\/td><td>贤助需要同时强化一名农民，但可通过选择对象控制对手收益，并获得最高牌情报<\/td><\/tr>\n<tr><td>农民<\/td><td>9.5/10<\/td><td>可与队友互相补强最高点数，兼具公开信息、三张结构与潜在炸弹接口<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8.5/10<\/td><td>贤助规则与信息完全公开；结缘虽依赖无人压牌，但满足条件后必定触发<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9/10<\/td><td>目标选择、发动时点与补出的三张结构决定收益差距<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：强农民型。<\/strong> 农民可把贤助当作队内双向补牌；地主使用时必然同时给一名对手资源，因此需要精确压低对方收益。<\/p>\n<p><strong>先手匹配度：中高。<\/strong> 地主可以开局发动贤助并立即利用补成的三张结构，但技能并非纯收益；农民虽然没有先手，却更容易通过队友共享价值。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>结缘只检查其他玩家打出的单牌；另外两家均选择不出后，立即强制触发，大乔获得该牌。<\/li><li>获得的单牌从出牌区转入大乔手牌，具体点数向全场公开。<\/li><li>结缘限1次，应优先等待2、A或王等高价值单牌，不宜被低单张提前消耗。<\/li><li>贤助选择1名其他玩家，双方各自公开展示当前手牌中的最高点数牌。<\/li><li>展示的最高点数牌不足3张时，由系统补到恰好3张；已有1张补2张，已有2张补1张，已有3张或更多均保持原数量不变。<\/li><li>若任意一方手牌中有大王或小王，该方以王作为最大牌展示，并直接跳过补牌，什么牌都不获得。<\/li><li>贤助新增牌的点数与数量向全场公开。<\/li><li>贤助同时暴露双方最高牌结构，收益不仅是补牌，也包括精确情报。<\/li><li>补至三张会增加手牌数量，只有能快速组成三带、飞机、炸弹接口或控制链时才是正收益。<\/li><\/ul>\n<h3>贤助目标优先级<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>目标状态<\/th><th>大乔收益<\/th><th>对方收益<\/th><th>评价<\/th><\/tr><\/thead><tbody>\n<tr><td>队友最高牌仅1张<\/td><td>自己补牌且队友也补2张<\/td><td>高<\/td><td>农民最强协作目标<\/td><\/tr>\n<tr><td>队友最高牌已有2张<\/td><td>自己补牌，队友补1张<\/td><td>中高<\/td><td>稳定构成双边三张结构<\/td><\/tr>\n<tr><td>对手最高牌为大小王<\/td><td>自己正常补牌<\/td><td>对手无法补王<\/td><td>地主优先目标<\/td><\/tr>\n<tr><td>对手最高点数已有3张或更多<\/td><td>自己正常补牌<\/td><td>对手保持原数量，不新增<\/td><td>地主低风险目标<\/td><\/tr>\n<tr><td>对手最高牌仅1张普通牌<\/td><td>自己补牌<\/td><td>对手同时补2张<\/td><td>地主通常避免<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>主流打法<\/h3>\n<h4>地主：低反哺贤助<\/h4>\n<ul><li>优先选择确认或高度疑似持有王的农民；该玩家会直接跳过补牌，可把对方增牌收益降为零。<\/li><li>无法确认王时，选择最高点数已经较密集、最可能无需补牌的目标。<\/li><li>自己最高牌为2或A时，贤助可直接建立三张核心；若已有两张，只增1张，效率最高。<\/li><li>补成三张后优先并入三带、飞机或与万能牌组成炸弹，不要把新增高牌拆成多个单张。<\/li><li>结缘保留给关键高单牌，用作残局回手或补强同点数结构。<\/li><\/ul>\n<h4>农民：双向协作<\/h4>\n<ul><li>贤助优先给最高牌能够立即成型、且新增牌不会拖慢出手的队友。<\/li><li>队友已有对应对子时，只补1张即可形成三张，整体手数负担最低。<\/li><li>双方补牌结果公开后，应立刻围绕新增三张分工：一方负责领出，另一方保留拦截。<\/li><li>结缘是强制技能，应避免让队友过早领出无人压制的低单牌；合适时可由队友领出高单张，另外两家均不出后定向供给大乔。<\/li><li>地主接近走完时，结缘获得的牌必须能形成即时拦截或减少手数，否则增牌可能反向拖累。<\/li><\/ul>\n<h3>技能优先级<\/h3>\n<ol><li>贤助补成能够直接少一手的三张、飞机组件或万能牌炸弹。<\/li><li>农民通过贤助同时强化自己与队友的高点数结构。<\/li><li>地主选择王为最高牌或最高牌已满3张的对手，降低反哺。<\/li><li>结缘获取能形成对子、三张、炸弹接口的关键单牌。<\/li><li>单纯为了多拿一张普通高牌而触发结缘，优先级最低。<\/li><\/ol>\n<h3>关键风险<\/h3>\n<ul><li>贤助不是单向增益；地主若选错目标，可能一次给农民补出2张关键高牌。<\/li><li>补成三张不等于直接形成炸弹，若缺乏带牌或后续接口，牌量增加可能拖慢收尾。<\/li><li>结缘强制获得单牌并增加自己的手牌，若低牌提前触发且无法并入结构，会成为直接负收益。<\/li><li>双方最大牌公开后，对手会据此调整控牌和拆牌策略。<\/li><\/ul>\n<h3>已确认结论<\/h3>\n<ul><li>结缘为强制触发：其他玩家打出单牌后，另外两家均不出，大乔立即获得该牌。<\/li><li>结缘获得的牌转入大乔手牌，获得点数向全场公开。<\/li><li>贤助双方的展示牌、补牌点数与补牌数量均向全场公开。<\/li><li>同点数牌不足3张才补到3张；已有3张或超过3张均不改变原数量。<\/li><li>手牌中只要存在大小王，该方就以王为最大牌并跳过补充，不会改为补充次高点数。<\/li><\/ul>", "search": "  大乔\n\n 大乔技能截图一 技能截图/大乔-1.png \n\n 大乔技能截图二 技能截图/大乔-2.png \n\n  技能\n\n 结缘｜被动｜限1次 \n\n  其他玩家打出的单牌无人压制时，你获得该牌。\n\n 贤助｜主动｜限1次 \n\n  选择1名其他玩家，你与其分别展示手中最大的牌，然后各自将展示牌补充至3张；大小王不能补充。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8/10   贤助需要同时强化一名农民，但可通过选择对象控制对手收益，并获得最高牌情报  \n  农民   9.5/10   可与队友互相补强最高点数，兼具公开信息、三张结构与潜在炸弹接口  \n  稳定性   8.5/10   贤助规则与信息完全公开；结缘虽依赖无人压牌，但满足条件后必定触发  \n  操作上限   9/10   目标选择、发动时点与补出的三张结构决定收益差距  \n\n 身份倾向：强农民型。  农民可把贤助当作队内双向补牌；地主使用时必然同时给一名对手资源，因此需要精确压低对方收益。\n\n 先手匹配度：中高。  地主可以开局发动贤助并立即利用补成的三张结构，但技能并非纯收益；农民虽然没有先手，却更容易通过队友共享价值。\n\n  核心机制\n\n- 结缘只检查其他玩家打出的单牌；另外两家均选择不出后，立即强制触发，大乔获得该牌。\n- 获得的单牌从出牌区转入大乔手牌，具体点数向全场公开。\n- 结缘限1次，应优先等待2、a或王等高价值单牌，不宜被低单张提前消耗。\n- 贤助选择1名其他玩家，双方各自公开展示当前手牌中的最高点数牌。\n- 展示的最高点数牌不足3张时，由系统补到恰好3张；已有1张补2张，已有2张补1张，已有3张或更多均保持原数量不变。\n- 若任意一方手牌中有大王或小王，该方以王作为最大牌展示，并直接跳过补牌，什么牌都不获得。\n- 贤助新增牌的点数与数量向全场公开。\n- 贤助同时暴露双方最高牌结构，收益不仅是补牌，也包括精确情报。\n- 补至三张会增加手牌数量，只有能快速组成三带、飞机、炸弹接口或控制链时才是正收益。\n\n  贤助目标优先级\n\n  目标状态   大乔收益   对方收益   评价  \n --- --- --- --- \n  队友最高牌仅1张   自己补牌且队友也补2张   高   农民最强协作目标  \n  队友最高牌已有2张   自己补牌，队友补1张   中高   稳定构成双边三张结构  \n  对手最高牌为大小王   自己正常补牌   对手无法补王   地主优先目标  \n  对手最高点数已有3张或更多   自己正常补牌   对手保持原数量，不新增   地主低风险目标  \n  对手最高牌仅1张普通牌   自己补牌   对手同时补2张   地主通常避免  \n\n  主流打法\n\n  地主：低反哺贤助\n\n- 优先选择确认或高度疑似持有王的农民；该玩家会直接跳过补牌，可把对方增牌收益降为零。\n- 无法确认王时，选择最高点数已经较密集、最可能无需补牌的目标。\n- 自己最高牌为2或a时，贤助可直接建立三张核心；若已有两张，只增1张，效率最高。\n- 补成三张后优先并入三带、飞机或与万能牌组成炸弹，不要把新增高牌拆成多个单张。\n- 结缘保留给关键高单牌，用作残局回手或补强同点数结构。\n\n  农民：双向协作\n\n- 贤助优先给最高牌能够立即成型、且新增牌不会拖慢出手的队友。\n- 队友已有对应对子时，只补1张即可形成三张，整体手数负担最低。\n- 双方补牌结果公开后，应立刻围绕新增三张分工：一方负责领出，另一方保留拦截。\n- 结缘是强制技能，应避免让队友过早领出无人压制的低单牌；合适时可由队友领出高单张，另外两家均不出后定向供给大乔。\n- 地主接近走完时，结缘获得的牌必须能形成即时拦截或减少手数，否则增牌可能反向拖累。\n\n  技能优先级\n\n1. 贤助补成能够直接少一手的三张、飞机组件或万能牌炸弹。\n2. 农民通过贤助同时强化自己与队友的高点数结构。\n3. 地主选择王为最高牌或最高牌已满3张的对手，降低反哺。\n4. 结缘获取能形成对子、三张、炸弹接口的关键单牌。\n5. 单纯为了多拿一张普通高牌而触发结缘，优先级最低。\n\n  关键风险\n\n- 贤助不是单向增益；地主若选错目标，可能一次给农民补出2张关键高牌。\n- 补成三张不等于直接形成炸弹，若缺乏带牌或后续接口，牌量增加可能拖慢收尾。\n- 结缘强制获得单牌并增加自己的手牌，若低牌提前触发且无法并入结构，会成为直接负收益。\n- 双方最大牌公开后，对手会据此调整控牌和拆牌策略。\n\n  已确认结论\n\n- 结缘为强制触发：其他玩家打出单牌后，另外两家均不出，大乔立即获得该牌。\n- 结缘获得的牌转入大乔手牌，获得点数向全场公开。\n- 贤助双方的展示牌、补牌点数与补牌数量均向全场公开。\n- 同点数牌不足3张才补到3张；已有3张或超过3张均不改变原数量。\n- 手牌中只要存在大小王，该方就以王为最大牌并跳过补充，不会改为补充次高点数。\n"}, {"name": "姜维", "faction": "蜀", "skills": "绝计、北伐", "position": "让权弃牌、单牌升点与大王转炸", "status": "初步分析", "landlord": 8.5, "farmer": 9.5, "identity": "强农民型。", "firstMove": "偏低", "image": "技能截图/姜维-1.png", "html": "<div class=\"hero-shot\"><img src=\"技能截图/姜维-1.png\" alt=\"姜维技能截图一\" loading=\"lazy\"><\/div>\n<div class=\"hero-shot\"><img src=\"技能截图/姜维-2.png\" alt=\"姜维技能截图二\" loading=\"lazy\"><\/div>\n<h3>技能<\/h3>\n<p><strong>绝计｜被动｜不限次数<\/strong><\/p>\n<blockquote>轮到你压牌时，若你仅有1张手牌且选择不压，该牌点数随机变大；该牌为大王时，转变为4张3。<\/blockquote>\n<p><strong>北伐｜被动｜不限次数<\/strong><\/p>\n<blockquote>轮到你压牌时，若你选择不压，弃置1张点数最小牌；仅剩1张手牌时不触发。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8.5/10<\/td><td>可通过多次不压持续减牌，但主动让权与地主连续进攻目标存在冲突<\/td><\/tr>\n<tr><td>农民<\/td><td>9.5/10<\/td><td>可借队友牌权安全触发北伐，剩单牌后再用绝计提高终局控制力<\/td><\/tr>\n<tr><td>稳定性<\/td><td>9/10<\/td><td>北伐只需轮到压牌并选择不出，减牌结果稳定；绝计升点具有随机性<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>让权次数、最低牌结构、最后单牌与大王转四张3的取舍决定上限<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：强农民型。<\/strong> 农民可在队友掌握牌权时无损触发北伐；地主虽然也能快速弃牌，但每次触发通常意味着把进攻权交给两名农民。<\/p>\n<p><strong>先手匹配度：偏低。<\/strong> 地主先手不能直接触发技能，必须等待其他玩家出牌后选择不压；技能方向是让权减牌，与地主先手连续冲牌并不完全匹配。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>两项技能都只在轮到姜维压牌且选择不出时检查。<\/li><li>手牌多于1张时，北伐弃置1张当前最低点数牌；不限次数，可逐轮持续压缩手牌。<\/li><li>仅剩1张时北伐停止，绝计接管：每次选择不压，最后一张牌随机升点。<\/li><li>最后一张已经是大王时，再触发绝计会把大王变成4张3，牌量由1张增加到4张，但获得一个四张炸弹。<\/li><li>北伐与绝计形成阶段循环：多牌阶段不断弃低牌，单牌阶段提高末牌，必要时由大王转化为炸弹重新进入多牌阶段。<\/li><li>两项技能都不要求姜维实际拥有可压制当前牌型的牌，只要轮到压牌并选择不出即可尝试触发。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：有限让权压缩<\/h4>\n<ul><li>首攻正常减手，不为了触发技能刻意打出容易失去控制的牌型。<\/li><li>农民只出单张、对子等低威胁牌型时，可选择一次不压，用北伐删除最低废张。<\/li><li>连续触发前必须确认仍有炸弹、王或高牌能够重新夺回牌权。<\/li><li>接近单牌阶段时，提前决定最终保留哪张牌；北伐会固定清理最低点数，因此可通过正常出牌调整末牌候选。<\/li><li>最后一张若已具备直接走掉的机会，应立即出完，不为继续触发绝计而放弃胜势。<\/li><\/ul>\n<h4>农民：队友牌权下连续北伐<\/h4>\n<ul><li>队友领牌时是最安全的触发窗口：姜维选择不压，持续弃掉最低牌，不破坏己方牌权。<\/li><li>队友可连续领出姜维不准备接的牌型，为北伐提供多次减牌机会。<\/li><li>地主接近走完时停止贪技能，能压必须压；北伐减1张不能补偿直接丢局。<\/li><li>进入单牌后，队友继续控场可让姜维多次触发绝计，把末牌提升到更可靠的终结点数。<\/li><li>最后一张升到大王后，若已有直接出完窗口应立刻单出；再次不压会变成四张3，重新增加手牌。<\/li><\/ul>\n<h3>阶段决策<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>当前手牌<\/th><th>不压后的主要结果<\/th><th>战术判断<\/th><\/tr><\/thead><tbody>\n<tr><td>3张以上<\/td><td>北伐弃1张最低牌<\/td><td>安全让权时持续压缩<\/td><\/tr>\n<tr><td>2张<\/td><td>北伐弃1张，进入单牌阶段<\/td><td>关键转折点，需预先设计保留牌<\/td><\/tr>\n<tr><td>1张普通牌<\/td><td>绝计随机升点<\/td><td>队友能控场时可继续养大<\/td><\/tr>\n<tr><td>1张大王<\/td><td>转变为4张3<\/td><td>获得炸弹但牌量回升，通常只在大王无法直接走掉时考虑<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>尾牌设计优先级<\/h3>\n<ol><li>保留可以在队友牌权协助下直接走掉的高单牌。<\/li><li>保留能够通过一次绝计进入2或王区间的牌。<\/li><li>利用北伐删除无法主动处理的最低孤张。<\/li><li>大王能够直接单出时优先结束，不主动追求四张3。<\/li><li>只有大王单出会被局势封锁、且后续仍有炸弹出手机会时，才考虑转四张3。<\/li><\/ol>\n<h3>关键风险<\/h3>\n<ul><li>每次发动都以“不压”为前提，错误让权可能直接放走地主或农民。<\/li><li>北伐固定弃最低点数牌，可能拆掉顺子、连对、三张或炸弹组件。<\/li><li>最后一张随机升点不等于立刻获得出牌权；仍需等待下一次主动领牌或合法压牌窗口。<\/li><li>大王转四张3会把1张尾牌变为4张，虽然获得炸弹，却可能把即将结束的牌局重新拉长。<\/li><li>地主若连续让权触发北伐，可能在自身减牌完成前被两名农民接力走完。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>绝计的随机升点上限是否为2，具体可跨越多少级，以及各点数概率是否相同。<\/li><li>最后一张为小王时还能否继续变大，以及可能结果是否只有大王。<\/li><li>2张手牌触发北伐后变为1张时，同一次“不压”是否会继续触发绝计。<\/li><li>北伐遇到多张并列最小点数牌时，系统如何选择具体牌（花色不影响牌型，仅关系到界面结算）。<\/li><li>北伐弃牌和绝计变牌结果是否向全场公开。<\/li><li>北伐弃置后手牌清空时是否立即获胜。<\/li><li>大王转成四张3后，4张3是否为普通炸弹并可继续触发北伐。<\/li><\/ul>", "search": "  姜维\n\n 姜维技能截图一 技能截图/姜维-1.png \n\n 姜维技能截图二 技能截图/姜维-2.png \n\n  技能\n\n 绝计｜被动｜不限次数 \n\n  轮到你压牌时，若你仅有1张手牌且选择不压，该牌点数随机变大；该牌为大王时，转变为4张3。\n\n 北伐｜被动｜不限次数 \n\n  轮到你压牌时，若你选择不压，弃置1张点数最小牌；仅剩1张手牌时不触发。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8.5/10   可通过多次不压持续减牌，但主动让权与地主连续进攻目标存在冲突  \n  农民   9.5/10   可借队友牌权安全触发北伐，剩单牌后再用绝计提高终局控制力  \n  稳定性   9/10   北伐只需轮到压牌并选择不出，减牌结果稳定；绝计升点具有随机性  \n  操作上限   9.5/10   让权次数、最低牌结构、最后单牌与大王转四张3的取舍决定上限  \n\n 身份倾向：强农民型。  农民可在队友掌握牌权时无损触发北伐；地主虽然也能快速弃牌，但每次触发通常意味着把进攻权交给两名农民。\n\n 先手匹配度：偏低。  地主先手不能直接触发技能，必须等待其他玩家出牌后选择不压；技能方向是让权减牌，与地主先手连续冲牌并不完全匹配。\n\n  核心机制\n\n- 两项技能都只在轮到姜维压牌且选择不出时检查。\n- 手牌多于1张时，北伐弃置1张当前最低点数牌；不限次数，可逐轮持续压缩手牌。\n- 仅剩1张时北伐停止，绝计接管：每次选择不压，最后一张牌随机升点。\n- 最后一张已经是大王时，再触发绝计会把大王变成4张3，牌量由1张增加到4张，但获得一个四张炸弹。\n- 北伐与绝计形成阶段循环：多牌阶段不断弃低牌，单牌阶段提高末牌，必要时由大王转化为炸弹重新进入多牌阶段。\n- 两项技能都不要求姜维实际拥有可压制当前牌型的牌，只要轮到压牌并选择不出即可尝试触发。\n\n  主流打法\n\n  地主：有限让权压缩\n\n- 首攻正常减手，不为了触发技能刻意打出容易失去控制的牌型。\n- 农民只出单张、对子等低威胁牌型时，可选择一次不压，用北伐删除最低废张。\n- 连续触发前必须确认仍有炸弹、王或高牌能够重新夺回牌权。\n- 接近单牌阶段时，提前决定最终保留哪张牌；北伐会固定清理最低点数，因此可通过正常出牌调整末牌候选。\n- 最后一张若已具备直接走掉的机会，应立即出完，不为继续触发绝计而放弃胜势。\n\n  农民：队友牌权下连续北伐\n\n- 队友领牌时是最安全的触发窗口：姜维选择不压，持续弃掉最低牌，不破坏己方牌权。\n- 队友可连续领出姜维不准备接的牌型，为北伐提供多次减牌机会。\n- 地主接近走完时停止贪技能，能压必须压；北伐减1张不能补偿直接丢局。\n- 进入单牌后，队友继续控场可让姜维多次触发绝计，把末牌提升到更可靠的终结点数。\n- 最后一张升到大王后，若已有直接出完窗口应立刻单出；再次不压会变成四张3，重新增加手牌。\n\n  阶段决策\n\n  当前手牌   不压后的主要结果   战术判断  \n ---: --- --- \n  3张以上   北伐弃1张最低牌   安全让权时持续压缩  \n  2张   北伐弃1张，进入单牌阶段   关键转折点，需预先设计保留牌  \n  1张普通牌   绝计随机升点   队友能控场时可继续养大  \n  1张大王   转变为4张3   获得炸弹但牌量回升，通常只在大王无法直接走掉时考虑  \n\n  尾牌设计优先级\n\n1. 保留可以在队友牌权协助下直接走掉的高单牌。\n2. 保留能够通过一次绝计进入2或王区间的牌。\n3. 利用北伐删除无法主动处理的最低孤张。\n4. 大王能够直接单出时优先结束，不主动追求四张3。\n5. 只有大王单出会被局势封锁、且后续仍有炸弹出手机会时，才考虑转四张3。\n\n  关键风险\n\n- 每次发动都以“不压”为前提，错误让权可能直接放走地主或农民。\n- 北伐固定弃最低点数牌，可能拆掉顺子、连对、三张或炸弹组件。\n- 最后一张随机升点不等于立刻获得出牌权；仍需等待下一次主动领牌或合法压牌窗口。\n- 大王转四张3会把1张尾牌变为4张，虽然获得炸弹，却可能把即将结束的牌局重新拉长。\n- 地主若连续让权触发北伐，可能在自身减牌完成前被两名农民接力走完。\n\n  待实测\n\n- 绝计的随机升点上限是否为2，具体可跨越多少级，以及各点数概率是否相同。\n- 最后一张为小王时还能否继续变大，以及可能结果是否只有大王。\n- 2张手牌触发北伐后变为1张时，同一次“不压”是否会继续触发绝计。\n- 北伐遇到多张并列最小点数牌时，系统如何选择具体牌（花色不影响牌型，仅关系到界面结算）。\n- 北伐弃牌和绝计变牌结果是否向全场公开。\n- 北伐弃置后手牌清空时是否立即获胜。\n- 大王转成四张3后，4张3是否为普通炸弹并可继续触发北伐。\n"}, {"name": "孙坚", "faction": "吴", "skills": "得玺", "position": "三K补充、K炸爆发与条件式起手强化", "status": "主要规则已实测", "landlord": 8.5, "farmer": 9.0, "identity": "农民略优。", "firstMove": "较高", "image": "", "html": "<h3>技能<\/h3>\n<p><strong>得玺｜主动｜限1次<\/strong><\/p>\n<blockquote>若你手中没有三张和炸弹牌型，则可以获得3张K。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8.5/10<\/td><td>先手可立即处理新增K，但20张手牌更容易原生存在三张或炸弹而无法发动<\/td><\/tr>\n<tr><td>农民<\/td><td>9/10<\/td><td>17张牌更容易满足发动条件，原有1至2张K时可直接制造四K或五K炸弹<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8/10<\/td><td>收益固定，但能否发动受整手牌中任意三张、炸弹限制<\/td><\/tr>\n<tr><td>爆发上限<\/td><td>9.5/10<\/td><td>一K起手可直接获得四K炸，二K起手可获得五K炸<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：农民略优。<\/strong> 农民初始牌量更少，更容易满足“无三张、无炸弹”；技能一旦配合原有K，能立即获得强炸弹。<\/p>\n<p><strong>先手匹配度：较高。<\/strong> 地主若能发动，可用先手主动安排三K或K炸的出牌顺序；但先手不能解决拿底后已经出现其他三张、炸弹导致的发动封锁。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>得玺为一次性主动技能，发动条件是当前手牌中不存在任何三张和炸弹牌型。<\/li><li>主动出牌阶段和轮到压牌阶段均可发动。<\/li><li>条件检查针对整手牌，并非只检查K。<\/li><li>发动后始终固定新增3张K，新增点数全场公开；新增K与普通K完全等价，并与原有K合并计算。<\/li><li>飞机中的连续三张同样属于三张牌型，会封锁得玺。<\/li><li>五张及更多同点数牌仍属于炸弹，同样会封锁得玺。<\/li><li>万能牌不计入三张或炸弹的发动条件判断。<\/li><li>原有0张K：得到三K，可作为三带等牌型核心。<\/li><li>原有1张K：合计四K，直接形成炸弹。<\/li><li>原有2张K：合计五K，形成更高张数炸弹。<\/li><li>原有3张以上K时，本身已构成三张或炸弹，通常不满足发动条件。<\/li><\/ul>\n<h3>起手K价值<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>发动前K数量<\/th><th>发动后<\/th><th>结果<\/th><\/tr><\/thead><tbody>\n<tr><td>0<\/td><td>3张K<\/td><td>稳定获得一组三张<\/td><\/tr>\n<tr><td>1<\/td><td>4张K<\/td><td>直接获得四K炸弹，最佳常规起手<\/td><\/tr>\n<tr><td>2<\/td><td>5张K<\/td><td>直接获得五K炸弹，爆发最高<\/td><\/tr>\n<tr><td>≥3<\/td><td>≥6张K<\/td><td>原手牌已含三张/炸弹，通常无法发动<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>主流打法<\/h3>\n<h4>地主：确认条件后立即定型<\/h4>\n<ul><li>看完底牌后先确认整手牌是否存在任意三张或炸弹，再决定得玺价值。<\/li><li>原有1至2张K且满足条件时，优先发动，直接建立K炸作为终局兜底。<\/li><li>无K时，把新增三K用于三带，优先带走难处理的低单张或对子。<\/li><li>有K炸时先用普通结构推进，炸弹保留作夺回牌权和最后衔接。<\/li><li>不要为了等待发动而拆散本来有价值的三张或炸弹，除非残局收益明确。<\/li><\/ul>\n<h4>农民：K炸爆发型<\/h4>\n<ul><li>1张K属于高质量叫分辅助条件，发动后直接形成四K炸。<\/li><li>2张K且无其他三张、炸弹时属于极强结构，可用五K炸建立绝对牌权。<\/li><li>无K时只把技能视为一组三张资源，不应仅凭三K无脑叫地主。<\/li><li>作为农民时保留K炸拦截地主短牌，避免过早为倍率空炸。<\/li><li>新增三K若不成炸，应尽快配带清理，避免增加三张净牌量后拖慢出完。<\/li><\/ul>\n<h3>发动优先级<\/h3>\n<ol><li>原有2张K：形成五K炸。<\/li><li>原有1张K：形成四K炸。<\/li><li>无K但三K可直接组成三带并减少两手以上。<\/li><li>无合适带牌、三K会形成额外负担时，可延后或放弃。<\/li><\/ol>\n<h3>关键风险<\/h3>\n<ul><li>新增3张牌会增加总牌量；若只能形成孤立三K，实际收益低于直接获得炸弹。<\/li><li>任意其他点数的三张或炸弹都可能封锁技能。<\/li><li>地主拿底后可能新形成三张，导致原17张可发动、20张却不能发动。<\/li><li>为保K炸而不及时控场，可能让对手直接走完。<\/li><\/ul>", "search": "  孙坚\n\n  技能\n\n 得玺｜主动｜限1次 \n\n  若你手中没有三张和炸弹牌型，则可以获得3张k。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8.5/10   先手可立即处理新增k，但20张手牌更容易原生存在三张或炸弹而无法发动  \n  农民   9/10   17张牌更容易满足发动条件，原有1至2张k时可直接制造四k或五k炸弹  \n  稳定性   8/10   收益固定，但能否发动受整手牌中任意三张、炸弹限制  \n  爆发上限   9.5/10   一k起手可直接获得四k炸，二k起手可获得五k炸  \n\n 身份倾向：农民略优。  农民初始牌量更少，更容易满足“无三张、无炸弹”；技能一旦配合原有k，能立即获得强炸弹。\n\n 先手匹配度：较高。  地主若能发动，可用先手主动安排三k或k炸的出牌顺序；但先手不能解决拿底后已经出现其他三张、炸弹导致的发动封锁。\n\n  核心机制\n\n- 得玺为一次性主动技能，发动条件是当前手牌中不存在任何三张和炸弹牌型。\n- 主动出牌阶段和轮到压牌阶段均可发动。\n- 条件检查针对整手牌，并非只检查k。\n- 发动后始终固定新增3张k，新增点数全场公开；新增k与普通k完全等价，并与原有k合并计算。\n- 飞机中的连续三张同样属于三张牌型，会封锁得玺。\n- 五张及更多同点数牌仍属于炸弹，同样会封锁得玺。\n- 万能牌不计入三张或炸弹的发动条件判断。\n- 原有0张k：得到三k，可作为三带等牌型核心。\n- 原有1张k：合计四k，直接形成炸弹。\n- 原有2张k：合计五k，形成更高张数炸弹。\n- 原有3张以上k时，本身已构成三张或炸弹，通常不满足发动条件。\n\n  起手k价值\n\n  发动前k数量   发动后   结果  \n ---: ---: --- \n  0   3张k   稳定获得一组三张  \n  1   4张k   直接获得四k炸弹，最佳常规起手  \n  2   5张k   直接获得五k炸弹，爆发最高  \n  ≥3   ≥6张k   原手牌已含三张/炸弹，通常无法发动  \n\n  主流打法\n\n  地主：确认条件后立即定型\n\n- 看完底牌后先确认整手牌是否存在任意三张或炸弹，再决定得玺价值。\n- 原有1至2张k且满足条件时，优先发动，直接建立k炸作为终局兜底。\n- 无k时，把新增三k用于三带，优先带走难处理的低单张或对子。\n- 有k炸时先用普通结构推进，炸弹保留作夺回牌权和最后衔接。\n- 不要为了等待发动而拆散本来有价值的三张或炸弹，除非残局收益明确。\n\n  农民：k炸爆发型\n\n- 1张k属于高质量叫分辅助条件，发动后直接形成四k炸。\n- 2张k且无其他三张、炸弹时属于极强结构，可用五k炸建立绝对牌权。\n- 无k时只把技能视为一组三张资源，不应仅凭三k无脑叫地主。\n- 作为农民时保留k炸拦截地主短牌，避免过早为倍率空炸。\n- 新增三k若不成炸，应尽快配带清理，避免增加三张净牌量后拖慢出完。\n\n  发动优先级\n\n1. 原有2张k：形成五k炸。\n2. 原有1张k：形成四k炸。\n3. 无k但三k可直接组成三带并减少两手以上。\n4. 无合适带牌、三k会形成额外负担时，可延后或放弃。\n\n  关键风险\n\n- 新增3张牌会增加总牌量；若只能形成孤立三k，实际收益低于直接获得炸弹。\n- 任意其他点数的三张或炸弹都可能封锁技能。\n- 地主拿底后可能新形成三张，导致原17张可发动、20张却不能发动。\n- 为保k炸而不及时控场，可能让对手直接走完。\n"}, {"name": "孙策", "faction": "吴", "skills": "继志、借兵", "position": "三K起手、高对转换与反应型补给", "status": "主要规则已实测", "landlord": 8.5, "farmer": 9.0, "identity": "农民略优。", "firstMove": "中等", "image": "技能截图/孙策-1.png", "html": "<div class=\"hero-shot\"><img src=\"技能截图/孙策-1.png\" alt=\"孙策技能截图一\" loading=\"lazy\"><\/div>\n<div class=\"hero-shot\"><img src=\"技能截图/孙策-2.png\" alt=\"孙策技能截图二\" loading=\"lazy\"><\/div>\n<h3>技能<\/h3>\n<p><strong>继志｜被动｜限1次<\/strong><\/p>\n<blockquote>开局时，将手牌中的K补充至3张。<\/blockquote>\n<p><strong>借兵｜主动｜限2次<\/strong><\/p>\n<blockquote>无牌可压时，可以弃置1张K，并获得1个不低于J的对子，然后跳过压牌；获得的对子不会是K。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8.5/10<\/td><td>开局稳定获得三K结构，但借兵依赖无牌可压，先手不能直接启动<\/td><\/tr>\n<tr><td>农民<\/td><td>9/10<\/td><td>更容易进入无牌可压窗口，高对可用于后续拦截或与队友建立控制链<\/td><\/tr>\n<tr><td>稳定性<\/td><td>9/10<\/td><td>三K起点固定、两次借兵均有K可用；随机只影响获得的高对点数<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9/10<\/td><td>用一次保留对K还是用两次追求第二个高对，是核心分支<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：农民略优。<\/strong><\/p>\n<p><strong>先手匹配度：中等。<\/strong> 地主能先处理其他结构并保留K作为借兵资源，但借兵必须等到无牌可压才可发动；先手对继志没有额外增益。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>开局K少于3张时，继志直接补牌至3张；原有K越少，净增加的手牌越多。<\/li><li>开局已有3张K时不额外补牌；已有4张或更多K时也不处理，完整保留原数量。<\/li><li>借兵只有在完全没有合法压牌时才能发动，不能在有牌可压时主动放弃应牌并换牌。<\/li><li>每次借兵弃1张K、获得2张同点数高牌，手牌净增加1张。<\/li><li>获得范围为不低于J的对子，但排除对K；主要候选为对J、对Q、对A、对2。<\/li><li>继志提供的三张K正好支持两次借兵，但两次全用会把三K拆至单K。<\/li><li>借兵只受“限2次”和当前是否有K可弃约束，与这是手中第几张K无关；即使只剩最后1张K，也能正常发动并将其弃置。<\/li><li>万能牌不参与孙策的继志或借兵机制，不计作K，也不能替代弃置成本。<\/li><li>借兵发动后跳过本次压牌，新增对子不能立即用于当前这一轮反压。<\/li><\/ul>\n<h3>一次与两次借兵的结构差异<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>使用次数<\/th><th>K结构变化<\/th><th>新增结构<\/th><th>净牌量<\/th><th>主流判断<\/th><\/tr><\/thead><tbody>\n<tr><td>0次<\/td><td>保留三K<\/td><td>无<\/td><td>0<\/td><td>三K已能高效并入三带、飞机或发展炸弹<\/td><\/tr>\n<tr><td>1次<\/td><td>三K变对K<\/td><td>1个J以上对子<\/td><td>+1<\/td><td>最均衡路线：保留高对K，同时获得另一个高对<\/td><\/tr>\n<tr><td>2次<\/td><td>对K变单K<\/td><td>2个J以上对子<\/td><td>+2<\/td><td>控制牌更多，但留下单K并增加总牌量，要求新对子能明显重组<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>默认最优通常是使用一次。<\/strong> 对K本身是稳定回手结构，第一次借兵完成“对K＋随机高对”；第二次借兵是否值得，取决于新对子能否形成三张、炸弹、连对或解决残局控制问题。<\/p>\n<h3>借兵奖励优先结果<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>随机对子<\/th><th>价值判断<\/th><\/tr><\/thead><tbody>\n<tr><td>对2<\/td><td>最高质量控制牌，第二次借兵的必要性通常下降<\/td><\/tr>\n<tr><td>对A<\/td><td>强回手牌，可与已有A组成三张或炸弹<\/td><\/tr>\n<tr><td>对Q<\/td><td>适合与对K、对J组成连对，或补现有Q结构<\/td><\/tr>\n<tr><td>对J<\/td><td>点数最低，但容易进入J-Q-K-A区间连对和三带结构<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>获得对子后应先检查同点数原牌：原有1张可形成三张，原有2张可直接形成四张炸弹；这种情况下借兵的增牌成本会迅速转化为结构收益。<\/p>\n<h3>主流打法<\/h3>\n<h4>地主：三K保留与单次转换<\/h4>\n<ul><li>首攻优先处理不依赖K的长顺、连对、飞机等结构，不急于消耗三K。<\/li><li>三K可直接作为三带结构，也可保留为两次借兵的资源池。<\/li><li>第一次无牌可压时通常发动，形成对K加随机高对的双控制结构。<\/li><li>若第一次获得对A或对2，往往停止第二次借兵，避免把对K拆成孤K。<\/li><li>只有第二次新增对子能显著降低静态手数，或必须增加拦截资源时，才继续转换。<\/li><\/ul>\n<h4>农民：反应型高对补给<\/h4>\n<ul><li>无法压住地主的关键牌型时发动第一次借兵，用新增高对准备下一轮拦截。<\/li><li>保留对K有利于与队友建立双重回手，因此不默认用满两次。<\/li><li>地主进入少牌阶段时，即使第二次会留下单K，也可换取对A或对2的潜在封锁能力。<\/li><li>新增对子无法处理当前牌面，发动借兵等于接受本轮失去牌权；必须评估地主是否会直接走完。<\/li><\/ul>\n<h3>叫地主判断<\/h3>\n<ul><li>开局0至1张K：继志补牌量较大，但直接形成三K，属于明显结构收益，不应只按“手牌变多”降分。<\/li><li>开局2张K：只增加1张便形成三K，是继志效率最高的起手。<\/li><li>开局3张K：没有增牌，保留原生三K并获得两次转换权，结构最干净。<\/li><li>有三带出口、K炸潜力或J/Q/A/2对子底子时，孙策更适合叫地主。<\/li><li>若原手牌已经对子过多、缺少带牌和长结构，借兵继续增加对子可能使手数恶化，不宜只凭三K强叫。<\/li><\/ul>\n<h3>关键风险<\/h3>\n<ul><li>借兵每次净增1张，并非直接减手技能。<\/li><li>第二次发动会把对K拆成单K，可能从两手变成三手。<\/li><li>新增对子随机，无法保证获得对2或补中现有点数。<\/li><li>无牌可压时若地主即将走完，发动借兵也无法立即阻止本轮出牌。<\/li><li>过早打掉K会失去后续借兵资格；过度保K又可能错过直接减手窗口。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>借兵随机对子是否只包含J、Q、A、2，四种结果的权重是否相等。<\/li><li>借兵获得的对子及点数是否向其他玩家公开。<\/li><\/ul>\n<h3>已确认的操作结论<\/h3>\n<ul><li>继志只做向上补足，不会把4张及以上K压回3张，也不会拆分原生K炸弹。<\/li><li>两次借兵是独立的固定次数，最后一张K仍是合法成本；不存在必须保留某一张K的隐藏限制。<\/li><li>万能牌与该武将两项技能完全无关，分析时不纳入K资源池。<\/li><\/ul>", "search": "  孙策\n\n 孙策技能截图一 技能截图/孙策-1.png \n\n 孙策技能截图二 技能截图/孙策-2.png \n\n  技能\n\n 继志｜被动｜限1次 \n\n  开局时，将手牌中的k补充至3张。\n\n 借兵｜主动｜限2次 \n\n  无牌可压时，可以弃置1张k，并获得1个不低于j的对子，然后跳过压牌；获得的对子不会是k。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8.5/10   开局稳定获得三k结构，但借兵依赖无牌可压，先手不能直接启动  \n  农民   9/10   更容易进入无牌可压窗口，高对可用于后续拦截或与队友建立控制链  \n  稳定性   9/10   三k起点固定、两次借兵均有k可用；随机只影响获得的高对点数  \n  操作上限   9/10   用一次保留对k还是用两次追求第二个高对，是核心分支  \n\n 身份倾向：农民略优。 \n\n 先手匹配度：中等。  地主能先处理其他结构并保留k作为借兵资源，但借兵必须等到无牌可压才可发动；先手对继志没有额外增益。\n\n  核心机制\n\n- 开局k少于3张时，继志直接补牌至3张；原有k越少，净增加的手牌越多。\n- 开局已有3张k时不额外补牌；已有4张或更多k时也不处理，完整保留原数量。\n- 借兵只有在完全没有合法压牌时才能发动，不能在有牌可压时主动放弃应牌并换牌。\n- 每次借兵弃1张k、获得2张同点数高牌，手牌净增加1张。\n- 获得范围为不低于j的对子，但排除对k；主要候选为对j、对q、对a、对2。\n- 继志提供的三张k正好支持两次借兵，但两次全用会把三k拆至单k。\n- 借兵只受“限2次”和当前是否有k可弃约束，与这是手中第几张k无关；即使只剩最后1张k，也能正常发动并将其弃置。\n- 万能牌不参与孙策的继志或借兵机制，不计作k，也不能替代弃置成本。\n- 借兵发动后跳过本次压牌，新增对子不能立即用于当前这一轮反压。\n\n  一次与两次借兵的结构差异\n\n  使用次数   k结构变化   新增结构   净牌量   主流判断  \n ---: --- --- ---: --- \n  0次   保留三k   无   0   三k已能高效并入三带、飞机或发展炸弹  \n  1次   三k变对k   1个j以上对子   +1   最均衡路线：保留高对k，同时获得另一个高对  \n  2次   对k变单k   2个j以上对子   +2   控制牌更多，但留下单k并增加总牌量，要求新对子能明显重组  \n\n 默认最优通常是使用一次。  对k本身是稳定回手结构，第一次借兵完成“对k＋随机高对”；第二次借兵是否值得，取决于新对子能否形成三张、炸弹、连对或解决残局控制问题。\n\n  借兵奖励优先结果\n\n  随机对子   价值判断  \n --- --- \n  对2   最高质量控制牌，第二次借兵的必要性通常下降  \n  对a   强回手牌，可与已有a组成三张或炸弹  \n  对q   适合与对k、对j组成连对，或补现有q结构  \n  对j   点数最低，但容易进入j-q-k-a区间连对和三带结构  \n\n获得对子后应先检查同点数原牌：原有1张可形成三张，原有2张可直接形成四张炸弹；这种情况下借兵的增牌成本会迅速转化为结构收益。\n\n  主流打法\n\n  地主：三k保留与单次转换\n\n- 首攻优先处理不依赖k的长顺、连对、飞机等结构，不急于消耗三k。\n- 三k可直接作为三带结构，也可保留为两次借兵的资源池。\n- 第一次无牌可压时通常发动，形成对k加随机高对的双控制结构。\n- 若第一次获得对a或对2，往往停止第二次借兵，避免把对k拆成孤k。\n- 只有第二次新增对子能显著降低静态手数，或必须增加拦截资源时，才继续转换。\n\n  农民：反应型高对补给\n\n- 无法压住地主的关键牌型时发动第一次借兵，用新增高对准备下一轮拦截。\n- 保留对k有利于与队友建立双重回手，因此不默认用满两次。\n- 地主进入少牌阶段时，即使第二次会留下单k，也可换取对a或对2的潜在封锁能力。\n- 新增对子无法处理当前牌面，发动借兵等于接受本轮失去牌权；必须评估地主是否会直接走完。\n\n  叫地主判断\n\n- 开局0至1张k：继志补牌量较大，但直接形成三k，属于明显结构收益，不应只按“手牌变多”降分。\n- 开局2张k：只增加1张便形成三k，是继志效率最高的起手。\n- 开局3张k：没有增牌，保留原生三k并获得两次转换权，结构最干净。\n- 有三带出口、k炸潜力或j/q/a/2对子底子时，孙策更适合叫地主。\n- 若原手牌已经对子过多、缺少带牌和长结构，借兵继续增加对子可能使手数恶化，不宜只凭三k强叫。\n\n  关键风险\n\n- 借兵每次净增1张，并非直接减手技能。\n- 第二次发动会把对k拆成单k，可能从两手变成三手。\n- 新增对子随机，无法保证获得对2或补中现有点数。\n- 无牌可压时若地主即将走完，发动借兵也无法立即阻止本轮出牌。\n- 过早打掉k会失去后续借兵资格；过度保k又可能错过直接减手窗口。\n\n  待实测\n\n- 借兵随机对子是否只包含j、q、a、2，四种结果的权重是否相等。\n- 借兵获得的对子及点数是否向其他玩家公开。\n\n  已确认的操作结论\n\n- 继志只做向上补足，不会把4张及以上k压回3张，也不会拆分原生k炸弹。\n- 两次借兵是独立的固定次数，最后一张k仍是合法成本；不存在必须保留某一张k的隐藏限制。\n- 万能牌与该武将两项技能完全无关，分析时不纳入k资源池。\n"}, {"name": "庞统", "faction": "蜀", "skills": "疑兵、连环", "position": "三J启动、三带连锁与对子补三", "status": "初步分析", "landlord": 9.5, "farmer": 8.5, "identity": "强地主型。", "firstMove": "极高", "image": "", "html": "<h3>技能<\/h3>\n<p><strong>疑兵｜被动｜限1次<\/strong><\/p>\n<blockquote>开局时，将你手牌中J的数量补充至3张。<\/blockquote>\n<p><strong>连环｜被动｜限2次<\/strong><\/p>\n<blockquote>你打出三带牌型时，手中的随机1个对子补充至3张。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9.5/10<\/td><td>三J配合先手可主动启动连环，20张牌也更容易保有后续对子<\/td><\/tr>\n<tr><td>农民<\/td><td>8.5/10<\/td><td>同样能获得三J和两次补三，但启动节奏更依赖获得牌权<\/td><\/tr>\n<tr><td>稳定性<\/td><td>9/10<\/td><td>开局固定形成至少三J；连环目标虽随机，但对子通常容易准备<\/td><\/tr>\n<tr><td>爆发上限<\/td><td>9.5/10<\/td><td>三J打出后补出新三张，可连续形成三带链并快速压缩手数<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：强地主型。<\/strong> 地主先手可以立刻打三J带牌，主动触发第一次连环，再用新三张继续组织第二次三带。<\/p>\n<p><strong>先手匹配度：极高。<\/strong> 疑兵直接提供首攻核心，避免等待对手出牌；只要手中有对子和合适带牌，就能从第一轮启动技能链。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>疑兵在开局把J补至3张：0张补3张、1张补2张、2张补1张、已有3张不补。<\/li><li>三J是一组稳定的三带核心，也是连环第一次触发的启动器。<\/li><li>连环在庞统打出三带牌型后，从当前手牌的对子中随机选择1组，并补1张使其成为三张。<\/li><li>连环最多触发2次，理想路线是三J启动后连续生成两组三张。<\/li><li>若手中存在多个对子，补三目标随机，因此应提前出掉低价值干扰对子。<\/li><li>整体强度取决于“可用对子数量＋三带所需附件”是否足够。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：三J首攻连锁<\/h4>\n<ul><li>起手先整理对子，尽量只保留最希望补成三张的目标对子。<\/li><li>第一手优先三J带低价值单张或对子，立即触发连环。<\/li><li>新生成的三张继续组成第二手三带，再触发第二次补三。<\/li><li>两次连环结束后，以新三张、剩余长牌和控制牌完成残局。<\/li><li>若首手三带会被轻易压且没有回手，先用其他强结构建立保护。<\/li><\/ul>\n<h4>农民：等待牌权后连发<\/h4>\n<ul><li>保留三J与目标对子，获得牌权后争取连续完成两次三带。<\/li><li>队友可通过让权帮助庞统启动，不必用三J强行争抢高牌。<\/li><li>随机对子中若含关键连对，应先判断补三会不会拆坏整体结构。<\/li><li>地主进入短牌阶段时，控制优先，不为完成连环放弃拦截。<\/li><\/ul>\n<h3>起手判断<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>原有J数量<\/th><th>疑兵后<\/th><th>价值<\/th><\/tr><\/thead><tbody>\n<tr><td>0<\/td><td>3张J<\/td><td>净增3张，但获得稳定三带核心<\/td><\/tr>\n<tr><td>1<\/td><td>3张J<\/td><td>净增2张，结构较好<\/td><\/tr>\n<tr><td>2<\/td><td>3张J<\/td><td>只增1张，效率最佳<\/td><\/tr>\n<tr><td>3<\/td><td>3张J<\/td><td>不增牌，直接获得技能启动结构<\/td><\/tr>\n<tr><td>≥4<\/td><td>保留原数量<\/td><td>原有J炸价值高，疑兵通常不再补牌<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>关键风险<\/h3>\n<ul><li>疑兵会增加牌量，原有J越少，初始增牌负担越大。<\/li><li>多个对子并存时连环随机，可能补中并不需要的点数。<\/li><li>缺少三带附件或缺少对子时，技能链无法完整展开。<\/li><li>连续三带需要持续牌权，第一手被压后可能中断节奏。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>原有4张或更多J时是否完全不处理并保留原数量。<\/li><li>连环的“三带牌型”包含三带一、三带二及飞机带牌中的哪些类型。<\/li><li>多个对子并存时是否严格等概率随机。<\/li><li>万能牌参与对子时是否会被纳入随机补三目标。<\/li><li>补出的牌是否全场公开，且是否与普通牌完全等价。<\/li><li>打出最后一手三带直接获胜时，是否还结算连环。<\/li><\/ul>", "search": "  庞统\n\n  技能\n\n 疑兵｜被动｜限1次 \n\n  开局时，将你手牌中j的数量补充至3张。\n\n 连环｜被动｜限2次 \n\n  你打出三带牌型时，手中的随机1个对子补充至3张。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9.5/10   三j配合先手可主动启动连环，20张牌也更容易保有后续对子  \n  农民   8.5/10   同样能获得三j和两次补三，但启动节奏更依赖获得牌权  \n  稳定性   9/10   开局固定形成至少三j；连环目标虽随机，但对子通常容易准备  \n  爆发上限   9.5/10   三j打出后补出新三张，可连续形成三带链并快速压缩手数  \n\n 身份倾向：强地主型。  地主先手可以立刻打三j带牌，主动触发第一次连环，再用新三张继续组织第二次三带。\n\n 先手匹配度：极高。  疑兵直接提供首攻核心，避免等待对手出牌；只要手中有对子和合适带牌，就能从第一轮启动技能链。\n\n  核心机制\n\n- 疑兵在开局把j补至3张：0张补3张、1张补2张、2张补1张、已有3张不补。\n- 三j是一组稳定的三带核心，也是连环第一次触发的启动器。\n- 连环在庞统打出三带牌型后，从当前手牌的对子中随机选择1组，并补1张使其成为三张。\n- 连环最多触发2次，理想路线是三j启动后连续生成两组三张。\n- 若手中存在多个对子，补三目标随机，因此应提前出掉低价值干扰对子。\n- 整体强度取决于“可用对子数量＋三带所需附件”是否足够。\n\n  主流打法\n\n  地主：三j首攻连锁\n\n- 起手先整理对子，尽量只保留最希望补成三张的目标对子。\n- 第一手优先三j带低价值单张或对子，立即触发连环。\n- 新生成的三张继续组成第二手三带，再触发第二次补三。\n- 两次连环结束后，以新三张、剩余长牌和控制牌完成残局。\n- 若首手三带会被轻易压且没有回手，先用其他强结构建立保护。\n\n  农民：等待牌权后连发\n\n- 保留三j与目标对子，获得牌权后争取连续完成两次三带。\n- 队友可通过让权帮助庞统启动，不必用三j强行争抢高牌。\n- 随机对子中若含关键连对，应先判断补三会不会拆坏整体结构。\n- 地主进入短牌阶段时，控制优先，不为完成连环放弃拦截。\n\n  起手判断\n\n  原有j数量   疑兵后   价值  \
