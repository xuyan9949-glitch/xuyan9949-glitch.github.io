<body><div class="app">
<header class="topbar"><div class="top-inner"><div class="brand"><div class="eyebrow">LOCAL STRATEGY ARCHIVE</div><h1>三国百将牌 · 武将研究库</h1></div><div class="search"><input id="search" placeholder="搜索武将、技能、炸弹、万能牌、顺子……" autocomplete="off"></div><div class="count" id="count"></div></div></header>
<main class="layout"><section class="catalog"><div class="toolbar"><div class="filters" id="filters"></div><select id="sort"><option value="default">默认排序</option><option value="landlord">地主评分</option><option value="farmer">农民评分</option><option value="name">武将名称</option></select></div><div class="grid" id="grid"></div></section><aside class="detail" id="detail"><div class="detail-empty"><div><div style="font-size:46px">将</div><p>选择一名武将查看完整研究</p></div></div></aside></main>
</div><script>
const heroes=[{"name": "关羽", "faction": "蜀", "skills": "单骑、武圣", "position": "顺子收益、万能牌与定向复制", "status": "主要规则已实测", "landlord": 9.0, "farmer": 8.5, "identity": "地主略优。", "firstMove": "极高", "html": "<h3>技能<\/h3>\n<p><strong>单骑｜被动｜限1次<\/strong><\/p>\n<blockquote>你打出顺子时，获得1张【万能牌】。<\/blockquote>\n<p><strong>武圣｜主动响应｜限2次<\/strong><\/p>\n<blockquote>其他玩家打出顺子后，你可以从这手顺子里选1张加入手牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9/10<\/td><td>先手可主动出顺子拿万能牌，20张手牌也更容易形成顺子<\/td><\/tr>\n<tr><td>农民<\/td><td>8.5/10<\/td><td>可由队友稳定提供顺子和关键普通点数，但武圣不能复制其中的万能牌<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8/10<\/td><td>单骑可主动触发；农民可由队友提高武圣触发稳定性<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>万能牌、连续武圣与队友协作带来高组合上限<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：地主略优。<\/strong> 地主能靠单骑稳定自取万能牌；农民虽有队友协作，但武圣只能复制顺子中的普通牌。<\/p>\n<p><strong>先手匹配度：极高。<\/strong> 地主第一手即可主动打顺子，稳定获得万能牌，再用万能牌重构剩余牌型；不需要等待对手配合。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>单骑把一次顺子出牌转化为1张万能牌，实际净减牌数为“顺子长度−1”。<\/li><li>万能牌可代替除大小王外的任意点数，可参与炸弹和特殊牌型，也可单独打出；单出时按当时点数结算。<\/li><li>武圣并非从原顺子中移走牌，而是复制所选牌加入手牌；原玩家的顺子仍完整结算。<\/li><li>“其他玩家”包括队友，队友可以主动提供顺子触发武圣。<\/li><li>若其他玩家的顺子中包含万能牌，武圣不能选择复制该万能牌；只能从其中的普通点数牌选择1张复制。<\/li><li>两次武圣可以在同一轮连续触发。<\/li><li>两个技能都围绕顺子展开：单骑提供万能牌，武圣补连接张或重复点数。<\/li><li>武圣不仅是收益技能，也会迫使对手减少顺子使用，具有牌型威慑。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：首顺启动型<\/h4>\n<ol><li>起手优先寻找不破坏核心结构的顺子。<\/li><li>第一轮主动出顺子，尽早拿到万能牌。<\/li><li>万能牌优先用于直接减少一手的结构，不为单纯补大牌浪费。<\/li><li>武圣只拿能立即成型或显著缩短尾牌的点数。<\/li><li>万能牌与武圣选牌共同服务于一至两手收尾。<\/li><\/ol>\n<p>地主首顺不是越长越好。若超长顺子会拆掉多组三张、对子或炸弹，应比较拿到万能牌后的整体手数再决定。<\/p>\n<h4>农民：协作回收型<\/h4>\n<ul><li>队友出顺子时，可定向复制己方需要的连接张；原顺子不受影响。<\/li><li>队友顺子中带有万能牌时，应忽略万能牌，只在其余普通点数牌中选择结构收益最高的一张。<\/li><li>同一轮出现两次顺子机会时，可连续使用两次武圣，快速完成炸弹或特殊牌型。<\/li><li>地主出顺子时，优先拿能形成炸弹、三张、连对或补齐己方顺子的牌。<\/li><li>地主接近走完时，武圣拿牌的首要目标是生成拦截牌，而不是单纯优化长期结构。<\/li><li>单骑尽量用于已经计划要出的顺子，不为触发技能强拆其他高价值组合。<\/li><\/ul>\n<h3>武圣选牌优先级<\/h3>\n<ol><li>复制后直接减少一手的普通点数牌。<\/li><li>补成长炸弹或特殊牌型的点数。<\/li><li>补成三张、飞机、连对或完整顺子的牌。<\/li><li>补齐另一条顺子的连接张。<\/li><li>形成高对或关键回手牌。<\/li><li>单独的大牌。<\/li><\/ol>\n<p>单纯选顺子中的最高点数通常不是最优。若一张中间连接牌能让尾牌少一手，其价值高于孤立的A。<\/p>\n<h3>万能牌使用优先级<\/h3>\n<ol><li>补成可以直接走完的最后牌型。<\/li><li>补成长炸弹或特殊牌型。<\/li><li>补飞机、长顺或连对，使总手数下降。<\/li><li>修复被拆断的关键结构。<\/li><li>单独作为所需点数出牌或回手。<\/li><\/ol>\n<p>万能牌只有一次获取机会，核心评价标准是“使用后少几手”，不是“变成多大的牌”。<\/p>\n<h3>主要风险<\/h3>\n<ul><li>为触发单骑强拆对子、三张或炸弹，整体手数可能反而增加。<\/li><li>武圣每次使手牌增加1张；选牌不能立即成型时可能拖慢收尾。<\/li><li>对手知道关羽技能后，可以主动减少顺子，压低武圣收益。<\/li><li>过早消耗万能牌，会降低残局修牌能力。<\/li><li>连续复制两张虽然上限高，但会让手牌增加2张；不能成型时不应为了用完次数而强拿。<\/li><\/ul>\n<h3>已确认的联动结论<\/h3>\n<ul><li>队友打出含万能牌的顺子时，原顺子照常结算，但关羽不能复制万能牌，只能复制其中的普通牌。<\/li><li>连续两次武圣可以在一个轮次内迅速补齐同点数炸弹、飞机或其他特殊牌型。<\/li><li>万能牌既能修结构，也能直接当作所需点数出牌，因此无需为“留万能牌”牺牲明确的当轮胜势。<\/li><li>武圣的本质是定向复制而非回收，不能用传统“拿牌会破坏对方顺子”的思路评估。<\/li><\/ul>", "search": "  关羽\n\n 关羽  \n\n  技能\n\n 单骑｜被动｜限1次 \n\n  你打出顺子时，获得1张【万能牌】。\n\n 武圣｜主动响应｜限2次 \n\n  其他玩家打出顺子后，你可以从这手顺子里选1张加入手牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9/10   先手可主动出顺子拿万能牌，20张手牌也更容易形成顺子  \n  农民   8.5/10   可由队友稳定提供顺子和关键普通点数，但武圣不能复制其中的万能牌  \n  稳定性   8/10   单骑可主动触发；农民可由队友提高武圣触发稳定性  \n  操作上限   9.5/10   万能牌、连续武圣与队友协作带来高组合上限  \n\n 身份倾向：地主略优。  地主能靠单骑稳定自取万能牌；农民虽有队友协作，但武圣只能复制顺子中的普通牌。\n\n 先手匹配度：极高。  地主第一手即可主动打顺子，稳定获得万能牌，再用万能牌重构剩余牌型；不需要等待对手配合。\n\n  核心机制\n\n- 单骑把一次顺子出牌转化为1张万能牌，实际净减牌数为“顺子长度−1”。\n- 万能牌可代替除大小王外的任意点数，可参与炸弹和特殊牌型，也可单独打出；单出时按当时点数结算。\n- 武圣并非从原顺子中移走牌，而是复制所选牌加入手牌；原玩家的顺子仍完整结算。\n- “其他玩家”包括队友，队友可以主动提供顺子触发武圣。\n- 若其他玩家的顺子中包含万能牌，武圣不能选择复制该万能牌；只能从其中的普通点数牌选择1张复制。\n- 两次武圣可以在同一轮连续触发。\n- 两个技能都围绕顺子展开：单骑提供万能牌，武圣补连接张或重复点数。\n- 武圣不仅是收益技能，也会迫使对手减少顺子使用，具有牌型威慑。\n\n  主流打法\n\n  地主：首顺启动型\n\n1. 起手优先寻找不破坏核心结构的顺子。\n2. 第一轮主动出顺子，尽早拿到万能牌。\n3. 万能牌优先用于直接减少一手的结构，不为单纯补大牌浪费。\n4. 武圣只拿能立即成型或显著缩短尾牌的点数。\n5. 万能牌与武圣选牌共同服务于一至两手收尾。\n\n地主首顺不是越长越好。若超长顺子会拆掉多组三张、对子或炸弹，应比较拿到万能牌后的整体手数再决定。\n\n  农民：协作回收型\n\n- 队友出顺子时，可定向复制己方需要的连接张；原顺子不受影响。\n- 队友顺子中带有万能牌时，应忽略万能牌，只在其余普通点数牌中选择结构收益最高的一张。\n- 同一轮出现两次顺子机会时，可连续使用两次武圣，快速完成炸弹或特殊牌型。\n- 地主出顺子时，优先拿能形成炸弹、三张、连对或补齐己方顺子的牌。\n- 地主接近走完时，武圣拿牌的首要目标是生成拦截牌，而不是单纯优化长期结构。\n- 单骑尽量用于已经计划要出的顺子，不为触发技能强拆其他高价值组合。\n\n  武圣选牌优先级\n\n1. 复制后直接减少一手的普通点数牌。\n2. 补成长炸弹或特殊牌型的点数。\n3. 补成三张、飞机、连对或完整顺子的牌。\n4. 补齐另一条顺子的连接张。\n5. 形成高对或关键回手牌。\n6. 单独的大牌。\n\n单纯选顺子中的最高点数通常不是最优。若一张中间连接牌能让尾牌少一手，其价值高于孤立的a。\n\n  万能牌使用优先级\n\n1. 补成可以直接走完的最后牌型。\n2. 补成长炸弹或特殊牌型。\n3. 补飞机、长顺或连对，使总手数下降。\n4. 修复被拆断的关键结构。\n5. 单独作为所需点数出牌或回手。\n\n万能牌只有一次获取机会，核心评价标准是“使用后少几手”，不是“变成多大的牌”。\n\n  主要风险\n\n- 为触发单骑强拆对子、三张或炸弹，整体手数可能反而增加。\n- 武圣每次使手牌增加1张；选牌不能立即成型时可能拖慢收尾。\n- 对手知道关羽技能后，可以主动减少顺子，压低武圣收益。\n- 过早消耗万能牌，会降低残局修牌能力。\n- 连续复制两张虽然上限高，但会让手牌增加2张；不能成型时不应为了用完次数而强拿。\n\n  已确认的联动结论\n\n- 队友打出含万能牌的顺子时，原顺子照常结算，但关羽不能复制万能牌，只能复制其中的普通牌。\n- 连续两次武圣可以在一个轮次内迅速补齐同点数炸弹、飞机或其他特殊牌型。\n- 万能牌既能修结构，也能直接当作所需点数出牌，因此无需为“留万能牌”牺牲明确的当轮胜势。\n- 武圣的本质是定向复制而非回收，不能用传统“拿牌会破坏对方顺子”的思路评估。\n"}, {"name": "关银屏", "faction": "蜀", "skills": "花武", "position": "强制增牌、中高牌增殖与多炸成长", "status": "主要规则已实测", "landlord": 8.5, "farmer": 9.0, "identity": "农民略优。", "firstMove": "高，但不是纯正收益", "html": "<h3>技能<\/h3>\n<p><strong>花武｜被动｜限5次<\/strong><\/p>\n<blockquote>任意玩家打出张数不少于4张的牌型时，你从J、Q、K中随机获得1张牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8.5/10<\/td><td>先手可主动用多张牌型启动花武，但新增牌会持续抵消减手效率<\/td><\/tr>\n<tr><td>农民<\/td><td>9/10<\/td><td>队友能协助触发，新增J/Q/K兼具拦截、组对与重构价值<\/td><\/tr>\n<tr><td>稳定性<\/td><td>7.5/10<\/td><td>触发条件清晰，但奖励点数随机，且最多增加5张手牌<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9/10<\/td><td>核心在触发密度、新牌重组和停止增牌后的残局设计<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：农民略优。<\/strong><\/p>\n<p><strong>先手匹配度：高，但不是纯正收益。<\/strong> 地主可以首手打出顺子、连对、三带一或其他四张以上牌型，稳定触发第一张奖励；但每次补牌都会降低当手的实际减牌量，必须依靠连续重组才能兑现优势。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>任意玩家均可触发，包括关银屏自己、队友和对手。<\/li><li>触发条件只看该次合法牌型的总张数是否不少于4张，与具体牌型无关。<\/li><li>每次触发随机获得1张J、Q或K，最多触发5次。<\/li><li>花武属于强制发牌，满足条件便触发，不能主动放弃；即使关银屏只剩少量手牌也会增牌。<\/li><li>新增牌的具体点数向全场公开，技能窗口会显示已触发或剩余次数。<\/li><li>技能生成的J/Q/K没有特殊标记，与普通牌完全等价。<\/li><li>完整触发会额外获得5张牌，优势是中高点数集中，代价是总牌量明显增加。<\/li><li>J、Q、K彼此相邻，天然适合补顺子；重复点数则适合发展对子、三张与超量同点数炸弹。<\/li><li>花武本身不直接提供牌权，新增牌必须通过正常牌型打出。<\/li><\/ul>\n<h3>新增牌的结构优先级<\/h3>\n<ol><li>与原手牌同点数合成三张、炸弹或更长同点数炸弹。<\/li><li>补齐10-J-Q-K-A区间顺子，或延长已有顺子。<\/li><li>形成JQK区间连对、飞机组件或三带结构。<\/li><li>保留对K、对Q作为中后盘回手点。<\/li><li>无法并入组合的单J、单Q、单K尽早择机处理。<\/li><\/ol>\n<p>花武的判断核心不是获得了几张牌，而是新增牌最终让静态手数减少还是增加。<\/p>\n<h3>主流打法<\/h3>\n<h4>地主：长牌型启动，边打边重组<\/h4>\n<ul><li>首攻优先选择原本就要打出的长顺、连对或飞机，既建立减手优势，也完成首次触发。<\/li><li>首次获得J/Q/K后立即重算10到A区间，不宜固守开局拆牌方案。<\/li><li>已有J、Q、K对子或三张时，可主动提高四张以上牌型的出牌频率，争取向炸弹或连续结构成长。<\/li><li>奖励接近5次前，应提前规划最终新增牌的落点，避免满触发后留下多个中高单张。<\/li><li>有直接走完路线时不为追满5次而延长牌局。<\/li><\/ul>\n<p>地主的高效路线是：<\/p>\n<blockquote>首手长结构减牌 → 新增牌并入中高区 → 再用重构牌型批量输出 → 奖励耗尽后收尾。<\/blockquote>\n<h4>农民：队友协同重构<\/h4>\n<ul><li>队友自然拥有顺子、连对、三带或飞机时，可在不牺牲牌权的前提下帮助触发花武。<\/li><li>新增K/Q更适合保留拦截；新增J更偏向顺子、连对和带牌重组。<\/li><li>地主少牌时不能为了触发奖励放弃立即封锁，新增牌不会自动转化为牌权。<\/li><li>若关银屏手中已有J/Q/K密集结构，队友连续打出四张以上牌型可以快速将其推向炸弹或多组对子。<\/li><li>农民优势来自队友可控触发，不是盲目把5次奖励全部灌满。<\/li><\/ul>\n<h3>触发牌型价值<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>触发方式<\/th><th>评价<\/th><\/tr><\/thead><tbody>\n<tr><td>长顺、长连对、飞机<\/td><td>本身减牌量大，最能消化花武增牌<\/td><\/tr>\n<tr><td>三带一、三带二<\/td><td>触发成本低，适合主动启动<\/td><\/tr>\n<tr><td>四张及以上炸弹<\/td><td>控场与触发兼得，但不应仅为花武提前消耗<\/td><\/tr>\n<tr><td>队友自然多张牌型<\/td><td>农民最优触发来源，不占用自己的出牌机会<\/td><\/tr>\n<tr><td>为触发而强拆组合<\/td><td>通常收益低，容易使新增牌成为额外负担<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>起手J/Q/K与成炸进度<\/h3>\n<p>计算口径：每次花武独立、J/Q/K等概率各1/3；同点数达到4张即形成炸弹。结构按数量降序表示，例如3-2-1不区分具体点数。任一项起手已经达到4张的情况属于原生炸弹，不列入生成概率。<\/p>\n<p>“首炸期望进度”把5次内仍未成炸记为第6次，用于同时衡量速度和失败风险，数值越小越好。<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>起手结构<\/th><th>第1次<\/th><th>第2次<\/th><th>第3次<\/th><th>第4次<\/th><th>第5次<\/th><th>首炸期望进度<\/th><th>第5次至少双炸<\/th><th>炸弹数期望<\/th><\/tr><\/thead><tbody>\n<tr><td>3-3-3<\/td><td>100%<\/td><td>100%<\/td><td>100%<\/td><td>100%<\/td><td>100%<\/td><td>1.00<\/td><td>98.77%<\/td><td>2.605<\/td><\/tr>\n<tr><td>3-3-2<\/td><td>66.67%<\/td><td>100%<\/td><td>100%<\/td><td>100%<\/td><td>100%<\/td><td>1.33<\/td><td>94.65%<\/td><td>2.276<\/td><\/tr>\n<tr><td>3-3-1<\/td><td>66.67%<\/td><td>88.89%<\/td><td>100%<\/td><td>100%<\/td><td \/tr>\n<tr><td>B：有条件叫<\/td><td>3-1-0、3-0-0、2-2-1、2-2-0<\/td><td>最终首炸率91.77%以上，但形成偏慢；王、2、原生炸或长牌型至少占一项优势再叫<\/td><\/tr>\n<tr><td>C：不围绕炸弹决策<\/td><td>2-1-1、2-1-0、2-0-0、1-1-1<\/td><td>前3次首炸率不超过33.33%，不要保护J/Q/K等炸；按顺子、对子和正常减手处理<\/td><\/tr>\n<tr><td>D：基本无成炸优势<\/td><td>1-1-0、1-0-0、0-0-0<\/td><td>完整5次首炸率低于50%，花武主要视为随机增牌与结构扰动<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>不存在只凭J/Q/K结构就绝对“无脑叫地主”的结论。S级代表技能本身已经提供极强叫分理由；最终仍要排除完全缺少王、2、牌权和四张以上触发牌型的极端烂牌。<\/p>\n<p><strong>最佳实战结构不是单纯总数最多，而是多组三张。<\/strong> 3-3-x既最快形成首炸，也最容易形成双炸；3-2-2虽然首炸稍慢，但第五次双炸率仍有82.30%。2-2-2总数同样为6张，却要到第2次才可能成炸，爆发明显晚于3-2-1和3-2-0。<\/p>\n<h3>关键风险<\/h3>\n<ul><li>连续触发会不断增加手牌，四张牌型实际只净减少3张。<\/li><li>随机结果若分散为J、Q、K单张，可能增加静态手数。<\/li><li>对手也能强制触发花武，可在关银屏临近收尾时用多张牌型向其塞牌。<\/li><li>新增中高牌容易与原有顺子、对子方案发生竞争，必须持续重算。<\/li><li>追求5次满收益可能延误直接获胜窗口。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>J、Q、K的随机权重是否严格相等；当前概率表按各1/3计算。<\/li><\/ul>", "search": "  关银屏\n\n 关银屏  \n\n  技能\n\n 花武｜被动｜限5次 \n\n  任意玩家打出张数不少于4张的牌型时，你从j、q、k中随机获得1张牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8.5/10   先手可主动用多张牌型启动花武，但新增牌会持续抵消减手效率  \n  农民   9/10   队友能协助触发，新增j/q/k兼具拦截、组对与重构价值  \n  稳定性   7.5/10   触发条件清晰，但奖励点数随机，且最多增加5张手牌  \n  操作上限   9/10   核心在触发密度、新牌重组和停止增牌后的残局设计  \n\n 身份倾向：农民略优。 \n\n 先手匹配度：高，但不是纯正收益。  地主可以首手打出顺子、连对、三带一或其他四张以上牌型，稳定触发第一张奖励；但每次补牌都会降低当手的实际减牌量，必须依靠连续重组才能兑现优势。\n\n  核心机制\n\n- 任意玩家均可触发，包括关银屏自己、队友和对手。\n- 触发条件只看该次合法牌型的总张数是否不少于4张，与具体牌型无关。\n- 每次触发随机获得1张j、q或k，最多触发5次。\n- 花武属于强制发牌，满足条件便触发，不能主动放弃；即使关银屏只剩少量手牌也会增牌。\n- 新增牌的具体点数向全场公开，技能窗口会显示已触发或剩余次数。\n- 技能生成的j/q/k没有特殊标记，与普通牌完全等价。\n- 完整触发会额外获得5张牌，优势是中高点数集中，代价是总牌量明显增加。\n- j、q、k彼此相邻，天然适合补顺子；重复点数则适合发展对子、三张与超量同点数炸弹。\n- 花武本身不直接提供牌权，新增牌必须通过正常牌型打出。\n\n  新增牌的结构优先级\n\n1. 与原手牌同点数合成三张、炸弹或更长同点数炸弹。\n2. 补齐10-j-q-k-a区间顺子，或延长已有顺子。\n3. 形成jqk区间连对、飞机组件或三带结构。\n4. 保留对k、对q作为中后盘回手点。\n5. 无法并入组合的单j、单q、单k尽早择机处理。\n\n花武的判断核心不是获得了几张牌，而是新增牌最终让静态手数减少还是增加。\n\n  主流打法\n\n  地主：长牌型启动，边打边重组\n\n- 首攻优先选择原本就要打出的长顺、连对或飞机，既建立减手优势，也完成首次触发。\n- 首次获得j/q/k后立即重算10到a区间，不宜固守开局拆牌方案。\n- 已有j、q、k对子或三张时，可主动提高四张以上牌型的出牌频率，争取向炸弹或连续结构成长。\n- 奖励接近5次前，应提前规划最终新增牌的落点，避免满触发后留下多个中高单张。\n- 有直接走完路线时不为追满5次而延长牌局。\n\n地主的高效路线是：\n\n  首手长结构减牌 → 新增牌并入中高区 → 再用重构牌型批量输出 → 奖励耗尽后收尾。\n\n  农民：队友协同重构\n\n- 队友自然拥有顺子、连对、三带或飞机时，可在不牺牲牌权的前提下帮助触发花武。\n- 新增k/q更适合保留拦截；新增j更偏向顺子、连对和带牌重组。\n- 地主少牌时不能为了触发奖励放弃立即封锁，新增牌不会自动转化为牌权。\n- 若关银屏手中已有j/q/k密集结构，队友连续打出四张以上牌型可以快速将其推向炸弹或多组对子。\n- 农民优势来自队友可控触发，不是盲目把5次奖励全部灌满。\n\n  触发牌型价值\n\n  触发方式   评价  \n --- --- \n  长顺、长连对、飞机   本身减牌量大，最能消化花武增牌  \n  三带一、三带二   触发成本低，适合主动启动  \n  四张及以上炸弹   控场与触发兼得，但不应仅为花武提前消耗  \n  队友自然多张牌型   农民最优触发来源，不占用自己的出牌机会  \n  为触发而强拆组合   通常收益低，容易使新增牌成为额外负担  \n\n  起手j/q/k与成炸进度\n\n计算口径：每次花武独立、j/q/k等概率各1/3；同点数达到4张即形成炸弹。结构按数量降序表示，例如3-2-1不区分具体点数。任一项起手已经达到4张的情况属于原生炸弹，不列入生成概率。\n\n“首炸期望进度”把5次内仍未成炸记为第6次，用于同时衡量速度和失败风险，数值越小越好。\n\n  起手结构   第1次   第2次   第3次   第4次   第5次   首炸期望进度   第5次至少双炸   炸弹数期望  \n :---: ---: ---: ---: ---: ---: ---: ---: ---: \n  3-3-3   100%   100%   100%   100%   100%   1.00   98.77%   2.605  \n  3-3-2   66.67%   100%   100%   100%   100%   1.33   94.65%   2.276  \n  3-3-1   66.67%   88.89%   100%   100%   100%   1.44   86.42%   1.947  \n  3-3-0   66.67%   88.89%   96.30%   100%   100%   1.48   78.19%   1.782  \n  3-2-2   33.33%   77.78%   100%   100%   100%   1.89   82.30%   1.947  \n  3-2-1   33.33%   66.67%   88.89%   100%   100%   2.11   61.73%   1.617  \n  3-2-0   33.33%   66.67%   85.19%   95.06%   100%   2.20   45.27%   1.453  \n  3-1-1   33.33%   55.56%   77.78%   92.59%   100%   2.41   28.81%   1.288  \n  3-1-0   33.33%   55.56%   74.07%   87.65%   95.88%   2.53   16.46%   1.123  \n  3-0-0   33.33%   55.56%   70.37%   82.72%   91.77%   2.66   4.12%   0.959  \n  2-2-2   0%   33.33%   77.78%   100%   100%   2.89   61.73%   1.617  \n  2-2-1   0%   22.22%   55.56%   85.19%   100%   3.37   28.81%   1.288  \n  2-2-0   0%   22.22%   51.85%   75.31%   91.77%   3.59   20.58%   1.123  \n  2-1-1   0%   11.11%   33.33%   62.96%   87.65%   4.05   8.23%   0.959  \n  2-1-0   0%   11.11%   29.63%   53.09%   75.31%   4.31   4.12%   0.794  \n  2-0-0   0%   11.11%   25.93%   43.21%   62.96%   4.57   0%   0.630  \n  1-1-1   0%   0%   1 lockquote>增加“不屈”标记后，根据层数获得效果：<br>- 2层：手中除大小王外最大的单牌补充至对子；<br>- 3层：获得1张2；<br>- 4层：获得1张万能牌。<br>以此法获得2次万能牌后，“不屈”失效。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9.5/10<\/td><td>先手启动四连出牌，主动掌控叠层节奏，适配度极高<\/td><\/tr>\n<tr><td>农民<\/td><td>7.5/10<\/td><td>需要持续跟牌或取得牌权，叠层容易被地主打断<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8/10<\/td><td>奖励固定，满层不会自行清零，但连续叠层仍受牌权限制<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>首轮顺序、2层复制目标和主动争取第二轮决定上限<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：强地主型。<\/strong><\/p>\n<p><strong>先手匹配度：极高。<\/strong> 地主可以主动打出第一手并连续维持牌权，是最容易完成四层循环的身份。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>连续实际出牌是资源；牌权被其他玩家抢走本身不会使不屈清零。<\/li><li>轮到典韦压牌时，只有实际选择“不出”才会清零；若继续用更大牌反压，原层数保留并继续累积。<\/li><li>每轮从0层完整升至4层时依次获得：复制最大单牌成对、获得2、获得万能牌。<\/li><li>奖励会增加手牌，但牌质快速上升，重点是把新增牌压成对子、炸弹和特殊牌型。<\/li><li>达到4层并获得万能牌后会维持4层；继续出牌不会再次触发4层奖励。<\/li><li>清零后可以重新从1层叠起，第二次升至4层时取得第二张万能牌。<\/li><li>获得两次万能牌后不屈永久失效，完整上限为两轮四层循环。<\/li><li>手牌不多于3张时停止加层，不能利用技能无限拖延最后残局。<\/li><li>2层时若手中不存在符合条件的单牌，奖励直接跳过，不补偿其他牌。<\/li><li>技能新增的2和万能牌均公开。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：双循环成长型<\/h4>\n<h5>第一轮：先手四连<\/h5>\n<ol><li>首攻选择不易被压、且不会破坏后续应牌能力的完整组合。<\/li><li>第2层到来前，尽量让最有价值的高牌保持“单牌”状态。<\/li><li>第2层优先复制单2，其次A、K，直接形成高对。<\/li><li>第3层固定获得2，继续向多张2或炸弹结构发展。<\/li><li>第4层取得万能牌，立即重算尾牌。<\/li><\/ol>\n<h5>第二轮：重置再冲四层<\/h5>\n<p>达到4层并取得第一张万能牌后，继续出牌只会维持4层，不会重复获得万能牌。第二轮必须在典韦实际选择一次“不出”、层数清零后，再从1层重新叠至4层。<\/p>\n<p>不应为了清层主动放弃本可继续反压或直接走完的机会。只有确实需要不出且本局仍有足够回合时，才规划第二轮；能够直接获胜时立即结束。<\/p>\n<h4>农民：接力续层型<\/h4>\n<ul><li>队友取得牌权本身不会清层；但应避免用典韦无法继续反压的牌型迫使其不出。<\/li><li>第一目标通常是完成2层或3层，不强求每局两次四层。<\/li><li>地主即将走完时，保住出牌连续性比保留普通组合更重要。<\/li><li>一旦层数清零，应重新评估是否还有时间再启动，不宜沉没成本式强追。<\/li><\/ul>\n<h3>2层复制目标<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>最大单牌<\/th><th>结果<\/th><th>评价<\/th><\/tr><\/thead><tbody>\n<tr><td>2<\/td><td>补成对2<\/td><td>最优常规目标，回手稳定<\/td><\/tr>\n<tr><td>A<\/td><td>补成对A<\/td><td>高质量争权牌<\/td><\/tr>\n<tr><td>K/Q/J<\/td><td>补成高对<\/td><td>可继续争权或并入连对<\/td><\/tr>\n<tr><td>中低牌<\/td><td>补成普通对子<\/td><td>主要价值是减少孤张<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>为了让2层复制到理想牌，不应在首手提前打掉目标单牌，也要避免目标在2层前因其他组合变成非单牌状态。<\/p>\n<p>不存在“最大单牌并列”的实际判定问题：同点数两张牌已经构成对子，不属于单牌；剩余单牌按点数自然确定最高者。<\/p>\n<h3>万能牌路线<\/h3>\n<ul><li>第一张万能牌优先修复新增奖励造成的散牌，或补成长炸弹、飞机、连对。<\/li><li>第二张万能牌通常服务于直接收尾或构成高强度特殊牌型。<\/li><li>两张万能牌是技能上限，不应只当普通大牌使用。<\/li><\/ul>\n<h3>主要风险<\/h3>\n<ul><li>对手用典韦无法跟进的牌型逼其不出，可直接清空层数。<\/li><li>为维持层数强行拆炸弹、顺子或飞机，可能得不偿失。<\/li><li>2/3/4层连续增牌，若不能立即成型，会拖慢手数。<\/li><li>满4层后若始终保持牌权，只能维持当前状态，无法重复刷取万能牌。<\/li><li>为了开启第二轮故意选择不出，可能失去整局主动权，通常不值得。<\/li><li>手牌降到3张后不再叠层，接近残局才启动通常来不及。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>万能牌单独处于手牌时，是否会被2层“最大单牌补充至对子”选中，及其复制后的点数判定。<\/li><\/ul>\n<h3>已确认的清零规则<\/h3>\n<ul><li>牌权变化不是清零条件，其他玩家压过典韦后，不屈层数仍然保留。<\/li><li>典韦当轮用更大牌继续反压时，层数正常延续。<\/li><li>只有典韦实际选择“不出”时，不屈层数才清零。<\/li><\/ul>", "search": "  典韦\n\n 典韦1  \n 典韦2  \n 典韦3  \n\n  技能\n\n 不屈｜被动｜不限次数 \n\n  你出牌后，增加1层“不屈”标记，最多积累4层。不出时层数清零；手牌不多于3张时不增加层数。\n\n 血战｜被动｜不限次数 \n\n  增加“不屈”标记后，根据层数获得效果：\n \n  - 2层：手中除大小王外最大的单牌补充至对子；\n  - 3层：获得1张2；\n  - 4层：获得1张万能牌。\n \n  以此法获得2次万能牌后，“不屈”失效。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9.5/10   先手启动四连出牌，主动掌控叠层节奏，适配度极高  \n  农民   7.5/10   需要持续跟牌或取得牌权，叠层容易被地主打断  \n  稳定性   8/10   奖励固定，满层不会自行清零，但连续叠层仍受牌权限制  \n  操作上限   9.5/10   首轮顺序、2层复制目标和主动争取第二轮决定上限  \n\n 身份倾向：强地主型。 \n\n 先手匹配度：极高。  地主可以主动打出第一手并连续维持牌权，是最容易完成四层循环的身份。\n\n  核心机制\n\n- 连续实际出牌是资源；牌权被其他玩家抢走本身不会使不屈清零。\n- 轮到典韦压牌时，只有实际选择“不出”才会清零；若继续用更大牌反压，原层数保留并继续累积。\n- 每轮从0层完整升至4层时依次获得：复制最大单牌成对、获得2、获得万能牌。\n- 奖励会增加手牌，但牌质快速上升，重点是把新增牌压成对子、炸弹和特殊牌型。\n- 达到4层并获得万能牌后会维持4层；继续出牌不会再次触发4层奖励。\n- 清零后可以重新从1层叠起，第二次升至4层时取得第二张万能牌。\n- 获得两次万能牌后不屈永久失效，完整上限为两轮四层循环。\n- 手牌不多于3张时停止加层，不能利用技能无限拖延最后残局。\n- 2层时若手中不存在符合条件的单牌，奖励直接跳过，不补偿其他牌。\n- 技能新增的2和万能牌均公开。\n\n  主流打法\n\n  地主：双循环成长型\n\n  第一轮：先手四连\n\n1. 首攻选择不易被压、且不会破坏后续应牌能力的完整组合。\n2. 第2层到来前，尽量让最有价值的高牌保持“单牌”状态。\n3. 第2层优先复制单2，其次a、k，直接形成高对。\n4. 第3层固定获得2，继续向多张2或炸弹结构发展。\n5. 第4层取得万能牌，立即重算尾牌。\n\n  第二轮：重置再冲四层\n\n达到4层并取得第一张万能牌后，继续出牌只会维持4层，不会重复获得万能牌。第二轮必须在典韦实际选择一次“不出”、层数清零后，再从1层重新叠至4层。\n\n不应为了清层主动放弃本可继续反压或直接走完的机会。只有确实需要不出且本局仍有足够回合时，才规划第二轮；能够直接获胜时立即结束。\n\n  农民：接力续层型\n\n- 队友取得牌权本身不会清层；但应避免用典韦无法继续反压的牌型迫使其不出。\n- 第一目标通常是完成2层或3层，不强求每局两次四层。\n- 地主即将走完时，保住出牌连续性比保留普通组合更重要。\n- 一旦层数清零，应重新评估是否还有时间再启动，不宜沉没成本式强追。\n\n  2层复制目标\n\n  最大单牌   结果   评价  \n --- --- --- \n  2   补成对2   最优常规目标，回手稳定  \n  a   补成对a   高质量争权牌  \n  k/q/j   补成高对   可继续争权或并入连对  \n  中低牌   补成普通对子   主要价值是减少孤张  \n\n为了让2层复制到理想牌，不应在首手提前打掉目标单牌，也要避免目标在2层前因其他组合变成非单牌状态。\n\n不存在“最大单牌并列”的实际判定问题：同点数两张牌已经构成对子，不属于单牌；剩余单牌按点数自然确定最高者。\n\n  万能牌路线\n\n- 第一张万能牌优先修复新增奖励造成的散牌，或补成长炸弹、飞机、连对。\n- 第二张万能牌通常服务于直接收尾或构成高强度特殊牌型。\n- 两张万能牌是技能上限，不应只当普通大牌使用。\n\n  主要风险\n\n- 对手用典韦无法跟进的牌型逼其不出，可直接清空层数。\n- 为维持层数强行拆炸弹、顺子或飞机，可能得不偿失。\n- 2/3/4层连续增牌，若不能立即成型，会拖慢手数。\n- 满4层后若始终保持牌权，只能维持当前状态，无法重复刷取万能牌。\n- 为了开启第二轮故意选择不出，可能失去整局主动权，通常不值得。\n- 手牌降到3张后不再叠层，接近残局才启动通常来不及。\n\n  待实测\n\n- 万能牌单独处于手牌时，是否会被2层“最大单牌补充至对子”选中，及其复制后的点数判定。\n\n  已确认的清零规则\n\n- 牌权变化不是清零条件，其他玩家压过典韦后，不屈层数仍然保留。\n- 典韦当轮用更大牌继续反压时，层数正常延续。\n- 只有典韦实际选择“不出”时，不屈层数才清零。\n"}, {"name": "吕蒙", "faction": "吴", "skills": "勤学、顿悟", "position": "定向取牌、炸弹重置与二次补强", "status": "初步分析", "landlord": 8.5, "farmer": 9.5, "identity": "农民明显更优。", "firstMove": "偏低", "html": "<h3>技能<\/h3>\n<p><strong>勤学｜主动｜限1次<\/strong><\/p>\n<blockquote>轮到你压牌时，可以从上一手其他玩家打出的牌中选择至多2张获得，然后跳过压牌；无法获得王炸。<\/blockquote>\n<p><strong>顿悟｜被动｜限1次<\/strong><\/p>\n<blockquote>当你打出炸弹后，重置“勤学”的使用次数。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8.5/10<\/td><td>定向取牌质量高，但首手无法启动勤学，需要先让出一轮节奏<\/td><\/tr>\n<tr><td>农民<\/td><td>9.5/10<\/td><td>可同时利用地主与队友的出牌，队友还能主动输送关键张<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8.5/10<\/td><td>目标公开可选，但收益受上一手牌型与自身炸弹数量影响<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>取牌目标、跳过时机与炸弹重置顺序共同决定上限<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：农民明显更优。<\/strong><\/p>\n<p><strong>先手匹配度：偏低。<\/strong> 地主首手无法使用勤学，必须等其他玩家出牌后才能发动；先手主要用于整理牌型和规划后续炸弹重置，并非技能的直接启动优势。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>勤学只能在轮到自己压牌时发动，目标必须来自上一手其他玩家打出的牌。<\/li><li>可选0至2张；发动后跳过本次压牌，不能同时获得牌并正常压制。<\/li><li>获得目标可定向选择，不是随机补牌。<\/li><li>王炸不能作为勤学的获取目标。<\/li><li>勤学初始可使用1次；发动后使用次数变为0。<\/li><li>勤学次数为0时，打出炸弹会通过顿悟将其刷新回1次。<\/li><li>勤学尚未使用、次数仍为1时提前打出炸弹，不消耗也不影响后续刷新机制。<\/li><li>顿悟只提供一次有效刷新，因此常规上限是两次勤学：首次勤学、炸弹刷新、第二次勤学。<\/li><li>每次最多获得2张，完整循环最多增加4张定向牌。<\/li><\/ul>\n<h3>取牌优先级<\/h3>\n<ol><li>直接补成炸弹或使现有炸弹升级的同点数牌。<\/li><li>补齐飞机、三张、连对、顺子等可立即少手的结构牌。<\/li><li>能建立稳定回手的2、A或大王、小王单张。<\/li><li>能与现有单张直接成对、与对子直接成三张的牌。<\/li><li>单纯点数较高、但无法进入结构的牌。<\/li><\/ol>\n<p>取牌标准是“获得后减少多少手并增加多少控制力”，不是机械拿上一手最大的两张。<\/p>\n<h3>主流打法<\/h3>\n<h4>地主：先出结构，后取牌重组<\/h4>\n<ul><li>首攻优先清理完整长结构，保留一枚可控炸弹作为顿悟开关。<\/li><li>第一次勤学只在能明显改良结构时发动；不为普通高牌轻易放弃压牌权。<\/li><li>取牌后尽快把新增牌并入对子、三张、顺子或炸弹，避免20张基础牌量继续膨胀。<\/li><li>为完成双勤学循环，应在第一次勤学后保留至少一枚炸弹；此前因实战需要打出的其他炸弹不影响后续刷新。<\/li><li>第二次勤学更适合残局定向补牌，目标是直接形成最后两三手，而不是继续囤牌。<\/li><\/ul>\n<p>地主核心顺序：<\/p>\n<blockquote>先清原生结构 → 第一次勤学补关键张 → 炸弹夺权并重置 → 第二次勤学完成残局结构。<\/blockquote>\n<h4>农民：队友输送型<\/h4>\n<ul><li>队友可主动打出吕蒙需要的对子、三张组件或顺子连接张，让勤学定向获取。<\/li><li>获取队友牌时要同时判断跳过后是否会把牌权送还地主；结构收益不足时不发动。<\/li><li>地主打出高对、三张或长结构时，可截取最能补强自身手牌的两张，直接改变地主剩余牌推断。<\/li><li>有炸弹时应尽量完成两轮勤学；没有炸弹时，首次发动必须更严格地要求即时收益。<\/li><li>地主进入少牌阶段后，控场优先于贪取，不能为拿牌主动跳过关键拦截。<\/li><\/ul>\n<h3>炸弹与重置顺序<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>局面<\/th><th>建议<\/th><\/tr><\/thead><tbody>\n<tr><td>勤学未使用<\/td><td>炸弹可按正常控场需要使用，不影响之后的有效刷新<\/td><\/tr>\n<tr><td>勤学已使用<\/td><td>可用炸弹夺权并重置，形成技能完整循环<\/td><\/tr>\n<tr><td>炸弹可被取牌补成<\/td><td>优先勤学补炸，再用新炸弹触发顿悟<\/td><\/tr>\n<tr><td>对手即将走完<\/td><td>直接炸断，不为技能顺序延误控场<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>炸弹不仅是控制牌，也是第二次勤学的启动成本。是否保炸应以“重置后的第二次取牌是否有实际窗口”为准。<\/p>\n<h3>关键风险<\/h3>\n<ul><li>每次勤学都会增加手牌，若新增牌不能并入结构，可能明显拖慢出完速度。<\/li><li>发动后强制跳过压牌，错误时机会直接丢失控制权。<\/li><li>第一次勤学后手中没有炸弹，便无法启动第二次勤学。<\/li><li>过度等待理想目标，可能整局没有使用技能。<\/li><li>农民队友喂牌若缺少牌权规划，可能帮助地主连续推进。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>“获得”是复制上一手牌，还是将对应实体牌从已出牌区转入吕蒙手牌；是否影响记牌总量。<\/li><li>上一手包含王炸以外的单张大王或小王时，能否单独获取。<\/li><li>上一手多张同点数牌时，可否选择其中两张，且是否保留原点数与技能标记。<\/li><li>勤学选择0张是否仍算使用，并强制跳过压牌。<\/li><li>第二次勤学后再次打炸弹是否因顿悟已用完而不再重置。<\/li><\/ul>", "search": "  吕蒙\n\n 吕蒙��  \n\n 吕蒙��  \n\n  技能\n\n 勤学｜主动｜限1次 \n\n  轮到你压牌时，可以从上一手其他玩家打出的牌中选择至多2张获得，然后跳过压牌；无法获得王炸。\n\n 顿悟｜被动｜限1次 \n\n  当你打出炸弹后，重置“勤学”的使用次数。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8.5/10   定向取牌质量高，但首手无法启动勤学，需要先让出一轮节奏  \n  农民   9.5/10   可同时利用地主与队友的出牌，队友还能主动输送关键张  \n  稳定性   8.5/10   目标公开可选，但收益受上一手牌型与自身炸弹数量影响  \n  操作上限   9.5/10   取牌目标、跳过时机与炸弹重置顺序共同决定上限  \n\n 身份倾向：农民明显更优。 \n\n 先手匹配度：偏低。  地主首手无法使用勤学，必须等其他玩家出牌后才能发动；先手主要用于整理牌型和规划后续炸弹重置，并非技能的直接启动优势。\n\n  核心机制\n\n- 勤学只能在轮到自己压牌时发动，目标必须来自上一手其他玩家打出的牌。\n- 可选0至2张；发动后跳过本次压牌，不能同时获得牌并正常压制。\n- 获得目标可定向选择，不是随机补牌。\n- 王炸不能作为勤学的获取目标。\n- 勤学初始可使用1次；发动后使用次数变为0。\n- 勤学次数为0时，打出炸弹会通过顿悟将其刷新回1次。\n- 勤学尚未使用、次数仍为1时提前打出炸弹，不消耗也不影响后续刷新机制。\n- 顿悟只提供一次有效刷新，因此常规上限是两次勤学：首次勤学、炸弹刷新、第二次勤学。\n- 每次最多获得2张，完整循环最多增加4张定向牌。\n\n  取牌优先级\n\n1. 直接补成炸弹或使现有炸弹升级的同点数牌。\n2. 补齐飞机、三张、连对、顺子等可立即少手的结构牌。\n3. 能建立稳定回手的2、a或大王、小王单张。\n4. 能与现有单张直接成对、与对子直接成三张的牌。\n5. 单纯点数较高、但无法进入结构的牌。\n\n取牌标准是“获得后减少多少手并增加多少控制力”，不是机械拿上一手最大的两张。\n\n  主流打法\n\n  地主：先出结构，后取牌重组\n\n- 首攻优先清理完整长结构，保留一枚可控炸弹作为顿悟开关。\n- 第一次勤学只在能明显改良结构时发动；不为普通高牌轻易放弃压牌权。\n- 取牌后尽快把新增牌并入对子、三张、顺子或炸弹，避免20张基础牌量继续膨胀。\n- 为完成双勤学循环，应在第一次勤学后保留至少一枚炸弹；此前因实战需要打出的其他炸弹不影响后续刷新。\n- 第二次勤学更适合残局定向补牌，目标是直接形成最后两三手，而不是继续囤牌。\n\n地主核心顺序：\n\n  先清原生结构 → 第一次勤学补关键张 → 炸弹夺权并重置 → 第二次勤学完成残局结构。\n\n  农民：队友输送型\n\n- 队友可主动打出吕蒙需要的对子、三张组件或顺子连接张，让勤学定向获取。\n- 获取队友牌时要同时判断跳过后是否会把牌权送还地主；结构收益不足时不发动。\n- 地主打出高对、三张或长结构时，可截取最能补强自身手牌的两张，直接改变地主剩余牌推断。\n- 有炸弹时应尽量完成两轮勤学；没有炸弹时，首次发动必须更严格地要求即时收益。\n- 地主进入少牌阶段后，控场优先于贪取，不能为拿牌主动跳过关键拦截。\n\n  炸弹与重置顺序\n\n  局面   建议  \n --- --- \n  勤学未使用   炸弹可按正常控场需要使用，不影响之后的有效刷新  \n  勤学已使用   可用炸弹夺权并重置，形成技能完整循环  \n  炸弹可被取牌补成   优先勤学补炸，再用新炸弹触发顿悟  \n  对手即将走完   直接炸断，不为技能顺序延误控场  \n\n炸弹不仅是控制牌，也是第二次勤学的启动成本。是否保炸应以“重置后的第二次取牌是否有实际窗口”为准。\n\n  关键风险\n\n- 每次勤学都会增加手牌，若新增牌不能并入结构，可能明显拖慢出完速度。\n- 发动后强制跳过压牌，错误时机会直接丢失控制权。\n- 第一次勤学后手中没有炸弹，便无法启动第二次勤学。\n- 过度等待理想目标，可能整局没有使用技能。\n- 农民队友喂牌若缺少牌权规划，可能帮助地主连续推进。\n\n  待实测\n\n- “获得”是复制上一手牌，还是将对应实体牌从已出牌区转入吕蒙手牌；是否影响记牌总量。\n- 上一手包含王炸以外的单张大王或小王时，能否单独获取。\n- 上一手多张同点数牌时，可否选择其中两张，且是否保留原点数与技能标记。\n- 勤学选择0张是否仍算使用，并强制跳过压牌。\n- 第二次勤学后再次打炸弹是否因顿悟已用完而不再重置。\n"}, {"name": "吴国太", "faction": "吴", "skills": "懿训", "position": "强制压牌、最大牌弃置与双目标压榨", "status": "初步分析", "landlord": 9.5, "farmer": 8.5, "identity": "强地主型。", "firstMove": "极高", "html": "<h3>技能<\/h3>\n<p><strong>懿训｜主动｜限2次<\/strong><\/p>\n<blockquote>可以令至多2名其他玩家在你本次出牌后的回合：若能压牌则必须压牌；若不能压牌，则弃置1张最大牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9.5/10<\/td><td>先手可同时指定两名农民，用高强度牌型逼出控制牌或双弃最大牌<\/td><\/tr>\n<tr><td>农民<\/td><td>8.5/10<\/td><td>可单独针对地主，但指定队友存在误伤，需要更精确地选择对象与牌型<\/td><\/tr>\n<tr><td>稳定性<\/td><td>9/10<\/td><td>无论目标能否压牌都会产生强制结果，技能很少完全落空<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>出牌类型、目标顺序和两次发动窗口决定收益上限<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：强地主型。<\/strong><\/p>\n<p><strong>先手匹配度：极高。<\/strong> 地主首手即可发动懿训，同时覆盖两名农民；既能用难压牌型迫使双方弃掉最大牌，也能用可压牌型强制消耗其王、2、炸弹或关键结构。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>主动选择至多2名其他玩家，可以只选1人，也可以同时选择两人。<\/li><li>效果只约束目标在吴国太本次出牌后的对应回合。<\/li><li>目标存在合法压牌时不能选择不出，必须打出能够压住当前牌面的牌型。<\/li><li>目标完全无法压牌时，改为弃置手中1张最大牌。<\/li><li>两条结果都具有收益：能压则强制消耗牌；不能压则直接删除其最高控制牌。<\/li><li>技能限2次，通常分别承担“前中盘拆控制”和“残局强制处理”两种任务。<\/li><\/ul>\n<h3>发动牌型优先级<\/h3>\n<ol><li><strong>王炸或接近最高级的炸弹：<\/strong> 对手大概率无法压牌，两名农民各弃1张最大牌；若存在更高炸弹，则强制其提前交出。<\/li><li><strong>高位复杂牌型：<\/strong> 高顺子、高连对、飞机等匹配难度高，容易触发弃最大牌。<\/li><li><strong>高单张、高对子：<\/strong> 可逼出王、2或更高对子，适合拆除对方残局回手牌。<\/li><li><strong>特殊牌型或长炸弹：<\/strong> 用于测试并清除对手隐藏的强控制结构。<\/li><li><strong>低位普通牌型：<\/strong> 对手往往能轻松压制，甚至借机批量减手，通常不适合作为懿训载体。<\/li><\/ol>\n<p>评价标准不是“这手牌有多大”，而是两名目标分别会进入“被迫交牌”还是“弃最大牌”，以及哪种结果更有利。<\/p>\n<h3>主流打法<\/h3>\n<h4>地主：双目标压榨型<\/h4>\n<ul><li>第一次优先在首轮或早期使用，利用先手同时查看两名农民的应牌能力。<\/li><li>手中有高炸、王炸或难匹配长牌型时，可直接追求双弃最大牌。<\/li><li>若牌型能被压但需要王、2或炸弹，发动价值仍然很高，等于强迫农民提前暴露并消耗控制资源。<\/li><li>第一名农民被迫压牌后，第二名农民面对的牌面可能继续升高，存在连锁压榨潜力。<\/li><li>第二次保留到一名农民进入少牌或地主准备连续冲牌时，用于清掉最后的回手点。<\/li><\/ul>\n<p>地主的主流节奏：<\/p>\n<blockquote>首手高强度牌型发动 → 双目标被迫响应或弃最大牌 → 根据公开结果重排控制链 → 残局第二次发动封口。<\/blockquote>\n<h4>农民：单点针对地主<\/h4>\n<ul><li>默认只指定地主，避免队友无法压牌时被迫弃掉最大牌。<\/li><li>地主握有牌权且疑似准备连续冲牌时，用高位同类牌型逼其交出更高控制牌。<\/li><li>队友手牌结构明确、被迫压牌反而能帮助其减手时，才考虑同时指定队友。<\/li><li>若队友无法应对当前牌型，指定队友等于主动削弱己方控制力，通常禁止。<\/li><li>第二次应围绕地主残局牌数使用，不要仅为早期交换普通牌而消耗。<\/li><\/ul>\n<h3>两种收益的取舍<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>预期结果<\/th><th>战术价值<\/th><\/tr><\/thead><tbody>\n<tr><td>目标用王或2压牌<\/td><td>提前拆掉残局控制点，吴国太可据此重排回手牌<\/td><\/tr>\n<tr><td>目标用炸弹压牌<\/td><td>强制暴露并消耗隐藏炸弹，价值通常很高<\/td><\/tr>\n<tr><td>目标无法压牌并弃最大牌<\/td><td>直接削弱最高控制力，但也可能替对手删除一张难处理的孤张<\/td><\/tr>\n<tr><td>目标用长牌型压牌<\/td><td>可能帮助其大量减手，是发动前必须规避的反收益<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>关键风险<\/h3>\n<ul><li>使用低位顺子、连对或飞机发动，可能强制对手一次打出大量手牌，反而帮助其提速。<\/li><li>对手弃掉的最大牌若原本是难以搭配的孤张，可能同时改善其静态手数。<\/li><li>农民误选队友可能造成高牌损失，或打乱队友原定控制顺序。<\/li><li>两次技能都在前期使用，会失去残局强制拆牌能力。<\/li><li>只追求“不能压”的弃牌效果，可能忽略强制对手交出炸弹本身就是更高价值收益。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>同时指定两人时，第二名目标需要压吴国太最初的牌，还是压第一名目标被迫打出的新牌面。<\/li><li>目标只有炸弹能够压牌时，是否必须使用炸弹。<\/li><li>最大点数有多张时，由目标自行选择弃置其中1张，还是系统随机选择。<\/li><li>万能牌处于手牌时是否参与“最大牌”判定，以及被弃置时按什么点数结算。<\/li><li>强制弃置的牌及具体点数是否向全场公开。<\/li><\/ul>", "search": "  吴国太\n\n 吴国太  \n\n  技能\n\n 懿训｜主动｜限2次 \n\n  可以令至多2名其他玩家在你本次出牌后的回合：若能压牌则必须压牌；若不能压牌，则弃置1张最大牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9.5/10   先手可同时指定两名农民，用高强度牌型逼出控制牌或双弃最大牌  \n  农民   8.5/10   可单独针对地主，但指定队友存在误伤，需要更精确地选择对象与牌型  \n  稳定性   9/10   无论目标能否压牌都会产生强制结果，技能很少完全落空  \n  操作上限   9.5/10   出牌类型、目标顺序和两次发动窗口决定收益上限  \n\n 身份倾向：强地主型。 \n\n 先手匹配度：极高。  地主首手即可发动懿训，同时覆盖两名农民；既能用难压牌型迫使双方弃掉最大牌，也能用可压牌型强制消耗其王、2、炸弹或关键结构。\n\n  核心机制\n\n- 主动选择至多2名其他玩家，可以只选1人，也可以同时选择两人。\n- 效果只约束目标在吴国太本次出牌后的对应回合。\n- 目标存在合法压牌时不能选择不出，必须打出能够压住当前牌面的牌型。\n- 目标完全无法压牌时，改为弃置手中1张最大牌。\n- 两条结果都具有收益：能压则强制消耗牌；不能压则直接删除其最高控制牌。\n- 技能限2次，通常分别承担“前中盘拆控制”和“残局强制处理”两种任务。\n\n  发动牌型优先级\n\n1.  王炸或接近最高级的炸弹：  对手大概率无法压牌，两名农民各弃1张最大牌；若存在更高炸弹，则强制其提前交出。\n2.  高位复杂牌型：  高顺子、高连对、飞机等匹配难度高，容易触发弃最大牌。\n3.  高单张、高对子：  可逼出王、2或更高对子，适合拆除对方残局回手牌。\n4.  特殊牌型或长炸弹：  用于测试并清除对手隐藏的强控制结构。\n5.  低位普通牌型：  对手往往能轻松压制，甚至借机批量减手，通常不适合作为懿训载体。\n\n评价标准不是“这手牌有多大”，而是两名目标分别会进入“被迫交牌”还是“弃最大牌”，以及哪种结果更有利。\n\n  主流打法\n\n  地主：双目标压榨型\n\n- 第一次优先在首轮或早期使用，利用先手同时查看两名农民的应牌能力。\n- 手中有高炸、王炸或难匹配长牌型时，可直接追求双弃最大牌。\n- 若牌型能被压但需要王、2或炸弹，发动价值仍然很高，等于强迫农民提前暴露并消耗控制资源。\n- 第一名农民被迫压牌后，第二名农民面对的牌面可能继续升高，存在连锁压榨潜力。\n- 第二次保留到一名农民进入少牌或地主准备连续冲牌时，用于清掉最后的回手点。\n\n地主的主流节奏：\n\n  首手高强度牌型发动 → 双目标被迫响应或弃最大牌 → 根据公开结果重排控制链 → 残局第二次发动封口。\n\n  农民：单点针对地主\n\n- 默认只指定地主，避免队友无法压牌时被迫弃掉最大牌。\n- 地主握有牌权且疑似准备连续冲牌时，用高位同类牌型逼其交出更高控制牌。\n- 队友手牌结构明确、被迫压牌反而能帮助其减手时，才考虑同时指定队友。\n- 若队友无法应对当前牌型，指定队友等于主动削弱己方控制力，通常禁止。\n- 第二次应围绕地主残局牌数使用，不要仅为早期交换普通牌而消耗。\n\n  两种收益的取舍\n\n  预期结果   战术价值  \n --- --- \n  目标用王或2压牌   提前拆掉残局控制点，吴国太可据此重排回手牌  \n  目标用炸弹压牌   强制暴露并消耗隐藏炸弹，价值通常很高  \n  目标无法压牌并弃最大牌   直接削弱最高控制力，但也可能替对手删除一张难处理的孤张  \n  目标用长牌型压牌   可能帮助其大量减手，是发动前必须规避的反收益  \n\n  关键风险\n\n- 使用低位顺子、连对或飞机发动，可能强制对手一次打出大量手牌，反而帮助其提速。\n- 对手弃掉的最大牌若原本是难以搭配的孤张，可能同时改善其静态手数。\n- 农民误选队友可能造成高牌损失，或打乱队友原定控制顺序。\n- 两次技能都在前期使用，会失去残局强制拆牌能力。\n- 只追求“不能压”的弃牌效果，可能忽略强制对手交出炸弹本身就是更高价值收益。\n\n  待实测\n\n- 同时指定两人时，第二名目标需要压吴国太最初的牌，还是压第一名目标被迫打出的新牌面。\n- 目标只有炸弹能够压牌时，是否必须使用炸弹。\n- 最大点数有多张时，由目标自行选择弃置其中1张，还是系统随机选择。\n- 万能牌处于手牌时是否参与“最大牌”判定，以及被弃置时按什么点数结算。\n- 强制弃置的牌及具体点数是否向全场公开。\n"}, {"name": "夏侯惇", "faction": "魏", "skills": "刚烈", "position": "最大牌诱压、队友协同与三牌内斩杀", "status": "主要规则已实测", "landlord": 9.5, "farmer": 9.5, "identity": "地主、农民基本同档。", "firstMove": "极高", "html": "<h3>技能<\/h3>\n<p><strong>刚烈｜条件触发｜限1次<\/strong><\/p>\n<blockquote>你打出带有最大手牌的牌型被压后，你可以弃置3张最小牌，然后拿回1张点数最大的牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9.5/10<\/td><td>先手便于主动规划含最大牌的攻势，进入剩1至3张窗口后形成直接斩杀威胁<\/td><\/tr>\n<tr><td>农民<\/td><td>9.5/10<\/td><td>队友可主动压制并触发刚烈，终局配合稳定性极高<\/td><\/tr>\n<tr><td>稳定性<\/td><td>9/10<\/td><td>对手不压仍可限制中盘发动，但队友可配合，且剩1至3张时被任何方式压制都会清空<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>上限集中在最大牌嵌入、尾牌数量控制和队友配合触发<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：地主、农民基本同档。<\/strong> 地主有先手和20张牌的规划空间；农民则可由队友主动压制，稳定兑现刚烈终结。<\/p>\n<p><strong>先手匹配度：极高。<\/strong> 地主能从第一手开始主动控制牌数和牌型，目标不是尽早发动，而是把唯一一次刚烈保留到“出牌后剩1至3张”的终结窗口。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>触发检查的是刚打出的整手牌型中是否包含出牌前自己手里的最高点数牌，不要求该牌型本身是最大牌型。<\/li><li>有大王时，大王就是最高牌；例如“三个3带大王”包含大王，因此满足“带有最大手牌”。<\/li><li>该手牌被任何玩家以合法方式压住都会触发，包括农民队友配合压制，以及被炸弹压制。<\/li><li>发动后弃置手牌区最右侧的3张牌；若只剩1张或2张，则将剩余牌全部弃完。<\/li><li>随后从自己刚打出的那手牌中拿回点数最高的<strong>单独1张牌<\/strong>。只按点数判定且固定只回收1张，例如该手含3张A，仍只回收1张A。<\/li><li>常规结算净减少2张，但这不是技能的主要价值。<\/li><li>若出牌后剩1至3张，牌型被压后会直接弃完全部尾牌并终结比赛；牌局结束，不会再因拿回牌而恢复手牌。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：三牌内斩杀型<\/h4>\n<ul><li>前中盘保留刚烈，优先把总牌数整理到“本手打出后剩1至3张”。<\/li><li>终结手必须嵌入当时的最高牌，但不必把最高牌单独打出；可作为三带一、飞机带牌或其他合法组合的组成牌。<\/li><li>该手若无人压，继续保有牌权推进；若被普通牌或炸弹压，弃掉全部尾牌直接获胜。<\/li><li>因此对手面对终结手会进入两难：不压则让夏侯惇继续领牌，压则触发刚烈清空。<\/li><li>大王并非只能当单张使用；能够合法嵌入组合时，可作为最高牌完成触发条件。<\/li><\/ul>\n<h4>农民：终局逼迫型<\/h4>\n<ul><li>同样以剩1至3张斩杀为最高优先级，不在中盘只为净减2张提前交技能。<\/li><li>夏侯惇完成含最高牌的终结手后，队友可以主动用更大同型牌或炸弹压制，直接帮助其触发刚烈获胜。<\/li><li>无法进入三张窗口时，再把技能用于清除三张结构最差的低牌，并回收1张高牌继续拦截地主。<\/li><\/ul>\n<h3>触发牌型选择<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>牌型<\/th><th>评价<\/th><\/tr><\/thead><tbody>\n<tr><td>最大单张<\/td><td>条件最直观，但2或王通常缺少普通压制空间<\/td><\/tr>\n<tr><td>最大对子<\/td><td>可推进两张，但仍需对手拥有更大同型或炸弹<\/td><\/tr>\n<tr><td>含最高牌的组合<\/td><td>最高牌作为带牌也有效；例如三个3带大王可以成立<\/td><\/tr>\n<tr><td>出牌后剩1至3张<\/td><td>最高优先级；一旦被任意玩家压制，弃完尾牌直接获胜<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>理想触发牌不是绝对最大的牌型，而是“合法包含当前最高牌，并在出牌后留下1至3张”的牌型。<\/p>\n<h3>发动禁区<\/h3>\n<ul><li>未进入斩杀窗口便为净减2张提前消耗唯一一次技能。<\/li><li>弃置的三张仍是关键完整结构，且发动后不能显著缩短手数。<\/li><li>为了塞入最高牌强拆更优的直接出完路线。<\/li><\/ul>\n<h3>已确认结论<\/h3>\n<ul><li>“最大手牌”按出牌前自己手中的最高点数判断；牌型只需包含它。<\/li><li>被队友压制和被炸弹压制均能触发刚烈。<\/li><li>拿回范围是自己刚打出的牌，且无论最高点数有几张都只拿回1张。<\/li><li>弃牌对象固定为手牌排列最右侧的3张，不存在不同组合选择。<\/li><li>出牌后只剩1张、2张或3张均可正常触发；刚烈弃完全部尾牌便立即终结比赛，不会再因回收牌而恢复手牌。<\/li><\/ul>", "search": "  夏侯惇\n\n 夏侯惇  \n\n  技能\n\n 刚烈｜条件触发｜限1次 \n\n  你打出带有最大手牌的牌型被压后，你可以弃置3张最小牌，然后拿回1张点数最大的牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9.5/10   先手便于主动规划含最大牌的攻势，进入剩1至3张窗口后形成直接斩杀威胁  \n  农民   9.5/10   队友可主动压制并触发刚烈，终局配合稳定性极高  \n  稳定性   9/10   对手不压仍可限制中盘发动，但队友可配合，且剩1至3张时被任何方式压制都会清空  \n  操作上限   9.5/10   上限集中在最大牌嵌入、尾牌数量控制和队友配合触发  \n\n 身份倾向：地主、农民基本同档。  地主有先手和20张牌的规划空间；农民则可由队友主动压制，稳定兑现刚烈终结。\n\n 先手匹配度：极高。  地主能从第一手开始主动控制牌数和牌型，目标不是尽早发动，而是把唯一一次刚烈保留到“出牌后剩1至3张”的终结窗口。\n\n  核心机制\n\n- 触发检查的是刚打出的整手牌型中是否包含出牌前自己手里的最高点数牌，不要求该牌型本身是最大牌型。\n- 有大王时，大王就是最高牌；例如“三个3带大王”包含大王，因此满足“带有最大手牌”。\n- 该手牌被任何玩家以合法方式压住都会触发，包括农民队友配合压制，以及被炸弹压制。\n- 发动后弃置手牌区最右侧的3张牌；若只剩1张或2张，则将剩余牌全部弃完。\n- 随后从自己刚打出的那手牌中拿回点数最高的 单独1张牌 。只按点数判定且固定只回收1张，例如该手含3张a，仍只回收1张a。\n- 常规结算净减少2张，但这不是技能的主要价值。\n- 若出牌后剩1至3张，牌型被压后会直接弃完全部尾牌并终结比赛；牌局结束，不会再因拿回牌而恢复手牌。\n\n  主流打法\n\n  地主：三牌内斩杀型\n\n- 前中盘保留刚烈，优先把总牌数整理到“本手打出后剩1至3张”。\n- 终结手必须嵌入当时的最高牌，但不必把最高牌单独打出；可作为三带一、飞机带牌或其他合法组合的组成牌。\n- 该手若无人压，继续保有牌权推进；若被普通牌或炸弹压，弃掉全部尾牌直接获胜。\n- 因此对手面对终结手会进入两难：不压则让夏侯惇继续领牌，压则触发刚烈清空。\n- 大王并非只能当单张使用；能够合法嵌入组合时，可作为最高牌完成触发条件。\n\n  农民：终局逼迫型\n\n- 同样以剩1至3张斩杀为最高优先级，不在中盘只为净减2张提前交技能。\n- 夏侯惇完成含最高牌的终结手后，队友可以主动用更大同型牌或炸弹压制，直接帮助其触发刚烈获胜。\n- 无法进入三张窗口时，再把技能用于清除三张结构最差的低牌，并回收1张高牌继续拦截地主。\n\n  触发牌型选择\n\n  牌型   评价  \n --- --- \n  最大单张   条件最直观，但2或王通常缺少普通压制空间  \n  最大对子   可推进两张，但仍需对手拥有更大同型或炸弹  \n  含最高牌的组合   最高牌作为带牌也有效；例如三个3带大王可以成立  \n  出牌后剩1至3张   最高优先级；一旦被任意玩家压制，弃完尾牌直接获胜  \n\n理想触发牌不是绝对最大的牌型，而是“合法包含当前最高牌，并在出牌后留下1至3张”的牌型。\n\n  发动禁区\n\n- 未进入斩杀窗口便为净减2张提前消耗唯一一次技能。\n- 弃置的三张仍是关键完整结构，且发动后不能显著缩短手数。\n- 为了塞入最高牌强拆更优的直接出完路线。\n\n  已确认结论\n\n- “最大手牌”按出牌前自己手中的最高点数判断；牌型只需包含它。\n- 被队友压制和被炸弹压制均能触发刚烈。\n- 拿回范围是自己刚打出的牌，且无论最高点数有几张都只拿回1张。\n- 弃牌对象固定为手牌排列最右侧的3张，不存在不同组合选择。\n- 出牌后只剩1张、2张或3张均可正常触发；刚烈弃完全部尾牌便立即终结比赛，不会再因回收牌而恢复手牌。\n"}, {"name": "夏侯渊", "faction": "魏", "skills": "神速", "position": "出牌后随机升点、动态改牌", "status": "主要规则已实测", "landlord": 9.5, "farmer": 7.5, "identity": "地主优势明显。", "firstMove": "极高", "html": "<h3>技能<\/h3>\n<p><strong>神速｜被动｜不限次数<\/strong><\/p>\n<blockquote>你出牌后，手中随机1张牌点数随机变大。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9.5/10<\/td><td>先手可立即打长组合触发神速，主动建立“清结构—养2”循环<\/td><\/tr>\n<tr><td>农民<\/td><td>7.5/10<\/td><td>能生成高牌拦截，但手牌少、触发次数和养成空间有限<\/td><\/tr>\n<tr><td>稳定性<\/td><td>6.5/10<\/td><td>目标和新点数随机，但变化只向上且2永久稳定<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9/10<\/td><td>出牌顺序、触发次数和残局重算要求高<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：地主优势明显。<\/strong><\/p>\n<p><strong>先手匹配度：极高。<\/strong> 地主第一手即可选择飞机、长顺或连对，在大量减牌的同时只触发一次神速；不需要等待对手先出，能主动决定第一次变化发生在什么手牌结构上。<\/p>\n<h3>已确认规则<\/h3>\n<ul><li>每出一手牌触发一次；一手出多张也只变化1张。<\/li><li>随机选取一张非2手牌，变为更大的随机点数，上限为2。<\/li><li>2不再变化。<\/li><li>对子、三张、炸弹没有保护权重。<\/li><li>手牌全部出完后直接获胜，不再结算神速。<\/li><li>变化结果仅自己可见。<\/li><li>同点数达到4张及以上均为完整炸弹；5张2、6张2可整组打出，不形成散牌负担。<\/li><\/ul>\n<h3>升2效率<\/h3>\n<p>以下按所有合法更大点数等概率计算：<\/p>\n<div class=\"table-wrap\"><table><thead><tr><th>原点数<\/th><th>变成2概率<\/th><\/tr><\/thead><tbody>\n<tr><td>A<\/td><td>100%<\/td><\/tr>\n<tr><td>K<\/td><td>50%<\/td><\/tr>\n<tr><td>Q<\/td><td>33.3%<\/td><\/tr>\n<tr><td>J<\/td><td>25%<\/td><\/tr>\n<tr><td>10<\/td><td>20%<\/td><\/tr>\n<tr><td>9<\/td><td>16.7%<\/td><\/tr>\n<tr><td>8<\/td><td>14.3%<\/td><\/tr>\n<tr><td>7<\/td><td>12.5%<\/td><\/tr>\n<tr><td>6<\/td><td>11.1%<\/td><\/tr>\n<tr><td>5<\/td><td>10%<\/td><\/tr>\n<tr><td>4<\/td><td>9.1%<\/td><\/tr>\n<tr><td>3<\/td><td>8.3%<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>A、K、Q是主要养2候选。低牌虽然也能直升2，但效率更低。<\/p>\n<h3>主流打法<\/h3>\n<h4>地主：清结构 → 养2 → 长炸弹收尾<\/h4>\n<h5>第一阶段：清结构<\/h5>\n<p>优先级：<\/p>\n<ol><li>能直接出完的牌型；<\/li><li>飞机、长顺子、长连对；<\/li><li>容易被拆的非2炸弹、三张和对子；<\/li><li>中低位散牌；<\/li><li>A、K、Q升2候选；<\/li><li>已生成的2。<\/li><\/ol>\n<p>长组合一手出得多，却只触发一次，优于拆成多手。非2结构持有越久，被神速拆坏的累计风险越高。<\/p>\n<p>地主首攻优先从长组合开始：既利用先手无须压牌的优势，又先移除最怕神速破坏的结构。若没有长组合，再考虑低位对子或散牌启动第一次变化，不宜先交2。<\/p>\n<h5>第二阶段：养2<\/h5>\n<ul><li>逐步清除低、中位非2牌，提高神速命中A、K、Q的比例。<\/li><li>已生成的2永久稳定，持续并入炸弹。<\/li><li>用现有高牌或炸弹维持牌权；不为多触发一次而无条件拆牌。<\/li><li>对手不知道变化结果，可隐藏新生成的2、对子或炸弹长度。<\/li><\/ul>\n<h5>第三阶段：炸弹收尾<\/h5>\n<ul><li>4张2是起爆门槛，不是养成上限。<\/li><li>第5、第6张2继续强化同一个炸弹，不增加收尾手数。<\/li><li>理想尾牌是“一手普通组合 + 多张2炸弹”。<\/li><li>若已经可以直接走完，立即结束，不为增加炸弹长度延迟胜利。<\/li><\/ul>\n<h4>农民：隐蔽拦截型<\/h4>\n<ul><li>优先完成队友配合，不为了养2抢无意义牌权。<\/li><li>地主进入少牌阶段后，保留新生成的2和高牌作拦截。<\/li><li>长组合仍优先出，避免后续随机变化破坏结构。<\/li><li>利用变化不公开的优势，让地主难以判断你的真实控制力。<\/li><\/ul>\n<h3>结构风险<\/h3>\n<p>若剩余可变化牌为 <code>N<\/code> 张：<\/p>\n<ul><li>非2对子单次被拆概率约为 <code>2/N<\/code>；<\/li><li>非2三张约为 <code>3/N<\/code>；<\/li><li>非2四炸约为 <code>4/N<\/code>；<\/li><li>由2组成的对子、三张或长炸弹不受神速影响。<\/li><\/ul>\n<p>因此传统“长期捏住非2炸弹”等牌方式不适合夏侯渊。完整结构要么尽早出，要么接受被拆风险。<\/p>\n<h3>决策要点<\/h3>\n<ul><li>能直接走完，不等技能。<\/li><li>一手多出，少拆多触发。<\/li><li>先清脆弱结构，再提高高位牌占比。<\/li><li>四个2起爆，多一个更强。<\/li><li>每次变化后重新计算尾牌，不沿用开局方案。<\/li><\/ul>\n<blockquote>先清长牌，后养高牌；四个2起爆，多一个更强；能直接走完，不等技能。<\/blockquote>", "search": "  夏侯渊\n\n 夏侯渊  \n\n  技能\n\n 神速｜被动｜不限次数 \n\n  你出牌后，手中随机1张牌点数随机变大。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9.5/10   先手可立即打长组合触发神速，主动建立“清结构—养2”循环  \n  农民   7.5/10   能生成高牌拦截，但手牌少、触发次数和养成空间有限  \n  稳定性   6.5/10   目标和新点数随机，但变化只向上且2永久稳定  \n  操作上限   9/10   出牌顺序、触发次数和残局重算要求高  \n\n 身份倾向：地主优势明显。 \n\n 先手匹配度：极高。  地主第一手即可选择飞机、长顺或连对，在大量减牌的同时只触发一次神速；不需要等待对手先出，能主动决定第一次变化发生在什么手牌结构上。\n\n  已确认规则\n\n- 每出一手牌触发一次；一手出多张也只变化1张。\n- 随机选取一张非2手牌，变为更大的随机点数，上限为2。\n- 2不再变化。\n- 对子、三张、炸弹没有保护权重。\n- 手牌全部出完后直接获胜，不再结算神速。\n- 变化结果仅自己可见。\n- 同点数达到4张及以上均为完整炸弹；5张2、6张2可整组打出，不形成散牌负担。\n\n  升2效率\n\n以下按所有合法更大点数等概率计算：\n\n  原点数   变成2概率  \n --- ---: \n  a   100%  \n  k   50%  \n  q   33.3%  \n  j   25%  \n  10   20%  \n  9   16.7%  \n  8   14.3%  \n  7   12.5%  \n  6   11.1%  \n  5   10%  \n  4   9.1%  \n  3   8.3%  \n\na、k、q是主要养2候选。低牌虽然也能直升2，但效率更低。\n\n  主流打法\n\n  地主：清结构 → 养2 → 长炸弹收尾\n\n  第一阶段：清结构\n\n优先级：\n\n1. 能直接出完的牌型；\n2. 飞机、长顺子、长连对；\n3. 容易被拆的非2炸弹、三张和对子；\n4. 中低位散牌；\n5. a、k、q升2候选；\n6. 已生成的2。\n\n长组合一手出得多，却只触发一次，优于拆成多手。非2结构持有越久，被神速拆坏的累计风险越高。\n\n地主首攻优先从长组合开始：既利用先手无须压牌的优势，又先移除最怕神速破坏的结构。若没有长组合，再考虑低位对子或散牌启动第一次变化，不宜先交2。\n\n  第二阶段：养2\n\n- 逐步清除低、中位非2牌，提高神速命中a、k、q的比例。\n- 已生成的2永久稳定，持续并入炸弹。\n- 用现有高牌或炸弹维持牌权；不为多触发一次而无条件拆牌。\n- 对手不知道变化结果，可隐藏新生成的2、对子或炸弹长度。\n\n  第三阶段：炸弹收尾\n\n- 4张2是起爆门槛，不是养成上限。\n- 第5、第6张2继续强化同一个炸弹，不增加收尾手数。\n- 理想尾牌是“一手普通组合 + 多张2炸弹”。\n- 若已经可以直接走完，立即结束，不为增加炸弹长度延迟胜利。\n\n  农民：隐蔽拦截型\n\n- 优先完成队友配合，不为了养2抢无意义牌权。\n- 地主进入少牌阶段后，保留新生成的2和高牌作拦截。\n- 长组合仍优先出，避免后续随机变化破坏结构。\n- 利用变化不公开的优势，让地主难以判断你的真实控制力。\n\n  结构风险\n\n若剩余可变化牌为  n  张：\n\n- 非2对子单次被拆概率约为  2/n ；\n- 非2三张约为  3/n ；\n- 非2四炸约为  4/n ；\n- 由2组成的对子、三张或长炸弹不受神速影响。\n\n因此传统“长期捏住非2炸弹”等牌方式不适合夏侯渊。完整结构要么尽早出，要么接受被拆风险。\n\n  决策要点\n\n- 能直接走完，不等技能。\n- 一手多出，少拆多触发。\n- 先清脆弱结构，再提高高位牌占比。\n- 四个2起爆，多一个更强。\n- 每次变化后重新计算尾牌，不沿用开局方案。\n\n  先清长牌，后养高牌；四个2起爆，多一个更强；能直接走完，不等技能。\n"}, {"name": "大乔", "faction": "吴", "skills": "结缘、贤助", "position": "强制截获、最高牌补三与公开协作", "status": "主要规则已实测", "landlord": 8.0, "farmer": 9.5, "identity": "强农民型。", "firstMove": "中高", "html": "<h3>技能<\/h3>\n<p><strong>结缘｜被动｜限1次<\/strong><\/p>\n<blockquote>其他玩家打出的单牌无人压制时，你获得该牌。<\/blockquote>\n<p><strong>贤助｜主动｜限1次<\/strong><\/p>\n<blockquote>选择1名其他玩家，你与其分别展示手中最大的牌，然后各自将展示牌补充至3张；大小王不能补充。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8/10<\/td><td>贤助需要同时强化一名农民，但可通过选择对象控制对手收益，并获得最高牌情报<\/td><\/tr>\n<tr><td>农民<\/td><td>9.5/10<\/td><td>可与队友互相补强最高点数，兼具公开信息、三张结构与潜在炸弹接口<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8.5/10<\/td><td>贤助规则与信息完全公开；结缘虽依赖无人压牌，但满足条件后必定触发<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9/10<\/td><td>目标选择、发动时点与补出的三张结构决定收益差距<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：强农民型。<\/strong> 农民可把贤助当作队内双向补牌；地主使用时必然同时给一名对手资源，因此需要精确压低对方收益。<\/p>\n<p><strong>先手匹配度：中高。<\/strong> 地主可以开局发动贤助并立即利用补成的三张结构，但技能并非纯收益；农民虽然没有先手，却更容易通过队友共享价值。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>结缘只检查其他玩家打出的单牌；另外两家均选择不出后，立即强制触发，大乔获得该牌。<\/li><li>获得的单牌从出牌区转入大乔手牌，具体点数向全场公开。<\/li><li>结缘限1次，应优先等待2、A或王等高价值单牌，不宜被低单张提前消耗。<\/li><li>贤助选择1名其他玩家，双方各自公开展示当前手牌中的最高点数牌。<\/li><li>展示的最高点数牌不足3张时，由系统补到恰好3张；已有1张补2张，已有2张补1张，已有3张或更多均保持原数量不变。<\/li><li>若任意一方手牌中有大王或小王，该方以王作为最大牌展示，并直接跳过补牌，什么牌都不获得。<\/li><li>贤助新增牌的点数与数量向全场公开。<\/li><li>贤助同时暴露双方最高牌结构，收益不仅是补牌，也包括精确情报。<\/li><li>补至三张会增加手牌数量，只有能快速组成三带、飞机、炸弹接口或控制链时才是正收益。<\/li><\/ul>\n<h3>贤助目标优先级<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>目标状态<\/th><th>大乔收益<\/th><th>对方收益<\/th><th>评价<\/th><\/tr><\/thead><tbody>\n<tr><td>队友最高牌仅1张<\/td><td>自己补牌且队友也补2张<\/td><td>高<\/td><td>农民最强协作目标<\/td><\/tr>\n<tr><td>队友最高牌已有2张<\/td><td>自己补牌，队友补1张<\/td><td>中高<\/td><td>稳定构成双边三张结构<\/td><\/tr>\n<tr><td>对手最高牌为大小王<\/td><td>自己正常补牌<\/td><td>对手无法补王<\/td><td>地主优先目标<\/td><\/tr>\n<tr><td>对手最高点数已有3张或更多<\/td><td>自己正常补牌<\/td><td>对手保持原数量，不新增<\/td><td>地主低风险目标<\/td><\/tr>\n<tr><td>对手最高牌仅1张普通牌<\/td><td>自己补牌<\/td><td>对手同时补2张<\/td><td>地主通常避免<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>主流打法<\/h3>\n<h4>地主：低反哺贤助<\/h4>\n<ul><li>优先选择确认或高度疑似持有王的农民；该玩家会直接跳过补牌，可把对方增牌收益降为零。<\/li><li>无法确认王时，选择最高点数已经较密集、最可能无需补牌的目标。<\/li><li>自己最高牌为2或A时，贤助可直接建立三张核心；若已有两张，只增1张，效率最高。<\/li><li>补成三张后优先并入三带、飞机或与万能牌组成炸弹，不要把新增高牌拆成多个单张。<\/li><li>结缘保留给关键高单牌，用作残局回手或补强同点数结构。<\/li><\/ul>\n<h4>农民：双向协作<\/h4>\n<ul><li>贤助优先给最高牌能够立即成型、且新增牌不会拖慢出手的队友。<\/li><li>队友已有对应对子时，只补1张即可形成三张，整体手数负担最低。<\/li><li>双方补牌结果公开后，应立刻围绕新增三张分工：一方负责领出，另一方保留拦截。<\/li><li>结缘是强制技能，应避免让队友过早领出无人压制的低单牌；合适时可由队友领出高单张，另外两家均不出后定向供给大乔。<\/li><li>地主接近走完时，结缘获得的牌必须能形成即时拦截或减少手数，否则增牌可能反向拖累。<\/li><\/ul>\n<h3>技能优先级<\/h3>\n<ol><li>贤助补成能够直接少一手的三张、飞机组件或万能牌炸弹。<\/li><li>农民通过贤助同时强化自己与队友的高点数结构。<\/li><li>地主选择王为最高牌或最高牌已满3张的对手，降低反哺。<\/li><li>结缘获取能形成对子、三张、炸弹接口的关键单牌。<\/li><li>单纯为了多拿一张普通高牌而触发结缘，优先级最低。<\/li><\/ol>\n<h3>关键风险<\/h3>\n<ul><li>贤助不是单向增益；地主若选错目标，可能一次给农民补出2张关键高牌。<\/li><li>补成三张不等于直接形成炸弹，若缺乏带牌或后续接口，牌量增加可能拖慢收尾。<\/li><li>结缘强制获得单牌并增加自己的手牌，若低牌提前触发且无法并入结构，会成为直接负收益。<\/li><li>双方最大牌公开后，对手会据此调整控牌和拆牌策略。<\/li><\/ul>\n<h3>已确认结论<\/h3>\n<ul><li>结缘为强制触发：其他玩家打出单牌后，另外两家均不出，大乔立即获得该牌。<\/li><li>结缘获得的牌转入大乔手牌，获得点数向全场公开。<\/li><li>贤助双方的展示牌、补牌点数与补牌数量均向全场公开。<\/li><li>同点数牌不足3张才补到3张；已有3张或超过3张均不改变原数量。<\/li><li>手牌中只要存在大小王，该方就以王为最大牌并跳过补充，不会改为补充次高点数。<\/li><\/ul>", "search": "  大乔\n\n 大乔��  \n\n 大乔��  \n\n  技能\n\n 结缘｜被动｜限1次 \n\n  其他玩家打出的单牌无人压制时，你获得该牌。\n\n 贤助｜主动｜限1次 \n\n  选择1名其他玩家，你与其分别展示手中最大的牌，然后各自将展示牌补充至3张；大小王不能补充。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8/10   贤助需要同时强化一名农民，但可通过选择对象控制对手收益，并获得最高牌情报  \n  农民   9.5/10   可与队友互相补强最高点数，兼具公开信息、三张结构与潜在炸弹接口  \n  稳定性   8.5/10   贤助规则与信息完全公开；结缘虽依赖无人压牌，但满足条件后必定触发  \n  操作上限   9/10   目标选择、发动时点与补出的三张结构决定收益差距  \n\n 身份倾向：强农民型。  农民可把贤助当作队内双向补牌；地主使用时必然同时给一名对手资源，因此需要精确压低对方收益。\n\n 先手匹配度：中高。  地主可以开局发动贤助并立即利用补成的三张结构，但技能并非纯收益；农民虽然没有先手，却更容易通过队友共享价值。\n\n  核心机制\n\n- 结缘只检查其他玩家打出的单牌；另外两家均选择不出后，立即强制触发，大乔获得该牌。\n- 获得的单牌从出牌区转入大乔手牌，具体点数向全场公开。\n- 结缘限1次，应优先等待2、a或王等高价值单牌，不宜被低单张提前消耗。\n- 贤助选择1名其他玩家，双方各自公开展示当前手牌中的最高点数牌。\n- 展示的最高点数牌不足3张时，由系统补到恰好3张；已有1张补2张，已有2张补1张，已有3张或更多均保持原数量不变。\n- 若任意一方手牌中有大王或小王，该方以王作为最大牌展示，并直接跳过补牌，什么牌都不获得。\n- 贤助新增牌的点数与数量向全场公开。\n- 贤助同时暴露双方最高牌结构，收益不仅是补牌，也包括精确情报。\n- 补至三张会增加手牌数量，只有能快速组成三带、飞机、炸弹接口或控制链时才是正收益。\n\n  贤助目标优先级\n\n  目标状态   大乔收益   对方收益   评价  \n --- --- --- --- \n  队友最高牌仅1张   自己补牌且队友也补2张   高   农民最强协作目标  \n  队友最高牌已有2张   自己补牌，队友补1张   中高   稳定构成双边三张结构  \n  对手最高牌为大小王   自己正常补牌   对手无法补王   地主优先目标  \n  对手最高点数已有3张或更多   自己正常补牌   对手保持原数量，不新增   地主低风险目标  \n  对手最高牌仅1张普通牌   自己补牌   对手同时补2张   地主通常避免  \n\n  主流打法\n\n  地主：低反哺贤助\n\n- 优先选择确认或高度疑似持有王的农民；该玩家会直接跳过补牌，可把对方增牌收益降为零。\n- 无法确认王时，选择最高点数已经较密集、最可能无需补牌的目标。\n- 自己最高牌为2或a时，贤助可直接建立三张核心；若已有两张，只增1张，效率最高。\n- 补成三张后优先并入三带、飞机或与万能牌组成炸弹，不要把新增高牌拆成多个单张。\n- 结缘保留给关键高单牌，用作残局回手或补强同点数结构。\n\n  农民：双向协作\n\n- 贤助优先给最高牌能够立即成型、且新增牌不会拖慢出手的队友。\n- 队友已有对应对子时，只补1张即可形成三张，整体手数负担最低。\n- 双方补牌结果公开后，应立刻围绕新增三张分工：一方负责领出，另一方保留拦截。\n- 结缘是强制技能，应避免让队友过早领出无人压制的低单牌；合适时可由队友领出高单张，另外两家均不出后定向供给大乔。\n- 地主接近走完时，结缘获得的牌必须能形成即时拦截或减少手数，否则增牌可能反向拖累。\n\n  技能优先级\n\n1. 贤助补成能够直接少一手的三张、飞机组件或万能牌炸弹。\n2. 农民通过贤助同时强化自己与队友的高点数结构。\n3. 地主选择王为最高牌或最高牌已满3张的对手，降低反哺。\n4. 结缘获取能形成对子、三张、炸弹接口的关键单牌。\n5. 单纯为了多拿一张普通高牌而触发结缘，优先级最低。\n\n  关键风险\n\n- 贤助不是单向增益；地主若选错目标，可能一次给农民补出2张关键高牌。\n- 补成三张不等于直接形成炸弹，若缺乏带牌或后续接口，牌量增加可能拖慢收尾。\n- 结缘强制获得单牌并增加自己的手牌，若低牌提前触发且无法并入结构，会成为直接负收益。\n- 双方最大牌公开后，对手会据此调整控牌和拆牌策略。\n\n  已确认结论\n\n- 结缘为强制触发：其他玩家打出单牌后，另外两家均不出，大乔立即获得该牌。\n- 结缘获得的牌转入大乔手牌，获得点数向全场公开。\n- 贤助双方的展示牌、补牌点数与补牌数量均向全场公开。\n- 同点数牌不足3张才补到3张；已有3张或超过3张均不改变原数量。\n- 手牌中只要存在大小王，该方就以王为最大牌并跳过补充，不会改为补充次高点数。\n"}, {"name": "姜维", "faction": "蜀", "skills": "绝计、北伐", "position": "让权弃牌、单牌升点与大王转炸", "status": "初步分析", "landlord": 8.5, "farmer": 9.5, "identity": "强农民型。", "firstMove": "偏低", "html": "<h3>技能<\/h3>\n<p><strong>绝计｜被动｜不限次数<\/strong><\/p>\n<blockquote>轮到你压牌时，若你仅有1张手牌且选择不压，该牌点数随机变大；该牌为大王时，转变为4张3。<\/blockquote>\n<p><strong>北伐｜被动｜不限次数<\/strong><\/p>\n<blockquote>轮到你压牌时，若你选择不压，弃置1张点数最小牌；仅剩1张手牌时不触发。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8.5/10<\/td><td>可通过多次不压持续减牌，但主动让权与地主连续进攻目标存在冲突<\/td><\/tr>\n<tr><td>农民<\/td><td>9.5/10<\/td><td>可借队友牌权安全触发北伐，剩单牌后再用绝计提高终局控制力<\/td><\/tr>\n<tr><td>稳定性<\/td><td>9/10<\/td><td>北伐只需轮到压牌并选择不出，减牌结果稳定；绝计升点具有随机性<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>让权次数、最低牌结构、最后单牌与大王转四张3的取舍决定上限<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：强农民型。<\/strong> 农民可在队友掌握牌权时无损触发北伐；地主虽然也能快速弃牌，但每次触发通常意味着把进攻权交给两名农民。<\/p>\n<p><strong>先手匹配度：偏低。<\/strong> 地主先手不能直接触发技能，必须等待其他玩家出牌后选择不压；技能方向是让权减牌，与地主先手连续冲牌并不完全匹配。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>两项技能都只在轮到姜维压牌且选择不出时检查。<\/li><li>手牌多于1张时，北伐弃置1张当前最低点数牌；不限次数，可逐轮持续压缩手牌。<\/li><li>仅剩1张时北伐停止，绝计接管：每次选择不压，最后一张牌随机升点。<\/li><li>最后一张已经是大王时，再触发绝计会把大王变成4张3，牌量由1张增加到4张，但获得一个四张炸弹。<\/li><li>北伐与绝计形成阶段循环：多牌阶段不断弃低牌，单牌阶段提高末牌，必要时由大王转化为炸弹重新进入多牌阶段。<\/li><li>两项技能都不要求姜维实际拥有可压制当前牌型的牌，只要轮到压牌并选择不出即可尝试触发。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：有限让权压缩<\/h4>\n<ul><li>首攻正常减手，不为了触发技能刻意打出容易失去控制的牌型。<\/li><li>农民只出单张、对子等低威胁牌型时，可选择一次不压，用北伐删除最低废张。<\/li><li>连续触发前必须确认仍有炸弹、王或高牌能够重新夺回牌权。<\/li><li>接近单牌阶段时，提前决定最终保留哪张牌；北伐会固定清理最低点数，因此可通过正常出牌调整末牌候选。<\/li><li>最后一张若已具备直接走掉的机会，应立即出完，不为继续触发绝计而放弃胜势。<\/li><\/ul>\n<h4>农民：队友牌权下连续北伐<\/h4>\n<ul><li>队友领牌时是最安全的触发窗口：姜维选择不压，持续弃掉最低牌，不破坏己方牌权。<\/li><li>队友可连续领出姜维不准备接的牌型，为北伐提供多次减牌机会。<\/li><li>地主接近走完时停止贪技能，能压必须压；北伐减1张不能补偿直接丢局。<\/li><li>进入单牌后，队友继续控场可让姜维多次触发绝计，把末牌提升到更可靠的终结点数。<\/li><li>最后一张升到大王后，若已有直接出完窗口应立刻单出；再次不压会变成四张3，重新增加手牌。<\/li><\/ul>\n<h3>阶段决策<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>当前手牌<\/th><th>不压后的主要结果<\/th><th>战术判断<\/th><\/tr><\/thead><tbody>\n<tr><td>3张以上<\/td><td>北伐弃1张最低牌<\/td><td>安全让权时持续压缩<\/td><\/tr>\n<tr><td>2张<\/td><td>北伐弃1张，进入单牌阶段<\/td><td>关键转折点，需预先设计保留牌<\/td><\/tr>\n<tr><td>1张普通牌<\/td><td>绝计随机升点<\/td><td>队友能控场时可继续养大<\/td><\/tr>\n<tr><td>1张大王<\/td><td>转变为4张3<\/td><td>获得炸弹但牌量回升，通常只在大王无法直接走掉时考虑<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>尾牌设计优先级<\/h3>\n<ol><li>保留可以在队友牌权协助下直接走掉的高单牌。<\/li><li>保留能够通过一次绝计进入2或王区间的牌。<\/li><li>利用北伐删除无法主动处理的最低孤张。<\/li><li>大王能够直接单出时优先结束，不主动追求四张3。<\/li><li>只有大王单出会被局势封锁、且后续仍有炸弹出手机会时，才考虑转四张3。<\/li><\/ol>\n<h3>关键风险<\/h3>\n<ul><li>每次发动都以“不压”为前提，错误让权可能直接放走地主或农民。<\/li><li>北伐固定弃最低点数牌，可能拆掉顺子、连对、三张或炸弹组件。<\/li><li>最后一张随机升点不等于立刻获得出牌权；仍需等待下一次主动领牌或合法压牌窗口。<\/li><li>大王转四张3会把1张尾牌变为4张，虽然获得炸弹，却可能把即将结束的牌局重新拉长。<\/li><li>地主若连续让权触发北伐，可能在自身减牌完成前被两名农民接力走完。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>绝计的随机升点上限是否为2，具体可跨越多少级，以及各点数概率是否相同。<\/li><li>最后一张为小王时还能否继续变大，以及可能结果是否只有大王。<\/li><li>2张手牌触发北伐后变为1张时，同一次“不压”是否会继续触发绝计。<\/li><li>北伐遇到多张并列最小点数牌时，系统如何选择具体牌（花色不影响牌型，仅关系到界面结算）。<\/li><li>北伐弃牌和绝计变牌结果是否向全场公开。<\/li><li>北伐弃置后手牌清空时是否立即获胜。<\/li><li>大王转成四张3后，4张3是否为普通炸弹并可继续触发北伐。<\/li><\/ul>", "search": "  姜维\n\n 姜维��  \n\n 姜维��  \n\n  技能\n\n 绝计｜被动｜不限次数 \n\n  轮到你压牌时，若你仅有1张手牌且选择不压，该牌点数随机变大；该牌为大王时，转变为4张3。\n\n 北伐｜被动｜不限次数 \n\n  轮到你压牌时，若你选择不压，弃置1张点数最小牌；仅剩1张手牌时不触发。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8.5/10   可通过多次不压持续减牌，但主动让权与地主连续进攻目标存在冲突  \n  农民   9.5/10   可借队友牌权安全触发北伐，剩单牌后再用绝计提高终局控制力  \n  稳定性   9/10   北伐只需轮到压牌并选择不出，减牌结果稳定；绝计升点具有随机性  \n  操作上限   9.5/10   让权次数、最低牌结构、最后单牌与大王转四张3的取舍决定上限  \n\n 身份倾向：强农民型。  农民可在队友掌握牌权时无损触发北伐；地主虽然也能快速弃牌，但每次触发通常意味着把进攻权交给两名农民。\n\n 先手匹配度：偏低。  地主先手不能直接触发技能，必须等待其他玩家出牌后选择不压；技能方向是让权减牌，与地主先手连续冲牌并不完全匹配。\n\n  核心机制\n\n- 两项技能都只在轮到姜维压牌且选择不出时检查。\n- 手牌多于1张时，北伐弃置1张当前最低点数牌；不限次数，可逐轮持续压缩手牌。\n- 仅剩1张时北伐停止，绝计接管：每次选择不压，最后一张牌随机升点。\n- 最后一张已经是大王时，再触发绝计会把大王变成4张3，牌量由1张增加到4张，但获得一个四张炸弹。\n- 北伐与绝计形成阶段循环：多牌阶段不断弃低牌，单牌阶段提高末牌，必要时由大王转化为炸弹重新进入多牌阶段。\n- 两项技能都不要求姜维实际拥有可压制当前牌型的牌，只要轮到压牌并选择不出即可尝试触发。\n\n  主流打法\n\n  地主：有限让权压缩\n\n- 首攻正常减手，不为了触发技能刻意打出容易失去控制的牌型。\n- 农民只出单张、对子等低威胁牌型时，可选择一次不压，用北伐删除最低废张。\n- 连续触发前必须确认仍有炸弹、王或高牌能够重新夺回牌权。\n- 接近单牌阶段时，提前决定最终保留哪张牌；北伐会固定清理最低点数，因此可通过正常出牌调整末牌候选。\n- 最后一张若已具备直接走掉的机会，应立即出完，不为继续触发绝计而放弃胜势。\n\n  农民：队友牌权下连续北伐\n\n- 队友领牌时是最安全的触发窗口：姜维选择不压，持续弃掉最低牌，不破坏己方牌权。\n- 队友可连续领出姜维不准备接的牌型，为北伐提供多次减牌机会。\n- 地主接近走完时停止贪技能，能压必须压；北伐减1张不能补偿直接丢局。\n- 进入单牌后，队友继续控场可让姜维多次触发绝计，把末牌提升到更可靠的终结点数。\n- 最后一张升到大王后，若已有直接出完窗口应立刻单出；再次不压会变成四张3，重新增加手牌。\n\n  阶段决策\n\n  当前手牌   不压后的主要结果   战术判断  \n ---: --- --- \n  3张以上   北伐弃1张最低牌   安全让权时持续压缩  \n  2张   北伐弃1张，进入单牌阶段   关键转折点，需预先设计保留牌  \n  1张普通牌   绝计随机升点   队友能控场时可继续养大  \n  1张大王   转变为4张3   获得炸弹但牌量回升，通常只在大王无法直接走掉时考虑  \n\n  尾牌设计优先级\n\n1. 保留可以在队友牌权协助下直接走掉的高单牌。\n2. 保留能够通过一次绝计进入2或王区间的牌。\n3. 利用北伐删除无法主动处理的最低孤张。\n4. 大王能够直接单出时优先结束，不主动追求四张3。\n5. 只有大王单出会被局势封锁、且后续仍有炸弹出手机会时，才考虑转四张3。\n\n  关键风险\n\n- 每次发动都以“不压”为前提，错误让权可能直接放走地主或农民。\n- 北伐固定弃最低点数牌，可能拆掉顺子、连对、三张或炸弹组件。\n- 最后一张随机升点不等于立刻获得出牌权；仍需等待下一次主动领牌或合法压牌窗口。\n- 大王转四张3会把1张尾牌变为4张，虽然获得炸弹，却可能把即将结束的牌局重新拉长。\n- 地主若连续让权触发北伐，可能在自身减牌完成前被两名农民接力走完。\n\n  待实测\n\n- 绝计的随机升点上限是否为2，具体可跨越多少级，以及各点数概率是否相同。\n- 最后一张为小王时还能否继续变大，以及可能结果是否只有大王。\n- 2张手牌触发北伐后变为1张时，同一次“不压”是否会继续触发绝计。\n- 北伐遇到多张并列最小点数牌时，系统如何选择具体牌（花色不影响牌型，仅关系到界面结算）。\n- 北伐弃牌和绝计变牌结果是否向全场公开。\n- 北伐弃置后手牌清空时是否立即获胜。\n- 大王转成四张3后，4张3是否为普通炸弹并可继续触发北伐。\n"}, {"name": "孙策", "faction": "吴", "skills": "继志、借兵", "position": "三K起手、高对转换与反应型补给", "status": "主要规则已实测", "landlord": 8.5, "farmer": 9.0, "identity": "农民略优。", "firstMove": "中等", "html": "<h3>技能<\/h3>\n<p><strong>继志｜被动｜限1次<\/strong><\/p>\n<blockquote>开局时，将手牌中的K补充至3张。<\/blockquote>\n<p><strong>借兵｜主动｜限2次<\/strong><\/p>\n<blockquote>无牌可压时，可以弃置1张K，并获得1个不低于J的对子，然后跳过压牌；获得的对子不会是K。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8.5/10<\/td><td>开局稳定获得三K结构，但借兵依赖无牌可压，先手不能直接启动<\/td><\/tr>\n<tr><td>农民<\/td><td>9/10<\/td><td>更容易进入无牌可压窗口，高对可用于后续拦截或与队友建立控制链<\/td><\/tr>\n<tr><td>稳定性<\/td><td>9/10<\/td><td>三K起点固定、两次借兵均有K可用；随机只影响获得的高对点数<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9/10<\/td><td>用一次保留对K还是用两次追求第二个高对，是核心分支<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：农民略优。<\/strong><\/p>\n<p><strong>先手匹配度：中等。<\/strong> 地主能先处理其他结构并保留K作为借兵资源，但借兵必须等到无牌可压才可发动；先手对继志没有额外增益。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>开局K少于3张时，继志直接补牌至3张；原有K越少，净增加的手牌越多。<\/li><li>开局已有3张K时不额外补牌；已有4张或更多K时也不处理，完整保留原数量。<\/li><li>借兵只有在完全没有合法压牌时才能发动，不能在有牌可压时主动放弃应牌并换牌。<\/li><li>每次借兵弃1张K、获得2张同点数高牌，手牌净增加1张。<\/li><li>获得范围为不低于J的对子，但排除对K；主要候选为对J、对Q、对A、对2。<\/li><li>继志提供的三张K正好支持两次借兵，但两次全用会把三K拆至单K。<\/li><li>借兵只受“限2次”和当前是否有K可弃约束，与这是手中第几张K无关；即使只剩最后1张K，也能正常发动并将其弃置。<\/li><li>万能牌不参与孙策的继志或借兵机制，不计作K，也不能替代弃置成本。<\/li><li>借兵发动后跳过本次压牌，新增对子不能立即用于当前这一轮反压。<\/li><\/ul>\n<h3>一次与两次借兵的结构差异<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>使用次数<\/th><th>K结构变化<\/th><th>新增结构<\/th><th>净牌量<\/th><th>主流判断<\/th><\/tr><\/thead><tbody>\n<tr><td>0次<\/td><td>保留三K<\/td><td>无<\/td><td>0<\/td><td>三K已能高效并入三带、飞机或发展炸弹<\/td><\/tr>\n<tr><td>1次<\/td><td>三K变对K<\/td><td>1个J以上对子<\/td><td>+1<\/td><td>最均衡路线：保留高对K，同时获得另一个高对<\/td><\/tr>\n<tr><td>2次<\/td><td>对K变单K<\/td><td>2个J以上对子<\/td><td>+2<\/td><td>控制牌更多，但留下单K并增加总牌量，要求新对子能明显重组<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>默认最优通常是使用一次。<\/strong> 对K本身是稳定回手结构，第一次借兵完成“对K＋随机高对”；第二次借兵是否值得，取决于新对子能否形成三张、炸弹、连对或解决残局控制问题。<\/p>\n<h3>借兵奖励优先结果<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>随机对子<\/th><th>价值判断<\/th><\/tr><\/thead><tbody>\n<tr><td>对2<\/td><td>最高质量控制牌，第二次借兵的必要性通常下降<\/td><\/tr>\n<tr><td>对A<\/td><td>强回手牌，可与已有A组成三张或炸弹<\/td><\/tr>\n<tr><td>对Q<\/td><td>适合与对K、对J组成连对，或补现有Q结构<\/td><\/tr>\n<tr><td>对J<\/td><td>点数最低，但容易进入J-Q-K-A区间连对和三带结构<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>获得对子后应先检查同点数原牌：原有1张可形成三张，原有2张可直接形成四张炸弹；这种情况下借兵的增牌成本会迅速转化为结构收益。<\/p>\n<h3>主流打法<\/h3>\n<h4>地主：三K保留与单次转换<\/h4>\n<ul><li>首攻优先处理不依赖K的长顺、连对、飞机等结构，不急于消耗三K。<\/li><li>三K可直接作为三带结构，也可保留为两次借兵的资源池。<\/li><li>第一次无牌可压时通常发动，形成对K加随机高对的双控制结构。<\/li><li>若第一次获得对A或对2，往往停止第二次借兵，避免把对K拆成孤K。<\/li><li>只有第二次新增对子能显著降低静态手数，或必须增加拦截资源时，才继续转换。<\/li><\/ul>\n<h4>农民：反应型高对补给<\/h4>\n<ul><li>无法压住地主的关键牌型时发动第一次借兵，用新增高对准备下一轮拦截。<\/li><li>保留对K有利于与队友建立双重回手，因此不默认用满两次。<\/li><li>地主进入少牌阶段时，即使第二次会留下单K，也可换取对A或对2的潜在封锁能力。<\/li><li>新增对子无法处理当前牌面，发动借兵等于接受本轮失去牌权；必须评估地主是否会直接走完。<\/li><\/ul>\n<h3>叫地主判断<\/h3>\n<ul><li>开局0至1张K：继志补牌量较大，但直接形成三K，属于明显结构收益，不应只按“手牌变多”降分。<\/li><li>开局2张K：只增加1张便形成三K，是继志效率最高的起手。<\/li><li>开局3张K：没有增牌，保留原生三K并获得两次转换权，结构最干净。<\/li><li>有三带出口、K炸潜力或J/Q/A/2对子底子时，孙策更适合叫地主。<\/li><li>若原手牌已经对子过多、缺少带牌和长结构，借兵继续增加对子可能使手数恶化，不宜只凭三K强叫。<\/li><\/ul>\n<h3>关键风险<\/h3>\n<ul><li>借兵每次净增1张，并非直接减手技能。<\/li><li>第二次发动会把对K拆成单K，可能从两手变成三手。<\/li><li>新增对子随机，无法保证获得对2或补中现有点数。<\/li><li>无牌可压时若地主即将走完，发动借兵也无法立即阻止本轮出牌。<\/li><li>过早打掉K会失去后续借兵资格；过度保K又可能错过直接减手窗口。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>借兵随机对子是否只包含J、Q、A、2，四种结果的权重是否相等。<\/li><li>借兵获得的对子及点数是否向其他玩家公开。<\/li><\/ul>\n<h3>已确认的操作结论<\/h3>\n<ul><li>继志只做向上补足，不会把4张及以上K压回3张，也不会拆分原生K炸弹。<\/li><li>两次借兵是独立的固定次数，最后一张K仍是合法成本；不存在必须保留某一张K的隐藏限制。<\/li><li>万能牌与该武将两项技能完全无关，分析时不纳入K资源池。<\/li><\/ul>", "search": "  孙策\n\n 孙策��  \n\n 孙策��  \n\n  技能\n\n 继志｜被动｜限1次 \n\n  开局时，将手牌中的k补充至3张。\n\n 借兵｜主动｜限2次 \n\n  无牌可压时，可以弃置1张k，并获得1个不低于j的对子，然后跳过压牌；获得的对子不会是k。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   8.5/10   开局稳定获得三k结构，但借兵依赖无牌可压，先手不能直接启动  \n  农民   9/10   更容易进入无牌可压窗口，高对可用于后续拦截或与队友建立控制链  \n  稳定性   9/10   三k起点固定、两次借兵均有k可用；随机只影响获得的高对点数  \n  操作上限   9/10   用一次保留对k还是用两次追求第二个高对，是核心分支  \n\n 身份倾向：农民略优。 \n\n 先手匹配度：中等。  地主能先处理其他结构并保留k作为借兵资源，但借兵必须等到无牌可压才可发动；先手对继志没有额外增益。\n\n  核心机制\n\n- 开局k少于3张时，继志直接补牌至3张；原有k越少，净增加的手牌越多。\n- 开局已有3张k时不额外补牌；已有4张或更多k时也不处理，完整保留原数量。\n- 借兵只有在完全没有合法压牌时才能发动，不能在有牌可压时主动放弃应牌并换牌。\n- 每次借兵弃1张k、获得2张同点数高牌，手牌净增加1张。\n- 获得范围为不低于j的对子，但排除对k；主要候选为对j、对q、对a、对2。\n- 继志提供的三张k正好支持两次借兵，但两次全用会把三k拆至单k。\n- 借兵只受“限2次”和当前是否有k可弃约束，与这是手中第几张k无关；即使只剩最后1张k，也能正常发动并将其弃置。\n- 万能牌不参与孙策的继志或借兵机制，不计作k，也不能替代弃置成本。\n- 借兵发动后跳过本次压牌，新增对子不能立即用于当前这一轮反压。\n\n  一次与两次借兵的结构差异\n\n  使用次数   k结构变化   新增结构   净牌量   主流判断  \n ---: --- --- ---: --- \n  0次   保留三k   无   0   三k已能高效并入三带、飞机或发展炸弹  \n  1次   三k变对k   1个j以上对子   +1   最均衡路线：保留高对k，同时获得另一个高对  \n  2次   对k变单k   2个j以上对子   +2   控制牌更多，但留下单k并增加总牌量，要求新对子能明显重组  \n\n 默认最优通常是使用一次。  对k本身是稳定回手结构，第一次借兵完成“对k＋随机高对”；第二次借兵是否值得，取决于新对子能否形成三张、炸弹、连对或解决残局控制问题。\n\n  借兵奖励优先结果\n\n  随机对子   价值判断  \n --- --- \n  对2   最高质量控制牌，第二次借兵的必要性通常下降  \n  对a   强回手牌，可与已有a组成三张或炸弹  \n  对q   适合与对k、对j组成连对，或补现有q结构  \n  对j   点数最低，但容易进入j-q-k-a区间连对和三带结构  \n\n获得对子后应先检查同点数原牌：原有1张可形成三张，原有2张可直接形成四张炸弹；这种情况下借兵的增牌成本会迅速转化为结构收益。\n\n  主流打法\n\n  地主：三k保留与单次转换\n\n- 首攻优先处理不依赖k的长顺、连对、飞机等结构，不急于消耗三k。\n- 三k可直接作为三带结构，也可保留为两次借兵的资源池。\n- 第一次无牌可压时通常发动，形成对k加随机高对的双控制结构。\n- 若第一次获得对a或对2，往往停止第二次借兵，避免把对k拆成孤k。\n- 只有第二次新增对子能显著降低静态手数，或必须增加拦截资源时，才继续转换。\n\n  农民：反应型高对补给\n\n- 无法压住地主的关键牌型时发动第一次借兵，用新增高对准备下一轮拦截。\n- 保留对k有利于与队友建立双重回手，因此不默认用满两次。\n- 地主进入少牌阶段时，即使第二次会留下单k，也可换取对a或对2的潜在封锁能力。\n- 新增对子无法处理当前牌面，发动借兵等于接受本轮失去牌权；必须评估地主是否会直接走完。\n\n  叫地主判断\n\n- 开局0至1张k：继志补牌量较大，但直接形成三k，属于明显结构收益，不应只按“手牌变多”降分。\n- 开局2张k：只增加1张便形成三k，是继志效率最高的起手。\n- 开局3张k：没有增牌，保留原生三k并获得两次转换权，结构最干净。\n- 有三带出口、k炸潜力或j/q/a/2对子底子时，孙策更适合叫地主。\n- 若原手牌已经对子过多、缺少带牌和长结构，借兵继续增加对子可能使手数恶化，不宜只凭三k强叫。\n\n  关键风险\n\n- 借兵每次净增1张，并非直接减手技能。\n- 第二次发动会把对k拆成单k，可能从两手变成三手。\n- 新增对子随机，无法保证获得对2或补中现有点数。\n- 无牌可压时若地主即将走完，发动借兵也无法立即阻止本轮出牌。\n- 过早打掉k会失去后续借兵资格；过度保k又可能错过直接减手窗口。\n\n  待实测\n\n- 借兵随机对子是否只包含j、q、a、2，四种结果的权重是否相等。\n- 借兵获得的对子及点数是否向其他玩家公开。\n\n  已确认的操作结论\n\n- 继志只做向上补足，不会把4张及以上k压回3张，也不会拆分原生k炸弹。\n- 两次借兵是独立的固定次数，最后一张k仍是合法成本；不存在必须保留某一张k的隐藏限制。\n- 万能牌与该武将两项技能完全无关，分析时不纳入k资源池。\n"}, {"name": "张飞", "faction": "蜀", "skills": "咆哮", "position": "跨轮同型配对、低牌双升点与隐藏重组", "status": "主要规则已实测", "landlord": 9.5, "farmer": 9.0, "identity": "地主略优，但农民同样属于高强度。", "firstMove": "极高", "html": "<h3>技能<\/h3>\n<p><strong>咆哮｜被动｜不限次数<\/strong><\/p>\n<blockquote>连续两次打出相同牌型时，手中2张最小牌随机变大。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9.5/10<\/td><td>先手立即建立1层记录，后续不怕牌权中断，能稳定规划同型双升点<\/td><\/tr>\n<tr><td>农民<\/td><td>9/10<\/td><td>被压或失去牌权不会中断记录，只要个人下一手保持同类即可触发<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8.5/10<\/td><td>记录跨轮保留、一次改造2张且不限次数；主要波动来自随机升点结果<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>牌型序列与触发前手牌结构决定技能是升质还是拆牌<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：地主略优，但农民同样属于高强度。<\/strong><\/p>\n<p><strong>先手匹配度：极高。<\/strong> 地主第一手直接建立对应牌型的1层记录；之后即使被压、经过其他玩家回合，只要张飞个人下一次仍打同类牌型，就能完成触发。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>咆哮没有次数上限，可以在一局内反复改造手牌。<\/li><li>张飞每打出一种牌型，先建立该牌型的1层记录。<\/li><li>下一次由张飞出牌时仍为同一牌型，记录升至2层并触发咆哮；不要求处于同一轮，也不要求连续掌握牌权。<\/li><li>中间被其他玩家压牌不影响记录；只看张飞个人相邻两次实际出牌，期间是否打过其他牌型。<\/li><li>两次出牌结算为一组。触发后重新计数：连续打四次相同牌型会在第2次和第4次分别触发，不会在第3次滚动触发。<\/li><li>相同牌型按大类判断，顺子、连对、飞机等即使长度不同，也属于相同牌型。<\/li><li>每次触发同时选中手中最多2张最小牌，并按夏侯渊“神速”的同类机制随机向上改变点数。<\/li><li>升点上限为2；2不能继续变大，低点数也可能直接跳到2。<\/li><li>技能目标不可自由选择，因此触发前必须检查当前两张最小牌属于什么结构。<\/li><li>升点可能把孤张升级为控制牌，也可能拆散对子、三张、顺子或带牌结构。<\/li><li>技能收益是动态牌质提升，不直接减少手牌数量。<\/li><li>手牌不足2张时仍会触发，并改造当时实际剩余的可用牌。<\/li><li>如果本次出牌已经把手牌全部出完，则直接获胜，不再结算咆哮。<\/li><li>升点结果不向其他玩家公开，只有张飞本人知道。<\/li><\/ul>\n<h3>触发牌型优先级<\/h3>\n<ol><li><strong>连续两手对子：<\/strong> 每次正常减2张，结构效率和触发稳定性兼顾。<\/li><li><strong>连续两手单张：<\/strong> 最容易安排，但减手慢，适合精准处理低牌并连续刷技能。<\/li><li><strong>连续三带或飞机：<\/strong> 大量减手并触发升级，上限高但实战条件较严。<\/li><li><strong>连续顺子或连对：<\/strong> 长度可以不同，适合在大量减牌的同时稳定完成触发。<\/li><li><strong>连续炸弹：<\/strong> 控场和升级兼得，但不应仅为触发提前消耗炸弹。<\/li><\/ol>\n<h3>主流打法<\/h3>\n<h4>地主：同型连打成长<\/h4>\n<ul><li>首攻优先选择手中能够在个人下一次出牌时再次打出的牌型，不要求保住本轮牌权。<\/li><li>触发前先处理会被升点破坏的低位对子、三张或顺子连接张。<\/li><li>若最低两张均为无结构孤张，可主动连续打同牌型，将其同时升级为中高牌。<\/li><li>若最低牌中包含关键对子或炸弹组件，应暂缓第二次同型出牌，先把该结构正常打出。<\/li><li>每次咆哮后立即重算手牌；升点会产生新的对子、三张、顺子连接或控制牌，不能沿用旧拆法。<\/li><\/ul>\n<p>地主的高效循环：<\/p>\n<blockquote>首手建立1层 → 中间牌权变化不影响记录 → 个人下一手同型触发双升点 → 重新计数并按新点数重组。<\/blockquote>\n<h4>农民：跨轮保留型<\/h4>\n<ul><li>优先准备两组能够分别获得出牌窗口的单张或对子，不要求在同一轮完成。<\/li><li>队友正常抢牌权不会破坏张飞记录，无需为咆哮刻意让牌。<\/li><li>被地主压住后，只要下次重新出牌仍保持原牌型，就可以正常触发。<\/li><li>低牌升级后通常保留为拦截点，不必为了继续触发强行拆开新形成的对子或三张。<\/li><li>地主接近走完时，直接压制高于技能养成，不能为了凑第二次同型而放过关键牌。<\/li><\/ul>\n<h3>触发前检查<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>当前两张最小牌<\/th><th>建议<\/th><\/tr><\/thead><tbody>\n<tr><td>两张无结构孤牌<\/td><td>最理想目标，可主动完成触发<\/td><\/tr>\n<tr><td>一个对子<\/td><td>升点可能拆对，先判断对子是否承担收尾<\/td><\/tr>\n<tr><td>三张或炸弹中的两张<\/td><td>高风险，通常先打出或保护原结构<\/td><\/tr>\n<tr><td>顺子关键连接张<\/td><td>升点后可能使整条顺子断裂，谨慎触发<\/td><\/tr>\n<tr><td>已经较高的两张牌<\/td><td>继续升点的控制收益较高，但随机结果可能重叠或分散<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>关键风险<\/h3>\n<ul><li>技能强制选择最小牌，无法保护低位完整结构。<\/li><li>为追求连续相同牌型，可能放弃更高效的正常拆牌路线。<\/li><li>随机升点后可能产生更多孤张，牌质提升不等于静态手数下降。<\/li><li>张飞自己改打其他牌型会中断原有配对记录，出牌顺序规划错误才是主要断层来源。<\/li><li>接近残局时若手中只剩完整组合，咆哮反而可能破坏直接走完结构。<\/li><\/ul>\n<h3>已确认的操作结论<\/h3>\n<ul><li>咆哮记录跨轮保留，不需要连续掌握牌权，不能用抢牌权直接打断张飞。<\/li><li>两次同类牌型为一个独立结算组，触发后重新从1层开始累计。<\/li><li>牌型长度不影响大类判定，长顺接短顺、不同长度连对仍能完成配对。<\/li><li>技能与神速使用同一套升点规则，但咆哮一次处理2张最小牌。<\/li><li>结果隐藏使张飞具备信息优势；对手只能知道技能已经触发，不能确定新点数。<\/li><li>直接出完优先于技能结算，任何时候都不应为了触发而放弃当手获胜。<\/li><\/ul>", "search": "  张飞\n\n 张飞  \n\n  技能\n\n 咆哮｜被动｜不限次数 \n\n  连续两次打出相同牌型时，手中2张最小牌随机变大。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9.5/10   先手立即建立1层记录，后续不怕牌权中断，能稳定规划同型双升点  \n  农民   9/10   被压或失去牌权不会中断记录，只要个人下一手保持同类即可触发  \n  稳定性   8.5/10   记录跨轮保留、一次改造2张且不限次数；主要波动来自随机升点结果  \n  操作上限   9.5/10   牌型序列与触发前手牌结构决定技能是升质还是拆牌  \n\n 身份倾向：地主略优，但农民同样属于高强度。 \n\n 先手匹配度：极高。  地主第一手直接建立对应牌型的1层记录；之后即使被压、经过其他玩家回合，只要张飞个人下一次仍打同类牌型，就能完成触发。\n\n  核心机制\n\n- 咆哮没有次数上限，可以在一局内反复改造手牌。\n- 张飞每打出一种牌型，先建立该牌型的1层记录。\n- 下一次由张飞出牌时仍为同一牌型，记录升至2层并触发咆哮；不要求处于同一轮，也不要求连续掌握牌权。\n- 中间被其他玩家压牌不影响记录；只看张飞个人相邻两次实际出牌，期间是否打过其他牌型。\n- 两次出牌结算为一组。触发后重新计数：连续打四次相同牌型会在第2次和第4次分别触发，不会在第3次滚动触发。\n- 相同牌型按大类判断，顺子、连对、飞机等即使长度不同，也属于相同牌型。\n- 每次触发同时选中手中最多2张最小牌，并按夏侯渊“神速”的同类机制随机向上改变点数。\n- 升点上限为2；2不能继续变大，低点数也可能直接跳到2。\n- 技能目标不可自由选择，因此触发前必须检查当前两张最小牌属于什么结构。\n- 升点可能把孤张升级为控制牌，也可能拆散对子、三张、顺子或带牌结构。\n- 技能收益是动态牌质提升，不直接减少手牌数量。\n- 手牌不足2张时仍会触发，并改造当时实际剩余的可用牌。\n- 如果本次出牌已经把手牌全部出完，则直接获胜，不再结算咆哮。\n- 升点结果不向其他玩家公开，只有张飞本人知道。\n\n  触发牌型优先级\n\n1.  连续两手对子：  每次正常减2张，结构效率和触发稳定性兼顾。\n2.  连续两手单张：  最容易安排，但减手慢，适合精准处理低牌并连续刷技能。\n3.  连续三带或飞机：  大量减手并触发升级，上限高但实战条件较严。\n4.  连续顺子或连对：  长度可以不同，适合在大量减牌的同时稳定完成触发。\n5.  连续炸弹：  控场和升级兼得，但不应仅为触发提前消耗炸弹。\n\n  主流打法\n\n  地主：同型连打成长\n\n- 首攻优先选择手中能够在个人下一次出牌时再次打出的牌型，不要求保住本轮牌权。\n- 触发前先处理会被升点破坏的低位对子、三张或顺子连接张。\n- 若最低两张均为无结构孤张，可主动连续打同牌型，将其同时升级为中高牌。\n- 若最低牌中包含关键对子或炸弹组件，应暂缓第二次同型出牌，先把该结构正常打出。\n- 每次咆哮后立即重算手牌；升点会产生新的对子、三张、顺子连接或控制牌，不能沿用旧拆法。\n\n地主的高效循环：\n\n  首手建立1层 → 中间牌权变化不影响记录 → 个人下一手同型触发双升点 → 重新计数并按新点数重组。\n\n  农民：跨轮保留型\n\n- 优先准备两组能够分别获得出牌窗口的单张或对子，不要求在同一轮完成。\n- 队友正常抢牌权不会破坏张飞记录，无需为咆哮刻意让牌。\n- 被地主压住后，只要下次重新出牌仍保持原牌型，就可以正常触发。\n- 低牌升级后通常保留为拦截点，不必为了继续触发强行拆开新形成的对子或三张。\n- 地主接近走完时，直接压制高于技能养成，不能为了凑第二次同型而放过关键牌。\n\n  触发前检查\n\n  当前两张最小牌   建议  \n --- --- \n  两张无结构孤牌   最理想目标，可主动完成触发  \n  一个对子   升点可能拆对，先判断对子是否承担收尾  \n  三张或炸弹中的两张   高风险，通常先打出或保护原结构  \n  顺子关键连接张   升点后可能使整条顺子断裂，谨慎触发  \n  已经较高的两张牌   继续升点的控制收益较高，但随机结果可能重叠或分散  \n\n  关键风险\n\n- 技能强制选择最小牌，无法保护低位完整结构。\n- 为追求连续相同牌型，可能放弃更高效的正常拆牌路线。\n- 随机升点后可能产生更多孤张，牌质提升不等于静态手数下降。\n- 张飞自己改打其他牌型会中断原有配对记录，出牌顺序规划错误才是主要断层来源。\n- 接近残局时若手中只剩完整组合，咆哮反而可能破坏直接走完结构。\n\n  已确认的操作结论\n\n- 咆哮记录跨轮保留，不需要连续掌握牌权，不能用抢牌权直接打断张飞。\n- 两次同类牌型为一个独立结算组，触发后重新从1层开始累计。\n- 牌型长度不影响大类判定，长顺接短顺、不同长度连对仍能完成配对。\n- 技能与神速使用同一套升点规则，但咆哮一次处理2张最小牌。\n- 结果隐藏使张飞具备信息优势；对手只能知道技能已经触发，不能确定新点数。\n- 直接出完优先于技能结算，任何时候都不应为了触发而放弃当手获胜。\n"}, {"name": "徐盛", "faction": "吴", "skills": "疑城", "position": "补牌过滤、失去出牌权前的补救", "status": "初步分析", "landlord": 7.0, "farmer": 8.5, "identity": "农民明显优于地主。", "firstMove": "中等", "html": "<h3>技能<\/h3>\n<p><strong>疑城｜主动｜限3次<\/strong><\/p>\n<blockquote>你无牌可压时，可以先随机获得2张牌，然后再选择1张手牌弃置。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>7/10<\/td><td>先手可先建立牌型节奏，但疑城属于失去应牌后的补救，先手不直接启动技能<\/td><\/tr>\n<tr><td>农民<\/td><td>8.5/10<\/td><td>地主冲刺时强行找应牌，容错与拦截价值高<\/td><\/tr>\n<tr><td>稳定性<\/td><td>6/10<\/td><td>补牌随机，弃牌可控<\/td><\/tr>\n<tr><td>操作上限<\/td><td>8/10<\/td><td>发动时机和弃牌质量决定强度<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：农民明显优于地主。<\/strong><\/p>\n<p><strong>先手匹配度：中等。<\/strong> 地主能先处理最难交出的牌型，降低后续“无牌可压”的概率，但疑城本质是反应型技能，必须等到无法压牌才产生价值，先手增益不如主动成长型武将。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>触发门槛：当前无牌可压。<\/li><li>单次牌差：获得2张、弃1张，手牌净增1张。<\/li><li>核心收益：重新寻找应牌，同时过滤一张废牌。<\/li><li>核心代价：最多可能净增3张，残局手数压力上升。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>农民：拦截型<\/h4>\n<ul><li>前期不为普通牌型浪费次数，主要留给地主进入少牌阶段。<\/li><li>地主剩1—3手时，无牌可压再发动，价值最高。<\/li><li>摸到应牌时优先截断地主；没摸到时，用弃牌优化自己的尾牌。<\/li><li>队友已有明显牌权时不抢着发动，避免无意义增牌。<\/li><\/ul>\n<h4>地主：续攻型<\/h4>\n<ul><li>首攻优先处理难脱手结构，利用先手减少后续被卡死的节点。<\/li><li>只在失去牌权会导致农民连续走牌时使用。<\/li><li>手牌本身整齐时少发动，避免随机补牌打散收尾。<\/li><li>适合有多张孤牌、补到相邻点数即可成顺子/连对/三张的牌局。<\/li><li>第三次通常留给残局，不在前期全部交完。<\/li><\/ul>\n<h3>弃牌优先级<\/h3>\n<ol><li>无法并入任何组合的低位孤张。<\/li><li>破坏最少手数方案的冗余牌。<\/li><li>重复但无法成对、成三或作带牌的断张。<\/li><\/ol>\n<p>避免弃置控制牌、完整组合关键张，以及能让最少手数下降的连接张。<\/p>\n<h3>关键判断<\/h3>\n<p>发动前只比较两件事：<\/p>\n<ol><li>抢回这一轮牌权的价值；<\/li><li>手牌净增1张对残局的成本。<\/li><\/ol>\n<p>地主即将走完时，牌权价值通常高于增牌成本；普通前中期则相反。<\/p>\n<h3>待实测<\/h3>\n<ul><li>新牌的具体来源与牌池规则。<\/li><li>发动后是否立即获得重新压牌机会。<\/li><li>有炸弹但不愿使用时，系统是否仍判定“无牌可压”。<\/li><li>弃牌是否公开。<\/li><li>“限3次”的重置范围。<\/li><\/ul>", "search": "  徐盛\n\n 徐盛  \n\n  技能\n\n 疑城｜主动｜限3次 \n\n  你无牌可压时，可以先随机获得2张牌，然后再选择1张手牌弃置。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   7/10   先手可先建立牌型节奏，但疑城属于失去应牌后的补救，先手不直接启动技能  \n  农民   8.5/10   地主冲刺时强行找应牌，容错与拦截价值高  \n  稳定性   6/10   补牌随机，弃牌可控  \n  操作上限   8/10   发动时机和弃牌质量决定强度  \n\n 身份倾向：农民明显优于地主。 \n\n 先手匹配度：中等。  地主能先处理最难交出的牌型，降低后续“无牌可压”的概率，但疑城本质是反应型技能，必须等到无法压牌才产生价值，先手增益不如主动成长型武将。\n\n  核心机制\n\n- 触发门槛：当前无牌可压。\n- 单次牌差：获得2张、弃1张，手牌净增1张。\n- 核心收益：重新寻找应牌，同时过滤一张废牌。\n- 核心代价：最多可能净增3张，残局手数压力上升。\n\n  主流打法\n\n  农民：拦截型\n\n- 前期不为普通牌型浪费次数，主要留给地主进入少牌阶段。\n- 地主剩1—3手时，无牌可压再发动，价值最高。\n- 摸到应牌时优先截断地主；没摸到时，用弃牌优化自己的尾牌。\n- 队友已有明显牌权时不抢着发动，避免无意义增牌。\n\n  地主：续攻型\n\n- 首攻优先处理难脱手结构，利用先手减少后续被卡死的节点。\n- 只在失去牌权会导致农民连续走牌时使用。\n- 手牌本身整齐时少发动，避免随机补牌打散收尾。\n- 适合有多张孤牌、补到相邻点数即可成顺子/连对/三张的牌局。\n- 第三次通常留给残局，不在前期全部交完。\n\n  弃牌优先级\n\n1. 无法并入任何组合的低位孤张。\n2. 破坏最少手数方案的冗余牌。\n3. 重复但无法成对、成三或作带牌的断张。\n\n避免弃置控制牌、完整组合关键张，以及能让最少手数下降的连接张。\n\n  关键判断\n\n发动前只比较两件事：\n\n1. 抢回这一轮牌权的价值；\n2. 手牌净增1张对残局的成本。\n\n地主即将走完时，牌权价值通常高于增牌成本；普通前中期则相反。\n\n  待实测\n\n- 新牌的具体来源与牌池规则。\n- 发动后是否立即获得重新压牌机会。\n- 有炸弹但不愿使用时，系统是否仍判定“无牌可压”。\n- 弃牌是否公开。\n- “限3次”的重置范围。\n"}, {"name": "甄姬", "faction": "魏", "skills": "镜花、洛神", "position": "牌型收集、高对与万能牌成长", "status": "主要奖励已确认", "landlord": 9.0, "farmer": 9.5, "identity": "农民略优。", "firstMove": "中高", "html": "<h3>技能<\/h3>\n<p><strong>镜花｜被动｜不限次数<\/strong><\/p>\n<blockquote>当任意玩家打出1种新牌型时，你点亮1片“花瓣”。<\/blockquote>\n<p><strong>洛神｜被动｜各限1次<\/strong><\/p>\n<blockquote>点亮3片“花瓣”时，立即随机获得1个不低于J的对子。<br>点亮5片“花瓣”时，立即获得1张万能牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9/10<\/td><td>有先手，可主动登记首种牌型；五花瓣万能牌显著提高主动冲牌上限<\/td><\/tr>\n<tr><td>农民<\/td><td>9.5/10<\/td><td>队友可主动补新牌型，触发五花瓣更稳定，万能牌也更利于协同控场<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8/10<\/td><td>镜花统计全场，三花瓣门槛较低；奖励点数随机<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>关键在牌型去重、五花瓣触发节奏与万能牌落点<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：农民略优。<\/strong><\/p>\n<p><strong>先手匹配度：中高。<\/strong> 地主可首手主动登记一种牌型，但镜花依赖全场出现不同牌型，不是单靠先手即可完成的技能循环。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>花瓣按“新牌型种类”累计，重复牌型不应重复计数。<\/li><li>任意玩家出牌都能推进，包括自己、对手和农民队友。<\/li><li>三花瓣奖励为J、Q、K、A、2范围内的随机对子。<\/li><li>三花瓣奖励手牌增加2张，收益是高对和回手能力，代价是总手数上升。<\/li><li>五花瓣奖励为1张万能牌，可代替除大小王外的任意点数，并参与炸弹和特殊牌型。<\/li><li>两段洛神奖励各触发一次；完整收益为一个高对加一张万能牌。<\/li><\/ul>\n<h3>主流打法<\/h3>\n<h4>地主：先手铺类型<\/h4>\n<ul><li>首攻优先选择本来就计划打出的完整牌型，同时点亮第一片花瓣。<\/li><li>后续取得牌权时，优先打尚未登记、又不增加拆牌手数的牌型。<\/li><li>不为凑花瓣强拆炸弹、飞机或长顺；奖励增加手牌，必须看整体收益。<\/li><li>三花瓣高对优先作为回手点，或并入三带、飞机等尾牌。<\/li><li>五花瓣临界时可为万能牌适度调整出牌顺序，但应确保万能牌能直接降低手数或形成强控制牌型。<\/li><\/ul>\n<p>地主首攻的价值在于锁定一个低成本牌型，并迫使两名农民后续出牌时可能继续为镜花补类型。<\/p>\n<h4>农民：队友协同型<\/h4>\n<ul><li>两名农民应尽量错开牌型，避免重复单张、对子而不推进花瓣。<\/li><li>队友有自然顺子、连对、三带时，可主动补齐第三或第五种牌型。<\/li><li>地主冲刺阶段，三花瓣高对更适合保留拦截，不急于拆开带牌。<\/li><li>接近五花瓣时，队友应优先打自然存在的新牌型，帮助甄姬取得万能牌并修补关键结构。<\/li><\/ul>\n<h3>牌型登记优先级<\/h3>\n<ol><li>不拆牌即可打出的顺子、连对、飞机等完整结构。<\/li><li>本来就要处理的单张、对子、三带。<\/li><li>能在取得牌权后自然出现的炸弹或特殊牌型。<\/li><li>需要强拆现有组合才能制造的新类型。<\/li><\/ol>\n<p>花瓣只是手段，不能为了“新类型”让静态手数明显恶化。<\/p>\n<h3>三花瓣奖励的处理<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>随机对子<\/th><th>主流处理<\/th><\/tr><\/thead><tbody>\n<tr><td>对2<\/td><td>稳定回手，通常保留到残局<\/td><\/tr>\n<tr><td>对A/对K<\/td><td>作为高对争权，或补三张结构<\/td><\/tr>\n<tr><td>对Q/对J<\/td><td>更适合尽快并入三带、飞机或连续对子<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p>高对不会自动降低手数。若原手牌缺乏对子结构，新增对子可能仍需独立一手打出；评分时应同时计算控制力与增牌成本。<\/p>\n<h3>五花瓣万能牌的处理<\/h3>\n<ol><li>优先补成能直接少一手的炸弹、飞机、连对或顺子。<\/li><li>其次补强残局回手结构，避免把万能牌消耗在普通低价值带牌中。<\/li><li>若原结构已顺畅，保留万能牌作为动态接口，待三花瓣随机对子落定后再决定用途。<\/li><\/ol>\n<h3>主要风险<\/h3>\n<ul><li>奖励会增加手牌，触发不等于立即减少手数。<\/li><li>为制造新牌型强拆完整结构，可能得不偿失。<\/li><li>地主对手可通过重复已登记牌型延缓花瓣。<\/li><li>三花瓣奖励随机，对J与对2的战术价值差距明显。<\/li><li>万能牌虽然质量高，但仍会使手牌增加1张；若不能并入现有结构，未必立即降低手数。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>“新牌型”按大类统计，还是不同长度的顺子、连对分别统计。<\/li><li>炸弹长度不同是否属于不同新牌型。<\/li><li>特殊武将牌型是否计入镜花。<\/li><li>一手牌同时满足多个牌型定义时，只点亮1片还是可能点亮多片。<\/li><li>已登记牌型是否有可见提示或列表。<\/li><\/ul>", "search": "  甄姬\n\n 甄姬  \n\n  技能\n\n 镜花｜被动｜不限次数 \n\n  当任意玩家打出1种新牌型时，你点亮1片“花瓣”。\n\n 洛神｜被动｜各限1次 \n\n  点亮3片“花瓣”时，立即随机获得1个不低于j的对子。\n \n  点亮5片“花瓣”时，立即获得1张万能牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9/10   有先手，可主动登记首种牌型；五花瓣万能牌显著提高主动冲牌上限  \n  农民   9.5/10   队友可主动补新牌型，触发五花瓣更稳定，万能牌也更利于协同控场  \n  稳定性   8/10   镜花统计全场，三花瓣门槛较低；奖励点数随机  \n  操作上限   9.5/10   关键在牌型去重、五花瓣触发节奏与万能牌落点  \n\n 身份倾向：农民略优。 \n\n 先手匹配度：中高。  地主可首手主动登记一种牌型，但镜花依赖全场出现不同牌型，不是单靠先手即可完成的技能循环。\n\n  核心机制\n\n- 花瓣按“新牌型种类”累计，重复牌型不应重复计数。\n- 任意玩家出牌都能推进，包括自己、对手和农民队友。\n- 三花瓣奖励为j、q、k、a、2范围内的随机对子。\n- 三花瓣奖励手牌增加2张，收益是高对和回手能力，代价是总手数上升。\n- 五花瓣奖励为1张万能牌，可代替除大小王外的任意点数，并参与炸弹和特殊牌型。\n- 两段洛神奖励各触发一次；完整收益为一个高对加一张万能牌。\n\n  主流打法\n\n  地主：先手铺类型\n\n- 首攻优先选择本来就计划打出的完整牌型，同时点亮第一片花瓣。\n- 后续取得牌权时，优先打尚未登记、又不增加拆牌手数的牌型。\n- 不为凑花瓣强拆炸弹、飞机或长顺；奖励增加手牌，必须看整体收益。\n- 三花瓣高对优先作为回手点，或并入三带、飞机等尾牌。\n- 五花瓣临界时可为万能牌适度调整出牌顺序，但应确保万能牌能直接降低手数或形成强控制牌型。\n\n地主首攻的价值在于锁定一个低成本牌型，并迫使两名农民后续出牌时可能继续为镜花补类型。\n\n  农民：队友协同型\n\n- 两名农民应尽量错开牌型，避免重复单张、对子而不推进花瓣。\n- 队友有自然顺子、连对、三带时，可主动补齐第三或第五种牌型。\n- 地主冲刺阶段，三花瓣高对更适合保留拦截，不急于拆开带牌。\n- 接近五花瓣时，队友应优先打自然存在的新牌型，帮助甄姬取得万能牌并修补关键结构。\n\n  牌型登记优先级\n\n1. 不拆牌即可打出的顺子、连对、飞机等完整结构。\n2. 本来就要处理的单张、对子、三带。\n3. 能在取得牌权后自然出现的炸弹或特殊牌型。\n4. 需要强拆现有组合才能制造的新类型。\n\n花瓣只是手段，不能为了“新类型”让静态手数明显恶化。\n\n  三花瓣奖励的处理\n\n  随机对子   主流处理  \n --- --- \n  对2   稳定回手，通常保留到残局  \n  对a/对k   作为高对争权，或补三张结构  \n  对q/对j   更适合尽快并入三带、飞机或连续对子  \n\n高对不会自动降低手数。若原手牌缺乏对子结构，新增对子可能仍需独立一手打出；评分时应同时计算控制力与增牌成本。\n\n  五花瓣万能牌的处理\n\n1. 优先补成能直接少一手的炸弹、飞机、连对或顺子。\n2. 其次补强残局回手结构，避免把万能牌消耗在普通低价值带牌中。\n3. 若原结构已顺畅，保留万能牌作为动态接口，待三花瓣随机对子落定后再决定用途。\n\n  主要风险\n\n- 奖励会增加手牌，触发不等于立即减少手数。\n- 为制造新牌型强拆完整结构，可能得不偿失。\n- 地主对手可通过重复已登记牌型延缓花瓣。\n- 三花瓣奖励随机，对j与对2的战术价值差距明显。\n- 万能牌虽然质量高，但仍会使手牌增加1张；若不能并入现有结构，未必立即降低手数。\n\n  待实测\n\n- “新牌型”按大类统计，还是不同长度的顺子、连对分别统计。\n- 炸弹长度不同是否属于不同新牌型。\n- 特殊武将牌型是否计入镜花。\n- 一手牌同时满足多个牌型定义时，只点亮1片还是可能点亮多片。\n- 已登记牌型是否有可见提示或列表。\n"}, {"name": "祝融", "faction": "蜀", "skills": "巡狩、射猎", "position": "压牌补A、不可压制桥接与定向弃牌", "status": "初步分析", "landlord": 9.0, "farmer": 9.5, "identity": "农民略优。", "firstMove": "中等", "html": "<h3>技能<\/h3>\n<p><strong>巡狩｜限5次<\/strong><\/p>\n<blockquote>压牌后，可以获得1张A；以此法获得的A不能组成炸弹。<\/blockquote>\n<p><strong>射猎｜限1次<\/strong><\/p>\n<blockquote>打出的牌型包含2张或以上的A时，可以令该牌型不能被压制，并选择1名玩家弃置2张最大牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9/10<\/td><td>可通过压牌补A并建立不可压制桥接，但首手不能启动巡狩，且只能削弱一名农民<\/td><\/tr>\n<tr><td>农民<\/td><td>9.5/10<\/td><td>可直接指定地主弃两张最大牌，不可压制牌型还能为队友建立稳定牌权<\/td><\/tr>\n<tr><td>稳定性<\/td><td>9/10<\/td><td>补牌点数固定、射猎结果确定；主要成本是巡狩持续增加手牌<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>补A数量、射猎牌型与弃牌目标时机共同决定收益<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：农民略优。<\/strong><\/p>\n<p><strong>先手匹配度：中等。<\/strong> 地主首手无法通过巡狩获得A，但若起手已有对A，可直接规划射猎；否则必须先等待并完成压牌。农民虽然没有先手，却能把弃两张最大牌的效果集中施加给地主，收益更直接。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>祝融成功压牌后，可以选择获得1张A，最多5次。<\/li><li>巡狩是可选补牌，不需要机械拿满5张。<\/li><li>技能生成A与普通A一样可用于单张、对子、三张、顺子、飞机和带牌，但不能参与炸弹。<\/li><li>每次巡狩使手牌净增加1张，必须通过组合重构消化。<\/li><li>射猎要求本次打出的完整牌型中至少包含2张A。<\/li><li>射猎发动后，该手牌型不可被其他牌型压制，同时选择1名玩家弃2张最大牌。<\/li><li>射猎只限1次，应承担牌权锁定与拆除最高控制牌的双重终结任务。<\/li><\/ul>\n<h3>巡狩拿A数量<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>当前A结构<\/th><th>建议<\/th><\/tr><\/thead><tbody>\n<tr><td>0张A<\/td><td>前两次压牌通常取A，优先建立射猎门槛<\/td><\/tr>\n<tr><td>1张A<\/td><td>再取1张即可形成对A，属于最高效率节点<\/td><\/tr>\n<tr><td>2张A<\/td><td>已满足射猎，后续只在能形成三张、飞机或减少手数时继续取<\/td><\/tr>\n<tr><td>3张A<\/td><td>三A已具备高效带牌能力，通常停止增牌<\/td><\/tr>\n<tr><td>4张及以上A<\/td><td>技能A不能成炸，继续增加容易成为牌量负担<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>常规目标是持有2至3张A，而不是用满5次巡狩。<\/strong> 对A最适合低成本启动射猎；三A则能搭配带牌，在不可压制的同时一次处理更多废张。<\/p>\n<h3>射猎牌型优先级<\/h3>\n<ol><li><strong>对A：<\/strong> 只出2张便获得绝对牌权并迫使目标弃2张最大牌，最容易留作残局桥接。<\/li><li><strong>三A带牌：<\/strong> 一次处理三A和附带废牌，减手效率更高。<\/li><li><strong>含三A的飞机或特殊组合：<\/strong> 批量减手并锁死牌权，上限最高但条件更严。<\/li><li><strong>其他含至少两A的合法牌型：<\/strong> 以能否直接衔接剩余手牌为判断标准。<\/li><\/ol>\n<p>射猎不应只看当手减牌量。真正价值是“这一手绝对不会被压＋目标失去两张最高控制牌＋祝融继续掌握牌权”。<\/p>\n<h3>主流打法<\/h3>\n<h4>地主：补双A后封一侧<\/h4>\n<ul><li>首攻正常清理结构，保留容易压牌的高牌，准备通过回合交锋启动巡狩。<\/li><li>取得两张A后停止无目的补牌，优先规划对A或三A带牌的射猎窗口。<\/li><li>射猎目标应选择手数更少、控制力更强或更接近走完的农民。<\/li><li>地主只能削弱一名农民，必须同时确认另一名农民无法在后续牌型中接管。<\/li><li>最理想节奏是射猎牌型领出后，依靠不可压制继续出完剩余完整结构。<\/li><\/ul>\n<h4>农民：锁地主并交接队友<\/h4>\n<ul><li>巡狩补至对A后即可停止，避免为技能增加过多手牌。<\/li><li>射猎通常只指定地主，使其直接失去两张最大控制牌。<\/li><li>队友接近走完时，可用不可压制牌型锁定本轮，再主动把后续牌权交给队友。<\/li><li>地主只剩少量牌时应提前发动，不能等待更漂亮的三A或复杂组合。<\/li><li>若起手已有对A，射猎可以完全不依赖巡狩，后续巡狩只作为结构补强选项。<\/li><\/ul>\n<h3>射猎时机<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>局面<\/th><th>决策<\/th><\/tr><\/thead><tbody>\n<tr><td>地主或关键农民只剩少量牌<\/td><td>立即射猎，删除其最高两张控制牌<\/td><\/tr>\n<tr><td>自己剩余手牌已经形成连续出牌路线<\/td><td>用射猎作为不可压制桥接，直接冲刺<\/td><\/tr>\n<tr><td>目标最大牌疑似王、2或炸弹组件<\/td><td>射猎弃牌收益极高<\/td><\/tr>\n<tr><td>当前只有普通对A，后续结构仍散乱<\/td><td>可暂缓，先整理射猎后的连续牌路<\/td><\/tr>\n<tr><td>为等第三张A可能丢失关键牌权<\/td><td>不等，直接用对A发动<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<h3>关键风险<\/h3>\n<ul><li>巡狩每次都会增加牌量，拿满5张A可能严重拖慢收尾。<\/li><li>技能A不能组成炸弹，多余A不能按普通同点数爆发路线处理。<\/li><li>射猎只能指定1人；地主对双农民时无法一次清空双方控制牌。<\/li><li>目标弃掉的最大牌也可能是难处理孤张，存在替对方优化结构的副作用。<\/li><li>射猎发动太早，虽然取得牌权，却可能没有后续完整牌路。<\/li><\/ul>\n<h3>待实测<\/h3>\n<ul><li>“不能组成炸弹”只限制巡狩生成的A，还是本局祝融所有A都不能参与炸弹。<\/li><li>自然A与技能A混合达到4张时，炸弹判定如何处理。<\/li><li>射猎的“不能被压制”是否连王炸和更长炸弹也无法压制。<\/li><li>弃置目标能否选择队友或自己，还是只能选择其他玩家。<\/li><li>最大牌有同点数多张时，由目标选择弃置哪两张还是系统自动处理。<\/li><li>射猎弃置的两张牌及巡狩新增A是否向全场公开。<\/li><li>当目标不足2张手牌时，是否弃完所有剩余牌，及其是否因此直接获胜。<\/li><\/ul>", "search": "  祝融\n\n 祝融  \n\n  技能\n\n 巡狩｜限5次 \n\n  压牌后，可以获得1张a；以此法获得的a不能组成炸弹。\n\n 射猎｜限1次 \n\n  打出的牌型包含2张或以上的a时，可以令该牌型不能被压制，并选择1名玩家弃置2张最大牌。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9/10   可通过压牌补a并建立不可压制桥接，但首手不能启动巡狩，且只能削弱一名农民  \n  农民   9.5/10   可直接指定地主弃两张最大牌，不可压制牌型还能为队友建立稳定牌权  \n  稳定性   9/10   补牌点数固定、射猎结果确定；主要成本是巡狩持续增加手牌  \n  操作上限   9.5/10   补a数量、射猎牌型与弃牌目标时机共同决定收益  \n\n 身份倾向：农民略优。 \n\n 先手匹配度：中等。  地主首手无法通过巡狩获得a，但若起手已有对a，可直接规划射猎；否则必须先等待并完成压牌。农民虽然没有先手，却能把弃两张最大牌的效果集中施加给地主，收益更直接。\n\n  核心机制\n\n- 祝融成功压牌后，可以选择获得1张a，最多5次。\n- 巡狩是可选补牌，不需要机械拿满5张。\n- 技能生成a与普通a一样可用于单张、对子、三张、顺子、飞机和带牌，但不能参与炸弹。\n- 每次巡狩使手牌净增加1张，必须通过组合重构消化。\n- 射猎要求本次打出的完整牌型中至少包含2张a。\n- 射猎发动后，该手牌型不可被其他牌型压制，同时选择1名玩家弃2张最大牌。\n- 射猎只限1次，应承担牌权锁定与拆除最高控制牌的双重终结任务。\n\n  巡狩拿a数量\n\n  当前a结构   建议  \n --- --- \n  0张a   前两次压牌通常取a，优先建立射猎门槛  \n  1张a   再取1张即可形成对a，属于最高效率节点  \n  2张a   已满足射猎，后续只在能形成三张、飞机或减少手数时继续取  \n  3张a   三a已具备高效带牌能力，通常停止增牌  \n  4张及以上a   技能a不能成炸，继续增加容易成为牌量负担  \n\n 常规目标是持有2至3张a，而不是用满5次巡狩。  对a最适合低成本启动射猎；三a则能搭配带牌，在不可压制的同时一次处理更多废张。\n\n  射猎牌型优先级\n\n1.  对a：  只出2张便获得绝对牌权并迫使目标弃2张最大牌，最容易留作残局桥接。\n2.  三a带牌：  一次处理三a和附带废牌，减手效率更高。\n3.  含三a的飞机或特殊组合：  批量减手并锁死牌权，上限最高但条件更严。\n4.  其他含至少两a的合法牌型：  以能否直接衔接剩余手牌为判断标准。\n\n射猎不应只看当手减牌量。真正价值是“这一手绝对不会被压＋目标失去两张最高控制牌＋祝融继续掌握牌权”。\n\n  主流打法\n\n  地主：补双a后封一侧\n\n- 首攻正常清理结构，保留容易压牌的高牌，准备通过回合交锋启动巡狩。\n- 取得两张a后停止无目的补牌，优先规划对a或三a带牌的射猎窗口。\n- 射猎目标应选择手数更少、控制力更强或更接近走完的农民。\n- 地主只能削弱一名农民，必须同时确认另一名农民无法在后续牌型中接管。\n- 最理想节奏是射猎牌型领出后，依靠不可压制继续出完剩余完整结构。\n\n  农民：锁地主并交接队友\n\n- 巡狩补至对a后即可停止，避免为技能增加过多手牌。\n- 射猎通常只指定地主，使其直接失去两张最大控制牌。\n- 队友接近走完时，可用不可压制牌型锁定本轮，再主动把后续牌权交给队友。\n- 地主只剩少量牌时应提前发动，不能等待更漂亮的三a或复杂组合。\n- 若起手已有对a，射猎可以完全不依赖巡狩，后续巡狩只作为结构补强选项。\n\n  射猎时机\n\n  局面   决策  \n --- --- \n  地主或关键农民只剩少量牌   立即射猎，删除其最高两张控制牌  \n  自己剩余手牌已经形成连续出牌路线   用射猎作为不可压制桥接，直接冲刺  \n  目标最大牌疑似王、2或炸弹组件   射猎弃牌收益极高  \n  当前只有普通对a，后续结构仍散乱   可暂缓，先整理射猎后的连续牌路  \n  为等第三张a可能丢失关键牌权   不等，直接用对a发动  \n\n  关键风险\n\n- 巡狩每次都会增加牌量，拿满5张a可能严重拖慢收尾。\n- 技能a不能组成炸弹，多余a不能按普通同点数爆发路线处理。\n- 射猎只能指定1人；地主对双农民时无法一次清空双方控制牌。\n- 目标弃掉的最大牌也可能是难处理孤张，存在替对方优化结构的副作用。\n- 射猎发动太早，虽然取得牌权，却可能没有后续完整牌路。\n\n  待实测\n\n- “不能组成炸弹”只限制巡狩生成的a，还是本局祝融所有a都不能参与炸弹。\n- 自然a与技能a混合达到4张时，炸弹判定如何处理。\n- 射猎的“不能被压制”是否连王炸和更长炸弹也无法压制。\n- 弃置目标能否选择队友或自己，还是只能选择其他玩家。\n- 最大牌有同点数多张时，由目标选择弃置哪两张还是系统自动处理。\n- 射猎弃置的两张牌及巡狩新增a是否向全场公开。\n- 当目标不足2张手牌时，是否弃完所有剩余牌，及其是否因此直接获胜。\n"}, {"name": "诸葛均", "faction": "蜀", "skills": "耕读", "position": "底牌复制、结构补强与废牌置换", "status": "主要规则已实测", "landlord": 9.0, "farmer": 8.5, "identity": "地主略优。", "firstMove": "极高", "html": "<h3>技能<\/h3>\n<p><strong>耕读｜开局选择｜限1次<\/strong><\/p>\n<blockquote>开局时，你可以从底牌中选1张复制并获得。你打出这张复制牌后，可以选1张手牌弃置。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>9/10<\/td><td>拥有先手，可立即用复制牌完成结构并触发弃牌，节奏稳定<\/td><\/tr>\n<tr><td>农民<\/td><td>8.5/10<\/td><td>能复制地主底牌中的关键点数，但需要先取得合适出牌窗口<\/td><\/tr>\n<tr><td>稳定性<\/td><td>9.5/10<\/td><td>复制目标可选、复制牌有标记、弃牌可选且任何组合都能触发<\/td><\/tr>\n<tr><td>操作上限<\/td><td>8.5/10<\/td><td>复制目标和弃牌时机决定收益<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：地主略优。<\/strong><\/p>\n<p><strong>先手匹配度：极高。<\/strong> 地主可在第一手主动打出包含复制牌的组合，并额外弃置一张废牌；同一轮完成结构输出和手牌压缩。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>开局从三张底牌中定向复制1张，原底牌不受影响。<\/li><li>复制目标与复制结果公开，所有玩家都知道复制的是哪张底牌。<\/li><li>复制范围仅限正常底牌，不存在复制万能牌的情况。<\/li><li>获得复制牌时手牌增加1张。<\/li><li>复制牌带有独立标记；无论单出，还是作为炸弹、顺子或其他组合的一部分打出，都会正确触发弃牌。<\/li><li>打出复制牌后，可以选择弃置1张手牌，也可以放弃弃牌。<\/li><li>弃牌结果公开。<\/li><li>若选择弃牌，完整结算后总牌差为0，完成一次“复制关键牌、删除废牌”的置换；若放弃弃牌，则保留净增加的1张牌。<\/li><li>若复制牌进入多张组合，该手出牌结束后仍可额外弃1张，实际推进效率高。<\/li><\/ul>\n<h3>复制优先级<\/h3>\n<ol><li>复制后直接形成或加长炸弹的点数。<\/li><li>复制后使总手数立即下降的结构牌。<\/li><li>补成三张、飞机、连对或顺子的关键张。<\/li><li>能稳定取得牌权的2、A等高牌。<\/li><li>能快速打出并触发弃牌的低成本牌。<\/li><\/ol>\n<p>选择标准不是底牌中哪张最大，而是哪张复制后能同时做到“更快打出＋弃掉最差手牌”。<\/p>\n<h3>主流打法<\/h3>\n<h4>地主：首手置换型<\/h4>\n<ul><li>优先复制能进入首攻组合的底牌。<\/li><li>第一手打出复制牌所在的顺子、连对、三带或炸弹，随后弃掉最大废张。<\/li><li>若复制可形成5张及以上同点数炸弹，通常属于高优先级路线。<\/li><li>没有立即成型机会时，可复制2或A作为回手点，等夺回牌权时完成弃牌。<\/li><\/ul>\n<p>地主最强节奏是：<\/p>\n<blockquote>复制关键张 → 首手打出完整组合 → 弃掉孤张 → 剩余结构直接压缩。<\/blockquote>\n<h4>农民：底牌针对型<\/h4>\n<ul><li>复制信息完全公开，不能依靠隐藏牌数误导地主；价值只来自结构补强和弃牌置换。<\/li><li>优先复制能形成炸弹、三张或关键拦截牌的点数。<\/li><li>地主少牌时，复制高牌的即时拦截价值高于长期结构收益。<\/li><li>复制牌迟迟无法打出时，弃牌收益被冻结，因此应避免只看强度、不看出牌窗口。<\/li><\/ul>\n<h3>弃牌优先级<\/h3>\n<ol><li>无法进入任何组合的孤张。<\/li><li>使最少手数增加的冗余牌。<\/li><li>无法形成对子、三张或带牌结构的断张。<\/li><li>已失去战术价值的低位牌。<\/li><\/ol>\n<p>如果复制牌本身已经让某个组合成型，弃牌应服务于下一个收尾组合，不能只按点数从小到大处理。<\/p>\n<h3>关键风险<\/h3>\n<ul><li>复制最强点数但无法及时打出，会暂时增加手牌负担。<\/li><li>为了触发弃牌强拆完整结构，可能抵消耕读收益。<\/li><li>弃牌时机过早，可能删掉后续连接张；过晚则失去压缩节奏。<\/li><li>农民没有先手，复制牌能否顺利进入应牌结构比地主更重要。<\/li><li>复制牌和弃牌均公开，对手可以据此推断炸弹、顺子及剩余结构。<\/li><\/ul>\n<h3>已确认的操作结论<\/h3>\n<ul><li>复制牌的独立标记解决了同点数识别问题，不需要为触发技能而单独打出。<\/li><li>主流选择是把复制牌并入价值最高的组合，在正常推进手数时顺带完成弃牌。<\/li><li>弃牌可放弃，因此复制牌出手时若剩余结构已经完整，不必强制破坏牌型。<\/li><li>信息完全公开，诸葛均没有隐藏牌优势；对手可针对复制点数和公开弃牌调整记牌。<\/li><\/ul>", "search": "  诸葛均\n\n 诸葛均  \n\n  技能\n\n 耕读｜开局选择｜限1次 \n\n  开局时，你可以从底牌中选1张复制并获得。你打出这张复制牌后，可以选1张手牌弃置。\n\n  定位与评分\n\n  维度   评分   结论  \n --- ---: --- \n  地主   9/10   拥有先手，可立即用复制牌完成结构并触发弃牌，节奏稳定  \n  农民   8.5/10   能复制地主底牌中的关键点数，但需要先取得合适出牌窗口  \n  稳定性   9.5/10   复制目标可选、复制牌有标记、弃牌可选且任何组合都能触发  \n  操作上限   8.5/10   复制目标和弃牌时机决定收益  \n\n 身份倾向：地主略优。 \n\n 先手匹配度：极高。  地主可在第一手主动打出包含复制牌的组合，并额外弃置一张废牌；同一轮完成结构输出和手牌压缩。\n\n  核心机制\n\n- 开局从三张底牌中定向复制1张，原底牌不受影响。\n- 复制目标与复制结果公开，所有玩家都知道复制的是哪张底牌。\n- 复制范围仅限正常底牌，不存在复制万能牌的情况。\n- 获得复制牌时手牌增加1张。\n- 复制牌带有独立标记；无论单出，还是作为炸弹、顺子或其他组合的一部分打出，都会正确触发弃牌。\n- 打出复制牌后，可以选择弃置1张手牌，也可以放弃弃牌。\n- 弃牌结果公开。\n- 若选择弃牌，完整结算后总牌差为0，完成一次“复制关键牌、删除废牌”的置换；若放弃弃牌，则保留净增加的1张牌。\n- 若复制牌进入多张组合，该手出牌结束后仍可额外弃1张，实际推进效率高。\n\n  复制优先级\n\n1. 复制后直接形成或加长炸弹的点数。\n2. 复制后使总手数立即下降的结构牌。\n3. 补成三张、飞机、连对或顺子的关键张。\n4. 能稳定取得牌权的2、a等高牌。\n5. 能快速打出并触发弃牌的低成本牌。\n\n选择标准不是底牌中哪张最大，而是哪张复制后能同时做到“更快打出＋弃掉最差手牌”。\n\n  主流打法\n\n  地主：首手置换型\n\n- 优先复制能进入首攻组合的底牌。\n- 第一手打出复制牌所在的顺子、连对、三带或炸弹，随后弃掉最大废张。\n- 若复制可形成5张及以上同点数炸弹，通常属于高优先级路线。\n- 没有立即成型机会时，可复制2或a作为回手点，等夺回牌权时完成弃牌。\n\n地主最强节奏是：\n\n  复制关键张 → 首手打出完整组合 → 弃掉孤张 → 剩余结构直接压缩。\n\n  农民：底牌针对型\n\n- 复制信息完全公开，不能依靠隐藏牌数误导地主；价值只来自结构补强和弃牌置换。\n- 优先复制能形成炸弹、三张或关键拦截牌的点数。\n- 地主少牌时，复制高牌的即时拦截价值高于长期结构收益。\n- 复制牌迟迟无法打出时，弃牌收益被冻结，因此应避免只看强度、不看出牌窗口。\n\n  弃牌优先级\n\n1. 无法进入任何组合的孤张。\n2. 使最少手数增加的冗余牌。\n3. 无法形成对子、三张或带牌结构的断张。\n4. 已失去战术价值的低位牌。\n\n如果复制牌本身已经让某个组合成型，弃牌应服务于下一个收尾组合，不能只按点数从小到大处理。\n\n  关键风险\n\n- 复制最强点数但无法及时打出，会暂时增加手牌负担。\n- 为了触发弃牌强拆完整结构，可能抵消耕读收益。\n- 弃牌时机过早，可能删掉后续连接张；过晚则失去压缩节奏。\n- 农民没有先手，复制牌能否顺利进入应牌结构比地主更重要。\n- 复制牌和弃牌均公开，对手可以据此推断炸弹、顺子及剩余结构。\n\n  已确认的操作结论\n\n- 复制牌的独立标记解决了同点数识别问题，不需要为触发技能而单独打出。\n- 主流选择是把复制牌并入价值最高的组合，在正常推进手数时顺带完成弃牌。\n- 弃牌可放弃，因此复制牌出手时若剩余结构已经完整，不必强制破坏牌型。\n- 信息完全公开，诸葛均没有隐藏牌优势；对手可针对复制点数和公开弃牌调整记牌。\n"}, {"name": "邓艾", "faction": "魏", "skills": "屯田、兵粮", "position": "主动让权、粮食积累与王炸兑换", "status": "主要规则已实测", "landlord": 8.0, "farmer": 9.5, "identity": "强农民型。", "firstMove": "偏低", "html": "<h3>技能<\/h3>\n<p><strong>屯田｜被动｜限5次<\/strong><\/p>\n<blockquote>轮到你压牌时，如果需要压的牌不超过4张且你选择不压，获得1点“粮食”。<\/blockquote>\n<p><strong>兵粮｜主动｜不限次数<\/strong><\/p>\n<blockquote>可以消耗“粮食”点数获得手牌：<br>- 2点：获得1张小王；<br>- 3点：获得1张大王；<br>- 4点：获得1张万能牌。<\/blockquote>\n<h3>定位与评分<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>维度<\/th><th>评分<\/th><th>结论<\/th><\/tr><\/thead><tbody>\n<tr><td>地主<\/td><td>8/10<\/td><td>能用5粮换出王炸，但需要多次主动放弃压牌权，与地主连续进攻目标冲突<\/td><\/tr>\n<tr><td>农民<\/td><td>9.5/10<\/td><td>可借队友回合安全屯粮，5粮稳定转化为大小王，残局封锁能力极强<\/td><\/tr>\n<tr><td>稳定性<\/td><td>8.5/10<\/td><td>兑换结果固定；主要不确定性在于能否获得足够安全的屯田窗口<\/td><\/tr>\n<tr><td>操作上限<\/td><td>9.5/10<\/td><td>每次不压的机会成本和2/3/4点兑换分支决定上限<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>身份倾向：强农民型。<\/strong><\/p>\n<p><strong>先手匹配度：偏低。<\/strong> 地主首手不能获得粮食，必须等其他玩家出牌并主动选择不压；先手虽能布置节奏，但与屯田的被动让权机制并不匹配。<\/p>\n<h3>核心机制<\/h3>\n<ul><li>屯田只在轮到邓艾压牌时检查。<\/li><li>当前需要压制的牌型总张数不超过4张，且邓艾选择不压，即可获得1粮。<\/li><li>是否实际存在合法压牌不影响屯田：有牌可压而主动不出、完全无牌可压后选择不出，均正常获得粮食。<\/li><li>恰好4张的任何合法牌型也正常触发，包括四张炸弹、三带一等；5张及以上不触发。<\/li><li>一次回合最多获得1粮，与需要压的具体牌型无关。<\/li><li>屯田整局最多触发5次，因此全局最多生产5点粮食；消费粮食不会恢复屯田次数，也不会提高产粮上限。<\/li><li>兵粮在轮到邓艾主动出牌时和轮到邓艾压牌时都可以使用。<\/li><li>兵粮不限次数，同一种兑换可以重复选择，只受当前粮食余额和整局5点总产量限制。<\/li><li>兵粮生成的牌会加入手牌，因此兑换控制力的同时也增加牌量。<\/li><li>2粮和3粮可以分别换取小王、大王；完整5粮理论上可直接凑成王炸。<\/li><li>4粮换万能牌只增加1张，结构适配性最高，但会放弃5粮王炸路线。<\/li><\/ul>\n<h3>粮食兑换优先级<\/h3>\n<div class=\"table-wrap\"><table><thead><tr><th>粮食<\/th><th>兑换路线<\/th><th>评价<\/th><\/tr><\/thead><tbody>\n<tr><td>2<\/td><td>小王<\/td><td>紧急拦截或提前建立王炸的一半；单独控制力有限<\/td><\/tr>\n<tr><td>3<\/td><td>大王<\/td><td>单卡控制力最高，适合无法继续安全屯粮的局面<\/td><\/tr>\n<tr><td>4<\/td><td>万能牌<\/td><td>最灵活，可补炸弹、顺子、飞机及残局结构<\/td><\/tr>\n<tr><td>5<\/td><td>小王＋大王<\/td><td>标准最强路线，增加2张但直接形成王炸<\/td><\/tr>\n<\/tbody><\/table><\/div>\n<p><strong>默认终点是5粮王炸。<\/strong> 这是最高确定性控制收益；但若地主已经进入少牌、邓艾无法再安全让权，则应在3粮直接换大王，或在4粮换万能牌解决当下结构，不能机械等第5粮。<\/p>\n<h3>主流打法<\/h3>\n<h4>地主：有限屯粮，不为王炸丢节奏<\/h4>\n<ul><li>首攻正常减手，不为技能刻意选择容易被压的牌型。<\/li><li>农民打出不超过4张的牌型时，只在其无法连续走牌、且地主仍有可靠回手时
