<script id="mm-data" type="application/json">__MU_MAGAZINE_DATA__</script>
<script>
(()=>{
const root=document.getElementById('mu-magazine-demo'),data=JSON.parse(document.getElementById('mm-data').textContent),p=data.profile,cv=root.querySelector('#mm-company-view'),rv=root.querySelector('#mm-reader-view'),article=root.querySelector('#mm-reader-article');let companyTab='overview',kind='dossier',part=0,flow='chapters',size=19,menu=null;
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const icon=()=>{if(window.lucide)lucide.createIcons({attrs:{width:15,height:15}});};
const companyTabs=[['overview','公司概览'],['thesis','研究判断'],['financials','财务分析'],['journal','研究跟踪']];root.querySelector('#mm-logo').src=data.logo;root.querySelector('#mm-company-date').textContent='研究版本 '+p.sourceDate+' · 历史归档';
root.querySelector('.mm-company-tabs').setAttribute('role','tablist');root.querySelector('#mm-company-content').setAttribute('role','tabpanel');root.querySelector('.mm-company-tabs').innerHTML=companyTabs.map(([id,title])=>`<button type="button" id="mm-company-tab-${id}" role="tab" aria-controls="mm-company-content" data-company-tab="${id}" aria-selected="${id===companyTab}">${title}</button>`).join('');
function briefPoints(){return `<div class="mm-points">${p.points.map(([title,text])=>`<div><h3>${esc(title)}</h3><p>${esc(text)}</p></div>`).join('')}</div>`;}
function figures(){return `<div class="mm-financials">${p.metrics.map(([label,value,type])=>`<div><small>${esc(label)}</small><strong>${esc(value)}</strong><small>${esc(type)}</small></div>`).join('')}</div>`;}
function resumeInfo(which){try{const saved=JSON.parse(localStorage.getItem('mu.magazine.'+which)||'null');return saved&&Number.isInteger(saved.part)&&saved.part>=0&&saved.part<data.documents[which].parts.length?saved:null;}catch{return null;}}
function readingChoices(){return `<section class="mm-reading-section"><h2>读懂这家公司</h2><div class="mm-reading-choice"><img class="mm-cover" src="${data.hero}" alt="存储芯片业务示意"><div>${[['dossier','投研全文','利润变了，周期还在','从生意、盈利到估值与风险。'],['story','公司故事','从地下室到记忆工厂','沿着关键人物和抉择，认识美光。']].map(([id,label,title,desc])=>`<button type="button" class="mm-choice" data-open="${id}"><small>${label} · ${data.documents[id].parts.length} 个篇章</small><strong class="mm-serif">${title}</strong><p>${desc}</p><span class="mm-open">${resumeInfo(id)?'继续上次阅读':'开始阅读'} →</span></button>`).join('')}</div></div></section>`;}
function renderCompany(){root.querySelector('#mm-company-content').setAttribute('aria-labelledby','mm-company-tab-'+companyTab);cv.hidden=false;rv.hidden=true;root.querySelectorAll('[data-company-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.companyTab===companyTab)));const panes={overview:`<div class="mm-brief"><div class="mm-eyebrow">THE COMPANY AT A GLANCE</div><h2 class="mm-serif">AI 时代的存储，<br>从涨价走向长期兑现。</h2><p>${esc(p.thesis)}</p>${briefPoints()}</div>${readingChoices()}`,thesis:`<div class="mm-brief"><h2 class="mm-serif">持续性，才是下一道题。</h2><p>${esc(p.thesis)}</p>${briefPoints()}<h3>需要重新判断的信号</h3><ul>${p.risks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul></div>`,financials:`<div class="mm-brief"><h2 class="mm-serif">把盈利与现金一起看。</h2><div class="mm-eyebrow">已归档财报 · ${esc(p.financialPeriod)}</div>${figures()}<p>年度营收与经营现金流、季度毛利率和协议数量分别代表不同维度，口径沿用原档案。</p></div>`,journal:`<div class="mm-brief"><h2 class="mm-serif">把判断的变化留下来。</h2><p class="mm-empty">暂无新增跟踪文章。后续公司动态、买入逻辑和复盘将按日期归档。</p></div>`};root.querySelector('#mm-company-content').innerHTML=panes[companyTab];icon();}
function setMenu(value){menu=menu===value?null:value;for(const name of ['contents','settings'])root.querySelector('#mm-'+name+'-menu').hidden=menu!==name;root.querySelectorAll('[data-menu]').forEach(b=>b.setAttribute('aria-expanded',String(b.dataset.menu===menu)));}
function save(){if(rv.hidden)return;try{localStorage.setItem('mu.magazine.'+kind,JSON.stringify({part,flow,updatedAt:Date.now()}));}catch{}}
function renderReader(scroll=true){const d=data.documents[kind];cv.hidden=true;rv.hidden=false;root.querySelector('#mm-reader-name').textContent=kind==='story'?'MU · 公司故事':'MU · 投研全文';const dl=root.querySelector('#mm-download');dl.href='https://www.xxyalpha.cn'+d.download;dl.setAttribute('aria-label','下载'+(kind==='story'?'公司故事':'投研全文')+' Word');root.querySelector('#mm-contents-menu').innerHTML='<p>选择一个篇章继续阅读</p>'+d.parts.map((x,i)=>`<button type="button" class="mm-toc-entry" data-part="${i}"><span>${String(i+1).padStart(2,'0')}</span><div><strong>${esc(x.title)}</strong><small>${esc(x.description)}</small></div><span>↗</span></button>`).join('');
const selected=flow==='continuous'?d.parts:[d.parts[part]],cover=part===0||flow==='continuous';article.innerHTML=`<div class="mm-article-wrap">${cover?`<header class="mm-article-cover"><div class="mm-eyebrow">${kind==='story'?'COMPANY STORY / MICRON':'EQUITY RESEARCH / MICRON'}</div><h1 class="mm-serif">${kind==='story'?'从牙医诊所的地下室，<br>到 AI 时代的记忆工厂。':'利润变了，<br>周期的考验还在。'}</h1><p class="mm-deck">${kind==='story'?'一间地下室、几代掌门和一连串并不注定成功的选择。沿着公司走过的路，理解今天的美光。':'美光已经跨过盈利兑现这一关。接下来要研究的，是价格、产品与客户长约，能否把超额利润留得更久。'}</p><div class="mm-article-date">资料截至 ${esc(d.date)} · ${d.parts.length} 个篇章 · 完整原文</div>${kind==='story'?`<figure><img src="${data.hero}" alt="存储芯片业务示意"><figcaption>存储业务示意，不作为历史场景照片。</figcaption></figure>`:''}</header>`:''}${selected.map((x,i)=>{const index=flow==='continuous'?i:part;return `<section id="mm-part-${index}"><header class="mm-part-heading"><span>CHAPTER ${String(index+1).padStart(2,'0')} / ${String(d.parts.length).padStart(2,'0')}</span><h2 class="mm-serif">${esc(x.title)}</h2><p>${esc(x.lead)}</p></header><div class="mm-body">${x.html}</div></section>`;}).join('')}</div>`;
for(const img of article.querySelectorAll('img')){const asset=data.assets[img.getAttribute('src')];if(asset)img.src=asset;}const bottom=root.querySelector('#mm-reader-bottom');bottom.innerHTML=flow==='continuous'?'<div class="mm-nextbar"><button type="button" data-reader-top>↑ 回到文章开头</button><button type="button" data-company-return>返回 MU 档案 →</button></div>':`<div class="mm-nextbar"><button type="button" ${part>0?'data-prev':'data-reader-top'}>${part>0?'← 上一篇章':'↑ 回到篇首'}</button>${part<d.parts.length-1?`<button type="button" class="mm-next" data-next><small>接下来</small><strong>${esc(d.parts[part+1].title)} →</strong></button>`:'<button type="button" data-company-return>读完了 · 返回 MU →</button>'}</div>`;
menu=null;for(const name of ['contents','settings'])root.querySelector('#mm-'+name+'-menu').hidden=true;root.querySelectorAll('[data-menu]').forEach(b=>b.setAttribute('aria-expanded','false'));root.querySelectorAll('[data-flow]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.flow===flow)));save();icon();if(scroll)root.querySelector('.mm-reader-bar').scrollIntoView({block:'start',behavior:'auto'});}
root.addEventListener('keydown',e=>{if(e.key==='Escape'&&menu){setMenu(menu);root.querySelector('[data-menu="contents"]').focus();}});
root.addEventListener('click',e=>{const open=e.target.closest('[data-open]');if(open){kind=open.dataset.open;const saved=resumeInfo(kind);part=saved?Math.max(0,Math.min(data.documents[kind].parts.length-1,saved.part||0)):0;flow=saved?.flow==='continuous'?'continuous':'chapters';renderReader();return;}const ct=e.target.closest('[data-company-tab]');if(ct){companyTab=ct.dataset.companyTab;renderCompany();return;}if(e.target.closest('#mm-back,[data-company-return]')){save();renderCompany();root.querySelector('.mm-company-head').scrollIntoView({block:'start',behavior:'auto'});return;}const mb=e.target.closest('[data-menu]');if(mb){setMenu(mb.dataset.menu);return;}const pb=e.target.closest('[data-part]');if(pb){part=Number(pb.dataset.part);if(flow==='continuous'){setMenu('contents');root.querySelector('#mm-part-'+part)?.scrollIntoView({block:'start',behavior:'auto'});save();}else renderReader();return;}const font=e.target.closest('[data-size]');if(font){size=Number(font.dataset.size);root.style.setProperty('--mm-size',size+'px');root.querySelectorAll('[data-size]').forEach(b=>b.setAttribute('aria-pressed',String(Number(b.dataset.size)===size)));return;}const fw=e.target.closest('[data-flow]');if(fw){flow=fw.dataset.flow;renderReader();return;}if(e.target.closest('[data-next]')){part++;renderReader();return;}if(e.target.closest('[data-prev]')){part--;renderReader();return;}if(e.target.closest('[data-reader-top]'))root.querySelector('.mm-reader-bar').scrollIntoView({block:'start',behavior:'auto'});});renderCompany();
})();
</script>
