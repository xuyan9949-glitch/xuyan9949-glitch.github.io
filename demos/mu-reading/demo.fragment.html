#mu-reading-demo .mr-layout aside{position:sticky;top:20px;align-self:start}#mu-reading-demo .mr-chapter-label{display:block;font-size:11px;color:var(--mr-sub);margin:14px 0 5px}#mu-reading-demo #mr-chapter-select{width:100%;min-width:0;font:inherit;font-size:12px;background:var(--mr-paper);color:var(--mr-ink);border:1px solid var(--mr-line);padding:9px 5px;border-radius:4px}#mu-reading-demo .mr-return{display:inline-block;vertical-align:middle;margin-left:12px;border:0;background:none;color:var(--mr-sub);padding:5px;font-size:11px;line-height:1.6;font-weight:400;letter-spacing:0}#mu-reading-demo #mr-content h2,#mu-reading-demo #mr-content h3{scroll-margin-top:22px}#mu-reading-demo:not(.mr-toc-expanded) #mr-toc a:nth-child(n+7){display:none}#mu-reading-demo .mr-toc-head{display:flex;justify-content:space-between;align-items:center;color:var(--mr-sub);font-size:11px;padding-bottom:13px;border-bottom:1px solid var(--mr-line)}#mu-reading-demo #mr-toc-toggle{display:block;border:0;background:none;font-size:11px;color:var(--mr-sub)}#mu-reading-demo .mr-font{display:flex;gap:3px}#mu-reading-demo .mr-font button{border:0;background:none;padding:6px 4px;font-size:11px;min-width:26px}#mu-reading-demo #mr-toc{padding-top:9px}#mu-reading-demo #mr-toc a{display:block;font-size:12px;line-height:1.6;padding:8px 0;color:var(--mr-sub)}#mu-reading-demo #mr-toc a[aria-current]{color:var(--mr-green)}#mu-reading-demo .mr-full-doc table{width:100%;border-collapse:collapse;font-size:14px;line-height:1.75}#mu-reading-demo .mr-full-doc td,#mu-reading-demo .mr-full-doc th{border-bottom:1px solid var(--mr-line);padding:12px 10px;text-align:left;vertical-align:top}#mu-reading-demo .mr-full-doc th{font-weight:500;background:#eef0e8}#mu-reading-demo .mr-full-doc img{max-width:100%;height:auto;margin:20px 0}#mu-reading-demo .mr-full-doc strong{font-weight:500}#mu-reading-demo .v0-table-scroll{overflow:auto;margin:24px 0}#mu-reading-demo .v0-table-scroll table{min-width:510px}#mu-reading-demo .mr-full-doc a{overflow-wrap:anywhere}#mu-reading-demo .mr-full-doc blockquote{margin:24px 0;border-left:2px solid var(--mr-green);padding-left:20px}#mu-reading-demo .mr-empty{font-size:16px;color:var(--mr-sub);padding:25px 0}#mu-reading-demo .mr-footer{display:flex;justify-content:space-between;gap:15px;border-top:1px solid var(--mr-line);padding:24px 0;margin-top:65px;font-size:11px;color:var(--mr-sub);letter-spacing:1px}

@media(max-width:400px){#mu-reading-demo .mr-identity{align-items:start}#mu-reading-demo #mr-logo{width:58px;margin-top:10px}#mu-reading-demo h1{font-size:24px}#mu-reading-demo .mr-meta{gap:10px}#mu-reading-demo .mr-brand span{display:none}#mu-reading-demo .mr-metrics{grid-template-columns:1fr}}

<script id="mr-data" type="application/json">__MU_DATA__</script>
<script>
(()=>{
const root=document.getElementById('mu-reading-demo'),data=JSON.parse(document.getElementById('mr-data').textContent),p=data.profile,docs=data.documents,content=root.querySelector('#mr-content'),toc=root.querySelector('#mr-toc');
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const tabs=[['overview','公司概览'],['thesis','研究判断'],['financials','财务分析'],['dossier','投研全文'],['story','公司故事'],['journal','研究跟踪']];let current='overview',size=18;
root.querySelector('#mr-logo').src=data.logo;root.querySelector('#mr-date').textContent='研究版本 '+p.sourceDate+' · 历史归档';
root.querySelector('.mr-tabs').innerHTML=tabs.map(([id,label])=>`<button type="button" role="tab" id="mr-tab-${id}" data-tab="${id}" aria-controls="mr-content" aria-selected="${id===current}">${label}</button>`).join('');root.querySelector('.mr-tabs').setAttribute('role','tablist');content.setAttribute('role','tabpanel');
root.querySelector('#mr-material-list').innerHTML=docs.map(d=>`<div class="mr-material-row"><strong>${d.kind==='story'?'公司故事':'投研档案'}</strong><button type="button" data-read="${d.kind}">阅读全文</button><a href="https://www.xxyalpha.cn${esc(d.download)}" target="_blank" rel="noopener">下载 Word ↗</a><small>${esc(d.date)}</small></div>`).join('')+`<details class="mr-sources"><summary>引用来源</summary>${p.sources.map(([name,url])=>`<a href="${esc(url)}" target="_blank" rel="noopener">${esc(name)} ↗</a>`).join('')}</details>`;
const points=()=>p.points.map(([title,text],i)=>`<div class="mr-numbered"><span>${String(i+1).padStart(2,'0')}</span><div><h3>${esc(title)}</h3><p>${esc(text)}</p></div></div>`).join('');
const metrics=()=>`<div class="mr-fin-label">已归档财报 · ${esc(p.financialPeriod)}</div><div class="mr-metrics">${p.metrics.map(([label,value,kind])=>`<div class="mr-metric"><small>${esc(label)}</small><strong>${esc(value)}</strong><small>${esc(kind)}</small></div>`).join('')}</div>`;
const timeline=()=>`<div class="mr-timeline">${p.catalysts.map(([when,what])=>`<div><strong>${esc(when)}</strong><p>${esc(what)}</p></div>`).join('')}</div>`;
const article=kind=>{const d=docs.find(x=>x.kind===kind);return `<div class="mr-kicker">${kind==='story'?'COMPANY STORY':'INVESTMENT DOSSIER'}</div><h2 class="mr-title">${kind==='story'?'一家公司，如何走过存储周期':'Micron · 投研档案'}</h2><div class="mr-full-doc">${d.html}</div>`;};
const panes={overview:()=>`<div class="mr-kicker">THE COMPANY AT A GLANCE</div><h2 class="mr-title">AI 时代的存储，<br>从涨价走向长期兑现。</h2><p class="mr-lead">${esc(p.thesis)}</p><p class="mr-intro">${esc(p.summary)}</p><h2>值得盯住的四件事</h2>${points()}<h2>经营快照</h2>${metrics()}<h2>下一步如何验证</h2><p class="mr-intro">关注价格、产品升级、客户长约与新增供给。一次季度兑现之后，还需要验证利润的持续性。</p>${timeline()}`,thesis:()=>`<div class="mr-kicker">RESEARCH THESIS</div><h2 class="mr-title">利润已兑现，<br>持续性才是下一道题。</h2><p class="mr-lead">${esc(p.thesis)}</p><h2>判断的四个支点</h2>${points()}<h2>哪些变化需要重新判断</h2><ul class="mr-risk-list">${p.risks.map(x=>`<li>${esc(x)}</li>`).join('')}</ul><h2>验证窗口</h2>${timeline()}`,financials:()=>`<div class="mr-kicker">FINANCIAL REVIEW</div><h2 class="mr-title">把收入、利润，<br>与现金放在一起看。</h2>${metrics()}<h2>看数字，也看口径</h2><p>以上沿用 ${esc(p.sourceDate)} 研究版本。年度营收和经营现金流、单季毛利率、战略协议数量分别代表不同维度，不能当作同一期间的指标比较。</p><p>重点仍是超额利润能持续多久，以及扩产支出之后能留下多少自由现金流。</p><h2>财报跟踪</h2><p class="mr-empty">新的季度分析将在这里按时间积累。</p>`,dossier:()=>article('dossier'),story:()=>article('story'),journal:()=>`<div class="mr-kicker">RESEARCH JOURNAL</div><h2 class="mr-title">判断会变，<br>把变化留下来。</h2><p class="mr-empty">目前尚无新增跟踪文章。后续公司动态、买入逻辑与复盘将按日期归档。</p>`};
function render(tab){current=tab;root.querySelectorAll('[data-tab]').forEach(b=>b.setAttribute('aria-selected',String(b.dataset.tab===tab)));content.setAttribute('aria-labelledby','mr-tab-'+tab);content.innerHTML=panes[tab]();for(const img of content.querySelectorAll('img')){const url=data.assets[img.getAttribute('src')];if(url)img.src=url;}
const headings=[...content.querySelectorAll('h2,h3')].filter(h=>!h.classList.contains('mr-title'));headings.forEach((h,i)=>{h.id='mr-'+tab+'-'+i;});root.querySelector('#mr-chapter-select').innerHTML='<option value="">选择章节…</option>'+headings.map(h=>`<option value="${h.id}">${esc(h.textContent)}</option>`).join('');toc.innerHTML=headings.map(h=>`<a href="#${h.id}">${esc(h.textContent)}</a>`).join('')||'<span class="mr-empty">暂无章节</span>';headings.forEach(h=>{const b=document.createElement('button');b.type='button';b.className='mr-return';b.dataset.return='directory';b.textContent='↑ 返回目录';h.append(b);});root.querySelector('#mr-materials').open=false;if(window.lucide)lucide.createIcons({attrs:{width:14,height:14}});}
function jump(id){const heading=root.querySelector('#'+id);if(!heading)return;heading.scrollIntoView({block:'start',behavior:'auto'});root.querySelector('#mr-chapter-select').value=id;toc.querySelectorAll('a').forEach(a=>{if(a.getAttribute('href')==='#'+id)a.setAttribute('aria-current','location');else a.removeAttribute('aria-current');});}
root.querySelector('#mr-chapter-select').addEventListener('change',e=>{if(e.target.value)jump(e.target.value);});
root.addEventListener('click',e=>{if(e.target.closest('[data-return]')){root.querySelector('.mr-tabs').scrollIntoView({block:'start',behavior:'auto'});return;}const tab=e.target.closest('[data-tab],[data-read]');if(tab){render(tab.dataset.tab||tab.dataset.read);return;}if(e.target.closest('#mr-toc-toggle')){const expanded=root.classList.toggle('mr-toc-expanded');root.querySelector('#mr-toc-toggle').setAttribute('aria-expanded',String(expanded));root.querySelector('#mr-toc-toggle').textContent=expanded?'收起':'全部';return;}const font=e.target.closest('[data-font]');if(font){size=Math.max(16,Math.min(22,size+(font.dataset.font==='larger'?1:-1)));root.style.setProperty('--mr-font',size+'px');return;}const a=e.target.closest('#mr-toc a');if(a){e.preventDefault();jump(a.getAttribute('href').slice(1));}});render('overview');
})();
</script>
