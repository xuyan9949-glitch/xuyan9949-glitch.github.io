<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>旅行攻略 — Leslie 旅行笔记</title>
    <style>
        *{margin:0;padding:0;box-sizing:border-box}
        body{font-family:-apple-system,"PingFang SC","Noto Sans SC",sans-serif;background:#f8f6f0;color:#2c2c2c;line-height:1.6}
        .hero{position:relative;height:30vh;min-height:200px;background:linear-gradient(135deg,#2c1810,#5c3a28);overflow:hidden;display:flex;align-items:center;justify-content:center;text-align:center}
        .hero h1{color:#fff;font-size:clamp(1.5rem,4vw,2rem);letter-spacing:4px}
        .container{max-width:640px;margin:0 auto;padding:24px 20px}
        .card{display:block;background:#fff;border-radius:14px;padding:20px;box-shadow:0 2px 8px rgba(0,0,0,0.05);text-decoration:none;color:inherit;margin-bottom:12px}
        .card-img{height:140px;border-radius:10px;overflow:hidden;background:linear-gradient(135deg,#2c1810,#8b5e3c);margin-bottom:10px;display:flex;align-items:center;justify-content:center;font-size:2rem;color:rgba(255,255,255,0.3)}
        .card h3{font-size:1rem;color:#2c1810}
        .card .meta{font-size:0.78rem;color:#999;margin-top:3px}
        .card p{font-size:0.84rem;color:#666;margin-top:6px}
        .footer{text-align:center;padding:32px;color:#999;font-size:0.75rem}
    </style>
</head>
<body>
<div class="hero"><h1>🌏 旅行攻略</h1></div>
<div class="container">
    <a href="/travel/quanzhou-2026/" class="card">
        <div class="card-img">🏛</div>
        <h3>泉州·休闲深度游 2.0</h3>
        <div class="meta">7月2日→5日 · 张震岳演唱会</div>
        <p>三晚同酒店不搬家。古城·南洋·木偶·演唱会·洛伽寺·梧林。</p>
    </a>
</div>
<div class="footer">Leslie 旅行笔记 · 2026</div>
</body>
</html>
